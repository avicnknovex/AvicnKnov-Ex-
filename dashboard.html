  <script>
    // --- 1. SUPABASE INIT (Preserved) ---
    const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // --- 2. GLOBAL CONSTANTS ---
    const PROFILE_BUCKET = 'profile-image'; 
    const DEFAULT_PROFILE_ICON = "https://cdn-icons-png.flaticon.com/512/847/847969.png"; 
    const WALLET_RATES = { INR: 1, USD: 0.012, BTC: 0.00000027, ETH: 0.0000042, BNB: 0.00013, USDT: 0.012, XRP: 0.78, EUR: 0.011, JPY: 1.72, GBP: 0.0094 };

    // --- 3. ANIMATED COUNTER LOGIC (Counter Effect) ---
    let currentDisplayedValue = 0; // Tracks the current visual state for smooth transitions
    let storedRawBalance = 0; // Tracks actual DB balance to handle currency swaps correctly

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            
            // Premium Ease-Out Expo easing function
            const ease = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
            
            const value = start + (end - start) * ease;
            obj.innerHTML = value.toFixed(2);
            
            if (progress < 1) {
                window.requestAnimationFrame(step);
            } else {
                obj.innerHTML = end.toFixed(2); // Ensure it lands exactly on the target
            }
        };
        window.requestAnimationFrame(step);
    }

    // --- 4. REALTIME WALLET SYNC (Auto System with 5s Polling) ---
    async function syncRealtimeBalance() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) return;

      // Helper: Fetch Latest Balance from DB
      const fetchBalance = async () => {
         const { data: wallet } = await sb.from("user_wallets").select("balance").eq("uid", user.id).maybeSingle();
         if (wallet && wallet.balance !== storedRawBalance) {
             console.log("Auto-Refresh Update:", wallet.balance);
             storedRawBalance = wallet.balance;
             updateDisplay();
         }
      };

      // 1. Initial Fetch
      await fetchBalance();

      // 2. Realtime Subscription (Instant)
      sb.channel('db-sync')
        .on('postgres_changes', 
          { 
            event: 'UPDATE', 
            schema: 'public', 
            table: 'user_wallets', 
            filter: `uid=eq.${user.id}` 
          }, 
          (payload) => {
            console.log("Realtime Instant Update:", payload.new.balance);
            storedRawBalance = payload.new.balance;
            // Update UI with smooth animation immediately
            updateDisplay();
          })
        .subscribe();
      
      // 3. Auto-Refresh System (5 Second Timer/Polling)
      setInterval(() => {
          fetchBalance();
      }, 5000); // Check every 5 seconds
    }

    // Updates display based on Stored Balance + Selected Currency
    function updateDisplay() {
      const currency = document.getElementById("currency").value;
      const balanceEl = document.getElementById("balanceValue");
      
      if (balanceEl) {
        const rate = WALLET_RATES[currency] || 1;
        const targetValue = storedRawBalance * rate;
        
        // Trigger Counter Animation from current visual number to new target
        animateValue(balanceEl, currentDisplayedValue, targetValue, 1500); // 1.5s duration
        currentDisplayedValue = targetValue;
      }
    }

    document.getElementById("currency").addEventListener("change", () => updateDisplay());

    // --- 5. PROFILE IMAGE ---
    async function loadProfileImage() {
      const profileIcon = document.getElementById('dashboard-profile-icon');
      profileIcon.src = DEFAULT_PROFILE_ICON;
      
      const { data: { user } } = await sb.auth.getUser(); 
      if (!user) return;

      try {
        const { data } = sb.storage.from(PROFILE_BUCKET).getPublicUrl(`${user.id}/avatar.jpg`);
        const imageUrl = data.publicUrl;
        
        const tempImg = new Image();
        tempImg.onload = function() {
            profileIcon.src = imageUrl;
        };
        // Bypass cache
        tempImg.src = imageUrl + '?' + new Date().getTime(); 
      } catch (error) {
        profileIcon.src = DEFAULT_PROFILE_ICON;
      }
    }

    // --- 6. SEARCH LOGIC ---
    const searchInput = document.querySelector('.search-input');
    const searchResultsContainer = document.getElementById('search-results');
    const searchItems = [
      { name: 'Earn-NX', url: 'earn-nx.html', type: 'page' },
      { name: 'Reward Hub', url: 'reward-box.html', type: 'page' },
      { name: 'NFT Kvon', url: 'nft-kvon.html', type: 'page' },
      { name: 'Achievement', url: 'achievement.html', type: 'page' },
      { name: 'Pre Launch', url: 'pre-launch.html', type: 'page' },
      { name: 'M&T Future', url: 'mt-future.html', type: 'page' },
      { name: 'More', url: 'more.html', type: 'page' },
      { name: 'Deposit', url: 'deposit.html', type: 'page' },
      { name: 'Withdrawal', url: 'withdrawal.html', type: 'page' },
      { name: 'Transactions', url: 'transactions.html', type: 'page' },
      { name: 'Live Price', target: 'live_price', type: 'section' },
      { name: 'Announcement', target: 'announcement', type: 'section' },
      { name: 'Eluza', target: 'eluza', type: 'section' },
      { name: 'Qineq', target: 'qineq', type: 'section' }
    ];

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase().trim();
      searchResultsContainer.innerHTML = '';
      if (query.length > 0) {
        searchResultsContainer.classList.remove('hidden');
        const matches = searchItems.filter(item => item.name.toLowerCase().includes(query));
        matches.forEach(match => {
          const div = document.createElement('div');
          div.className = 'px-4 py-3 hover:bg-blue-50 cursor-pointer text-sm font-medium text-slate-700 border-b border-gray-50 last:border-none transition-colors flex items-center justify-between group';
          div.innerHTML = `<span>${match.name}</span> <i class="fas fa-chevron-right text-xs text-gray-300 group-hover:text-blue-400"></i>`;
          div.onclick = () => {
            if (match.type === 'page') {
              window.location.href = match.url;
            } else if (match.type === 'section') {
              switchContent(match.target);
              document.getElementById('newOptionsBar').scrollIntoView({ behavior: 'smooth' });
            }
            searchResultsContainer.innerHTML = '';
            searchResultsContainer.classList.add('hidden');
            searchInput.value = '';
          };
          searchResultsContainer.appendChild(div);
        });
      } else {
        searchResultsContainer.classList.add('hidden');
      }
    });
    
    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !searchResultsContainer.contains(e.target)) {
            searchResultsContainer.classList.add('hidden');
        }
    });

    // --- 7. NEWS CAROUSEL (Logic Preserved) ---
    let newsItems = [];
    let currentIndex = 0;
    let rotationInterval;
    let currentVideo = null;
    let startX = 0;
    let isDragging = false;
    const DRAG_THRESHOLD = 50; 

    async function loadNewsContent() {
      try {
        const { data, error } = await sb
          .from('news_box_ak')
          .select('*')
          .eq('is_active', true)
          .order('display_order');
        
        if (error) throw error;
        newsItems = data || [];
        displayNewsContent();
      } catch (error) {
        console.error('Error loading news:', error);
        document.getElementById('news-box').innerHTML = 
          '<div class="flex items-center justify-center h-full text-red-400 font-medium">Unable to load news</div>';
      }
    }
    
    function updateCarouselPosition(useTransition = true) {
        const carousel = document.getElementById('news-carousel');
        if (!carousel) return;
        const offset = -currentIndex * 100; 
        carousel.style.transition = useTransition ? 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
        carousel.style.transform = `translateX(${offset}%)`;
    }
    
    function goToNext() {
      if (newsItems.length <= 1) return;
      currentIndex = (currentIndex + 1) % newsItems.length;
      updateCarouselPosition(true);
    }
    
    function goToPrev() {
      if (newsItems.length <= 1) return;
      currentIndex = (currentIndex - 1 + newsItems.length) % newsItems.length;
      updateCarouselPosition(true);
    }

    function displayNewsContent() {
      const newsBox = document.getElementById('news-box');
      if (newsItems.length === 0) {
        newsBox.innerHTML = '<div class="flex items-center justify-center h-full text-slate-400">No updates available</div>';
        return;
      }
      
      const carousel = document.createElement('div');
      carousel.className = 'news-carousel';
      carousel.id = 'news-carousel'; 

      newsItems.forEach((item) => {
        const newsItem = document.createElement('div');
        newsItem.className = 'news-item'; 
        
        if (item.click_url && item.click_url.trim()) {
          newsItem.style.cursor = 'pointer';
          newsItem.onclick = () => window.open(item.click_url, '_blank');
        }
        
        // 8K Quality Rendering
        if (item.content_type === 'image' || item.content_type === 'gif') {
          newsItem.innerHTML = `<img src="${item.content_url}" alt="${item.title || ''}" class="w-full h-full object-cover" />`;
        } else if (item.content_type === 'video') {
          newsItem.innerHTML = `
            <video muted controls class="w-full h-full object-cover" onended="handleVideoEnd()" onplay="handleVideoPlay(this)">
              <source src="${item.content_url}" type="video/mp4">
            </video>`;
        } else if (item.content_type === 'text') {
          newsItem.innerHTML = `
            <div class="w-full h-full flex flex-col justify-center items-center p-8 text-center bg-gradient-to-br from-[#0f172a] to-[#1e293b] text-white">
              ${item.title ? '<h3 class="text-3xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-blue-200 to-indigo-200">' + item.title + '</h3>' : ''}
              <p class="text-lg leading-relaxed text-slate-300 font-light">${item.content_text}</p>
            </div>`;
        }
        
        // Overlay Gradient for better visibility of text/icons
        const overlay = document.createElement('div');
        overlay.className = "absolute inset-0 bg-gradient-to-t from-black/50 to-transparent pointer-events-none";
        newsItem.appendChild(overlay);

        if (item.click_url && item.click_url.trim()) {
            const indicator = document.createElement('div');
            indicator.className = 'absolute top-4 right-4 bg-white/20 backdrop-blur-md border border-white/20 p-2 rounded-full z-10 shadow-lg';
            indicator.innerHTML = '<i class="fas fa-external-link-alt text-white text-xs"></i>';
            newsItem.appendChild(indicator);
        }

        carousel.appendChild(newsItem);
      });
      
      newsBox.innerHTML = ''; 
      newsBox.appendChild(carousel); 
      
      // Indicators
      const indicators = document.createElement('div');
      indicators.className = "absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-1.5 z-20";
      newsItems.forEach((_, idx) => {
          const dot = document.createElement('div');
          dot.className = "w-1.5 h-1.5 rounded-full bg-white/50 transition-all duration-300";
          if(idx === 0) dot.classList.add('w-4', 'bg-white');
          indicators.appendChild(dot);
      });

      currentIndex = 0; 
      updateCarouselPosition(false);
      if (newsItems.length > 1) startRotation();
      addSwipeHandlers();
    }
    
    function handleVideoPlay(video) {
      currentVideo = video;
      if (rotationInterval) clearInterval(rotationInterval);
    }
    
    function handleVideoEnd() {
      currentVideo = null;
      if (newsItems.length > 1) {
        goToNext(); 
        setTimeout(startRotation, 500); 
      }
    }
    
    function startRotation() {
      if (rotationInterval) clearInterval(rotationInterval);
      rotationInterval = setInterval(() => {
        if (currentVideo && !currentVideo.paused) return;
        goToNext();
      }, 10000); 
    }
    
    function addSwipeHandlers() {
        const newsBox = document.getElementById('news-box');
        if (!newsBox || newsItems.length <= 1) return;
        
        // Touch
        newsBox.addEventListener('touchstart', handleTouchStart, {passive: false});
        newsBox.addEventListener('touchmove', handleTouchMove, {passive: false});
        newsBox.addEventListener('touchend', handleTouchEnd);
        // Mouse
        newsBox.addEventListener('mousedown', handleTouchStart);
        newsBox.addEventListener('mousemove', handleTouchMove);
        newsBox.addEventListener('mouseup', handleTouchEnd);
        newsBox.addEventListener('mouseleave', handleTouchEnd); 
    }

    function handleTouchStart(e) {
        if (newsItems.length <= 1) return;
        if (rotationInterval) clearInterval(rotationInterval);
        isDragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        const carousel = document.getElementById('news-carousel');
        if (carousel) carousel.style.transition = 'none';
        if (e.type === 'mousedown') e.preventDefault();
    }

    function handleTouchMove(e) {
        if (!isDragging || newsItems.length <= 1) return;
        const currentX = (e.touches ? e.touches[0].clientX : e.clientX);
        const diffX = currentX - startX;
        const newsBox = document.getElementById('news-box');
        const carousel = document.getElementById('news-carousel');
        if (!carousel || !newsBox) return;
        
        const baseOffset = -currentIndex * newsBox.offsetWidth;
        const newOffset = baseOffset + diffX;
        carousel.style.transform = `translateX(${newOffset}px)`;
        if (e.touches) e.preventDefault(); // Prevent scroll while swiping
    }

    function handleTouchEnd(e) {
        if (!isDragging || newsItems.length <= 1) return;
        isDragging = false;
        const endX = (e.changedTouches ? e.changedTouches[0].clientX : (e.clientX || startX));
        const diffX = endX - startX;
        const carousel = document.getElementById('news-carousel');
        
        // Snap back or move
        if (diffX > DRAG_THRESHOLD) goToPrev();
        else if (diffX < -DRAG_THRESHOLD) goToNext();
        else updateCarouselPosition(true); 
        
        if (newsItems.length > 1) setTimeout(startRotation, 500); 
    } 

    // --- 8. CONTENT SWITCHING (Fixed Select Effect) ---
    const optionsMap = {
        'live_price': 'live_price.js',
        'announcement': 'announcement.js',
        'eluza': 'eluza.js',
        'qineq': 'qineq.js',
        'news': 'news.js',
        'more': 'more.js'
    };
    
    const jsContentArea = document.getElementById('jsContentArea');
    const optionButtons = document.querySelectorAll('.option-button');
    let loadedScripts = {}; 

    function switchContent(contentId) {
        optionButtons.forEach(button => {
            const btnId = button.getAttribute('data-content-id');
            // Explicitly set classes for Active vs Inactive state to guarantee the effect
            if (btnId === contentId) {
                // Active: Blue Gradient, Shadow, White Text, Scaled Up
                button.className = 'option-button active whitespace-nowrap px-6 py-2.5 rounded-full text-sm font-bold transition-all duration-300 transform scale-105 bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg shadow-blue-500/30 border border-transparent';
            } else {
                // Inactive: White, Gray Text, Border
                button.className = 'option-button whitespace-nowrap px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 hover:text-slate-700';
            }
        });

        // Toggle Content Visibility
        for (const id in optionsMap) {
            const contentDiv = document.getElementById(id + '_content');
            if (contentDiv) {
                contentDiv.style.display = (id === contentId) ? 'block' : 'none';
            }
        }
        
        // Handle Scroll Logic
        if (contentId === 'live_price') {
            jsContentArea.classList.add('live-price-active');
            jsContentArea.style.overflowY = 'auto'; 
        } else {
            jsContentArea.classList.remove('live-price-active');
            jsContentArea.style.overflowY = 'visible'; 
        }
       
        // Load JS
        const scriptName = optionsMap[contentId];
        if (scriptName && !loadedScripts[scriptName]) {
            loadScript(scriptName, contentId);
        }
    }
    
    function loadScript(scriptName, contentId) {
        if (loadedScripts[scriptName]) return;
        
        const script = document.createElement('script');
        script.src = scriptName;
        script.type = 'text/javascript';
        
        const contentWrapper = document.getElementById(contentId + '_content');
        if (contentWrapper) {
            contentWrapper.innerHTML = ''; 
            // Important: Re-add the inner div just in case scripts depend on it, 
            // though most scripts will overwrite innerHTML of wrapper.
            const inner = document.createElement('div');
            inner.style.cssText = "min-height: 100%; width: 100%; background-color: white;";
            contentWrapper.appendChild(inner);
        }

        script.onload = () => { loadedScripts[scriptName] = true; };
        document.head.appendChild(script);
        loadedScripts[scriptName] = 'loading'; 
    }

    optionButtons.forEach(button => {
        button.addEventListener('click', () => {
            switchContent(button.getAttribute('data-content-id'));
        });
    });

    // --- 9. INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
      loadProfileImage(); 
      syncRealtimeBalance(); 
      setTimeout(loadNewsContent, 1000);
      switchContent('live_price'); // Set default active tab
    });
    
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (rotationInterval) clearInterval(rotationInterval);
      } else {
        if (newsItems.length > 1 && (!currentVideo || currentVideo.paused)) {
          startRotation();
        }
      }
    });
  </script>
</body>
</html>
