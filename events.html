<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Event Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #f3ba2f; 
            --bg: #0b0e11;
            --card-bg: #1e2329;
            --text-main: #eaecef;
            --text-dim: #848e9c;
            --accent: #2ebd85;
        }

        body { background-color: var(--bg); color: var(--text-main); font-family: 'Poppins', sans-serif; margin: 0; }

        /* Navigation Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(30, 35, 41, 0.9);
            backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .header i { font-size: 24px; cursor: pointer; color: var(--text-main); transition: 0.3s; }
        .header i:hover { color: var(--primary); }

        .container { padding: 20px; max-width: 600px; margin: auto; }

        /* Premium Event Card */
        .event-card {
            background: var(--card-bg); border-radius: 20px; margin-bottom: 30px;
            border: 1px solid #333; overflow: hidden; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); transition: 0.3s;
        }

        .event-image { width: 100%; height: 220px; object-fit: cover; }

        /* Timer Badge */
        .timer-container {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.85); padding: 10px 15px;
            border-radius: 12px; border: 1px solid var(--primary);
            text-align: center; min-width: 100px;
        }
        .timer-label { font-size: 9px; text-transform: uppercase; color: #fff; display: block; }
        .timer-clock { font-size: 14px; font-weight: bold; color: var(--primary); }

        .content { padding: 20px; }
        .event-title { font-size: 26px; font-weight: 800; color: var(--primary); margin: 0 0 10px 0; }
        .event-desc { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }

        /* Stats Grid */
        .stats-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            background: rgba(255, 255, 255, 0.05); padding: 15px;
            border-radius: 15px; margin-bottom: 20px; border: 1px solid #333;
        }
        .stat-item { display: flex; align-items: center; font-size: 14px; }
        .stat-item i { color: var(--primary); margin-right: 10px; font-size: 18px; }
        .stat-val { font-weight: bold; color: #fff; display: block; }
        .stat-label { font-size: 11px; color: var(--text-dim); }

        /* Dynamic Status Info */
        .dynamic-info {
            background: rgba(46, 189, 133, 0.1); color: var(--accent);
            padding: 10px; border-radius: 8px; font-size: 13px;
            text-align: center; margin-bottom: 15px; border: 1px solid rgba(46, 189, 133, 0.2);
        }

        /* The Button */
        .btn-join {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #f3ba2f 0%, #f0b90b 100%);
            color: #000; font-weight: 800; font-size: 16px;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .btn-join:disabled {
            background: #2b2f36 !important; color: #5e6673 !important;
            cursor: not-allowed; border: 1px solid #333;
        }

        /* Sidebar Panel */
        #detailsPanel {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg); z-index: 2000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .result-card {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            margin-top: 20px; border: 1px solid var(--primary);
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left" onclick="location.href='dashboard.html'"></i>
        <span style="font-weight: 900; letter-spacing: 1px;">EXCHANGE EVENTS</span>
        <i class="fas fa-crown" onclick="toggleDetails(true)"></i>
    </div>

    <div class="container" id="events-wrapper">
        <div style="text-align:center; padding:50px;" id="status-msg">Fetching Premium Events...</div>
    </div>

    <div id="detailsPanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--primary)">Participation Records</h2>
            <i class="fas fa-times" style="font-size:28px" onclick="toggleDetails(false)"></i>
        </div>
        <div id="user-history-content"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Simulated Login User ID
        const MY_ID = "USER_PERMANENT_001"; 

        async function loadSystem() {
            const { data: events } = await sb.from('events_control').select('*').order('created_at', { ascending: false });
            const { data: joined } = await sb.from('user_events').select('event_id').eq('user_id', MY_ID);
            
            const joinedList = joined ? joined.map(item => item.event_id) : [];
            displayEvents(events, joinedList);
        }

        function displayEvents(events, joinedList) {
            const wrapper = document.getElementById('events-wrapper');
            if (!events || events.length === 0) {
                wrapper.innerHTML = '<div style="text-align:center; color:#848e9c; margin-top:50px;">No Active Events Found</div>';
                return;
            }

            wrapper.innerHTML = '';
            events.forEach(ev => {
                const isLocked = joinedList.includes(ev.id);
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    ${ev.image_url ? `<img src="${ev.image_url}" class="event-image">` : ''}
                    <div class="timer-container">
                        <span class="timer-label" id="lbl-${ev.id}">Wait</span>
                        <span class="timer-clock" id="clock-${ev.id}">00:00:00</span>
                    </div>
                    <div class="content">
                        <h2 class="event-title">${ev.title}</h2>
                        <p class="event-desc">${ev.description || ''}</p>
                        
                        <div class="dynamic-info" id="info-${ev.id}">Loading dates...</div>

                        <div class="stats-box">
                            <div class="stat-item">
                                <i class="fas fa-gem"></i>
                                <div><span class="stat-label">Prize Pool</span><span class="stat-val">${ev.price_pool}</span></div>
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-users"></i>
                                <div><span class="stat-label">Participants</span><span class="stat-val">${ev.joined_count} / ${ev.user_limit}</span></div>
                            </div>
                        </div>

                        <button class="btn-join" id="btn-${ev.id}" onclick="joinEvent(${ev.id})" ${isLocked ? 'disabled' : ''}>
                            ${isLocked ? 'ALREADY JOINED ✅' : 'CHECKING...'}
                        </button>
                    </div>
                `;
                wrapper.appendChild(card);
                runTimer(ev, isLocked);
            });
        }

        function runTimer(ev, isLocked) {
            const clock = document.getElementById(`clock-${ev.id}`);
            const lbl = document.getElementById(`lbl-${ev.id}`);
            const btn = document.getElementById(`btn-${ev.id}`);
            const info = document.getElementById(`info-${ev.id}`);

            const tick = () => {
                const now = new Date().getTime();
                const start = new Date(ev.start_time).getTime();
                const end = new Date(ev.end_time).getTime();
                const result = new Date(ev.result_time).getTime();

                let target, statusLabel, dateInfo;

                if (now < start) {
                    target = start; statusLabel = "Starts In";
                    dateInfo = `<i class="fas fa-calendar"></i> Starts on: ${new Date(ev.start_time).toLocaleString()}`;
                    if(!isLocked) { btn.disabled = true; btn.innerText = "UPCOMING"; }
                } else if (now < end) {
                    target = end; statusLabel = "Ends In";
                    dateInfo = `<i class="fas fa-hourglass-half"></i> Event Closes: ${new Date(ev.end_time).toLocaleString()}`;
                    if(!isLocked && ev.is_joinable === 'yes') { 
                        btn.disabled = false; btn.innerText = "JOIN EVENT NOW"; 
                    } else if(!isLocked) {
                        btn.disabled = true; btn.innerText = "WAITING FOR ADMIN";
                    }
                } else {
                    target = result; statusLabel = "Result In";
                    dateInfo = `<i class="fas fa-award"></i> Result Date: ${new Date(ev.result_time).toLocaleString()}`;
                    if(!isLocked) { btn.disabled = true; btn.innerText = "CLOSED"; }
                }

                lbl.innerText = statusLabel;
                info.innerHTML = dateInfo;

                const diff = target - now;
                if (diff > 0) {
                    const d = Math.floor(diff / (1000*60*60*24));
                    const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                    const m = Math.floor((diff % (1000*60*60)) / (1000*60));
                    const s = Math.floor((diff % (1000*60)) / 1000);
                    clock.innerText = `${d}d ${h}h ${m}m ${s}s`;
                } else {
                    clock.innerText = "COMPLETED";
                }
            };
            setInterval(tick, 1000); tick();
        }

        async function joinEvent(id) {
            const btn = document.getElementById(`btn-${id}`);
            btn.disabled = true;
            btn.innerText = "Verifying...";

            const { error } = await sb.from('user_events').insert([{ event_id: id, user_id: MY_ID }]);

            if (!error) {
                alert("Successfully Registered for Event!");
                btn.innerText = "ALREADY JOINED ✅";
                btn.disabled = true; // HARD LOCK
                loadSystem(); // Refresh counts
            } else {
                alert("You are already joined or there is an issue.");
                btn.innerText = "LOCKED";
            }
        }

        function toggleDetails(open) {
            document.getElementById('detailsPanel').style.right = open ? '0' : '-100%';
            if(open) fetchUserHistory();
        }

        async function fetchUserHistory() {
            const historyList = document.getElementById('user-history-content');
            historyList.innerHTML = '<div style="text-align:center; padding:30px;">Fetching records...</div>';

            const { data } = await sb.from('user_events').select('*, events_control(title)').eq('user_id', MY_ID).order('joined_at', { ascending: false });

            if (data && data.length > 0) {
                historyList.innerHTML = data.map(item => `
                    <div class="result-card">
                        <h3 style="margin:0; color:var(--primary)">${item.events_control.title}</h3>
                        <p style="font-size:11px; color:var(--text-dim)">Joined on: ${new Date(item.joined_at).toLocaleString()}</p>
                        <hr border="0" style="border-bottom:1px solid #333; margin:15px 0;">
                        <div style="font-size:14px;">
                            <span style="color:var(--text-dim)">Result Message:</span><br>
                            <strong style="color:var(--accent)">${item.result_message || 'Waiting for result...'}</strong>
                        </div>
                    </div>
                `).join('');
            } else {
                historyList.innerHTML = '<div class="no-event-msg">You have not joined any event yet.</div>';
            }
        }

        loadSystem();
    </script>
</body>
</html>
