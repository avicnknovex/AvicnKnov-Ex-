<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Edit Profile - AvicnKnov Ex</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Premium Font Styling */
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f8f9fc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }

    /* Input Field Animation */
    .input-group {
      position: relative;
      transition: all 0.3s ease;
    }
    
    .input-field {
      width: 100%;
      padding: 12px 16px 12px 45px; /* Space for icon */
      background-color: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #334155;
      transition: all 0.3s;
      outline: none;
    }

    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    /* Locked Field Styling */
    .input-field:disabled {
      background-color: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
      border-color: #e2e8f0;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s;
    }

    .input-field:focus + .input-icon {
      color: #3b82f6;
    }

    /* Label Styling */
    .field-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="bg-[#f8f9fc] min-h-screen pb-10">

  <!-- Header -->
  <div class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-gray-100 px-4 py-4 flex items-center shadow-sm">
    <button onclick="window.location.href='profile.html'" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 text-slate-600 hover:bg-slate-100 transition-colors">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1 class="text-lg font-bold text-slate-800 ml-3 tracking-tight">Edit Profile</h1>
  </div>

  <div class="max-w-md mx-auto px-4 mt-6">
    
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-6 border border-slate-100">
      
      <form id="edit-form" class="space-y-5">
        
        <!-- Full Name -->
        <div>
          <label class="field-label">Full Name</label>
          <div class="input-group">
            <input type="text" id="name" class="input-field" placeholder="Enter full name" required>
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>

        <!-- Date of Birth (Locked) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="field-label mb-0">Date of Birth</label>
            <span class="text-[10px] font-bold text-amber-500 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">
              <i class="fas fa-lock text-[8px] mr-1"></i>Locked
            </span>
          </div>
          <div class="input-group">
            <input type="date" id="dob" class="input-field opacity-70" required disabled>
            <i class="fas fa-calendar-alt input-icon"></i>
          </div>
        </div>

        <!-- Username -->
        <div>
          <label class="field-label">Username</label>
          <div class="input-group">
            <input type="text" id="username" class="input-field" placeholder="@username" required>
            <i class="fas fa-at input-icon"></i>
          </div>
        </div>

        <!-- Account Identifier (Locked) -->
        <div>
           <div class="flex justify-between items-center mb-1.5">
            <label class="field-label mb-0" id="identifier-label">Account Identifier</label>
            <span class="text-[10px] font-bold text-amber-500 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">
              <i class="fas fa-lock text-[8px] mr-1"></i>Locked
            </span>
          </div>
          <div class="input-group">
            <input type="text" id="identifier" class="input-field opacity-70" disabled>
            <i class="fas fa-id-badge input-icon"></i>
          </div>
          <p class="text-xs text-blue-500 font-semibold mt-1.5 text-right" id="account-type-text"></p>
        </div>

        <!-- Country (Locked) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="field-label mb-0">Country</label>
            <span class="text-[10px] font-bold text-amber-500 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-100">
              <i class="fas fa-lock text-[8px] mr-1"></i>Locked
            </span>
          </div>
          <div class="input-group">
            <input type="text" id="country" class="input-field opacity-70" disabled>
            <i class="fas fa-globe input-icon"></i>
          </div>
        </div>

        <!-- Gender -->
        <div>
          <label class="field-label">Gender</label>
          <div class="input-group">
            <select id="gender" class="input-field appearance-none cursor-pointer" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <i class="fas fa-venus-mars input-icon"></i>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
          </div>
        </div>

        <!-- Save Button -->
        <button type="submit" class="w-full mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 active:scale-[0.98] flex items-center justify-center gap-2">
          <i class="fas fa-save"></i>
          Save Changes
        </button>

      </form>
    </div>
  </div>

  <!-- EXACT LOGIC PRESERVED FROM USER PROMPT -->
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Constant used in Edge Function for phone number login
    const PHONE_LOGIN_DOMAIN = '@crypto-temp.com';

    /**
     * Load existing profile data
     */
    async function loadProfile() {
      // 1. Check Auth Status
      const { data: authData, error: authError } = await sb.auth.getUser();
      if (authError || !authData?.user) {
        alert('You must be logged in to view this page.');
        window.location.href = 'index.html'; 
        return;
      }

      const user = authData.user;
      
      // 2. Determine Account Type
      let identifierValue = user.email; 
      let accountType = 'Gmail';
      
      if (identifierValue && identifierValue.endsWith(PHONE_LOGIN_DOMAIN)) {
          accountType = 'Phone Number';
          identifierValue = identifierValue.replace(PHONE_LOGIN_DOMAIN, '').replace(/\+/g, ''); 
          document.getElementById('identifier-label').textContent = 'Phone Number';
      } else {
          document.getElementById('identifier-label').textContent = 'Gmail';
      }

      document.getElementById('identifier').value = identifierValue;
      document.getElementById('account-type-text').textContent = `(${accountType} Account)`;

      // 3. Fetch from user-details
      const { data: profileData, error: profileError } = await sb
        .from('user-details')
        .select('full_name, dob, username, country, gender, email, phone_number')
        .or(`email.eq.${user.email},phone_number.eq.${user.email.replace(PHONE_LOGIN_DOMAIN, '')}`)
        .maybeSingle(); 

      if (profileError) {
        console.error('Error fetching profile:', profileError.message);
        alert('Failed to load profile data.');
        return;
      }

      if (profileData) {
        document.getElementById('name').value = profileData.full_name || '';
        document.getElementById('dob').value = profileData.dob || '';
        document.getElementById('username').value = profileData.username || '';
        document.getElementById('country').value = profileData.country || '';
        document.getElementById('gender').value = profileData.gender || '';
        
        // Lock fields
        document.getElementById('dob').disabled = true;
        document.getElementById('identifier').disabled = true;
        document.getElementById('country').disabled = true;
      } else {
        alert('Profile not found in user-details table.');
      }
    }

    /**
     * Submit Handler: Updates 'user-details', 'user-profile-data', and 'qineq_users'
     */
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const { data: authData } = await sb.auth.getUser();
      if (!authData?.user) return;
      const user = authData.user;
      
      const newFullName = document.getElementById('name').value.trim();
      const newUsername = document.getElementById('username').value.trim();
      const newGender = document.getElementById('gender').value;
      
      // Determine criteria
      const identifier = user.email; 
      let updateCriteria = {};
      if (identifier.endsWith(PHONE_LOGIN_DOMAIN)) {
          const phoneNumber = identifier.replace(PHONE_LOGIN_DOMAIN, '');
          updateCriteria = { phone_number: phoneNumber };
      } else {
          updateCriteria = { email: identifier };
      }
      
      // 1. Update user-details
      const { error: errorDetails } = await sb
        .from('user-details')
        .update({
          full_name: newFullName,
          username: newUsername,
          gender: newGender,
        })
        .match(updateCriteria);

      // 2. Update user-profile-data
      const { error: errorProfile } = await sb
        .from('user-profile-data')
        .update({
          full_name: newFullName,
          username: newUsername,
          gender: newGender,
        })
        .match(updateCriteria);

      // 3. Update qineq_users (Naya addition)
      // Note: Isme hum user_id (Auth UID) ka use karte hain stability ke liye
      const { error: errorQineq } = await sb
        .from('qineq_users')
        .update({
          full_name: newFullName,
          username: newUsername,
          gender: newGender,
        })
        .eq('user_id', user.id);

      // Feedback
      if (errorDetails) {
        alert('❌ Failed to update User Details: ' + errorDetails.message);
      } else if (errorProfile) {
        alert('⚠️ Main profile updated, but failed to sync to Profile Data: ' + errorProfile.message);
      } else if (errorQineq) {
        alert('⚠️ Profile updated, but failed to sync to qineq_users: ' + errorQineq.message);
      } else {
        alert('✅ Profile updated successfully across all tables!');
        window.location.href = 'profile.html';
      }
    });

    loadProfile();
  </script>
</body>
</html>
