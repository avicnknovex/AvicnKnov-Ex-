
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit UPI - Wallet</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
      
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* --- Custom Scrollbar --- */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      
      /* --- Animations --- */
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .zoom-in { animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .pulse-soft { animation: pulseSoft 2s infinite; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

      /* --- Premium Inputs --- */
      .premium-input {
          transition: all 0.3s ease;
          border: 1px solid #e2e8f0;
          background: #f8fafc;
      }
      .premium-input:focus {
          background: #ffffff;
          border-color: #3b82f6;
          box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }

      /* --- Method Card --- */
      .method-card {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .method-card:active {
          transform: scale(0.96);
      }
    </style>

    <!-- Import Map for React & Supabase -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-10 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, X, Copy, CheckCircle2, UploadCloud, 
            Clock, AlertCircle, Loader2, QrCode, ShieldCheck
        } from 'lucide-react';

        // --- Supabase Configuration ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- Tables (Wallet Prefix Added) ---
        const TABLES = {
            CONTROL: 'wallet-upi-payment-control',
            PAYMENTS: 'wallet-user-payments',
            TRANSACTIONS: 'wallet-user-transactions',
            BUCKET: 'wallet-user-payments-image'
        };

        const DepositUPI = () => {
            const [selectedMethod, setSelectedMethod] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [loadingDetails, setLoadingDetails] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [adminDetails, setAdminDetails] = useState(null);
            
            // Form State
            const [amount, setAmount] = useState('');
            const [utr, setUtr] = useState('');
            const [screenshot, setScreenshot] = useState(null);
            const [successMsg, setSuccessMsg] = useState('');
            
            // Timer State
            const [timeLeft, setTimeLeft] = useState(3600);
            const timerRef = useRef(null);

            // --- Navigation ---
            const handleBack = () => {
                window.location.href = 'wallet-deposit.html';
            };

            // --- Effects ---
            useEffect(() => {
                if (showModal && timeLeft > 0) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                handleCloseModal();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [showModal, timeLeft]);

            useEffect(() => {
                if (selectedMethod && showModal) {
                    fetchPaymentDetails(selectedMethod);
                }
            }, [selectedMethod, showModal]);

            // --- Logic ---
            const fetchPaymentDetails = async (methodName) => {
                setLoadingDetails(true);
                try {
                    const { data, error } = await supabase
                        .from(TABLES.CONTROL)
                        .select('upi_id, qr_image')
                        .eq('change_box', methodName)
                        .eq('is_active', true)
                        .single();

                    if (data) {
                        setAdminDetails(data);
                    } else {
                        // Fallback logic in case row doesn't exist
                        setAdminDetails({
                            upi_id: 'admin@wallet', 
                            qr_image: 'https://placehold.co/200x200/png?text=QR+Not+Found'
                        });
                    }
                } catch (err) {
                    console.error("Fetch error", err);
                } finally {
                    setLoadingDetails(false);
                }
            };

            const handleMethodClick = (method) => {
                setSelectedMethod(method);
                setShowModal(true);
                setTimeLeft(3600); 
                setSuccessMsg('');
                setAmount('');
                setUtr('');
                setScreenshot(null);
            };

            const handleCloseModal = () => {
                setShowModal(false);
                setSelectedMethod(null);
                if (timerRef.current) clearInterval(timerRef.current);
            };

            const formatTime = (s) => {
                const m = Math.floor((s % 3600) / 60);
                const secs = s % 60;
                return `${m.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleSubmit = async () => {
                if (!amount || !utr || !screenshot) {
                    alert("Please complete all fields and upload the payment screenshot.");
                    return;
                }

                const numAmount = parseFloat(amount);
                if (isNaN(numAmount) || numAmount < 100) {
                    alert("Minimum deposit amount is ₹100.");
                    return;
                }

                if (utr.length < 12) {
                    alert("Please enter a valid 12-digit UTR.");
                    return;
                }

                setSubmitting(true);
                
                try {
                    const { data: { user }, error: authError } = await supabase.auth.getUser();
                    
                    if (authError || !user) {
                        alert("Authentication required. Please log in.");
                        setSubmitting(false);
                        return;
                    }

                    const userId = user.id; 
                    const timestamp = new Date().toISOString();

                    // 1. Upload Image to 'wallet-user-payments-image'
                    const fileExt = screenshot.name.split('.').pop();
                    const fileName = `${userId}/${Date.now()}.${fileExt}`;
                    
                    const { error: uploadError } = await supabase.storage
                        .from(TABLES.BUCKET)
                        .upload(fileName, screenshot);
                    
                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = supabase.storage
                        .from(TABLES.BUCKET)
                        .getPublicUrl(fileName);

                    // 2. Insert into 'wallet-user-payments'
                    const { error: paymentError } = await supabase
                        .from(TABLES.PAYMENTS)
                        .insert([{
                            user_id: userId,
                            method: selectedMethod,
                            amount: numAmount,
                            utr: utr,
                            screenshot_url: publicUrl,
                            created_at: timestamp,
                            status: 'pending'
                        }]);
                    
                    if (paymentError) throw paymentError;

                    // 3. Insert into 'wallet-user-transactions'
                    const { error: txError } = await supabase
                        .from(TABLES.TRANSACTIONS)
                        .insert([{
                            user_id: userId,
                            type: 'deposit',
                            method: selectedMethod,
                            amount: numAmount,
                            status: 'pending',
                            description: 'Wallet Deposit Request',
                            created_at: timestamp
                        }]);
                    
                    if (txError) throw txError;

                    setSuccessMsg('Deposit submitted successfully! Verification pending.');
                    setTimeout(handleCloseModal, 3000);

                } catch (err) {
                    console.error("Submission Error:", err);
                    alert("Error submitting payment: " + (err.message || "Unknown error"));
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen text-slate-800 relative overflow-hidden">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-5 py-4">
                        <div className="max-w-xl mx-auto flex items-center justify-between">
                            <button 
                                onClick={handleBack} 
                                className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100 active:scale-90"
                            >
                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <h1 className="text-xl font-black text-slate-800 tracking-tight">
                                UPI Deposit
                            </h1>
                            <div className="w-10"></div>
                        </div>
                    </div>

                    <div className="relative z-10 max-w-xl mx-auto px-5 pt-8 pb-20">
                        
                        {/* Header Text */}
                        <div className="text-center mb-8 fade-in">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Fast & Secure</p>
                            <h2 className="text-2xl font-black text-slate-800">Choose UPI App</h2>
                        </div>

                        {/* Payment Options Grid */}
                        <div className="grid grid-cols-2 gap-4 slide-up">
                            <MethodButton 
                                name="UPI ID" 
                                icon={<QrCode className="w-6 h-6" />}
                                gradient="bg-gradient-to-br from-blue-500 to-indigo-600"
                                shadow="shadow-blue-500/30"
                                onClick={() => handleMethodClick('UPI')}
                            />
                            <MethodButton 
                                name="PhonePe" 
                                icon={<span className="font-bold text-xl">Pe</span>}
                                gradient="bg-gradient-to-br from-purple-500 to-fuchsia-600"
                                shadow="shadow-purple-500/30"
                                onClick={() => handleMethodClick('PhonePe')}
                            />
                            <MethodButton 
                                name="Google Pay" 
                                icon={<span className="font-bold text-xl">GPay</span>}
                                gradient="bg-gradient-to-br from-blue-600 to-sky-500"
                                shadow="shadow-sky-500/30"
                                onClick={() => handleMethodClick('Google Pay')}
                            />
                            <MethodButton 
                                name="Paytm" 
                                icon={<span className="font-bold text-xl">Paytm</span>}
                                gradient="bg-gradient-to-br from-cyan-400 to-blue-500"
                                shadow="shadow-cyan-500/30"
                                onClick={() => handleMethodClick('Paytm')}
                            />
                        </div>

                        {/* Security Badge */}
                        <div className="mt-8 flex items-center justify-center gap-2 text-slate-400 opacity-80 slide-up" style={{ animationDelay: '0.1s' }}>
                            <ShieldCheck className="w-4 h-4" />
                            <span className="text-xs font-bold uppercase tracking-widest">End-to-End Encrypted</span>
                        </div>
                    </div>

                    {/* Modal */}
                    {showModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md fade-in">
                            <div className="w-full max-w-md bg-white rounded-[2rem] shadow-2xl relative flex flex-col max-h-[90vh] zoom-in overflow-hidden border border-slate-100">
                                
                                {/* Modal Header */}
                                <div className="flex items-center justify-between p-5 border-b border-slate-100 bg-white z-20 sticky top-0">
                                    <button onClick={handleCloseModal} className="p-2 bg-slate-50 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600 transition-colors">
                                        <X className="w-5 h-5" />
                                    </button>
                                    
                                    <div className="flex items-center gap-2 px-3 py-1 bg-rose-50 border border-rose-100 rounded-full">
                                        <Clock className="w-3.5 h-3.5 text-rose-500 pulse-soft" />
                                        <span className="text-rose-600 font-mono text-sm font-bold tracking-wide">{formatTime(timeLeft)}</span>
                                    </div>
                                </div>

                                {/* Modal Body */}
                                <div className="overflow-y-auto p-6 space-y-6 custom-scrollbar bg-[#f8f9fc]">
                                    {successMsg ? (
                                        <div className="flex flex-col items-center justify-center py-12 text-center space-y-4 fade-in">
                                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-2 shadow-lg shadow-green-500/20">
                                                <CheckCircle2 className="w-10 h-10 text-green-600" />
                                            </div>
                                            <h3 className="text-xl font-black text-slate-800">Deposit Request Sent!</h3>
                                            <p className="text-slate-500 px-4 leading-relaxed font-medium text-sm">{successMsg}</p>
                                        </div>
                                    ) : (
                                        <>
                                            {/* QR & UPI ID Display */}
                                            <div className="flex flex-col items-center space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                <div className="relative group">
                                                    {loadingDetails ? (
                                                        <div className="w-48 h-48 flex items-center justify-center bg-slate-50 rounded-2xl animate-pulse">
                                                            <Loader2 className="w-8 h-8 text-blue-400 animate-spin" />
                                                        </div>
                                                    ) : (
                                                        <img 
                                                            src={adminDetails?.qr_image} 
                                                            alt="Payment QR" 
                                                            className="w-48 h-48 object-contain rounded-2xl border border-slate-100 p-2 bg-white shadow-inner"
                                                        />
                                                    )}
                                                </div>
                                                
                                                <div className="w-full">
                                                    <p className="text-[10px] text-slate-400 text-center mb-2 uppercase tracking-wider font-bold">Official UPI ID</p>
                                                    <div 
                                                        onClick={() => {
                                                            navigator.clipboard.writeText(adminDetails?.upi_id);
                                                            alert("UPI ID Copied!");
                                                        }}
                                                        className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-3 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-all active:scale-[0.98] group"
                                                    >
                                                        <span className="font-mono text-sm text-slate-700 truncate max-w-[200px] select-all font-bold">
                                                            {loadingDetails ? 'Loading...' : (adminDetails?.upi_id || 'Unavailable')}
                                                        </span>
                                                        <Copy className="w-4 h-4 text-slate-400 group-hover:text-blue-500 transition-colors" />
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Input Fields */}
                                            <div className="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                {/* Amount */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Amount (₹)</label>
                                                    <div className="relative">
                                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₹</span>
                                                        <input 
                                                            type="number" 
                                                            value={amount}
                                                            onChange={(e) => setAmount(e.target.value)}
                                                            className="premium-input w-full rounded-xl py-3.5 pl-8 pr-4 text-slate-800 font-bold placeholder-slate-400 font-mono"
                                                            placeholder="100 - 10,00,000"
                                                        />
                                                    </div>
                                                </div>

                                                {/* UTR */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">UTR / Ref No.</label>
                                                    <input 
                                                        type="text" 
                                                        value={utr}
                                                        onChange={(e) => setUtr(e.target.value.replace(/\D/g, '').slice(0, 12))}
                                                        className="premium-input w-full rounded-xl py-3.5 px-4 text-slate-800 font-bold placeholder-slate-400 font-mono"
                                                        placeholder="12 digit UTR"
                                                        maxLength="12"
                                                    />
                                                    <p className="text-[10px] text-slate-400 flex items-center gap-1 mt-1 ml-1 font-bold">
                                                        <AlertCircle className="w-3 h-3" /> 12 Digits Only
                                                    </p>
                                                </div>

                                                {/* Screenshot */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Payment Proof</label>
                                                    <div className="relative">
                                                        <input 
                                                            type="file" 
                                                            id="file-upload" 
                                                            accept="image/*"
                                                            className="hidden"
                                                            onChange={(e) => setScreenshot(e.target.files[0])}
                                                        />
                                                        <label 
                                                            htmlFor="file-upload"
                                                            className={`flex items-center justify-center gap-2 w-full p-4 border-2 border-dashed rounded-xl cursor-pointer transition-all ${screenshot ? 'border-emerald-500 bg-emerald-50' : 'border-slate-300 hover:border-blue-400 hover:bg-blue-50'}`}
                                                        >
                                                            <UploadCloud className={`w-5 h-5 ${screenshot ? 'text-emerald-600' : 'text-slate-400'}`} />
                                                            <div className="flex flex-col items-center">
                                                                <span className={`text-sm font-bold ${screenshot ? 'text-emerald-700' : 'text-slate-500'}`}>
                                                                    {screenshot ? "Screenshot Added" : "Tap to Upload"}
                                                                </span>
                                                            </div>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Submit Button */}
                                            <button 
                                                onClick={handleSubmit}
                                                disabled={submitting || loadingDetails}
                                                className="w-full py-4 bg-slate-900 text-white font-bold rounded-xl shadow-lg hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                                            >
                                                {submitting ? (
                                                    <>
                                                        <Loader2 className="w-5 h-5 animate-spin" />
                                                        Processing...
                                                    </>
                                                ) : (
                                                    "Submit Deposit Request"
                                                )}
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MethodButton = ({ name, icon, gradient, shadow, onClick }) => (
            <button 
                onClick={onClick}
                className={`method-card group relative overflow-hidden bg-white p-5 rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/50 hover:shadow-2xl hover:-translate-y-1 flex flex-col items-center justify-center h-36 w-full`}
            >
                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-3 shadow-lg transition-transform duration-300 group-hover:scale-110 text-white ${gradient} ${shadow}`}>
                    {icon}
                </div>
                <span className="font-bold text-slate-700 text-sm group-hover:text-blue-600 transition-colors">{name}</span>
            </button>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<DepositUPI />);
    </script>
</body>
</html>
