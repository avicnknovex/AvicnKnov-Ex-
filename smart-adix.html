<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Adix AI - Premium Market Assistant</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           ULTRA PREMIUM CSS STYLING & ANIMATIONS
           ========================================== */
        :root {
            --bg-dark: #050b14;
            --bg-panel: #0f172a;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --secondary: #8b5cf6;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.08), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* Chat Bubbles */
        .chat-bubble {
            max-width: 88%;
            padding: 16px 20px;
            border-radius: 24px;
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .ai-bubble {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
            transform-origin: bottom left;
            animation: popInLeft 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            backdrop-filter: blur(10px);
        }

        .user-bubble {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-bottom-right-radius: 6px;
            transform-origin: bottom right;
            animation: popInRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        /* Animations */
        @keyframes popInLeft {
            0% { opacity: 0; transform: scale(0.9) translateY(10px) translateX(-10px); }
            100% { opacity: 1; transform: scale(1) translateY(0) translateX(0); }
        }

        @keyframes popInRight {
            0% { opacity: 0; transform: scale(0.9) translateY(10px) translateX(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0) translateX(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px var(--primary-glow), inset 0 0 10px rgba(255,255,255,0.1); }
            50% { box-shadow: 0 0 35px var(--primary-glow), inset 0 0 20px rgba(255,255,255,0.2); }
        }

        /* High-Tech Typing Indicator */
        .typing-container {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 8px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: typingWave 1.5s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; background-color: var(--secondary); }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; background-color: var(--accent); }

        @keyframes typingWave {
            0%, 100% { transform: translateY(0) scale(0.8); opacity: 0.4; }
            50% { transform: translateY(-6px) scale(1.2); opacity: 1; box-shadow: 0 0 10px currentColor; }
        }

        /* Quick Action Chips */
        .quick-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .quick-chip:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: white;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25);
        }

        /* Input Field */
        .chat-input-container {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(16px);
        }

        .chat-input-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3), 0 10px 30px rgba(0,0,0,0.5);
            background: rgba(15, 23, 42, 0.9);
        }

        .chat-input {
            background: transparent;
            color: white;
            border: none;
            outline: none;
            resize: none;
            width: 100%;
            max-height: 120px;
            font-family: 'Inter', sans-serif;
        }

        /* AI Avatar Glow */
        .ai-avatar-container {
            position: relative;
            z-index: 1;
        }
        .ai-avatar-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            z-index: -1;
            animation: pulse-glow 3s infinite;
            background-size: 200% 200%;
        }

        /* Timestamp */
        .msg-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 6px;
            opacity: 0.7;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Formatted Content inside AI Bubble */
        .ai-content { font-family: 'Inter', sans-serif; }
        .ai-content b, .ai-content strong { color: #fff; font-weight: 700; font-family: 'Outfit', sans-serif; }
        .ai-content ul { padding-left: 1.2rem; margin-top: 0.8rem; margin-bottom: 0.8rem; }
        .ai-content li { margin-bottom: 0.5rem; list-style-type: none; position: relative; }
        .ai-content li::before {
            content: '•';
            color: var(--primary);
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: -1em;
        }
        
        /* Market Data Cards */
        .crypto-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s;
        }
        .crypto-card:hover { transform: scale(1.02); background: rgba(255,255,255,0.05); }
        .crypto-price { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.1rem; }
        .text-green { color: var(--accent); }
        .text-red { color: var(--danger); }
        
        .signal-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.02));
            border-left: 4px solid var(--accent);
            padding: 14px;
            border-radius: 0 12px 12px 0;
            margin: 12px 0;
        }
        .signal-box.bearish {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.02));
            border-left-color: var(--danger);
        }
    </style>
</head>
<body>

    <!-- ==========================================
         HEADER SECTION
         ========================================== -->
    <header class="glass-panel px-4 py-3 flex justify-between items-center z-40 shrink-0">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='wallet.html'" class="w-10 h-10 rounded-full bg-white/5 text-white flex items-center justify-center hover:bg-white/10 transition-colors border border-white/10 shadow-lg">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="flex items-center gap-3">
                <div class="ai-avatar-container">
                    <img id="aiIcon" src="https://cdn-icons-png.flaticon.com/512/8649/8649605.png" alt="AI" class="w-11 h-11 rounded-full object-cover border-2 border-[#0f172a]">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 rounded-full border-2 border-[#0f172a]"></div>
                </div>
                <div>
                    <h1 id="aiName" class="text-lg font-bold text-white tracking-tight leading-none font-['Outfit']">Smart Adix</h1>
                    <div class="flex items-center gap-1.5 mt-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-[10px] font-medium text-emerald-400 uppercase tracking-wider">Live Market AI</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Controls: Help, Language, Timer -->
        <div class="flex items-center gap-3">
            <!-- Help & Support Button -->
            <button onclick="window.location.href='help.html'" class="w-10 h-10 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center hover:bg-indigo-500/40 hover:text-white transition-all border border-indigo-500/30 shadow-[0_0_15px_rgba(99,102,241,0.2)]" title="Help & Support">
                <i class="fas fa-headset text-lg"></i>
            </button>

            <div class="flex flex-col items-end gap-1.5">
                <div class="relative group">
                    <select id="langSelect" onchange="changeLanguage(this.value)" class="appearance-none bg-white/5 border border-white/10 text-white text-xs font-semibold rounded-full pl-3 pr-8 py-1 outline-none focus:border-indigo-500 cursor-pointer backdrop-blur-md transition-all hover:bg-white/10">
                        <option value="en" class="bg-slate-800">English</option>
                        <option value="hi" class="bg-slate-800">Hindi</option>
                    </select>
                    <i class="fas fa-globe absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-slate-400 pointer-events-none"></i>
                </div>
                <div class="text-[9px] font-bold text-slate-400 bg-white/5 px-2 py-0.5 rounded-full border border-white/5 flex items-center gap-1.5 shadow-inner">
                    <i class="fas fa-sync-alt text-indigo-400"></i>
                    <span id="sessionTimerDisplay">05:00</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ==========================================
         CHAT AREA SECTION
         ========================================== -->
    <main id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-5 custom-scrollbar">
        <!-- Welcome Date Badge -->
        <div class="flex justify-center my-4">
            <span class="bg-white/5 border border-white/10 text-slate-400 text-[10px] font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm backdrop-blur-sm">
                Live Market Session
            </span>
        </div>
        <!-- Messages will be injected here dynamically -->
    </main>

    <!-- ==========================================
         INPUT & FOOTER SECTION
         ========================================== -->
    <footer class="glass-panel p-4 w-full z-40 shrink-0">
        <!-- Quick Action Chips -->
        <div class="flex gap-3 overflow-x-auto scrollbar-hide mb-4 pb-2 px-1" id="quickActions">
            <button class="quick-chip" onclick="sendQuickMessage('Show top 5 crypto prices')">
                <i class="fas fa-fire text-orange-400"></i> Top Coins
            </button>
            <button class="quick-chip" onclick="sendQuickMessage('Give me market signals')">
                <i class="fas fa-bolt text-yellow-400"></i> Signals
            </button>
            <button class="quick-chip" onclick="sendQuickMessage('What is the price of Bitcoin?')">
                <i class="fab fa-bitcoin text-amber-500"></i> BTC Price
            </button>
            <button class="quick-chip" onclick="sendQuickMessage('Trading strategy advice')">
                <i class="fas fa-chess-knight text-indigo-400"></i> Strategy
            </button>
            <button class="quick-chip" onclick="sendQuickMessage('Change language to Hindi')">
                <i class="fas fa-language text-blue-400"></i> Hindi
            </button>
        </div>

        <div class="max-w-4xl mx-auto flex items-end gap-3 relative">
            <div class="flex-1 chat-input-container flex items-center px-2 py-1">
                <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-indigo-400 transition-colors shrink-0">
                    <i class="fas fa-chart-line"></i>
                </button>
                <textarea id="userInput" rows="1" placeholder="Ask about live prices, signals, or strategies..." 
                    class="chat-input py-3 px-2 custom-scrollbar"
                    oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
                <button class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-indigo-400 transition-colors shrink-0">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
            
            <button onclick="sendMessage()" id="sendBtn" class="w-14 h-14 rounded-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white flex items-center justify-center shadow-lg shadow-indigo-500/40 hover:scale-105 transition-all active:scale-95 shrink-0 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-paper-plane text-lg ml-1"></i>
            </button>
        </div>
    </footer>

    <!-- ==========================================
         JAVASCRIPT LOGIC & LIVE API ENGINE
         ========================================== -->
    <script>
        // --- 1. GLOBAL VARIABLES & API DATA ---
        let currentLang = 'en';
        let isTyping = false;
        let liveCryptoData = []; // Will hold top 100 coins from CoinGecko
        let isDataLoaded = false;
        
        // Default AI Configuration
        let aiConfig = {
            name: 'Smart Adix',
            icon: 'https://cdn-icons-png.flaticon.com/512/8649/8649605.png',
            custom_responses: {
                "hello": "Hi there! I am connected to live market data. Ask me about any top 100 crypto price or market signals.",
                "kaise ho": "Main bilkul theek hoon! Market ka live data mere paas hai. Kiska price janna hai?",
                "who are you": "I am Smart Adix, your premium AI trading and market analysis assistant.",
                "tum kaun ho": "Main Smart Adix hoon, aapka premium AI trading aur market analysis assistant."
            },
            banned_words: {
                "scam": "We maintain a 100% secure platform. Please avoid such words.",
                "fake": "Our data is fetched live from trusted global APIs."
            }
        };

        // Session Timer Variables
        let sessionTimerInterval = null;
        let sessionTimeLeft = 300; // 5 minutes

        // --- 2. FETCH LIVE CRYPTO DATA (COINGECKO API) ---
        async function fetchLiveMarketData() {
            try {
                // Fetch Top 100 coins by market cap
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false');
                if (response.ok) {
                    liveCryptoData = await response.json();
                    isDataLoaded = true;
                    console.log("Live Market Data Loaded: 100 Coins");
                }
            } catch (error) {
                console.error("Failed to fetch live data:", error);
            }
        }

        // --- 3. MULTILINGUAL KNOWLEDGE BASE ---
        const knowledgeBase = {
            en: {
                welcome: "Hello! I am <b>{name}</b>, your live market AI assistant. I track the <b>Top 100 Cryptocurrencies</b> in real-time. Ask me for prices, market signals, or trading strategies!",
                price_found: "Here is the live data for <b>{name} ({symbol})</b>:",
                price_not_found: "I couldn't find that coin in the Top 100 list. Please check the spelling or ask for major coins like Bitcoin, Ethereum, or Solana.",
                top_coins_intro: "Here are the current Top 5 Cryptocurrencies by Market Cap:",
                signal_bullish: "<div class='signal-box'><b>🟢 BULLISH SIGNAL</b><br>The overall market trend for top coins is positive. It might be a good time to hold or look for breakout setups.</div>",
                signal_bearish: "<div class='signal-box bearish'><b>🔴 BEARISH SIGNAL</b><br>The market is currently facing downward pressure. Consider tightening stop-losses and keeping stablecoins ready for dips.</div>",
                advice: "<b>Professional Trading Strategy:</b><ul><li><b>Trend is your friend:</b> Don't trade against strong market momentum.</li><li><b>Risk/Reward Ratio:</b> Always aim for at least 1:2 R/R on your setups.</li><li><b>Stop Loss:</b> Never enter a trade without a predefined exit point.</li><li><b>Patience:</b> Wait for the price to come to your levels, don't chase green candles.</li></ul><i>Disclaimer: This is algorithmic advice, not financial advice (NFA).</i>",
                lang_changed: "Language successfully changed to English. How can I assist your trading today?",
                banned_warning: "⚠️ <b>Warning:</b> {reply}",
                session_refresh: "🔄 Session refreshed to ensure data accuracy. Let's analyze the market!"
            },
            hi: {
                welcome: "Namaste! Main <b>{name}</b> hoon, aapka live market AI assistant. Main <b>Top 100 Cryptocurrencies</b> ko real-time track karta hoon. Mujhse live price, market signals, ya trading strategy puchiye!",
                price_found: "Ye raha <b>{name} ({symbol})</b> ka live data:",
                price_not_found: "Mujhe ye coin Top 100 list mein nahi mila. Kripya spelling check karein ya Bitcoin, Ethereum jaise bade coins ke baare mein puchein.",
                top_coins_intro: "Ye hain Market Cap ke hisaab se Top 5 Cryptocurrencies:",
                signal_bullish: "<div class='signal-box'><b>🟢 BULLISH SIGNAL (Tezi)</b><br>Market ka overall trend positive hai. Ye hold karne ya naye breakout setups dhundhne ka accha samay ho sakta hai.</div>",
                signal_bearish: "<div class='signal-box bearish'><b>🔴 BEARISH SIGNAL (Mandi)</b><br>Market abhi neeche ki taraf pressure mein hai. Apne stop-loss tight rakhein aur dips ke liye stablecoins taiyar rakhein.</div>",
                advice: "<b>Professional Trading Strategy:</b><ul><li><b>Trend ke sath chalein:</b> Market ke khilaf trade na karein.</li><li><b>Risk/Reward Ratio:</b> Hamesha kam se kam 1:2 R/R ka target rakhein.</li><li><b>Stop Loss:</b> Bina exit point soche kabhi trade mein entry na lein.</li><li><b>Sabar (Patience):</b> Price ko apne level par aane dein, bhaagti hui candle ke piche na bhagein.</li></ul><i>Disclaimer: Ye algorithmic salah hai, financial advice nahi (NFA).</i>",
                lang_changed: "Bhasha safaltapurvak Hindi mein badal di gayi hai. Main aapki trading mein kaise madad karoon?",
                banned_warning: "⚠️ <b>Chetawani:</b> {reply}",
                session_refresh: "🔄 Data accuracy ke liye session refresh ho gaya hai. Chaliye market analyze karte hain!"
            }
        };

        // --- 4. INITIALIZATION FUNCTION ---
        async function init() {
            console.log("Initializing Smart Adix AI (Live Market Mode)...");
            
            // Fetch live data immediately
            await fetchLiveMarketData();
            
            // Start Session Timer
            startSessionTimer();

            // Send Initial Welcome Message
            setTimeout(() => {
                const msg = knowledgeBase[currentLang].welcome.replace('{name}', aiConfig.name);
                appendAIMessage(msg);
            }, 1000);

            // Refresh data every 60 seconds in background
            setInterval(fetchLiveMarketData, 60000);
        }

        // --- 5. SESSION MANAGEMENT ---
        function startSessionTimer() {
            if (sessionTimerInterval) clearInterval(sessionTimerInterval);
            sessionTimeLeft = 300; // Reset to 5 mins
            
            updateTimerDisplay();
            
            sessionTimerInterval = setInterval(() => {
                sessionTimeLeft--;
                updateTimerDisplay();
                
                if (sessionTimeLeft <= 0) {
                    refreshSession();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(sessionTimeLeft / 60).toString().padStart(2, '0');
            const s = (sessionTimeLeft % 60).toString().padStart(2, '0');
            document.getElementById('sessionTimerDisplay').textContent = `${m}:${s}`;
        }

        function refreshSession() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `
                <div class="flex justify-center my-4">
                    <span class="bg-white/5 border border-white/10 text-slate-400 text-[10px] font-bold px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm backdrop-blur-sm">
                        Session Restarted
                    </span>
                </div>
            `;
            appendAIMessage(knowledgeBase[currentLang].session_refresh);
            startSessionTimer();
            fetchLiveMarketData(); // Force data refresh
        }

        // --- 6. UI INTERACTION FUNCTIONS ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
            if(textarea.value === '') textarea.style.height = '48px';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendQuickMessage(text) {
            const input = document.getElementById('userInput');
            input.value = text;
            sendMessage();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            
            const chips = document.getElementById('quickActions');
            if(lang === 'hi') {
                chips.innerHTML = `
                    <button class="quick-chip" onclick="sendQuickMessage('Top 5 coins dikhao')"><i class="fas fa-fire text-orange-400"></i> Top Coins</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Market signals kya hain?')"><i class="fas fa-bolt text-yellow-400"></i> Signals</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Bitcoin ka price kya hai?')"><i class="fab fa-bitcoin text-amber-500"></i> BTC Price</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Trading strategy batao')"><i class="fas fa-chess-knight text-indigo-400"></i> Strategy</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Change language to English')"><i class="fas fa-language text-blue-400"></i> English</button>
                `;
            } else {
                chips.innerHTML = `
                    <button class="quick-chip" onclick="sendQuickMessage('Show top 5 crypto prices')"><i class="fas fa-fire text-orange-400"></i> Top Coins</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Give me market signals')"><i class="fas fa-bolt text-yellow-400"></i> Signals</button>
                    <button class="quick-chip" onclick="sendQuickMessage('What is the price of Bitcoin?')"><i class="fab fa-bitcoin text-amber-500"></i> BTC Price</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Trading strategy advice')"><i class="fas fa-chess-knight text-indigo-400"></i> Strategy</button>
                    <button class="quick-chip" onclick="sendQuickMessage('Change language to Hindi')"><i class="fas fa-language text-blue-400"></i> Hindi</button>
                `;
            }
            appendAIMessage(knowledgeBase[currentLang].lang_changed);
        }

        // --- 7. CORE AI LOGIC ENGINE (LIVE DATA) ---
        function sendMessage() {
            if (isTyping) return;

            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            startSessionTimer();
            appendUserMessage(text);
            
            inputEl.value = '';
            inputEl.style.height = '48px';
            
            isTyping = true;
            document.getElementById('sendBtn').disabled = true;
            const typingId = showTypingIndicator();

            // Dynamic Delay: 3 to 5 seconds based on user request
            // Simulates deep API fetching and analysis time
            const delay = Math.floor(Math.random() * 2000) + 3000; // 3000ms to 5000ms
            
            setTimeout(() => {
                const response = generateAIResponse(text);
                removeTypingIndicator(typingId);
                if (response) appendAIMessage(response);
                isTyping = false;
                document.getElementById('sendBtn').disabled = false;
            }, delay);
        }

        function formatCryptoCard(coin) {
            const change = coin.price_change_percentage_24h;
            const changeClass = change >= 0 ? 'text-green' : 'text-red';
            const changeIcon = change >= 0 ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';
            const sign = change >= 0 ? '+' : '';
            
            return `
                <div class="crypto-card">
                    <div class="flex items-center gap-3">
                        <img src="${coin.image}" alt="${coin.name}" class="w-8 h-8 rounded-full">
                        <div>
                            <div class="font-bold text-white">${coin.name} <span class="text-xs text-slate-400 uppercase ml-1">${coin.symbol}</span></div>
                            <div class="text-xs text-slate-400">Rank #${coin.market_cap_rank}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="crypto-price">$${coin.current_price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6})}</div>
                        <div class="text-xs font-bold ${changeClass} mt-1">
                            <i class="fas ${changeIcon} mr-1"></i>${sign}${change.toFixed(2)}%
                        </div>
                    </div>
                </div>
            `;
        }

        function generateAIResponse(text) {
            const lowerText = text.toLowerCase();
            const dict = knowledgeBase[currentLang];

            // A. Language Change
            if (lowerText.includes('hindi') && (lowerText.includes('language') || lowerText.includes('mein') || lowerText.includes('bhasha'))) {
                changeLanguage('hi'); return null;
            }
            if (lowerText.includes('english') && (lowerText.includes('language') || lowerText.includes('in') || lowerText.includes('bhasha'))) {
                changeLanguage('en'); return null;
            }

            // B. Banned Words
            for (const [word, reply] of Object.entries(aiConfig.banned_words)) {
                if (lowerText.includes(word.toLowerCase())) {
                    return dict.banned_warning.replace('{reply}', reply);
                }
            }

            // C. Intent: TOP COINS
            if (lowerText.includes('top') && (lowerText.includes('coin') || lowerText.includes('crypto'))) {
                if (!isDataLoaded || liveCryptoData.length === 0) return "Fetching live data, please try again in a moment.";
                let reply = dict.top_coins_intro + "<div class='mt-3'>";
                for(let i=0; i<5; i++) {
                    reply += formatCryptoCard(liveCryptoData[i]);
                }
                reply += "</div>";
                return reply;
            }

            // D. Intent: MARKET SIGNALS
            if (lowerText.includes('signal') || lowerText.includes('market kaisa hai') || lowerText.includes('trend')) {
                if (!isDataLoaded || liveCryptoData.length === 0) return "Fetching live data, please try again in a moment.";
                
                // Calculate average 24h change of top 20 coins to determine signal
                let totalChange = 0;
                for(let i=0; i<20; i++) { totalChange += liveCryptoData[i].price_change_percentage_24h; }
                const avgChange = totalChange / 20;
                
                let reply = avgChange >= 0 ? dict.signal_bullish : dict.signal_bearish;
                reply += `<div class='text-xs text-slate-400 mt-2'>Based on Top 20 coins average 24h change: <b>${avgChange > 0 ? '+' : ''}${avgChange.toFixed(2)}%</b></div>`;
                return reply;
            }

            // E. Intent: TRADING STRATEGY / ADVICE
            if (lowerText.includes('strategy') || lowerText.includes('advice') || lowerText.includes('tip') || lowerText.includes('salah')) {
                return dict.advice;
            }

            // F. Intent: SPECIFIC COIN PRICE
            if (lowerText.includes('price') || lowerText.includes('rate') || lowerText.includes('kitna hai') || lowerText.includes('value')) {
                if (!isDataLoaded || liveCryptoData.length === 0) return "Fetching live data, please try again in a moment.";
                
                // Search for coin in top 100
                const match = liveCryptoData.find(c => lowerText.includes(c.name.toLowerCase()) || lowerText.includes(c.symbol.toLowerCase()));
                
                if (match) {
                    let reply = dict.price_found.replace('{name}', match.name).replace('{symbol}', match.symbol.toUpperCase());
                    reply += formatCryptoCard(match);
                    return reply;
                } else {
                    return dict.price_not_found;
                }
            }

            // G. Greetings
            if (lowerText.match(/\b(hi|hello|hey|namaste|hola|sup)\b/)) {
                return dict.welcome.replace('{name}', aiConfig.name);
            }

            // H. Fallback: Try to find a coin name anyway
            const fallbackMatch = liveCryptoData.find(c => lowerText.includes(c.name.toLowerCase()) || lowerText.includes(c.symbol.toLowerCase()));
            if (fallbackMatch) {
                let reply = dict.price_found.replace('{name}', fallbackMatch.name).replace('{symbol}', fallbackMatch.symbol.toUpperCase());
                reply += formatCryptoCard(fallbackMatch);
                return reply;
            }

            return dict.welcome.replace('{name}', aiConfig.name);
        }

        // --- 8. MESSAGE RENDERING FUNCTIONS ---
        function getCurrentTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return hours + ':' + minutes + ' ' + ampm;
        }

        function appendUserMessage(text) {
            const chatBox = document.getElementById('chatBox');
            const time = getCurrentTime();
            const html = `
                <div class="flex justify-end w-full">
                    <div class="flex flex-col items-end max-w-[85%]">
                        <div class="user-bubble px-4 py-3 text-sm font-medium">
                            ${text}
                        </div>
                        <span class="msg-time pr-1">${time}</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function appendAIMessage(text) {
            if (!text) return;
            
            const chatBox = document.getElementById('chatBox');
            const time = getCurrentTime();
            const html = `
                <div class="flex justify-start gap-3 w-full">
                    <img src="${aiConfig.icon}" class="w-8 h-8 rounded-full object-cover border border-slate-700 shadow-sm shrink-0 mt-1">
                    <div class="flex flex-col items-start max-w-[85%]">
                        <div class="ai-bubble ai-content px-4 py-3 text-sm font-medium">
                            ${text}
                        </div>
                        <span class="msg-time pl-1">${time}</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const chatBox = document.getElementById('chatBox');
            const html = `
                <div id="${id}" class="flex justify-start gap-3 w-full">
                    <img src="${aiConfig.icon}" class="w-8 h-8 rounded-full object-cover border border-slate-700 shadow-sm shrink-0 mt-1">
                    <div class="ai-bubble px-4 py-3 text-sm font-medium flex items-center">
                        <div class="typing-container">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', html);
            scrollToBottom();
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 200);
            }
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTo({
                top: chatBox.scrollHeight,
                behavior: 'smooth'
            });
        }

        // --- 9. BOOTSTRAP ---
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    </script>
</body>
</html>
