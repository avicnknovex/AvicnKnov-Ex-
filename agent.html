<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvicnKnov Agent - Verification & Support</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      /* --- Base and Layout --- */
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
      body {
        height: 100vh;
        background: url('https://imgpx.com/mbRZiaEdwWxL.png') no-repeat center center fixed;
        background-size: cover;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .chat-container {
        width: 100%;
        max-width: 600px;
        height: 90%;
        max-height: 800px;
        background: rgba(0, 0, 0, 0.75);
        border-radius: 15px;
        box-shadow: 0 0 25px #00ffe1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* --- Header (Back Button) --- */
      .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background: rgba(0, 255, 225, 0.1);
        border-bottom: 1px solid #00ffe1;
      }
      .back-btn {
        background: none;
        border: none;
        color: #00ffe1;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      .language-selector {
        padding: 5px 10px;
        border-radius: 5px;
        background: #00ffe1;
        color: black;
        border: none;
        font-weight: bold;
      }

      /* --- Chat Area --- */
      #chat-messages {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .message {
        display: flex;
        max-width: 85%;
      }
      .agent-message {
        justify-content: flex-start;
      }
      .user-message {
        justify-content: flex-end;
        align-self: flex-end;
      }
      .message-box {
        padding: 12px;
        border-radius: 15px;
        font-size: 0.95rem;
        line-height: 1.4;
      }
      .agent-message .message-box {
        background: #00ffe1;
        color: black;
        border-bottom-left-radius: 5px;
      }
      .user-message .message-box {
        background: #333;
        color: white;
        border-bottom-right-radius: 5px;
      }
      .message-header {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 0.8rem;
        color: #00ffe1;
      }
      .user-message .message-header {
        color: white;
      }
      
      /* --- Dynamic Options --- */
      .chat-options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }
      .chat-options button {
        background: rgba(0, 255, 225, 0.2);
        color: #00ffe1;
        border: 1px solid #00ffe1;
        padding: 8px 15px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: background 0.3s;
      }
      .chat-options button:hover {
        background: #00ffe1;
        color: black;
      }

      /* --- Input Area --- */
      .chat-input {
        display: flex;
        padding: 10px;
        gap: 10px;
        background: rgba(0, 0, 0, 0.85);
        border-top: 1px solid #00ffe1;
      }
      #chat-input-text {
        flex-grow: 1;
        padding: 12px;
        border-radius: 20px;
        border: 1px solid #00ffe1;
        background: #1a1a1a;
        color: white;
        outline: none;
      }
      #chat-send-btn {
        width: 50px;
        padding: 10px;
        border-radius: 50%;
        background: #00ffe1;
        color: black;
        border: none;
        font-weight: bold;
        cursor: pointer;
      }
      /* --- File Upload Specific Styles --- */
      .file-upload-box {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .file-upload-box input[type="file"] {
          border: 1px solid #00ffe1;
          padding: 10px;
          border-radius: 5px;
          background: #333;
      }
      /* Custom file input styling */
      .file-upload-box input[type="file"]::file-selector-button {
          background: #00ffe1;
          color: black;
          border: none;
          padding: 5px 10px;
          margin-right: 10px;
          border-radius: 3px;
          cursor: pointer;
      }
      #file-upload-btn {
        background: #00ffe1;
        color: black;
        font-weight: bold;
        padding: 10px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
      }

      /* --- Utility --- */
      .hidden { display: none !important; }
      .loading-animation {
          color: #00ffe1;
          animation: pulse 1s infinite alternate;
      }
      @keyframes pulse {
          0% { opacity: 0.5; }
          100% { opacity: 1; }
      }

    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <button class="back-btn" onclick="showExitConfirmation()">← Back to Exchange</button>
        <select id="language-select" class="language-selector" onchange="changeLanguage(this.value)">
          <option value="Hindi">हिन्दी</option>
          <option value="English">English</option>
        </select>
      </div>

      <div id="chat-messages">
        </div>

      <div class="chat-input">
        <input type="text" id="chat-input-text" placeholder="Type your message here...">
        <button id="chat-send-btn" onclick="handleUserInput()">Send</button>
      </div>
    </div>
    
    <input type="file" id="document-file-input" class="hidden" accept="image/*, video/mp4, application/pdf">

    <script>
      // Supabase Credentials
      const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // --- Global State ---
      let currentLanguage = 'Hindi'; 
      let chatState = 'INITIAL'; // States: INITIAL, AWAITING_ID, AWAITING_DOCS, AWAITING_PASSWORD, COMPLETE
      let userName = 'User';
      let wtqId = null;
      let action = null; // 'verify' or 'forgot'

      // --- Localization Data (Hindi and English) ---
      const lang = {
        Hindi: {
          agent_name: "AvicnKnov Agent",
          greeting: (name) => `नमस्ते ${name}, मैं आपकी क्या मदद कर सकता हूँ? कृपया अपना नाम (या "User") बताएँ।`,

          q_forgot_check: "कृपया अपनी WTQ ID सबमिट करें। मैं चेक कर रहा हूँ कि क्या आपका अकाउंट सत्यापित है।",
          forgot_verified: "मैंने आपकी ID को चेक कर लिया है। अब कृपया 8 से 16 अंकों के बीच एक नया मज़बूत (strong) पासवर्ड टाइप करके भेजें।",
          forgot_unverified: "❌ यह अकाउंट सत्यापित नहीं है। कृपया पहले 'Verify Account Number' विकल्प चुनें।",

          password_updated: (pass) => `✅ आपका पासवर्ड सफलतापूर्वक बदल दिया गया है। आपका नया पासवर्ड है: ${pass}. आप अब लॉग इन कर सकते हैं।`,
          docs_received: "✅ डॉक्यूमेंट मिल गया है। कृपया 5 सेकंड प्रतीक्षा करें, मैं सत्यापन प्रक्रिया पूरी कर रहा हूँ...",
          verification_complete: "✅ आपका अकाउंट सत्यापित हो गया है! आपको 72 घंटे के लिए हमारी टीम की निगरानी (surveillance) में रखा जाएगा। यदि कोई अनियमितता पाई जाती है, तो अकाउंट स्थायी रूप से बंद किया जा सकता है।",
          wrong_option: "कृपया 'Verify Account Number' या 'Forgot Password' में से सही विकल्प चुनें, या केवल अपनी ID/पासवर्ड टाइप करें।",
          id_forgot_solution: "यदि आप अपनी WTQ ID भूल गए हैं, तो <a href='support.html' target='_blank' style='color:#00ffe1;'>Support</a> सेक्शन पर जाएँ और 'WTQ ID Recovery' विकल्प चुनकर अपनी रिपोर्ट सबमिट करें। टीम आपके दिए गए डॉक्यूमेंट से सत्यापन करेगी।",
          unknown_error: "माफ़ करें, मैं इस काम के लिए नहीं बना हूँ। आप Support सेक्शन पर जाकर अपनी समस्या बता सकते हैं।"
        },
        English: {
          agent_name: "AvicnKnov Agent",
          greeting: (name) => `Hello ${name}, how may I help you? Please state your name (or "User").`,
          initial_options: ["Verify Account Number", "Forgot Password"],
          q_name: "Name",
          q_id: "Please submit your 12-character WTQ ID.",
          waiting: "Please wait 5 seconds, I am checking your ID...",
          id_found: "Your ID is correct! I have found it.",
          id_not_found: "❌ This ID is incorrect or no unverified account exists with this ID. Please submit the correct ID.",
          q_docs: "For future recovery, please upload a 7-second live video or any ID card/document (e.g., Aadhar, Driving License).",
          q_forgot_check: "Please submit your WTQ ID. I am checking if your account is verified.",
          forgot_verified: "I have checked your ID. Now please type and send a new strong password between 8 and 16 digits.",
          forgot_unverified: "❌ This account is not verified. Please choose the 'Verify Account Number' option first.",
          forgot_not_found: "❌ No verified account found with this ID.",
          password_updated: (pass) => `✅ Your password has been successfully changed. Your new password is: ${pass}. You can now log in.`,
          docs_received: "✅ Document received. Please wait 5 seconds while I complete the verification process...",
          verification_complete: "✅ Your account has been verified! You will be under our team's surveillance for 72 hours. If any irregularity is found, the account may be permanently banned.",
          wrong_option: "Please select the correct option from 'Verify Account Number' or 'Forgot Password', or type only your ID/Password.",
          id_forgot_solution: "If you forgot your WTQ ID, please go to the <a href='support.html' target='_blank' style='color:#00ffe1;'>Support</a> section and submit your report using the 'WTQ ID Recovery' option. The team will verify using the documents you provided.",
          unknown_error: "Sorry, I am not programmed for this task. You can report your problem in the Support section."
        }
      };

      // --- CORE FUNCTIONS ---

      function changeLanguage(langCode) {
        currentLanguage = langCode;
        // Re-display the latest message to update language if necessary
        document.getElementById('chat-messages').innerHTML = '';
        postAgentMessage(lang[currentLanguage].greeting(userName), lang[currentLanguage].initial_options);
      }

      function addMessage(sender, text, options = []) {
        const chatBox = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'Agent' ? 'agent-message' : 'user-message');
        
        const contentBox = document.createElement('div');
        contentBox.classList.add('message-box');

        const header = document.createElement('div');
        header.classList.add('message-header');
        header.textContent = sender === 'Agent' ? lang[currentLanguage].agent_name : userName;
        
        const textContent = document.createElement('p');
        textContent.innerHTML = text; // Use innerHTML to allow links

        contentBox.appendChild(header);
        contentBox.appendChild(textContent);

        if (options.length > 0) {
            const optionDiv = document.createElement('div');
            optionDiv.classList.add('chat-options');
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => handleUserInput(opt);
                optionDiv.appendChild(btn);
            });
            contentBox.appendChild(optionDiv);
        }
        
        msgDiv.appendChild(contentBox);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
      }

      function postAgentMessage(text, options = []) {
        addMessage('Agent', text, options);
      }

      function postUserMessage(text) {
        addMessage('User', text);
      }
      
      // --- STATE HANDLER ---

      async function handleUserInput(input = null) {
        const chatInput = document.getElementById('chat-input-text');
        const text = input || chatInput.value.trim();
        
        if (!text) return;
        
        // Post user message immediately
        postUserMessage(text);
        chatInput.value = ''; // Clear input

        if (chatState === 'INITIAL') {
            // First message: Set name
            if (text.toLowerCase() !== 'user') {
                userName = text.trim();
            }
            // Proceed to action selection
            postAgentMessage(lang[currentLanguage].greeting(userName), lang[currentLanguage].initial_options);
            chatState = 'AWAITING_ACTION';
            return;
        }

        if (chatState === 'AWAITING_ACTION') {
            const lowerText = text.toLowerCase();
            if (lowerText.includes('verify')) {
                action = 'verify';
                chatState = 'AWAITING_ID';
                postAgentMessage(lang[currentLanguage].q_id);
            } else if (lowerText.includes('forgot')) {
                action = 'forgot';
                chatState = 'AWAITING_ID';
                postAgentMessage(lang[currentLanguage].q_forgot_check);
            } else if (lowerText.includes('id bhul') || lowerText.includes('forgot id') || lowerText.includes('wtq id')) {
                postAgentMessage(lang[currentLanguage].id_forgot_solution);
            } else {
                postAgentMessage(lang[currentLanguage].wrong_option);
            }
            return;
        }

        if (chatState === 'AWAITING_ID') {
            const idPattern = /^[A-Z0-9]{12}$/;
            if (!idPattern.test(text)) {
                if (text.toLowerCase().includes('id bhul') || text.toLowerCase().includes('forgot id')) {
                     postAgentMessage(lang[currentLanguage].id_forgot_solution);
                     return;
                }
                postAgentMessage("❌ Invalid WTQ ID format. It must be 12 characters (uppercase letters and numbers).");
                return;
            }

            wtqId = text.toUpperCase();
            postAgentMessage(lang[currentLanguage].waiting + `<span id="loading-id" class="loading-animation">...</span>`);
            await new Promise(resolve => setTimeout(resolve, 5000)); // 5 second wait

            document.getElementById('loading-id').remove();

            if (action === 'verify') {
                await checkVerificationId(wtqId);
            } else if (action === 'forgot') {
                await checkForgotId(wtqId);
            }
            return;
        }

        if (chatState === 'AWAITING_PASSWORD') {
            if (text.length >= 8 && text.length <= 16) {
                await updatePassword(text);
            } else {
                postAgentMessage("❌ Password must be between 8 and 16 characters.");
            }
            return;
        }

        if (chatState === 'AWAITING_DOCS') {
            // Check if input is a known command (e.g., ID forgotten)
            if (text.toLowerCase().includes('id bhul') || text.toLowerCase().includes('forgot id')) {
                 postAgentMessage(lang[currentLanguage].id_forgot_solution);
                 return;
            }
            
            // Assume user is typing the ID again or trying to upload
            postAgentMessage("Please use the file upload option below (or type your WTQ ID if you think you typed it wrong).");
            return;
        }
        
        // Default catch-all
        postAgentMessage(lang[currentLanguage].unknown_error);
      }
      
      // --- SUPABASE & VERIFICATION LOGIC ---
      
      async function checkVerificationId(id) {
          // Check if WTQ ID exists in the unverified table
          const { data, error } = await sb
              .from('user-verify')
              .select('id')
              .eq('wtq_id', id)
              .maybeSingle();

          if (error || !data) {
              postAgentMessage(lang[currentLanguage].id_not_found);
              chatState = 'AWAITING_ID'; // Stay here
              return;
          }

          postAgentMessage(lang[currentLanguage].id_found);
          postAgentMessage(lang[currentLanguage].q_docs);
          
          // Inject file upload UI
          injectFileUploadUI();
          chatState = 'AWAITING_DOCS';
      }
      
      async function checkForgotId(id) {
          // Check if WTQ ID exists in the verified table (user-details)
          const { data, error } = await sb
              .from('user-details')
              .select('id, phone_number')
              .eq('wtq_id', id)
              .maybeSingle();

          if (error || !data) {
              postAgentMessage(lang[currentLanguage].forgot_not_found);
              chatState = 'AWAITING_ACTION'; // Go back to initial choice
              return;
          }

          // In a real system, we must confirm the account is verified, 
          // which is implied by being in user-details.
          postAgentMessage(lang[currentLanguage].forgot_verified);
          chatState = 'AWAITING_PASSWORD';
      }
      
      async function updatePassword(newPassword) {
          const loadingMsg = "🔄 " + lang[currentLanguage].waiting.replace('ID', 'Password');
          postAgentMessage(loadingMsg);
          
          await new Promise(resolve => setTimeout(resolve, 5000)); // 5 second wait

          // **IMPORTANT:** In production, this password MUST be HASHED before saving.
          const { error } = await sb
              .from('user-details')
              .update({ password: newPassword })
              .eq('wtq_id', wtqId); // Use WTQ ID for targetting

          if (error) {
              postAgentMessage("❌ Password update failed: " + error.message);
              chatState = 'AWAITING_PASSWORD'; 
              return;
          }

          postAgentMessage(lang[currentLanguage].password_updated(newPassword));
          chatState = 'COMPLETE';
          
          // Redirect after 7 seconds
          setTimeout(() => {
              window.location.href = 'index.html';
          }, 7000);
      }
      
      // --- FILE UPLOAD AND VERIFICATION ---
      
      function injectFileUploadUI() {
          const chatBox = document.getElementById('chat-messages');
          const fileDiv = document.createElement('div');
          fileDiv.classList.add('agent-message');
          fileDiv.innerHTML = `
              <div class="message-box file-upload-box" id="file-upload-box">
                  <div class="message-header">${lang[currentLanguage].agent_name}</div>
                  <p>Choose File (Video/Document/ID):</p>
                  <input type="file" id="verification-file" accept="image/*,video/mp4,application/pdf" />
                  <button id="file-upload-btn" onclick="uploadVerificationFile()">Upload & Send</button>
              </div>
          `;
          chatBox.appendChild(fileDiv);
          chatBox.scrollTop = chatBox.scrollHeight;
      }
      
      async function uploadVerificationFile() {
          const fileInput = document.getElementById('verification-file');
          const file = fileInput.files[0];
          const uploadBtn = document.getElementById('file-upload-btn');
          
          if (!file || !wtqId) {
              alert("Please select a file and ensure your WTQ ID is set.");
              return;
          }

          uploadBtn.disabled = true;
          uploadBtn.textContent = 'Uploading...';
          
          // Upload file to the designated bucket: user-verify-number
          const fileExtension = file.name.split('.').pop();
          const filePath = `${wtqId}/verification.${fileExtension}`; // Unique path based on WTQ ID
          
          const { error: uploadError } = await sb.storage
              .from('user-verify-number')
              .upload(filePath, file);

          uploadBtn.disabled = false;
          uploadBtn.textContent = 'Upload & Send';

          if (uploadError) {
              alert(`❌ Upload Failed: ${uploadError.message}`);
              return;
          }

          // Remove upload UI and show success message
          document.getElementById('file-upload-box').remove();
          postUserMessage(`File uploaded: ${file.name}`);
          postAgentMessage(lang[currentLanguage].docs_received);
          
          await new Promise(resolve => setTimeout(resolve, 5000)); // 5 second wait for 'check'
          
          // Final Verification Step: Update user-verify and move data to user-details
          
          // 1. Update user-verify status
          const { error: updateError, data: userData } = await sb
              .from('user-verify')
              .update({ is_verified: true })
              .eq('wtq_id', wtqId)
              .select('*')
              .single();

          if (updateError || !userData) {
              postAgentMessage("❌ Verification failed at final step. Please contact support immediately.");
              chatState = 'COMPLETE'; 
              return;
          }
          
          // 2. Insert verified data into user-details
          const { error: insertError } = await sb
              .from('user-details')
              .insert({
                  phone_number: userData.phone_number,
                  password: userData.password_hash,
                  wtq_id: userData.wtq_id,
                  full_name: userData.full_name,
                  username: userData.username,
                  country: userData.country,
                  gender: userData.gender,
                  dob: userData.dob
              });
              
          if (insertError) {
              // Handle case where insertion fails but verify table is updated (critical error)
               postAgentMessage(`⚠️ Critical Error: Verification status updated, but final details insert failed (${insertError.message}). Please contact support with your WTQ ID.`);
               chatState = 'COMPLETE'; 
               return;
          }


          postAgentMessage(lang[currentLanguage].verification_complete);
          chatState = 'COMPLETE';
          
          // Redirect after 7 seconds
          setTimeout(() => {
              window.location.href = 'index.html';
          }, 7000);
      }
      
      // --- NAVIGATION AND INIT ---
      
      function showExitConfirmation() {
          const msg = currentLanguage === 'Hindi' ? "क्या आप सचमुच वापस जाना चाहते हैं?" : "Are you sure you want to go back?";
          const confirmExit = confirm(msg);
          
          if (confirmExit) {
              window.location.href = 'index.html'; // Confirm
          }
          // Cancel: Do nothing
      }
      
      function init() {
          // Read URL parameters
          const params = new URLSearchParams(window.location.search);
          action = params.get('action');
          wtqId = params.get('id');
          
          // Set initial chat message
          postAgentMessage(lang[currentLanguage].greeting(userName));
          
          // Auto-select action based on URL
          if (action === 'verify' && wtqId) {
              postUserMessage(`Verify Account (WTQ ID: ${wtqId})`);
              handleUserInput(wtqId); // Start verification immediately
          } else if (action === 'forgot' && wtqId) {
              postUserMessage(`Forgot Password (WTQ ID: ${wtqId})`);
              handleUserInput(wtqId); // Start forgot flow immediately
          } else {
              // If no action is set, await name input
              chatState = 'INITIAL';
          }
          
          // Event listener for Enter key in input field
          document.getElementById('chat-input-text').addEventListener('keypress', function(e) {
              if (e.key === 'Enter') {
                  handleUserInput();
              }
          });
      }

      window.onload = init;
    </script>
  </body>
</html>
