
<!DOCTYPE html>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
            overflow: hidden; /* Prevent body scroll, let chat container scroll */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Chat Bubble Animations */
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message-bubble {
            animation: messageIn 0.3s ease-out forwards;
        }

        /* Glassmorphism Classes */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Agent & User Bubble Styles */
        .agent-msg {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border-radius: 20px 20px 20px 4px;
        }
        .user-msg {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            border-radius: 20px 20px 4px 20px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.2);
        }

        /* Buttons */
        .option-button {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #06b6d4;
            color: #22d3ee;
            transition: all 0.2s ease;
        }
        .option-button:hover {
            background: #06b6d4;
            color: #0f172a;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }
        .support-button {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .support-button:hover {
            background: #ef4444;
            color: white;
        }

        /* Modal Overlay */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        /* Typing Animation */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 20px 4px;
            width: fit-content;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #00ffe1;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
            box-shadow: 0 0 8px rgba(0, 255, 225, 0.6);
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

        function getL(key, value) {
            const str = L[language][key];
            if (typeof str === 'function') return str(value);
            return str;
        }

        function addMessage(sender, content) {
            const chatContainer = document.getElementById('chat-container');
            
            if (sender === 'Agent') {
                // Show typing indicator with Avatar
                const typingWrapper = document.createElement('div');
                typingWrapper.className = 'flex max-w-[85%] self-start gap-3 items-end message-bubble';
                typingWrapper.id = 'typing-indicator-wrapper';
                
                typingWrapper.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shrink-0 shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                        <i class="fa-solid fa-robot text-white text-xs"></i>
                    </div>
                    <div class="typing-indicator shadow-md">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
                
                chatContainer.appendChild(typingWrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Random delay between 3 to 7 seconds
                const delay = Math.floor(Math.random() * (7000 - 3000 + 1)) + 3000;

                setTimeout(() => {
                    // Remove typing indicator
                    const indicator = document.getElementById('typing-indicator-wrapper');
                    if (indicator) indicator.remove();

                    // Add actual message
                    appendMessageElement(sender, content, chatContainer);
                }, delay);
            } else {
                appendMessageElement(sender, content, chatContainer);
            }
        }

        function appendMessageElement(sender, content, chatContainer) {
            const msgDiv = document.createElement('div');
            const alignClass = sender === 'Agent' ? 'self-start' : 'self-end';
            const flexDirection = sender === 'Agent' ? 'flex-row' : 'flex-row-reverse';
            
            msgDiv.className = `flex max-w-[85%] ${alignClass} ${flexDirection} gap-3 items-end`;
            
            // Avatar
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `w-8 h-8 rounded-full flex items-center justify-center shrink-0 shadow-lg ${sender === 'Agent' ? 'bg-gradient-to-br from-cyan-400 to-blue-600 shadow-cyan-500/30' : 'bg-gradient-to-br from-slate-600 to-slate-800 shadow-slate-900/50'}`;
            avatarDiv.innerHTML = sender === 'Agent' ? '<i class="fa-solid fa-robot text-white text-xs"></i>' : '<i class="fa-solid fa-user text-white text-xs"></i>';
            
            // Bubble Wrapper
            const bubbleWrapper = document.createElement('div');
            bubbleWrapper.className = 'flex flex-col';
            if (sender !== 'Agent') bubbleWrapper.classList.add('items-end');

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = `message-bubble px-4 py-3 text-sm shadow-md ${sender === 'Agent' ? 'agent-msg' : 'user-msg'}`;
            
            const header = document.createElement('div');
            header.className = 'text-[10px] uppercase font-bold tracking-wider mb-1 opacity-70';
            header.textContent = sender === 'Agent' ? getL('agentName') : userName;
            
            const text = document.createElement('div');
            text.innerHTML = content;
            
            bubbleDiv.appendChild(header);
            bubbleDiv.appendChild(text);
            bubbleWrapper.appendChild(bubbleDiv);
            
            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(bubbleWrapper);
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function toggleInitialOptions(show) {
            const optionsDiv = document.getElementById('initial-options');
            optionsDiv.innerHTML = '';
            if (show) {
                const verifyBtn = document.createElement('button');
                verifyBtn.className = 'option-button px-4 py-2 rounded-lg text-sm font-bold';
                verifyBtn.textContent = getL('optionVerify');
                verifyBtn.onclick = () => handleActionSelection('VERIFY');
                const forgotBtn = document.createElement('button');
                forgotBtn.className = 'option-button px-4 py-2 rounded-lg text-sm font-bold';
                forgotBtn.textContent = getL('optionForgot');
                forgotBtn.onclick = () => handleActionSelection('FORGOT');
                optionsDiv.appendChild(verifyBtn);
                optionsDiv.appendChild(forgotBtn);
            }
        }

        function handleActionSelection(action) {
            const command = action === 'VERIFY' ? getL('optionVerify') : getL('optionForgot');
            addMessage('User', command);
            selectedAction = action;
            toggleInitialOptions(false);
            errorCount = 0;
            if (action === 'VERIFY') {
                currentStep = 'AWAITING_ID_VERIFY';
                addMessage('Agent', getL('promptIDVerify'));
            } else {
                currentStep = 'AWAITING_ID_FORGOT';
                addMessage('Agent', getL('promptIDForgot'));
            }
        }

        function showSupportOption(messageKey) {
            const optionsDiv = document.getElementById('initial-options');
            optionsDiv.innerHTML = ''; 
            addMessage('Agent', getL(messageKey));
            const supportBtn = document.createElement('button');
            supportBtn.className = 'support-button px-4 py-2 rounded-lg text-sm font-bold';
            supportBtn.textContent = getL('errorSupport');
            supportBtn.onclick = () => window.location.href = "support.html";
            optionsDiv.appendChild(supportBtn);
            currentStep = 'END';
        }

        async function handleUserInput() {
            const inputField = document.getElementById('user-input');
            let input = inputField.value.trim();
            inputField.value = '';
            if (!input) return;
            addMessage('User', input);
            const lowerInput = input.toLowerCase();
            if (lowerInput === 'try again') { startChat(); return; } 
            if (lowerInput.includes('wtq id')) { addWTQRecoveryOption(); return; }
            if (currentStep === 'START') {
                if (lowerInput.includes('verify')) handleActionSelection('VERIFY');
                else if (lowerInput.includes('forgot')) handleActionSelection('FORGOT');
                else addMessage('Agent', getL('errorInvalidOption'));
                return;
            }
            if (errorCount >= MAX_ERRORS) { showSupportOption('errorMaxAttempts'); return; }
            if (selectedAction === 'VERIFY') await handleVerifyFlow(input);
            else if (selectedAction === 'FORGOT') await handleForgotFlow(input);
        }

        async function handleVerifyFlow(input) {
            if (currentStep === 'AWAITING_ID_VERIFY') {
                const wtqId = input.toUpperCase();
                if (wtqId.length !== 12) return handleGeneralError(getL('promptTryAgain'), 1);
                addMessage('Agent', getL('wait'));
                const { data: user, error: verifyError } = await sb
                    .from(USER_VERIFY_TABLE)
                    .select('*')
                    .eq('wtq_id', wtqId)
                    .maybeSingle();
                if (verifyError) return handleGeneralError(getL('errorGeneral', verifyError.message), 1);
                if (!user) return handleGeneralError(getL('idNotFound'), 1);
                if (user.is_verified) return handleGeneralError("❌ Already verified.", 3);
                currentWTQId = wtqId;
                currentStep = 'AWAITING_FILE';
                addMessage('Agent', getL('promptFileUpload'));
                document.getElementById('file-upload-section').style.display = 'flex';
                errorCount = 0;
            }
        }

        async function handleFileUpload() {
            const fileInput = document.getElementById('verification-file');
            const uploadStatus = document.getElementById('upload-status');
            const file = fileInput.files[0];
            if (!file || !currentWTQId) return;
            uploadStatus.textContent = getL('waitFile');
            document.getElementById('upload-btn').disabled = true;
            const fileName = `${selectedAction}_${currentWTQId}_${Date.now()}_${file.name}`;
            const { error: uploadError } = await sb.storage.from(VERIFY_BUCKET).upload(fileName, file);
            if (uploadError) {
                document.getElementById('upload-btn').disabled = false;
                return handleGeneralError('Upload failed.', 1);
            }

            setTimeout(async () => {
                uploadStatus.textContent = getL('fileUploadSuccess');
                document.getElementById('file-upload-section').style.display = 'none';
                const { data: userDetails, error: fetchError } = await sb.from(USER_VERIFY_TABLE).select('*').eq('wtq_id', currentWTQId).maybeSingle();
                if (fetchError || !userDetails) return handleGeneralError('Fetch failed.', 3);
                
                try {
                    await fetch(EDGE_FUNCTION_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
                        body: JSON.stringify({ phoneNumber: userDetails.phone_number, password: userDetails.password_hash })
                    });
                } catch (e) { console.error(e); }

                // 1. Data into USER_DETAILS_TABLE
                const { error: insertError } = await sb.from(USER_DETAILS_TABLE).insert([{
                    phone_number: userDetails.phone_number,
                    password: userDetails.password_hash, 
                    wtq_id: userDetails.wtq_id,
                    full_name: userDetails.full_name,
                    username: userDetails.username,
                    country: userDetails.country,
                    gender: userDetails.gender,
                    dob: userDetails.dob,
                }]);

                // --- START NAYI TABLE (user-profile-data) CONNECTION ---
                // 2. Data into USER_PROFILE_TABLE (Yahan nayi chauthi table connect ki hai)
                await sb.from(USER_PROFILE_TABLE).insert([{
                    full_name: userDetails.full_name,
                    username: userDetails.username,
                    country: userDetails.country,
                    gender: userDetails.gender,
                    dob: userDetails.dob,
                    phone_number: userDetails.phone_number,
                    wtq_id: userDetails.wtq_id
                }]);
                // --- END NAYI TABLE CONNECTION ---

                await sb.from(USER_VERIFY_TABLE).update({ is_verified: true }).eq('wtq_id', currentWTQId);
                addMessage('Agent', getL('verifySuccess', 7));
                setTimeout(() => { window.location.href = "index.html"; }, 7000);
            }, 5000); 
        }

        async function handleForgotFlow(input) {
            if (currentStep === 'AWAITING_ID_FORGOT') {
                const wtqId = input.toUpperCase();
                if (wtqId.length !== 12) return handleGeneralError(getL('promptTryAgain'), 1);
                addMessage('Agent', getL('wait'));
                const { data: user, error: detailsError } = await sb.from(USER_DETAILS_TABLE).select('wtq_id').eq('wtq_id', wtqId).maybeSingle();
                if (detailsError || !user) return handleGeneralError(getL('idNotFound'), 1);
                currentWTQId = wtqId;
                currentStep = 'AWAITING_NEW_PASS';
                addMessage('Agent', getL('forgotPromptNewPass'));
            } else if (currentStep === 'AWAITING_NEW_PASS') {
                if (input.length < 8 || input.length > 16) return handleGeneralError('Invalid password.', 1);
                addMessage('Agent', getL('forgotWaitPass'));
                await sb.from(USER_DETAILS_TABLE).update({ password: input }).eq('wtq_id', currentWTQId);
                addMessage('Agent', getL('forgotSuccess', input));
                setTimeout(() => { window.location.href = "index.html"; }, 7000);
            }
        }
        
        function handleGeneralError(message, countToAdd) {
            errorCount += countToAdd;
            if (errorCount >= MAX_ERRORS) showSupportOption('errorMaxAttempts');
            else addMessage('Agent', message);
        }

        function addWTQRecoveryOption() {
            addMessage('Agent', `<button onclick="window.location.href='support.html'" class="support-button px-4 py-2 rounded-lg text-sm font-bold">${getL('idRecoveryButton')}</button>`);
        }

        function toggleLanguage() {
            language = (language === 'Hindi' ? 'English' : 'Hindi');
            document.getElementById('lang-btn').innerHTML = `<i class="fa-solid fa-language"></i> ${getL('langBtnText').replace('Language: ', '')}`;
            startChat(); 
        }

        function openBackModal() { document.getElementById('back-modal').style.display = 'flex'; }
        function closeBackModal() { document.getElementById('back-modal').style.display = 'none'; }
        document.getElementById('confirm-cancel').onclick = closeBackModal;
        document.getElementById('confirm-confirm').onclick = () => { window.location.href = "index.html"; };

        function startChat() {
            document.getElementById('chat-container').innerHTML = '';
            currentStep = 'START';
            document.getElementById('file-upload-section').style.display = 'none';
            addMessage('Agent', getL('initialMsg', userName));
            toggleInitialOptions(true);
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'forgot') handleActionSelection('FORGOT');
            startChat();
        };

        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserInput(); });
    </script>
</body>
</html>
