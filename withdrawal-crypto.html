<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Crypto - AvicnKnov Ex</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

      /* Animations */
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .slide-up { animation: slideUp 0.4s ease-out forwards; }
      .zoom-in { animation: zoomIn 0.3s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-12">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, Search, ChevronRight, AlertCircle, 
            Wallet, CheckSquare, Loader2, CheckCircle2,
            Info
        } from 'lucide-react';

        // --- Supabase Config ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- SHARED HOLDINGS LOGIC (Connecting to favourites-holdings.js/favourites-all.js) ---
        // We use the same storage key and logic to ensure balance synchronization.
        const HOLD_KEY = 'AVX_holdings_test';

        const getSharedHoldingBalance = (symbol) => {
            try {
                const raw = localStorage.getItem(HOLD_KEY);
                const data = raw ? JSON.parse(raw) : {};
                // Handle case sensitivity as seen in referenced JS files
                const item = data[symbol.toUpperCase()];
                return item ? Number(item.qty || 0) : 0;
            } catch (e) {
                console.error("Error reading shared holdings:", e);
                return 0;
            }
        };

        const updateSharedHoldingBalance = (symbol, deductQty) => {
            try {
                const raw = localStorage.getItem(HOLD_KEY);
                const data = raw ? JSON.parse(raw) : {};
                const sym = symbol.toUpperCase();
                const item = data[sym];

                if (item) {
                    const currentQty = Number(item.qty || 0);
                    const currentCost = Number(item.cost_inr || 0);

                    // Calculate average cost to deduct cost proportionally
                    const avgCost = currentQty > 0 ? currentCost / currentQty : 0;
                    
                    const newQty = Math.max(0, currentQty - deductQty);
                    const newCost = Math.max(0, currentCost - (deductQty * avgCost));

                    if (newQty <= 0) {
                        delete data[sym]; // Remove if empty
                    } else {
                        data[sym] = { qty: newQty, cost_inr: newCost };
                    }
                    localStorage.setItem(HOLD_KEY, JSON.stringify(data));
                    return true;
                }
                return false;
            } catch (e) {
                console.error("Error updating shared holdings:", e);
                return false;
            }
        };

        const WithdrawalCrypto = () => {
            // --- State ---
            const [step, setStep] = useState(1); // 1: Select Token, 2: Select Network, 3: Form
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState('');
            
            // Data
            const [allConfig, setAllConfig] = useState([]); // Raw data from user-withdrawal-control
            const [uniqueTokens, setUniqueTokens] = useState([]); // Unique symbols
            const [availableNetworks, setAvailableNetworks] = useState([]); // Networks for selected token
            const [userBalance, setUserBalance] = useState(0);

            // Selection
            const [selectedToken, setSelectedToken] = useState(null); // e.g. 'USDT'
            const [selectedNetworkData, setSelectedNetworkData] = useState(null); // Full row object

            // Form
            const [amount, setAmount] = useState('');
            const [address, setAddress] = useState('');
            const [memo, setMemo] = useState('');
            const [isConfirmed, setIsConfirmed] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [successMsg, setSuccessMsg] = useState('');

            // --- Handlers ---
            const handleBack = () => {
                if (step === 3) setStep(2);
                else if (step === 2) {
                    setStep(1);
                    setSelectedToken(null);
                } else {
                    window.location.href = 'withdrawal.html';
                }
            };

            // --- Fetch Config ---
            useEffect(() => {
                const fetchConfig = async () => {
                    try {
                        const { data, error } = await supabase
                            .from('user-withdrawal-control')
                            .select('*')
                            .order('token_symbol');
                        
                        if (error) throw error;
                        setAllConfig(data || []);

                        // Extract unique tokens
                        const unique = [...new Set(data.map(item => item.token_symbol))]
                            .map(symbol => data.find(item => item.token_symbol === symbol));
                        setUniqueTokens(unique);
                    } catch (err) {
                        console.error(err);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchConfig();
            }, []);

            // --- Actions ---

            const handleTokenSelect = (tokenSymbol) => {
                setSelectedToken(tokenSymbol);
                // Filter networks for this token
                const networks = allConfig.filter(item => item.token_symbol === tokenSymbol);
                setAvailableNetworks(networks);
                setStep(2);
            };

            const handleNetworkSelect = async (networkData) => {
                setSelectedNetworkData(networkData);
                setLoading(true);
                
                try {
                    // --- CONNECTION TO JS FILE LOGIC ---
                    const balance = getSharedHoldingBalance(networkData.token_symbol);
                    setUserBalance(balance);

                } catch (e) {
                    console.error("Balance check failed", e);
                } finally {
                    setLoading(false);
                    setStep(3);
                }
            };

            const handleSubmit = async () => {
                const amt = parseFloat(amount);
                if (isNaN(amt)) return;

                if (amt < parseFloat(selectedNetworkData.min_withdraw)) {
                    alert(`Minimum withdrawal is ${selectedNetworkData.min_withdraw} ${selectedToken}`);
                    return;
                }
                
                // Re-check balance at moment of submission to prevent race conditions
                const currentBalance = getSharedHoldingBalance(selectedToken);
                if (amt > currentBalance) {
                    alert(`Insufficient ${selectedToken} balance.`);
                    return;
                }

                if (!address || address.length < 10) {
                    alert("Please enter a valid wallet address.");
                    return;
                }
                if (selectedNetworkData.enable_memo === 'yes' && !memo) {
                    alert("Memo is required for this network.");
                    return;
                }

                setSubmitting(true);

                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) throw new Error("Please log in.");

                    const timestamp = new Date().toISOString();

                    // 1. Insert into withdrawal-crypto-history
                    const { error: histError } = await supabase
                        .from('withdrawal-crypto-history')
                        .insert([{
                            user_id: user.id,
                            token_symbol: selectedToken,
                            network: selectedNetworkData.network,
                            amount: amt,
                            address: address,
                            memo: memo || null,
                            created_at: timestamp
                        }]);
                    if (histError) throw histError;

                    // 2. Insert into user-transactions
                    const { error: txError } = await supabase
                        .from('user-transactions')
                        .insert([{
                            user_id: user.id,
                            type: 'withdrawal',
                            method: 'Crypto',
                            amount: amt,
                            status: 'pending',
                            created_at: timestamp
                        }]);
                    if (txError) throw txError;

                    // 3. DEDUCT BALANCE (Connect to favourites-holdings.js logic)
                    updateSharedHoldingBalance(selectedToken, amt);

                    setSuccessMsg("Withdrawal Submitted Successfully!");
                    
                    // Refresh after 3 seconds
                    setTimeout(() => {
                        window.location.reload();
                    }, 3000);

                } catch (err) {
                    alert(err.message);
                    setSubmitting(false);
                }
            };

            // --- Render ---

            return (
                <div className="min-h-screen text-slate-800 relative font-sans pb-10">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto flex items-center gap-3">
                            <button onClick={handleBack} className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100">
                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <div>
                                <h1 className="text-xl font-black text-slate-800 tracking-tight">Withdraw Crypto</h1>
                                <p className="text-xs text-slate-400 font-bold">
                                    {step === 1 ? 'Select Coin' : step === 2 ? `Select ${selectedToken} Network` : 'Enter Details'}
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 pt-6">

                        {loading && (
                            <div className="flex flex-col items-center justify-center py-20">
                                <Loader2 className="w-10 h-10 text-amber-500 animate-spin mb-3" />
                                <p className="text-slate-400 text-sm font-bold animate-pulse">Loading...</p>
                            </div>
                        )}

                        {!loading && !successMsg && (
                            <>
                                {/* STEP 1: TOKEN SELECTION */}
                                {step === 1 && (
                                    <div className="fade-in space-y-4">
                                        <div className="relative group">
                                            <Search className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-focus-within:text-amber-500 transition-colors" />
                                            <input 
                                                type="text" 
                                                placeholder="Search Coin" 
                                                value={search}
                                                onChange={e => setSearch(e.target.value)}
                                                className="w-full bg-white border border-slate-200 rounded-xl py-3.5 pl-12 text-slate-700 font-medium focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 outline-none transition-all placeholder-slate-400 shadow-sm"
                                            />
                                        </div>

                                        <div className="space-y-3">
                                            {uniqueTokens
                                                .filter(t => t.token_name.toLowerCase().includes(search.toLowerCase()) || t.token_symbol.toLowerCase().includes(search.toLowerCase()))
                                                .map(token => (
                                                <button 
                                                    key={token.id}
                                                    onClick={() => handleTokenSelect(token.token_symbol)}
                                                    className="w-full flex items-center justify-between p-4 bg-white border border-slate-100 hover:border-amber-300 hover:shadow-md rounded-2xl transition-all group shadow-sm"
                                                >
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center font-black text-slate-500 border border-slate-100 group-hover:bg-amber-50 group-hover:text-amber-600 transition-colors">
                                                            {token.token_symbol[0]}
                                                        </div>
                                                        <div className="text-left">
                                                            <p className="font-bold text-slate-800 text-lg group-hover:text-amber-600 transition-colors">{token.token_symbol}</p>
                                                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">{token.token_name}</p>
                                                        </div>
                                                    </div>
                                                    <div className="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-amber-50 group-hover:text-amber-500 transition-colors">
                                                        <ChevronRight className="w-5 h-5" />
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* STEP 2: NETWORK SELECTION */}
                                {step === 2 && (
                                    <div className="slide-up space-y-4">
                                        <div className="p-4 bg-amber-50 border border-amber-100 rounded-2xl flex items-start gap-3 mb-2 shadow-sm">
                                            <div className="p-1.5 bg-amber-100 rounded-full text-amber-600 mt-0.5">
                                                <AlertCircle className="w-4 h-4" />
                                            </div>
                                            <p className="text-xs text-amber-800 font-medium leading-relaxed">
                                                Ensure the receiving platform supports the selected network. Sending to a wrong network may result in loss of funds.
                                            </p>
                                        </div>

                                        {availableNetworks.map(net => (
                                            <button 
                                                key={net.id}
                                                onClick={() => handleNetworkSelect(net)}
                                                className="w-full text-left p-5 bg-white border border-slate-100 hover:border-amber-300 hover:shadow-lg rounded-3xl transition-all duration-300 group shadow-sm hover:-translate-y-1"
                                            >
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="font-black text-lg text-slate-800 group-hover:text-amber-600 transition-colors">{net.network}</span>
                                                    <span className="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded-lg text-slate-500 uppercase tracking-wider group-hover:bg-amber-50 group-hover:text-amber-600 transition-colors">Min: {net.min_withdraw}</span>
                                                </div>
                                                <div className="flex items-center justify-between text-xs text-slate-500 font-medium">
                                                    <span>Fee: <span className="text-amber-600 font-bold">{net.network_fee} {net.token_symbol}</span></span>
                                                    <span className="flex items-center gap-1 text-slate-400 group-hover:text-amber-500 font-bold">Select <ChevronRight className="w-3 h-3" /></span>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* STEP 3: WITHDRAWAL FORM */}
                                {step === 3 && selectedNetworkData && (
                                    <div className="slide-up space-y-6">
                                        
                                        {/* Available Balance Display */}
                                        <div className="bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-xl shadow-slate-200/50 relative overflow-hidden group">
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-amber-500 rounded-full -mr-10 -mt-10 blur-3xl opacity-20 group-hover:opacity-30 transition-opacity"></div>
                                            <div className="flex justify-between items-center relative z-10">
                                                <span className="text-xs text-slate-400 font-bold uppercase tracking-widest">Available Balance</span>
                                                <div className="flex items-center gap-2">
                                                    <Wallet className="w-4 h-4 text-amber-500" />
                                                    <span className="font-mono text-white font-bold text-lg">{userBalance.toFixed(8)} {selectedToken}</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Quantity Input */}
                                        <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1 mb-2 block">Withdrawal Amount</label>
                                            <div className="relative">
                                                <input 
                                                    type="number"
                                                    value={amount}
                                                    onChange={e => setAmount(e.target.value)}
                                                    placeholder={`Min ${selectedNetworkData.min_withdraw}`}
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-4 pr-20 text-slate-800 font-mono text-lg font-bold focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 outline-none transition-all placeholder-slate-400"
                                                />
                                                <button 
                                                    onClick={() => setAmount(userBalance)}
                                                    className="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] font-bold text-white bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm"
                                                >
                                                    MAX
                                                </button>
                                            </div>
                                            <div className="flex justify-between mt-3 px-1">
                                                <span className="text-[10px] font-bold text-slate-400">Fee: {selectedNetworkData.network_fee}</span>
                                                <span className="text-xs font-bold text-amber-600">Receive: {Math.max(0, (parseFloat(amount) || 0) - parseFloat(selectedNetworkData.network_fee)).toFixed(8)} {selectedToken}</span>
                                            </div>
                                        </div>

                                        {/* Address Input */}
                                        <div className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                            <label className="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1 mb-2 block">Wallet Address</label>
                                            <div className="relative">
                                                <input 
                                                    type="text"
                                                    value={address}
                                                    onChange={e => setAddress(e.target.value)}
                                                    placeholder="Long press to paste address"
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-4 pr-4 text-slate-800 font-mono text-sm font-medium focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 outline-none transition-all placeholder-slate-400"
                                                />
                                            </div>
                                        </div>

                                        {/* Memo Input (Conditional) */}
                                        {selectedNetworkData.enable_memo === 'yes' && (
                                            <div className="fade-in bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
                                                <label className="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1 mb-2 block">Memo / Tag (Required)</label>
                                                <input 
                                                    type="text"
                                                    value={memo}
                                                    onChange={e => setMemo(e.target.value)}
                                                    placeholder="Enter Memo"
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 px-4 text-slate-800 font-mono text-sm font-medium focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 outline-none transition-all placeholder-slate-400"
                                                />
                                            </div>
                                        )}

                                        {/* Confirm Checkbox */}
                                        <div 
                                            onClick={() => setIsConfirmed(!isConfirmed)}
                                            className="flex items-start gap-3 p-4 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:bg-slate-50 transition-colors shadow-sm"
                                        >
                                            <div className={`mt-0.5 w-5 h-5 rounded-lg border-2 flex items-center justify-center transition-all ${isConfirmed ? 'bg-amber-500 border-amber-500' : 'border-slate-300'}`}>
                                                {isConfirmed && <CheckSquare className="w-3.5 h-3.5 text-white" />}
                                            </div>
                                            <p className="text-xs text-slate-500 font-medium leading-relaxed">
                                                I confirm that the address and network are correct. Sending to the wrong network may result in permanent loss of funds.
                                            </p>
                                        </div>

                                        {/* Submit Button */}
                                        <button 
                                            onClick={handleSubmit}
                                            disabled={!isConfirmed || submitting}
                                            className="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 text-white font-bold rounded-xl shadow-lg shadow-amber-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98] flex justify-center items-center gap-2"
                                        >
                                            {submitting ? (
                                                <>
                                                    <Loader2 className="animate-spin w-5 h-5" />
                                                    Processing...
                                                </>
                                            ) : (
                                                "Confirm Withdrawal"
                                            )}
                                        </button>
                                    </div>
                                )}
                            </>
                        )}

                        {/* Success Screen */}
                        {successMsg && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md fade-in">
                                <div className="text-center p-8 bg-white border border-slate-100 rounded-3xl shadow-2xl scale-100 zoom-in mx-4 w-full max-w-sm">
                                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-green-500/20">
                                        <CheckCircle2 className="w-10 h-10 text-green-600" />
                                    </div>
                                    <h2 className="text-2xl font-black text-slate-800 mb-2">Submitted!</h2>
                                    <p className="text-slate-500 text-sm font-medium mb-4">{successMsg}</p>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-wider animate-pulse">Redirecting...</p>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<WithdrawalCrypto />);
    </script>
</body>
</html>
