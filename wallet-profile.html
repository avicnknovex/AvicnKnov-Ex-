<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --sub: #64748b;
            --acc: #4f46e5;
            --acc-dark: #3730a3;
            --border: 1px solid #e2e8f0;
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.08);
            --input-bg: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; position: relative; }

        /* HEADER */
        .header { 
            position: sticky; top: 0; z-index: 50; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); 
            border-bottom: var(--border); 
        }
        .page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
        
        .bank-home-btn { 
            width: 44px; height: 44px; border-radius: 14px; background: #f8fafc; 
            border: var(--border); display: flex; align-items: center; justify-content: center; 
            color: var(--acc); cursor: pointer; transition: 0.2s;
        }
        .bank-home-btn:active { transform: scale(0.95); background: #e0e7ff; }
        .bank-home-btn svg { width: 22px; height: 22px; }

        /* PROFILE SECTION */
        .profile-container {
            padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }

        .avatar-wrapper {
            position: relative; width: 120px; height: 120px; margin-bottom: 20px;
        }
        .avatar-img { 
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; 
            border: 4px solid #fff; box-shadow: 0 8px 25px rgba(79, 70, 229, 0.15); 
            background: #f1f5f9;
        }
        .camera-btn {
            position: absolute; bottom: 5px; right: 5px; 
            background: var(--acc); color: #fff; width: 36px; height: 36px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 3px solid #fff; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .camera-btn:active { transform: scale(0.9); }

        .user-fullname { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
        .user-username { font-size: 15px; color: var(--sub); font-weight: 500; margin-bottom: 25px; }

        /* WALLET CARD */
        .wallet-card {
            width: 100%; background: #f8fafc; border-radius: 24px; padding: 25px;
            border: var(--border); position: relative; overflow: hidden; margin-bottom: 20px;
        }
        .wc-label { font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
        .wc-value { font-size: 18px; font-weight: 700; color: var(--acc); margin-bottom: 15px; }
        .wc-id-box { 
            background: #fff; padding: 12px; border-radius: 12px; border: var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .wc-id-txt { font-family: monospace; font-size: 14px; color: var(--text); letter-spacing: 1px; }
        .copy-btn { color: var(--sub); cursor: pointer; padding: 5px; }

        /* ACTIONS */
        .action-btn {
            width: 100%; padding: 16px; border-radius: 18px; border: none;
            font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-edit { background: var(--text); color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .btn-edit:active { transform: scale(0.98); }

        /* BOTTOM SECTION */
        .bottom-section { margin-top: auto; padding: 20px; text-align: center; }
        .help-btn {
            background: #fff; border: var(--border); color: var(--sub); 
            padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
        }
        .help-btn:hover { color: var(--acc); border-color: var(--acc); }

        /* EDIT MODAL */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
            display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content {
            background: #fff; width: 100%; max-width: 500px; border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .m-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .m-title { font-size: 20px; font-weight: 800; }
        .m-close { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 20px; color: var(--sub); cursor: pointer; }

        .input-group { margin-bottom: 15px; }
        .input-label { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 8px; display: block; text-transform: uppercase; }
        .input-field { 
            width: 100%; padding: 16px; background: var(--input-bg); border: var(--border); 
            border-radius: 16px; font-size: 16px; color: var(--text); font-weight: 600; outline: none;
        }
        .input-field:focus { border-color: var(--acc); background: #fff; }

        .save-btn {
            width: 100%; padding: 18px; background: var(--acc); color: #fff; border: none;
            border-radius: 18px; font-size: 16px; font-weight: 700; margin-top: 10px; cursor: pointer;
        }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: #fff; z-index: 200; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e0e7ff; border-top-color: var(--acc); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="header">
        <div class="page-title">Profile</div>
        <div class="bank-home-btn" onclick="window.location.href='wallet.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21v-7M19 21v-7M4 10l8-7 8 7M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6"/></svg>
        </div>
    </div>

    <div class="profile-container">
        
        <div class="avatar-wrapper">
            <img id="p-img" src="" class="avatar-img" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iI2YxZjVmOSI+PGNpcmNsZSBjeD0iMTIiIGN5PSIxMiIgcj0iMTIiIGZpbGw9IiNlMmU4ZjAiLz48cGF0aCBkPSJNMTIgMTJhNCA0IDAgMSAwIDAtOCA0IDQgMCAwIDAgMCA4em0wIDJjLTIuNjcgMC04IDEuMzQtOCA0djJoMTZ2LTJjMC0yLjY2LTUuMzMtNC04LTR6IiBmaWxsPSIjOTRhM2I4Ii8+PC9zdmc+'">
            <div class="camera-btn" onclick="document.getElementById('file-input').click()">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
        </div>
        <input type="file" id="file-input" hidden accept="image/*" onchange="app.handleImageUpload(this)">

        <div id="p-fullname" class="user-fullname">Loading...</div>
        <div id="p-username" class="user-username">@loading</div>

        <div class="wallet-card">
            <div class="wc-label">Wallet Name</div>
            <div id="w-name" class="wc-value">Loading...</div>
            
            <div class="wc-label">Wallet ID</div>
            <div class="wc-id-box">
                <span id="w-id" class="wc-id-txt">...</span>
                <div class="copy-btn" onclick="app.copyID()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </div>
            </div>
        </div>

        <button class="action-btn btn-edit" onclick="app.openEditModal()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Edit Profile
        </button>

    </div>

    <div class="bottom-section">
        <div class="help-btn" onclick="window.location.href='help.html'">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            Help & Support
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="m-header">
                <span class="m-title">Edit Details</span>
                <button class="m-close" onclick="app.closeModal()">×</button>
            </div>
            
            <div class="input-group">
                <label class="input-label">Full Name</label>
                <input type="text" id="inp-fullname" class="input-field">
            </div>
            
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" id="inp-username" class="input-field">
            </div>
            
            <div class="input-group">
                <label class="input-label">Wallet Name</label>
                <input type="text" id="inp-wname" class="input-field">
            </div>

            <button class="save-btn" onclick="app.saveProfile()">Update Now</button>
        </div>
    </div>

    <script>
        // CONFIG
        const CONFIG = {
            SUPA_URL: 'https://hwrvqyipozrsxyjdpqag.supabase.co',
            SUPA_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM',
            BUCKET: 'user-wallet-image',
            TABLE: 'wallet_user_profile'
        };

        const supa = supabase.createClient(CONFIG.SUPA_URL, CONFIG.SUPA_KEY);

        const app = {
            user: null,
            profileData: null,

            async init() {
                console.log("App Initializing...");
                const { data: { user } } = await supa.auth.getUser();
                if(!user) { 
                    console.log("No User Found, Redirecting...");
                    window.location.href = 'index.html'; 
                    return; 
                }
                this.user = user;
                console.log("Logged In User UID:", this.user.id);
                await this.fetchProfile();
                document.getElementById('loader').style.display = 'none';
            },

            async fetchProfile() {
                console.log("Fetching profile from table:", CONFIG.TABLE);
                const { data, error, status } = await supa
                    .from(CONFIG.TABLE)
                    .select('*')
                    .eq('uid', this.user.id)
                    .maybeSingle();

                if (error) {
                    console.error("Supabase Error:", error);
                    alert("Database Error: " + error.message + " (Status: " + status + ")");
                    return;
                }

                if(data) {
                    console.log("Profile Data Found:", data);
                    this.profileData = data;
                    this.render();
                } else {
                    console.warn("No data found for this UID. Check table content and RLS policy.");
                    alert("System Error: Wallet Profile Not Found for UID: " + this.user.id);
                }
            },

            render() {
                const p = this.profileData;
                document.getElementById('p-fullname').textContent = p.full_name || 'User';
                document.getElementById('p-username').textContent = '@' + (p.username || 'username');
                document.getElementById('w-name').textContent = p.wallet_name || 'My Wallet';
                document.getElementById('w-id').textContent = p.wallet_id || '---';

                if(p.profile_image_url) {
                    // Force refresh image using timestamp
                    document.getElementById('p-img').src = `${p.profile_image_url}?t=${new Date().getTime()}`;
                }
            },

            async handleImageUpload(input) {
                if(!input.files || !input.files[0]) return;
                const file = input.files[0];

                // 1. Strict 24-Hour Check via LocalStorage
                const lastUpdate = localStorage.getItem(`last_pfp_update_${this.user.id}`);
                const now = Date.now();
                if (lastUpdate && (now - parseInt(lastUpdate)) < 86400000) { // 24 hours in ms
                    const hoursLeft = Math.ceil((86400000 - (now - parseInt(lastUpdate))) / (1000 * 60 * 60));
                    alert(`Limit reached: You can change profile picture once every 24 hours. Try again in ${hoursLeft} hours.`);
                    return;
                }

                document.getElementById('loader').style.display = 'flex';

                try {
                    // 2. Delete OLD Image from Bucket (Cleanup)
                    if(this.profileData.profile_image_url) {
                        const url = this.profileData.profile_image_url;
                        const path = url.split(`${CONFIG.BUCKET}/`)[1]; // Extract path after bucket name
                        if(path) {
                            const cleanPath = path.split('?')[0]; // Remove query params
                            await supa.storage.from(CONFIG.BUCKET).remove([cleanPath]);
                        }
                    }

                    // 3. Upload NEW Image
                    // Naming: uid_timestamp.png to ensure uniqueness
                    const fileName = `${this.user.id}_${Date.now()}.png`;
                    const { error: upErr } = await supa.storage.from(CONFIG.BUCKET).upload(fileName, file);
                    if(upErr) throw upErr;

                    // 4. Get Public URL
                    const { data: pubData } = supa.storage.from(CONFIG.BUCKET).getPublicUrl(fileName);
                    const publicUrl = pubData.publicUrl;

                    // 5. Update Database
                    const { error: dbErr } = await supa.from(CONFIG.TABLE)
                        .update({ profile_image_url: publicUrl })
                        .eq('uid', this.user.id);
                    
                    if(dbErr) throw dbErr;

                    // 6. Set Cooldown & Refresh
                    localStorage.setItem(`last_pfp_update_${this.user.id}`, now.toString());
                    await this.fetchProfile();
                    alert("Profile picture updated successfully!");

                } catch(e) {
                    console.error(e);
                    alert("Upload Failed: " + e.message);
                } finally {
                    document.getElementById('loader').style.display = 'none';
                }
            },

            openEditModal() {
                const p = this.profileData;
                if(!p) return alert("Profile data not loaded yet.");
                document.getElementById('inp-fullname').value = p.full_name || '';
                document.getElementById('inp-username').value = p.username || '';
                document.getElementById('inp-wname').value = p.wallet_name || '';
                
                document.getElementById('edit-modal').classList.add('show');
            },

            async saveProfile() {
                const fullname = document.getElementById('inp-fullname').value;
                const username = document.getElementById('inp-username').value;
                const wname = document.getElementById('inp-wname').value;

                if(!fullname || !username || !wname) return alert("Fields cannot be empty");

                document.getElementById('loader').style.display = 'flex';

                // Update DB based on User ID
                const { error } = await supa.from(CONFIG.TABLE)
                    .update({
                        full_name: fullname,
                        username: username,
                        wallet_name: wname
                    })
                    .eq('uid', this.user.id);

                document.getElementById('loader').style.display = 'none';

                if(error) {
                    console.error("Save Error:", error);
                    alert("Update Failed: " + error.message);
                } else {
                    this.closeModal();
                    await this.fetchProfile(); // Refresh UI to show changes
                    alert("Profile Updated Successfully!");
                }
            },

            closeModal() {
                document.getElementById('edit-modal').classList.remove('show');
            },

            copyID() {
                if(!this.profileData || !this.profileData.wallet_id) return alert("No ID to copy");
                navigator.clipboard.writeText(this.profileData.wallet_id).then(() => {
                    alert("Wallet ID Copied!");
                });
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
