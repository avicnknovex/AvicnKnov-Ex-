<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deposit UPI - AvicnKnov Ex</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      
      /* Animation Utilities */
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .slide-up { animation: slideUp 0.4s ease-out forwards; }
      .zoom-in { animation: zoomIn 0.3s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>

    <!-- Import Map for React & Supabase -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-10">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, X, Copy, CheckCircle2, UploadCloud, 
            Clock, AlertCircle, Loader2, QrCode
        } from 'lucide-react';

        // --- Supabase Configuration ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const DepositUPI = () => {
            const [selectedMethod, setSelectedMethod] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [loadingDetails, setLoadingDetails] = useState(false);
            const [submitting, setSubmitting] = useState(false);
            const [adminDetails, setAdminDetails] = useState(null);
            
            // Form State
            const [amount, setAmount] = useState('');
            const [utr, setUtr] = useState('');
            const [screenshot, setScreenshot] = useState(null);
            const [successMsg, setSuccessMsg] = useState('');
            
            // Timer State (3600s = 1 Hour)
            const [timeLeft, setTimeLeft] = useState(3600);
            const timerRef = useRef(null);

            // --- Navigation ---
            const handleBack = () => {
                if (window.history.length > 1 && document.referrer !== "") {
                    window.history.back();
                } else {
                    window.location.href = 'dashboard.html';
                }
            };

            // --- Effects ---
            useEffect(() => {
                if (showModal && timeLeft > 0) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                handleCloseModal();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [showModal, timeLeft]);

            useEffect(() => {
                if (selectedMethod && showModal) {
                    fetchPaymentDetails(selectedMethod);
                }
            }, [selectedMethod, showModal]);

            // --- Logic ---
            const fetchPaymentDetails = async (methodName) => {
                setLoadingDetails(true);
                try {
                    const { data, error } = await supabase
                        .from('upi-payment-control')
                        .select('upi_id, qr_image')
                        .eq('change_box', methodName)
                        .single();

                    if (data) {
                        setAdminDetails(data);
                    } else {
                        setAdminDetails({
                            upi_id: 'admin@upi', 
                            qr_image: 'https://placehold.co/200x200/png?text=QR+Not+Found'
                        });
                    }
                } catch (err) {
                    console.error("Fetch error", err);
                } finally {
                    setLoadingDetails(false);
                }
            };

            const handleMethodClick = (method) => {
                setSelectedMethod(method);
                setShowModal(true);
                setTimeLeft(3600); 
                setSuccessMsg('');
                setAmount('');
                setUtr('');
                setScreenshot(null);
            };

            const handleCloseModal = () => {
                setShowModal(false);
                setSelectedMethod(null);
                if (timerRef.current) clearInterval(timerRef.current);
            };

            const formatTime = (s) => {
                const h = Math.floor(s / 3600);
                const m = Math.floor((s % 3600) / 60);
                const secs = s % 60;
                
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                return `${m.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleSubmit = async () => {
                if (!amount || !utr || !screenshot) {
                    alert("Please complete all fields and upload the payment screenshot.");
                    return;
                }

                const numAmount = parseFloat(amount);
                if (isNaN(numAmount) || numAmount < 100) {
                    alert("Minimum deposit amount is ₹100.");
                    return;
                }
                if (numAmount > 1000000) {
                    alert("Maximum deposit amount is ₹10,00,000.");
                    return;
                }

                if (utr.length < 12 || utr.length > 16) {
                    alert("UTR number must be between 12 and 16 digits.");
                    return;
                }

                setSubmitting(true);
                
                try {
                    const { data: { user }, error: authError } = await supabase.auth.getUser();
                    
                    if (authError || !user) {
                        alert("Authentication required. Please log in.");
                        setSubmitting(false);
                        return;
                    }

                    const userId = user.id; 
                    const timestamp = new Date().toISOString();

                    // Upload Image
                    const fileExt = screenshot.name.split('.').pop();
                    const fileName = `${userId}/${Date.now()}.${fileExt}`;
                    
                    const { error: uploadError } = await supabase.storage
                        .from('user-payments-image')
                        .upload(fileName, screenshot);
                    
                    if (uploadError) throw uploadError;

                    const { data: { publicUrl } } = supabase.storage
                        .from('user-payments-image')
                        .getPublicUrl(fileName);

                    // Insert into 'user-payments'
                    const { error: paymentError } = await supabase
                        .from('user-payments')
                        .insert([{
                            user_id: userId,
                            method: selectedMethod,
                            amount: numAmount,
                            utr: utr,
                            screenshot_url: publicUrl,
                            created_at: timestamp
                        }]);
                    
                    if (paymentError) throw paymentError;

                    // Insert into 'user-transactions'
                    const { error: txError } = await supabase
                        .from('user-transactions')
                        .insert([{
                            user_id: userId,
                            type: 'deposit',
                            method: selectedMethod,
                            amount: numAmount,
                            status: 'pending',
                            created_at: timestamp
                        }]);
                    
                    if (txError) throw txError;

                    setSuccessMsg('Payment details submitted successfully! Verification pending.');
                    setTimeout(handleCloseModal, 3000);

                } catch (err) {
                    console.error("Submission Error:", err);
                    alert("Error submitting payment: " + (err.message || "Unknown error"));
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen text-slate-800 relative overflow-hidden">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <button 
                                onClick={handleBack} 
                                className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100"
                            >
                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <h1 className="text-xl font-black text-slate-800 tracking-tight">
                                UPI Payment Methods
                            </h1>
                            <div className="w-10"></div>
                        </div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 sm:px-6 pt-6 pb-20">
                        
                        {/* Payment Options Grid */}
                        <div className="grid grid-cols-2 gap-4 slide-up">
                            <MethodButton 
                                name="UPI" 
                                icon={<QrCode className="w-6 h-6" />}
                                gradient="bg-gradient-to-br from-blue-500 to-blue-600"
                                shadow="shadow-blue-500/20"
                                onClick={() => handleMethodClick('UPI')}
                            />
                            <MethodButton 
                                name="PhonePe" 
                                icon={<span className="font-bold text-xl">Pe</span>}
                                gradient="bg-gradient-to-br from-purple-500 to-purple-600"
                                shadow="shadow-purple-500/20"
                                onClick={() => handleMethodClick('PhonePe')}
                            />
                            <MethodButton 
                                name="Google Pay" 
                                icon={<span className="font-bold text-xl">GPay</span>}
                                gradient="bg-gradient-to-br from-blue-600 to-indigo-600"
                                shadow="shadow-indigo-500/20"
                                onClick={() => handleMethodClick('Google Pay')}
                            />
                            <MethodButton 
                                name="Paytm" 
                                icon={<span className="font-bold text-xl">Paytm</span>}
                                gradient="bg-gradient-to-br from-cyan-400 to-cyan-600"
                                shadow="shadow-cyan-500/20"
                                onClick={() => handleMethodClick('Paytm')}
                            />
                        </div>

                        <div className="mt-8 p-6 rounded-3xl bg-white border border-slate-100 shadow-xl shadow-slate-200/50 text-center slide-up" style={{ animationDelay: '0.1s' }}>
                            <div className="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-3 text-blue-600">
                                <CheckCircle2 className="w-6 h-6" />
                            </div>
                            <p className="text-sm font-bold text-slate-700">Safe & Secure Payments</p>
                            <p className="text-xs text-slate-400 mt-1">Powered by <span className="text-blue-600 font-bold">AvicnKnov</span> Gateway</p>
                        </div>
                    </div>

                    {/* Modal */}
                    {showModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md fade-in">
                            <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl relative flex flex-col max-h-[90vh] slide-up overflow-hidden border border-slate-100">
                                
                                {/* Modal Header */}
                                <div className="flex items-center justify-between p-5 border-b border-slate-100 bg-white z-20 sticky top-0">
                                    <button onClick={handleCloseModal} className="p-2 hover:bg-slate-50 rounded-full text-slate-400 hover:text-slate-600 transition-colors">
                                        <X className="w-5 h-5" />
                                    </button>
                                    
                                    <div className="flex items-center gap-2 px-3 py-1 bg-amber-50 border border-amber-100 rounded-full">
                                        <Clock className="w-3.5 h-3.5 text-amber-500 animate-pulse" />
                                        <span className="text-amber-600 font-mono text-sm font-bold tracking-wide">{formatTime(timeLeft)}</span>
                                    </div>
                                </div>

                                {/* Modal Body */}
                                <div className="overflow-y-auto p-6 space-y-6 custom-scrollbar bg-[#f8f9fc]">
                                    {successMsg ? (
                                        <div className="flex flex-col items-center justify-center py-12 text-center space-y-4 zoom-in">
                                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-2 shadow-lg shadow-green-500/20">
                                                <CheckCircle2 className="w-10 h-10 text-green-600" />
                                            </div>
                                            <h3 className="text-xl font-black text-slate-800">Payment Submitted!</h3>
                                            <p className="text-slate-500 px-4 leading-relaxed font-medium">{successMsg}</p>
                                        </div>
                                    ) : (
                                        <>
                                            {/* QR & UPI ID Display */}
                                            <div className="flex flex-col items-center space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                <div className="relative group">
                                                    {loadingDetails ? (
                                                        <div className="w-48 h-48 flex items-center justify-center bg-slate-50 rounded-2xl">
                                                            <Loader2 className="w-8 h-8 text-slate-400 animate-spin" />
                                                        </div>
                                                    ) : (
                                                        <img 
                                                            src={adminDetails?.qr_image} 
                                                            alt="Payment QR" 
                                                            className="w-48 h-48 object-contain rounded-2xl border border-slate-100 shadow-inner"
                                                        />
                                                    )}
                                                </div>
                                                
                                                <div className="w-full">
                                                    <p className="text-[10px] text-slate-400 text-center mb-2 uppercase tracking-wider font-bold">UPI ID</p>
                                                    <div 
                                                        onClick={() => navigator.clipboard.writeText(adminDetails?.upi_id)}
                                                        className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-3 cursor-pointer hover:border-blue-300 hover:bg-blue-50 transition-all active:scale-[0.98] group"
                                                    >
                                                        <span className="font-mono text-sm text-slate-700 truncate max-w-[200px] select-all font-bold">
                                                            {loadingDetails ? 'Loading...' : (adminDetails?.upi_id || 'Unavailable')}
                                                        </span>
                                                        <Copy className="w-4 h-4 text-slate-400 group-hover:text-blue-500 transition-colors" />
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Input Fields */}
                                            <div className="space-y-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                                {/* Amount */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Deposit Amount (₹)</label>
                                                    <div className="relative">
                                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₹</span>
                                                        <input 
                                                            type="number" 
                                                            value={amount}
                                                            onChange={(e) => setAmount(e.target.value)}
                                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-8 pr-4 text-slate-800 font-bold placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all font-mono"
                                                            placeholder="100 - 10,00,000"
                                                        />
                                                    </div>
                                                </div>

                                                {/* UTR */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">UTR Number</label>
                                                    <input 
                                                        type="text" 
                                                        value={utr}
                                                        onChange={(e) => setUtr(e.target.value.replace(/\D/g, '').slice(0, 16))}
                                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 px-4 text-slate-800 font-bold placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-all font-mono"
                                                        placeholder="12-16 digit UTR"
                                                    />
                                                    <p className="text-[10px] text-slate-400 flex items-center gap-1 mt-1 ml-1 font-medium">
                                                        <AlertCircle className="w-3 h-3" /> Must be 12-16 digits
                                                    </p>
                                                </div>

                                                {/* Screenshot */}
                                                <div className="space-y-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Upload Screenshot</label>
                                                    <div className="relative">
                                                        <input 
                                                            type="file" 
                                                            id="file-upload" 
                                                            accept="image/*"
                                                            className="hidden"
                                                            onChange={(e) => setScreenshot(e.target.files[0])}
                                                        />
                                                        <label 
                                                            htmlFor="file-upload"
                                                            className={`flex items-center justify-center gap-2 w-full p-4 border-2 border-dashed rounded-xl cursor-pointer transition-all ${screenshot ? 'border-emerald-500/50 bg-emerald-50' : 'border-slate-300 hover:border-blue-400 hover:bg-blue-50'}`}
                                                        >
                                                            <UploadCloud className={`w-5 h-5 ${screenshot ? 'text-emerald-500' : 'text-slate-400'}`} />
                                                            <div className="flex flex-col items-center">
                                                                <span className={`text-sm font-bold ${screenshot ? 'text-emerald-600' : 'text-slate-500'}`}>
                                                                    {screenshot ? "Screenshot Selected" : "Tap to upload"}
                                                                </span>
                                                                {!screenshot && <span className="text-[10px] text-slate-400 mt-0.5 font-bold uppercase">JPG, PNG supported</span>}
                                                            </div>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Submit Button */}
                                            <button 
                                                onClick={handleSubmit}
                                                disabled={submitting || loadingDetails}
                                                className="w-full py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all active:scale-[0.98] flex items-center justify-center gap-2"
                                            >
                                                {submitting ? (
                                                    <>
                                                        <Loader2 className="w-5 h-5 animate-spin" />
                                                        Processing...
                                                    </>
                                                ) : (
                                                    "Submit Payment Details"
                                                )}
                                            </button>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MethodButton = ({ name, icon, gradient, shadow, onClick }) => (
            <button 
                onClick={onClick}
                className={`group relative overflow-hidden bg-white p-6 rounded-3xl border border-slate-100 shadow-xl shadow-slate-200/50 hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 flex flex-col items-center justify-center h-32 w-full`}
            >
                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center mb-3 shadow-lg transition-transform duration-300 group-hover:scale-110 text-white ${gradient} ${shadow}`}>
                    {icon}
                </div>
                <span className="font-bold text-slate-700 text-sm group-hover:text-blue-600 transition-colors">{name}</span>
            </button>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<DepositUPI />);
    </script>
</body>
</html>
