<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(76, 175, 80, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Premium Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 16px 28px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #4CAF50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .back-btn, .add-order-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .back-btn:hover, .add-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        /* Premium Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab {
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .tab:hover {
            background: rgba(76, 175, 80, 0.2);
            border-color: rgba(76, 175, 80, 0.5);
            color: white;
        }

        .tab.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }

        /* Premium Card */
        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Order Card Premium */
        .order-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #4CAF50, #81C784);
            border-radius: 20px 0 0 20px;
        }

        .order-card:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
            border-color: rgba(76, 175, 80, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .token-icon {
            width: 40px;
            height: 40px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .token-symbol {
            font-size: 20px;
            font-weight: 800;
            color: #4CAF50;
        }

        .token-name {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .order-type {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
        }

        .buy-type {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .sell-type {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }

        .detail-item {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 14px;
        }

        .detail-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        .price-display {
            color: #4CAF50;
            font-size: 20px;
            font-weight: 800;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .payment-method {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 100px;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .buy-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .sell-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.3);
        }

        .cancel-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }

        .report-btn {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #1a1a2e;
        }

        .chat-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }

        .release-btn {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
        }

        .reject-btn {
            background: linear-gradient(135deg, #795548, #5d4037);
            color: white;
        }

        .pnp-btn {
            background: linear-gradient(135deg, #673AB7, #512DA8);
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        /* Premium Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 28px;
            padding: 32px;
            width: 90%;
            max-width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #4CAF50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 15px;
            color: white;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-option:hover {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .payment-option.selected {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        .payment-option input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #4CAF50;
        }

        .payment-option label {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }

        /* Chat Styles */
        .chat-container {
            height: 420px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 10px;
        }

        .chat-message {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: rgba(255, 255, 255, 0.6);
        }

        .ai-sender {
            color: #4CAF50;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 18px;
            border-radius: 18px;
            border-left: 3px solid #4CAF50;
            max-width: 85%;
            word-wrap: break-word;
        }

        .ai-message .message-content {
            border-left-color: #2196F3;
            background: rgba(33, 150, 243, 0.1);
        }

        .chat-image {
            max-width: 200px;
            border-radius: 12px;
            cursor: pointer;
        }

        .chat-input-container {
            display: flex;
            gap: 12px;
            padding: 18px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            color: white;
            outline: none;
        }

        .chat-input:focus {
            border-color: #4CAF50;
        }

        .send-btn, .image-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .send-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }

        .image-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }

        /* P&P Styles */
        .pnp-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        .uid-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            font-family: monospace;
            letter-spacing: 2px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-top: 24px;
        }

        .stat-box {
            padding: 32px;
            border-radius: 24px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box h4 {
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .stat-box p {
            font-size: 48px;
            font-weight: 800;
        }

        .green-box {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2), rgba(76, 175, 80, 0.05));
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .red-box {
            background: linear-gradient(135deg, rgba(244, 67, 54, 0.2), rgba(244, 67, 54, 0.05));
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        /* Timer & Toast */
        .timer-display {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            z-index: 1001;
            box-shadow: 0 4px 20px rgba(255, 152, 0, 0.4);
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 28px;
            border-radius: 16px;
            color: white;
            font-weight: 600;
            z-index: 1002;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .toast.error {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        .live-price {
            background: rgba(76, 175, 80, 0.15);
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: #4CAF50;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Token selector in create order */
        .token-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        .token-option-icon {
            font-size: 24px;
        }

        /* Role selector */
        .role-selector select {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .tabs {
                gap: 8px;
            }
            .tab {
                padding: 10px 18px;
                font-size: 12px;
            }
            .order-details {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .payment-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back to Trade</button>
            <h1>P2P Trading Platform</h1>
            <button class="add-order-btn" onclick="openCreateOrderModal()">+ Create Order</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('buy')">Buy Orders</button>
            <button class="tab" onclick="switchTab('sell')">Sell Orders</button>
            <button class="tab" onclick="switchTab('orderbox')">Order Box</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('pnp')">P&P</button>
        </div>

        <div id="buy-tab" class="tab-content active">
            <div id="buy-orders">
                <div class="loading">Loading buy orders...</div>
            </div>
        </div>

        <div id="sell-tab" class="tab-content">
            <div id="sell-orders">
                <div class="loading">Loading sell orders...</div>
            </div>
        </div>

        <div id="orderbox-tab" class="tab-content">
            <div id="order-box">
                <div class="loading">Loading your active orders...</div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div id="history-orders">
                <div class="loading">Loading history...</div>
            </div>
        </div>

        <div id="pnp-tab" class="tab-content">
            <div class="pnp-container">
                <div class="form-group">
                    <label class="form-label">Your Unique ID (UID)</label>
                    <div id="pnp-uid" class="uid-display">Loading...</div>
                </div>
                <div class="form-group role-selector">
                    <label class="form-label">Select Your Role</label>
                    <select id="userRole" class="form-select" onchange="updateUserRole()">
                        <option value="both">Both (Buyer & Seller)</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p id="pnp-completed-orders">-</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p id="pnp-uncompleted-orders">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Order Modal -->
    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create New Order</h2>
                <button class="close-btn" onclick="closeCreateOrderModal()">&times;</button>
            </div>
            
            <form id="createOrderForm">
                <div class="form-group">
                    <label class="form-label">Order Type</label>
                    <select id="orderType" class="form-select" onchange="updateOrderType()">
                        <option value="buy">Buy Order</option>
                        <option value="sell">Sell Order</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Select Token</label>
                    <select id="tokenSelect" class="form-select" onchange="updateTokenPrice()">
                        <!-- Tokens will be loaded dynamically from crypto_token_control -->
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Token Icon</label>
                    <div id="tokenIconDisplay" style="font-size: 32px; text-align: center; padding: 10px;">💰</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Live Price</label>
                    <div id="livePrice" class="live-price">Loading...</div>
                </div>

                <div id="availableQuantity" class="form-group" style="display: none;">
                    <label class="form-label">Available Quantity</label>
                    <div id="availableQty">0</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="quantity" class="form-input" step="0.00000001" min="0" oninput="calculateAmount()">
                </div>

                <div class="form-group">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" id="amount" class="form-input" min="100" max="10000" oninput="calculateQuantity()">
                </div>

        // ==================== TOKEN CONFIGURATION FROM crypto_token_control ====================
        async function loadTokensFromControl() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*')
                    .eq('status', 'active');
                
                if (error) throw error;
                
                tokenList = data || [];
                
                // Filter tokens that don't have "p2p.html" in nosupported_j
                const supportedTokens = tokenList.filter(token => {
                    if (!token.nosupported_j) return true;
                    return !token.nosupported_j.includes('p2p.html');
                });
                
                return supportedTokens;
            } catch (error) {
                console.error('Error loading tokens from control:', error);
                return [];
            }
        }

        async function loadTokenPrices() {
            const tokens = await loadTokensFromControl();
            
            for (const token of tokens) {
                let price = token.manual_price || 0;
                
                // If API is enabled and API URL exists
                if (token.is_live_api && token.api_url) {
                    try {
                        const response = await fetch(token.api_url);
                        const data = await response.json();
                        // Try to extract price from API response
                        if (data.price) price = data.price;
                        else if (data[token.symbol]) price = data[token.symbol];
                        else if (data[token.symbol.toLowerCase()]) price = data[token.symbol.toLowerCase()];
                    } catch (apiError) {
                        console.error(`API error for ${token.symbol}:`, apiError);
                        price = token.manual_price || 0;
                    }
                }
                
                livePrices[token.symbol] = price;
            }
            
            updatePriceDisplays();
        }

        function updatePriceDisplays() {
            const priceDisplay = document.getElementById('livePrice');
            const tokenSelect = document.getElementById('tokenSelect');
            if (priceDisplay && tokenSelect && tokenSelect.value) {

                if (livePrices[selectedToken]) {
                    priceDisplay.textContent = `₹${livePrices[selectedToken].toLocaleString('en-IN')}`;
                } else {
                    priceDisplay.textContent = 'Price unavailable';
                }
            }
            
            // Update all order cards
            document.querySelectorAll('.order-card').forEach(card => {
                const symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol]) {
                    const priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = `₹${livePrices[symbol].toLocaleString('en-IN')}`;
                    }
                }
            });
        }

            const tokenSelect = document.getElementById('tokenSelect');
            if (!tokenSelect || !tokenSelect.value) return;

                    try {

                        const data = await response.json();
                        if (data.price) price = data.price;
                        else if (data[token.symbol]) price = data[token.symbol];
                        else if (data[token.symbol.toLowerCase()]) price = data[token.symbol.toLowerCase()];
                        livePrices[selectedToken] = price;
                    } catch (e) {
                        price = token.manual_price || 0;

                    }
                } else {
                    livePrices[selectedToken] = price;

                const priceDisplay = document.getElementById('livePrice');

        // ==================== CRYPTO TOKEN HISTORY FUNCTIONS ====================
        async function checkTokenHolding(userId, symbol, requiredQty) {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_history')
                    .select('qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active')
                    .single();
                
                if (error && error.code !== 'PGRST116') throw error;
                
                const currentQty = data ? parseFloat(data.qty) : 0;
                return currentQty >= requiredQty;
            } catch (error) {
                console.error('Check token holding error:', error);
                return false;
            }
        }

        async function getTokenHolding(userId, symbol) {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_history')
                    .select('qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active')
                    .single();
                
                if (error && error.code !== 'PGRST116') throw error;
                return data ? parseFloat(data.qty) : 0;
            } catch (error) {
                console.error('Get token holding error:', error);
                return 0;
            }
        }

        async function addTokenHolding(userId, symbol, qty, priceAtTransaction, totalAmount, blockchainUsed = 'P2P') {
            try {
                // Check if record exists
                const { data: existing, error: checkError } = await supabase
                    .from('crypto_token_history')
                    .select('id, qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active')
                    .single();
                
                if (existing) {
                    const newQty = parseFloat(existing.qty) + qty;
                    const { error: updateError } = await supabase
                        .from('crypto_token_history')
                        .update({ 
                            qty: newQty,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', existing.id);
                    
                    if (updateError) throw updateError;
                } else {
                    const { error: insertError } = await supabase
                        .from('crypto_token_history')
                        .insert([{
                            user_id: userId,
                            symbol: symbol,
                            action: 'buy',
                            qty: qty,
                            price_at_transaction: priceAtTransaction,
                            total_amount: totalAmount,
                            blockchain_used: blockchainUsed,
                            status: 'active',
                            created_at: new Date().toISOString()
                        }]);
                    
                    if (insertError) throw insertError;
                }
                
                return true;
            } catch (error) {
                console.error('Add token holding error:', error);
                return false;
            }
        }

        async function subtractTokenHolding(userId, symbol, qty, priceAtTransaction, totalAmount, blockchainUsed = 'P2P') {
            try {
                const { data: existing, error: checkError } = await supabase
                    .from('crypto_token_history')
                    .select('id, qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active')
                    .single();
                
                if (!existing) {
                    return false;
                }
                
                const currentQty = parseFloat(existing.qty);
                const newQty = currentQty - qty;
                
                if (newQty < 0) {
                    return false;
                }
                
                if (newQty === 0) {
                    const { error: updateError } = await supabase
                        .from('crypto_token_history')
                        .update({ 
                            status: 'inactive',
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', existing.id);
                    
                    if (updateError) throw updateError;
                } else {
                    const { error: updateError } = await supabase
                        .from('crypto_token_history')
                        .update({ 
                            qty: newQty,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', existing.id);
                    
                    if (updateError) throw updateError;
                }
                
                // Add to history
                await supabase.from('crypto_token_history').insert([{
                    user_id: userId,
                    symbol: symbol,
                    action: 'sell',
                    qty: qty,
                    price_at_transaction: priceAtTransaction,
                    total_amount: totalAmount,
                    blockchain_used: blockchainUsed,
                    status: 'completed',
                    created_at: new Date().toISOString()
                }]);
                
                return true;
            } catch (error) {
                console.error('Subtract token holding error:', error);
                return false;
            }
        }

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            
            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();
            
            if (data) {
                return generateOrderId();
            }
            
            return result;
        }

        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }
            
            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between ₹100 and ₹10,000', 'error');
                return;
            }
            
            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked'))
                .map(input => input.value);
            
            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }
            
            if (orderType === 'sell') {
                const availableQty = await getTokenHolding(currentUser.id, tokenSymbol);
                
                if (quantity > availableQty) {
                    showToast(`Insufficient ${tokenSymbol} balance. You have ${availableQty.toFixed(8)}`, 'error');
                    return;
                }
                
                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;
                
                const needsPhone = selectedPaymentMethods.some(method => 
                    ['phonepe', 'googlepay', 'paytm'].includes(method)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');
                
                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }
                
                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }
            
            try {
                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);
                
                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully!', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            }
        });

        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;
                
                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                         await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'accepted' })
                            .eq('id', tradeId);
                        
                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);
                        
                        if(trade.order.order_type === 'sell') {
                           await sendAIMessage(tradeId, 
                               `Trade accepted! Buyer, please make the payment of ₹${trade.order.amount.toLocaleString('en-IN')} using one of the available methods. After paying, please share the screenshot with transaction ID and UTR number.`, 'buyer'
                            );
                        } else {
                            const paymentMethods = trade.order.payment_methods.split(',');
                            let promptMessage = 'Trade accepted! Please send your payment details (e.g., PhonePe, Google Pay, Paytm, UPI) and a screenshot of the account where you want to receive payment.';
                            
                            if (paymentMethods.length > 0) {
                                promptMessage = `Trade accepted! Please share your payment details for these methods: ${paymentMethods.join(', ')} and a screenshot of the account where you want to receive payment.`;
                            }
                            await sendAIMessage(tradeId, promptMessage, 'seller');
                        }
                        
                    } else if (message.includes('reject')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'rejected' })
                            .eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);

                        await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                    }
                }
                
                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId, 
                        'Payment details received! Buyer, please make the payment of ₹' + trade.order.amount.toLocaleString('en-IN') + ' to the seller. Be sure to share a screenshot, transaction ID, and UTR number after you\'ve paid.', 'buyer'
                    );
                }

                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase
                        .from('user_p2p_order_box')
                        .update({ status: 'payment_done' })
                        .eq('id', tradeId);

                    await sendAIMessage(tradeId, 
                        'Payment proof received! Seller, please check your bank/wallet for the payment and click "Release Tokens" once confirmed.', 'seller'
                    );
                }

            } catch (error) {
                console.error('Process user message error:', error);
            }
        }

        // ==================== TRADE ACTIONS ====================
        async function releaseTokens(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;
                
                console.log(`Transferring ${trade.order.quantity} ${trade.order.token_symbol} from ${trade.seller_id} to ${trade.buyer_id}`);
                
                // Subtract tokens from seller
                const sellerSuccess = await subtractTokenHolding(
                    trade.seller_id,
                    trade.order.token_symbol,
                    parseFloat(trade.order.quantity),
                    livePrices[trade.order.token_symbol] || 0,
                    trade.order.amount,
                    'P2P'
                );
                
                if (!sellerSuccess) {
                    showToast('Failed to deduct tokens from seller', 'error');
                    return;
                }
                
                // Add tokens to buyer
                const buyerSuccess = await addTokenHolding(
                    trade.buyer_id,
                    trade.order.token_symbol,
                    parseFloat(trade.order.quantity),
                    livePrices[trade.order.token_symbol] || 0,
                    trade.order.amount,
                    'P2P'
                );
                
                if (!buyerSuccess) {
                    showToast('Failed to add tokens to buyer', 'error');
                    return;
                }
                
                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'completed' })
                    .eq('id', tradeId);
                
                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.id);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.order_id_unique);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'completed'),
                    updatePnPStats(trade.seller_id, 'completed')
                ]);

                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id,
                        action: 'buy',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.seller_id,
                        created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id,
                        action: 'sell',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.buyer_id,
                        created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Tokens released successfully! Trade completed.', 'both');
                
                showToast('Tokens released successfully!', 'success');
                loadAllData();
                closeChatModal();

            } catch (error) {
                console.error('Release tokens error:', error);
                showToast('Failed to release tokens', 'error');
            }
        }
        
        async function cancelTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'cancelled' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'uncompleted'),
                    updatePnPStats(trade.seller_id, 'uncompleted')
                ]);

                await Promise.all([
                     supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id, action: 'buy', token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity, amount: trade.order.amount, status: 'cancelled', other_user_id: trade.seller_id, created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id, action: 'sell', token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity, amount: trade.order.amount, status: 'cancelled', other_user_id: trade.buyer_id, created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Trade has been cancelled.', 'both');
                showToast('Trade cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel trade error:', error);
                showToast('Failed to cancel trade', 'error');
            }
        }

        async function cancelOrder(orderId) {
            try {
                const { data: order, error } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('id', orderId)
                    .single();
                
                if (error || !order) throw error || new Error('Order not found');

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'cancelled' })
                    .eq('id', orderId);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'cancelled' })
                    .eq('id', order.order_id_unique);
                    
                await updatePnPStats(currentUser.id, 'uncompleted');

                await supabase.from('user_p2p_history').insert([{
                    user_id: currentUser.id,
                    action: order.order_type,
                    token_symbol: order.token_symbol,
                    quantity: order.quantity,
                    amount: order.amount,
                    status: 'cancelled',
                    other_user_id: null,
                    created_at: new Date().toISOString()
                }]);

                showToast('Order cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel order error:', error);
                showToast('Failed to cancel order', 'error');
            }
        }

        // ==================== REAL-TIME & REFRESH ====================
        function setupRealtimeSubscriptions() {
            supabase
                .channel('p2p_public_changes')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'user_p2p_order' }, 
                    () => { loadAllData(); }
                )
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'user_p2p_order_box' }, 
                    () => { loadAllData(); }
                )
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'user_p2p_history' }, 
                    () => { if(document.getElementById('history-tab').classList.contains('active')) loadHistory(); }
                )
                .on('postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}`},
                    (payload) => {
                        if(document.getElementById('pnp-tab').classList.contains('active')) {
                           loadPnPData();
                        }
                    }
                )
                .subscribe();
        }

        function setupChatRealtimeSubscription(tradeId) {
            if (activeChats[tradeId]) {
                supabase.removeChannel(activeChats[tradeId]);
            }
            const chatChannel = supabase
                .channel(`trade_chat_${tradeId}`)
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'trade_chat', filter: `trade_id=eq.${tradeId}` }, 
                    (payload) => {
                        loadChatMessages(tradeId);
                    }
                )
                .subscribe();
            activeChats[tradeId] = chatChannel;
        }

        // Silent background refresh every 3 seconds
        function startSilentRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(async () => {
                await loadTokenPrices();
                const activeTab = document.querySelector('.tab-content.active')?.id;
                if (activeTab === 'buy-tab') await loadBuyOrders();
                else if (activeTab === 'sell-tab') await loadSellOrders();
                else if (activeTab === 'orderbox-tab') await loadOrderBox();
                else if (activeTab === 'history-tab') await loadHistory();
                else if (activeTab === 'pnp-tab') await loadPnPData();
            }, 3000);
        }

        async function loadAllData() {
            await Promise.all([
                loadBuyOrders(),
                loadSellOrders(),
                loadOrderBox(),
                loadHistory()
            ]);
        }

        // ==================== P&P FUNCTIONS ====================
        async function getUID(userId) {
            try {
                const { data, error } = await supabase
                    .from('uid')
                    .select('uid')
                    .eq('user_id', userId)
                    .single();
                if (error || !data) return "Unavailable";
                return data.uid;
            } catch (e) {
                return "Unavailable";
            }
        }
        
        async function initializePnPProfile() {
            const { data, error } = await supabase
                .from('user-p&p')
                .select('user_id')
                .eq('user_id', currentUser.id)
                .single();

            if (!data) {
                await supabase.from('user-p&p').insert([{ user_id: currentUser.id }]);
            }
        }
        
        async function loadPnPData() {
            const uid = await getUID(currentUser.id);
            document.getElementById('pnp-uid').textContent = uid;
            
            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();
            
            if (data) {
                document.getElementById('userRole').value = data.role;
                document.getElementById('pnp-completed-orders').textContent = data.completed_orders || 0;
                document.getElementById('pnp-uncompleted-orders').textContent = data.uncompleted_orders || 0;
            }
        }

        async function updateUserRole() {
            const newRole = document.getElementById('userRole').value;
            const { data, error } = await supabase
                .from('user-p&p')
                .select('role_last_updated')
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.role_last_updated) {
                const lastUpdated = new Date(data.role_last_updated);
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastUpdated > twentyFourHoursAgo) {
                    showToast('You can only change your role once every 24 hours.', 'error');
                    loadPnPData();
                    return;
                }
            }

            const { error: updateError } = await supabase
                .from('user-p&p')
                .update({ role: newRole, role_last_updated: new Date().toISOString() })
                .eq('user_id', currentUser.id);

            if (updateError) {
                showToast('Failed to update role.', 'error');
            } else {
                showToast('Role updated successfully.', 'success');
            }
        }
        
        async function openPnPModal(userId, uidOnly = false) {
            const modal = document.getElementById('pnpModal');
            const modalBody = document.getElementById('pnpModalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = `<div class="loading">Loading user profile...</div>`;

            const uid = await getUID(userId);

            if (uidOnly) {
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">User's UID</label>
                        <div class="uid-display">${uid}</div>
                    </div>
                `;
                return;
            }

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                modalBody.innerHTML = `<div class="empty-state"><h3>Profile not found</h3></div>`;
                return;
            }

            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">User's UID</label>
                    <div class="uid-display">${uid}</div>
                </div>
                 <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="uid-display" style="text-transform: capitalize;">${data.role}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p>${data.completed_orders || 0}</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p>${data.uncompleted_orders || 0}</p>
                    </div>
                </div>
            `;
        }

        function closePnPModal() {
            document.getElementById('pnpModal').style.display = 'none';
        }
        
        async function updatePnPStats(userId, type) {
            try {
                const { data, error } = await supabase.rpc('update_pnp_stats', {
                    p_user_id: userId,
                    p_type: type
                });
                if(error) console.error('Error updating PnP stats:', error);
            } catch(e) {
                console.error('RPC error:', e);
            }
        }

        // ==================== UTILITY FUNCTIONS ====================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            await loadAllData();
            startSilentRefresh();
            setupRealtimeSubscriptions();
        });

        document.getElementById('chatInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (refreshInterval) clearInterval(refreshInterval);
            Object.values(timers).forEach(timer => clearInterval(timer));
            supabase.removeAllChannels();
        });
    </script>
</body>
</html>
