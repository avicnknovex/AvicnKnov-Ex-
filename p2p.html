<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #08080e;
            --bg-card: #111119;
            --bg-elevated: #1a1a26;
            --bg-input: #0d0d15;
            --border-color: rgba(255,255,255,0.06);
            --border-focus: #9b7dff;
            --text-primary: #eeeef2;
            --text-secondary: #6e6e82;
            --text-muted: #44445a;
            --accent: #9b7dff;
            --accent-hover: #b49aff;
            --buy-color: #00dc82;
            --buy-bg: rgba(0,220,130,0.08);
            --buy-border: rgba(0,220,130,0.2);
            --sell-color: #ff4757;
            --sell-bg: rgba(255,71,87,0.08);
            --sell-border: rgba(255,71,87,0.2);
            --chat-color: #4fa3ff;
            --warning-color: #ffb800;
            --release-color: #b57dff;
            --reject-color: #8b6555;
            --report-color: #c4a800;
            --cancel-color: #ff9100;
            --success-toast: #00dc82;
            --error-toast: #ff4757;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17,17,25,0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .back-btn, .add-order-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-btn:hover, .add-order-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 20px rgba(155, 125, 255, 0.25);
        }

        .tab-content {
            display: none;
            background: var(--bg-card);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
            border: 1px solid var(--border-color);
        }

        .tab-content.active {
            display: block;
        }

        .order-card {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--buy-color);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
            border-top-color: rgba(255,255,255,0.1);
        }

        .order-card.sell-card {
            border-left-color: var(--sell-color);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-icon-wrap {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(155,125,255,0.1);
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            overflow: hidden;
            flex-shrink: 0;
        }

        .token-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .token-symbol {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-primary);
        }

       .order-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .buy-type {
            background: var(--buy-bg);
            color: var(--buy-color);
            border: 1px solid var(--buy-border);
        }

        .sell-type {
            background: var(--sell-bg);
            color: var(--sell-color);
            border: 1px solid var(--sell-border);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .price-display {
            color: var(--buy-color);
            font-weight: 700;
        }

        .payment-methods {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .payment-method {
            padding: 4px 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 100px;
        }

        .buy-btn {
            background: var(--buy-color);
            color: #0a0a10;
        }

        .sell-btn {
            background: var(--sell-color);
            color: white;
        }

        .cancel-btn {
            background: var(--cancel-color);
            color: white;
        }
        
        .report-btn {
            background: var(--report-color);
            color: #0a0a10;
        }

        .chat-btn {
            background: var(--chat-color);
            color: white;
        }

        .release-btn {
            background: var(--release-color);
            color: white;
        }

        .reject-btn {
            background: var(--reject-color);
            color: white;
        }
        
        .pnp-btn {
            background: var(--accent);
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.04);
            opacity: 0.92;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-card);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,71,87,0.1);
            color: var(--sell-color);
            border-color: var(--sell-border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(155,125,255,0.1);
        }

        .form-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-secondary);
        }

        .payment-option:hover {
            border-color: rgba(155,125,255,0.3);
            background: rgba(155,125,255,0.04);
        }

        .payment-option.selected {
            border-color: var(--accent);
            background: rgba(155,125,255,0.08);
            color: var(--text-primary);
        }

        .payment-option input[type="checkbox"] {
            accent-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .submit-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(155,125,255,0.3);
        }

        /* Chat Modal */
        .chat-container {
            height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: var(--bg-primary);
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-sender {
            color: var(--accent);
        }

        .message-content {
            background: var(--bg-elevated);
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 3px solid var(--text-muted);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.5;
        }

        .ai-message .message-content {
            border-left-color: var(--accent);
            background: rgba(155,125,255,0.06);
        }
        
        .chat-image {
            max-width: 200px;
            border-radius: 8px;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            padding: 12px 15px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:focus {
            border-color: var(--border-focus);
        }

        .send-btn, .image-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        .send-btn {
            background: var(--accent);
            color: white;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .image-btn {
            background: var(--chat-color);
            color: white;
        }

        .image-btn:hover {
            opacity: 0.85;
        }

        .timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--warning-color);
            color: #0a0a10;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1001;
            font-family: inherit;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 20px;
            color: var(--text-secondary);
        }

        .empty-state p {
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            z-index: 1002;
            transform: translateX(calc(100% + 40px));
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            font-size: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: var(--success-toast);
            color: #0a0a10;
        }

        .toast.error {
            background: var(--error-toast);
        }

        .live-price {
            color: var(--buy-color);
            font-weight: 700;
            font-size: 18px;
        }

        .available-qty-display {
            color: var(--accent);
            font-weight: 600;
            font-size: 16px;
        }
        
        #pnp-tab .pnp-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }
        #pnp-tab .uid-display {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            word-wrap: break-word;
            color: var(--text-primary);
        }
        #pnp-tab .role-selector {
            margin-bottom: 30px;
        }
        #pnp-tab .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        #pnp-tab .stat-box {
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .stat-box h4 {
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
        }
        .stat-box p {
            font-size: 32px;
            font-weight: 800;
        }
        .green-box { 
            background: linear-gradient(135deg, #00dc82, #00b368); 
        }
        .red-box { 
            background: linear-gradient(135deg, #ff4757, #cc3a47); 
        }

        .uid-display {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            word-wrap: break-word;
            color: var(--text-primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Premium scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.12);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .header h1 {
                font-size: 18px !important;
            }
            .tabs {
                gap: 6px;
            }
            .tab {
                padding: 10px 16px;
                font-size: 12px;
            }
            .order-details {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
                gap: 10px;
            }
            .order-actions {
                flex-direction: column;
            }
            .action-btn {
                min-width: auto;
            }
            .payment-options {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Selection style */
        ::selection {
            background: rgba(155,125,255,0.3);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back to Trade</button>
            <h1 style="color: white; font-size: 24px; font-weight: 800; letter-spacing: -0.3px;">P2P Trading Platform</h1>
            <button class="add-order-btn" onclick="openCreateOrderModal()"><i class="fas fa-plus"></i> Create Order</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('buy')">Buy Orders</button>
            <button class="tab" onclick="switchTab('sell')">Sell Orders</button>
            <button class="tab" onclick="switchTab('orderbox')">Order Box</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('pnp')">P&P</button>
            </div>

        <div id="buy-tab" class="tab-content active">
            <div id="buy-orders">
                <div class="loading">Loading buy orders</div>
            </div>
        </div>

        <div id="sell-tab" class="tab-content">
            <div id="sell-orders">
                <div class="loading">Loading sell orders</div>
            </div>
        </div>

        <div id="orderbox-tab" class="tab-content">
            <div id="order-box">
                <div class="loading">Loading your active orders</div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div id="history-orders">
                <div class="loading">Loading history</div>
            </div>
        </div>
        
        <div id="pnp-tab" class="tab-content">
            <div class="pnp-container">
                <div class="form-group">
                    <label class="form-label">Your Unique ID (UID)</label>
                    <div id="pnp-uid" class="uid-display">Loading...</div>
                </div>
                <div class="form-group role-selector">
                    <label class="form-label">Select Your Role</label>
                    <select id="userRole" class="form-select" onchange="updateUserRole()">
                        <option value="both">Both (Buyer & Seller)</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p id="pnp-completed-orders">-</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p id="pnp-uncompleted-orders">-</p>
                    </div>
                </div>
            </div>
        </div>
        </div>

    <div id="createOrderModal" class="modal">
        <div class="modal-content">

        // =============================================
        // NEW: Load tokens from crypto_token_control
        // =============================================
        async function loadTokensFromControl() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*');

                if (error) throw error;

                availableTokens = {};

                if (data && data.length > 0) {
                    data.forEach(token => {
                        const nosupported = token.nosupported_js || '';
                        if (nosupported.includes('p2p.html')) return;

                        availableTokens[token.symbol] = {
                            name: token.name || token.symbol,
                            full_name: token.full_name || token.name || token.symbol,
                            icon_type: token.icon_type || 'text',
                            icon_url: token.icon_url || null,
                            is_live_api: token.is_live_api || false,
                            api_url: token.api_url || null,
                            manual_price: parseFloat(token.manual_price) || 0,
                            manual_min_price: parseFloat(token.manual_min_price) || 0,
                            manual_max_price: parseFloat(token.manual_max_price) || 0,
                            manual_change_p: parseFloat(token.manual_change_p) || 0,
                            volume: token.volume || '0',
                            total_supply: token.total_supply || '0',
                            holders: token.holders || '0',
                            description: token.description || '',
                            blockchains: token.blockchains || ['ERC20'],
                            social_links: token.social_links || {}
                        };
                    });
                }

                populateTokenSelect();

            } catch (error) {
                console.error('Load tokens from control error:', error);
            }
        }

        // =============================================
        // NEW: Token icon renderer
        // =============================================
        function getTokenIcon(tokenData, size) {
            const s = size || 32;
            if (!tokenData) {
                return '<span class="token-icon-wrap" style="width:' + s + 'px;height:' + s + 'px;"><i class="fas fa-coins" style="font-size:' + (s * 0.45) + 'px;"></i></span>';
            }

            if (tokenData.icon_type === 'image' && tokenData.icon_url) {
                return '<span class="token-icon-wrap" style="width:' + s + 'px;height:' + s + 'px;"><img src="' + tokenData.icon_url + '" alt="' + (tokenData.name || '') + '"></span>';
            }

            if (tokenData.icon_type === 'emoji' && tokenData.icon_url) {
                return '<span class="token-icon-wrap" style="width:' + s + 'px;height:' + s + 'px;font-size:' + (s * 0.55) + 'px;">' + tokenData.icon_url + '</span>';
            }

            if (tokenData.icon_type === 'text' && tokenData.icon_url) {
                return '<span class="token-icon-wrap" style="width:' + s + 'px;height:' + s + 'px;font-size:' + (s * 0.35) + 'px;">' + tokenData.icon_url + '</span>';
            }

            var initial = (tokenData.name || '?').charAt(0).toUpperCase();
            return '<span class="token-icon-wrap" style="width:' + s + 'px;height:' + s + 'px;font-size:' + (s * 0.42) + 'px;">' + initial + '</span>';
        }

        // =============================================
        // NEW: Populate token select dropdown
        // =============================================
        function populateTokenSelect() {
            var tokenSelect = document.getElementById('tokenSelect');
            if (!tokenSelect) return;

            tokenSelect.innerHTML = '';

            var symbols = Object.keys(availableTokens);
            if (symbols.length === 0) {
                var opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'No tokens available';
                tokenSelect.appendChild(opt);
                return;
            }

            symbols.forEach(function(symbol) {
                var token = availableTokens[symbol];
                var opt = document.createElement('option');
                opt.value = symbol;
                opt.textContent = token.full_name + ' (' + symbol + ')';
                tokenSelect.appendChild(opt);
            });

            updateTokenPrice();
        }

        // =============================================
        // NEW: Fetch price from API URL
        // =============================================
        async function fetchPriceFromApi(apiUrl, symbol) {
            try {
                var response = await fetch(apiUrl);
                var data = await response.json();

                for (var key in data) {
                    if (data[key] && typeof data[key] === 'object') {
                        if (data[key].inr !== undefined) return data[key].inr;
                        if (data[key].usd !== undefined) return data[key].usd;
                        if (data[key].price !== undefined) return data[key].price;
                    }
                }

                if (data.price !== undefined) return data.price;
                if (data.inr !== undefined) return data.inr;
                if (data.usd !== undefined) return data.usd;

                for (var k in data) {
                    if (typeof data[k] === 'number') return data[k];
                }

                return null;
            } catch (error) {
                console.error('Price API error for ' + symbol + ':', error);
                return null;
            }
        }

        // =============================================
        // MODIFIED: Price updates from crypto_token_control
        // =============================================
        async function fetchLivePrices() {
            try {
                var { data: tokens, error } = await supabase
                    .from('crypto_token_control')
                    .select('symbol, is_live_api, api_url, manual_price, nosupported_js');

                if (error) throw error;

                var pricePromises = tokens
                    .filter(function(t) {
                        var ns = t.nosupported_js || '';
                        return !ns.includes('p2p.html');
                    })
                    .map(async function(token) {
                        if (token.is_live_api && token.api_url) {
                            try {
                                var price = await fetchPriceFromApi(token.api_url, token.symbol);
                                livePrices[token.symbol] = price !== null ? price : (parseFloat(token.manual_price) || 0);
                            } catch (e) {
                                livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                            }
                        } else {
                            livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                        }
                    });

                await Promise.allSettled(pricePromises);
                updatePriceDisplays();

            } catch (error) {
                console.error('Price fetch error:', error);
            }
        }

        function updatePriceDisplays() {
            var priceDisplay = document.getElementById('livePrice');
            var tokenSelect = document.getElementById('tokenSelect');
            if (priceDisplay && tokenSelect) {
                var selectedToken = tokenSelect.value;
                if (livePrices[selectedToken] !== undefined) {
                    priceDisplay.textContent = '\u20B9' + livePrices[selectedToken].toLocaleString('en-IN');
                }
            }
            
            document.querySelectorAll('.order-card').forEach(function(card) {
                var symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol] !== undefined) {
                    var priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = '\u20B9' + livePrices[symbol].toLocaleString('en-IN');
                    }
                }
            });
        }

        function startPriceUpdates() {
            fetchLivePrices();
            priceInterval = setInterval(fetchLivePrices, 2000);
        }

        // =============================================
        // REPLACED: Holdings from crypto_token_histry
        // =============================================
        async function getHoldings() {
            try {
                if (!currentUser) return {};

                var { data, error } = await supabase
                    .from('crypto_token_histry')
                    .select('symbol, qty')
                    .eq('user_id', currentUser.id)
                    .eq('status', 'active');

                if (error) throw error;

                var holdingsMap = {};
                if (data) {
                    data.forEach(function(row) {
                        holdingsMap[row.symbol] = {
                            qty: parseFloat(row.qty) || 0
                        };
                    });
                }
                return holdingsMap;

            } catch (error) {
                console.error('Holdings fetch error:', error);
                return {};
            }
        }

        // =============================================
        // NEW: Update holding in crypto_token_histry
        // Only updates qty in existing rows. Creates new row only if needed.
        // =============================================
        async function updateHoldingAfterTrade(userId, symbol, qtyChange, priceAtTransaction, totalAmount, action, blockchain) {
            try {
                var { data: existing, error: fetchError } = await supabase
                    .from('crypto_token_histry')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active');

                if (fetchError) throw fetchError;

                if (existing && existing.length > 0) {
                    var currentQty = parseFloat(existing[0].qty) || 0;
                    var newQty = currentQty + qtyChange;
                    newQty = Math.max(0, newQty);

                    await supabase
                        .from('crypto_token_histry')
                        .update({ qty: newQty })
                        .eq('id', existing[0].id);
                } else if (qtyChange > 0) {
                    await supabase
                        .from('crypto_token_histry')
                        .insert([{
                            user_id: userId,
                            symbol: symbol,
                            action: action,
                            qty: Math.abs(qtyChange),
                            price_at_transacti: priceAtTransaction,
                            total_amount: totalAmount,
                            blockchain_used: blockchain || 'P2P',
                            status: 'active'
                        }]);
                }

            } catch (error) {
                console.error('Update holding error:', error);
                throw error;
            }
        }

        async function loadOrderBox() {
            try {
                const { data: trades, error: tradesError } = await supabase
    .from('user_p2p_order_box')
    .select(`*, order:user_p2p_order(*)`)
    .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)
    .in('status', ['pending', 'accepted', 'payment_done'])
    .order('created_at', { ascending: false });

                if (tradesError) throw tradesError;
                
                const engagedOrderIds = trades.map(t => t.order_id);
                const { data: myOrders, error: myOrdersError } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('status', 'active')
                    .not('id', 'in', `(${engagedOrderIds.join(',')})`);
                
                if (myOrdersError) throw myOrdersError;
                
                const container = document.getElementById('order-box');
                if (trades.length === 0 && myOrders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Active Trades or Orders</h3>
                            <p>You don't have any active trades or created orders.</p>
                        </div>
                    `;
                    return;
                }
                
                let combinedHtml = '';
                
                combinedHtml += await Promise.all(trades.map(async trade => {
                    const isOwner = trade.order.user_id === currentUser.id;
                    const isSeller = trade.seller_id === currentUser.id;
                    const otherUser = isSeller ? 'Buyer' : 'Seller';
                    const otherUserId = isSeller ? trade.buyer_id : trade.seller_id;
                    const isTradeFinished = (trade.status === 'completed' || trade.status === 'cancelled' || trade.status === 'rejected');
                    
                    return `
                        <div class="order-card ${isSeller ? 'sell-card' : ''}">
                            <div class="order-header">
                                <div class="token-info">
                                    ${getTokenIcon(availableTokens[trade.order.token_symbol])}
                                    <span class="token-symbol">${trade.order.token_symbol}</span>
                                    <span class="order-type ${isSeller ? 'sell-type' : 'buy-type'}">
                                        ${isSeller ? 'SELLING' : 'BUYING'}
                                    </span>
                                </div>
                                <div class="detail-value">Order ID: ${trade.order.order_id_unique}</div>
                                <div class="detail-value">Status: ${trade.status}</div>
                            </div>
                            
                            <div class="order-details">
                                <div class="detail-item">
                                    <div class="detail-label">QUANTITY</div>
                                    <div class="detail-value">${trade.order.quantity}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">AMOUNT</div>
                                    <div class="detail-value">\u20B9${trade.order.amount.toLocaleString('en-IN')}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">${otherUser}</div>
                                    <div class="detail-value">${isSeller ? trade.buyer_username : trade.seller_username}</div>
                                </div>
                            </div>
                            
                            <div class="order-actions">
                                ${!isTradeFinished ? `
                                    <button class="action-btn chat-btn" onclick="openChat('${trade.id}')">
                                        <i class="fas fa-comment-dots"></i> Chat
                                    </button>
                                    <button class="action-btn report-btn" onclick="goToHelpPage()">
                                        <i class="fas fa-flag"></i> Report
                                    </button>
                                ` : ''}

                                ${trade.status === 'pending' && isOwner ? `
                                    <button class="action-btn reject-btn" onclick="rejectTrade('${trade.id}')">
                                        <i class="fas fa-ban"></i> Reject
                                    </button>
                                ` : ''}

                                ${trade.status === 'accepted' ? `

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            
            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();
            
            if (data) {
                return generateOrderId();
            }
            
            return result;
        }

        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (!tokenSymbol) {
                showToast('Please select a token', 'error');
                return;
            }

            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }
            
            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between \u20B9100 and \u20B910,000', 'error');
                return;
            }
            
            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked'))
                .map(input => input.value);
            
            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }
            
            if (orderType === 'sell') {
                const holdings = await getHoldings();
                const holding = holdings[tokenSymbol];
                const availableQty = holding ? holding.qty : 0;
                
                if (quantity > availableQty) {
                    showToast('Insufficient token balance', 'error');
                    return;
                }
                
                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;
                
                const needsPhone = selectedPaymentMethods.some(method => 
                    ['phonepe', 'googlepay', 'paytm'].includes(method)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');
                
                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }
                
                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }
            
            try {
                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);
                
                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully!', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            }
        });

        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;
                
                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                         await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'accepted' })
                            .eq('id', tradeId);
                        
                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);
                        
                        if(trade.order.order_type === 'sell') {
                           await sendAIMessage(tradeId, 
                               `Trade accepted! Buyer, please make the payment of \u20B9${trade.order.amount.toLocaleString('en-IN')} using one of the available methods. After paying, please share the screenshot with transaction ID and UTR number.`, 'buyer'
                            );
                        } else {
                            const paymentMethods = trade.order.payment_methods.split(',');
                            let promptMessage = 'Trade accepted! Please send your payment details (e.g., PhonePe, Google Pay, Paytm, UPI) and a screenshot of the account where you want to receive payment.';
                            
                            if (paymentMethods.length > 0) {
                                promptMessage = `Trade accepted! Please share your payment details for these methods: ${paymentMethods.join(', ')} and a screenshot of the account where you want to receive payment.`;
                            }
                            await sendAIMessage(tradeId, promptMessage, 'seller');
                        }
                        
                    } else if (message.includes('reject')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'rejected' })
                            .eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);

                        await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                    }
                }
                
                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId, 
                        'Payment details received! Buyer, please make the payment of \u20B9' + trade.order.amount.toLocaleString('en-IN') + ' to the seller. Be sure to share a screenshot, transaction ID, and UTR number after you\'ve paid.', 'buyer'
                    );
                }

                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase
                        .from('user_p2p_order_box')
                        .update({ status: 'payment_done' })
                        .eq('id', tradeId);

                    await sendAIMessage(tradeId, 
                        'Payment proof received! Seller, please check your bank/wallet for the payment and click "Release Tokens" once confirmed.', 'seller'
                    );
                }

            } catch (error) {
                console.error('Process user message error:', error);
            }
        }
        
        function startTimer(tradeId, seconds, timerType) {
            const timerId = `${tradeId}_${timerType}`;
            
            if (timers[timerId]) {
                clearInterval(timers[timerId]);
            }
            
            let timeLeft = seconds;
            
            const updateTimer = () => {
                if (timeLeft <= 0) {
                    clearInterval(timers[timerId]);
                    delete timers[timerId];
                    handleTimerExpiry(tradeId, timerType);
                    return;
                }
                
                const timerDisplay = document.getElementById('timerDisplay');
                const timerText = document.getElementById('timerText');
                
                if (timerDisplay && timerText) {
                    timerDisplay.style.display = 'block';
                    timerText.textContent = `Timer: ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }
                
                timeLeft--;
            };
            
            updateTimer();
            timers[timerId] = setInterval(updateTimer, 1000);
        }

        async function handleTimerExpiry(tradeId, timerType) {
            try {
                 const timerDisplay = document.getElementById('timerDisplay');
                 if(timerDisplay) timerDisplay.style.display = 'none';

            } catch (error) {
                console.error('Handle timer expiry error:', error);
            }
        }

        // =============================================
        // MODIFIED: Trade actions - releaseTokens with token transfer
        // =============================================
        async function releaseTokens(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;
                
                console.log(`Transferring ${trade.order.quantity} ${trade.order.token_symbol} from ${trade.seller_id} to ${trade.buyer_id}`);

                var tradeQty = parseFloat(trade.order.quantity);
                var tradePrice = livePrices[trade.order.token_symbol] || 0;
                var tradeAmount = parseFloat(trade.order.amount);

                // Cut tokens from seller
                await updateHoldingAfterTrade(
                    trade.seller_id,
                    trade.order.token_symbol,
                    -tradeQty,
                    tradePrice,
                    tradeAmount,
                    'selling',
                    'P2P'
                );

                // Add tokens to buyer
                await updateHoldingAfterTrade(
                    trade.buyer_id,
                    trade.order.token_symbol,
                    tradeQty,
                    tradePrice,
                    tradeAmount,
                    'buying',
                    'P2P'
                );
                
                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'completed' })
                    .eq('id', tradeId);
                
                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.id);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.order_id_unique);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'completed'),
                    updatePnPStats(trade.seller_id, 'completed')
                ]);

                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id,
                        action: 'buy',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.seller_id,
                        created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id,
                        action: 'sell',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.buyer_id,
                        created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Tokens released successfully! Trade completed.', 'both');
                
                showToast('Tokens released successfully!', 'success');
                loadAllData();
                closeChatModal();


            } catch (error) {
                console.error('Release tokens error:', error);
                showToast('Failed to release tokens', 'error');
            }
        }
        
        async function cancelTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'cancelled' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'uncompleted'),
                    updatePnPStats(trade.seller_id, 'uncompleted')
                ]);

                await Promise.all([
                     supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id, action: 'buy', token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity, amount: trade.order.amount, status: 'cancelled', other_user_id: trade.seller_id, created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id, action: 'sell', token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity, amount: trade.order.amount, status: 'cancelled', other_user_id: trade.buyer_id, created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Trade has been cancelled.', 'both');
                showToast('Trade cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel trade error:', error);
                showToast('Failed to cancel trade', 'error');
            }
        }


        async function cancelOrder(orderId) {
            try {
                const { data: order, error } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('id', orderId)
                    .single();
                
                if (error || !order) throw error || new Error('Order not found');

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'cancelled' })
                    .eq('id', orderId);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'cancelled' })
                    .eq('id', order.order_id_unique);
                    
                await updatePnPStats(currentUser.id, 'uncompleted');

                await supabase.from('user_p2p_history').insert([{
                    user_id: currentUser.id,
                    action: order.order_type,
                    token_symbol: order.token_symbol,
                    quantity: order.quantity,
                    amount: order.amount,
                    status: 'cancelled',
                    other_user_id: null,
                    created_at: new Date().toISOString()
                }]);

                showToast('Order cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel order error:', error);
                showToast('Failed to cancel order', 'error');
            }
        }

        // =============================================
        // NEW: Reject trade function (was referenced but missing)
        // =============================================
        async function rejectTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'rejected' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await sendAIMessage(tradeId, 'Trade rejected. The order is now available again.', 'both');

                showToast('Trade rejected', 'success');
                loadAllData();

            } catch (error) {
                console.error('Reject trade error:', error);
                showToast('Failed to reject trade', 'error');
            }
        }
        
        function setupRealtimeSubscriptions() {
            supabase
                .channel('p2p_public_changes')
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'user_p2p_order' }, 
                    () => { loadAllData(); }
                )
                .on('postgres_changes', 
                    { event: '*', schema: 'public', table: 'user_p2p_order_box' }, 
                    () => { loadAllData(); }
                )
                .on('postgres_changes', 
                    { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}`},
                    (payload) => {
                        if(document.getElementById('pnp-tab').classList.contains('active')) {
                           loadPnPData();
                        }
                    }
                )
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'crypto_token_control' },
                    () => { loadTokensFromControl(); }
                )
                .subscribe();
        }

        function setupChatRealtimeSubscription(tradeId) {
            if (activeChats[tradeId]) {
                supabase.removeChannel(activeChats[tradeId]);
            }
            const chatChannel = supabase
                .channel(`trade_chat_${tradeId}`)
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'trade_chat', filter: `trade_id=eq.${tradeId}` }, 
                    (payload) => {
                        loadChatMessages(tradeId);
                    }
                )
                .subscribe();
            activeChats[tradeId] = chatChannel;
        }

        // Utility functions
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (priceInterval) {
                clearInterval(priceInterval);
            }
            
            Object.values(timers).forEach(timer => {
                clearInterval(timer);
            });
            supabase.removeAllChannels();
        });
        
        async function getUID(userId) {
            try {
                const { data, error } = await supabase
                    .from('uid')
                    .select('uid')
                    .eq('user_id', userId)
                    .single();
                if (error || !data) return "Unavailable";
                return data.uid;
            } catch (e) {
                return "Unavailable";
            }
        }
        
        async function initializePnPProfile() {
            const { data, error } = await supabase
                .from('user-p&p')
                .select('user_id')
                .eq('user_id', currentUser.id)
                .single();

            if (!data) {
                await supabase.from('user-p&p').insert([{ user_id: currentUser.id }]);
            }
        }
        
        async function loadPnPData() {
            const uid = await getUID(currentUser.id);
            document.getElementById('pnp-uid').textContent = uid;
            
            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();
            
            if (data) {
                document.getElementById('userRole').value = data.role;
                document.getElementById('pnp-completed-orders').textContent = data.completed_orders;
                document.getElementById('pnp-uncompleted-orders').textContent = data.uncompleted_orders;
            }
        }

        async function updateUserRole() {
            const newRole = document.getElementById('userRole').value;
            const { data, error } = await supabase
                .from('user-p&p')
                .select('role_last_updated')
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.role_last_updated) {
                const lastUpdated = new Date(data.role_last_updated);
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastUpdated > twentyFourHoursAgo) {
                    showToast('You can only change your role once every 24 hours.', 'error');
                    loadPnPData();
                    return;
                }
            }

            const { error: updateError } = await supabase
                .from('user-p&p')
                .update({ role: newRole, role_last_updated: new Date().toISOString() })
                .eq('user_id', currentUser.id);

            if (updateError) {
                showToast('Failed to update role.', 'error');
            } else {
                showToast('Role updated successfully.', 'success');
            }
        }
        
        async function openPnPModal(userId, uidOnly = false) {
            const modal = document.getElementById('pnpModal');
            const modalBody = document.getElementById('pnpModalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = `<div class="loading">Loading user profile</div>`;

            const uid = await getUID(userId);

            if (uidOnly) {
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">User's UID</label>
                        <div class="uid-display">${uid}</div>
                    </div>
                `;
                return;
            }

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                modalBody.innerHTML = `<div class="empty-state"><h3>Profile not found</h3></div>`;
                return;
            }

            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">User's UID</label>
                    <div class="uid-display">${uid}</div>
                </div>
                 <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="uid-display" style="text-transform: capitalize;">${data.role}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p>${data.completed_orders}</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p>${data.uncompleted_orders}</p>
                    </div>
                </div>
            `;
        }

        function closePnPModal() {
            document.getElementById('pnpModal').style.display = 'none';
        }
        
        async function updatePnPStats(userId, type) {
            const { data, error } = await supabase.rpc('update_pnp_stats', {
                p_user_id: userId,
                p_type: type
            });
            if(error) console.error('Error updating PnP stats:', error);
        }
    </script>
