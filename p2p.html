<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Trading - AvicnKnov</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Premium Font Styling */
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fc;
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* Hide Scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Modal Backdrop */
        .modal-backdrop {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }

        /* Tab Active State */
        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transform: scale(1.05);
        }
        
        /* Chat Bubbles */
        .chat-bubble-user {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border-radius: 18px 18px 4px 18px;
        }
        .chat-bubble-other {
            background-color: #f1f5f9;
            color: #334155;
            border-radius: 18px 18px 18px 4px;
        }
        .chat-bubble-ai {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border-radius: 18px;
        }

        /* Input Styling */
        .form-input-premium {
            width: 100%;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.2s;
            outline: none;
            font-size: 0.95rem;
        }
        .form-input-premium:focus {
            background-color: #fff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-[#f8f9fc] min-h-screen pb-20">

    <!-- Sticky Header -->
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-3 flex justify-between items-center">

            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="text-lg font-black text-slate-800 tracking-tight">P2P Trading</h1>
        <button onclick="openCreateOrderModal()" class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Tabs -->
    <div class="sticky top-[65px] z-30 bg-[#f8f9fc]/95 backdrop-blur-sm py-2 px-4 mb-2">
        <div class="flex gap-3 overflow-x-auto scrollbar-hide py-2 px-1">

            <button class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-slate-500 border border-slate-100 whitespace-nowrap shadow-sm" onclick="switchTab('sell')">Sell</button>
            <button class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-slate-500 border border-slate-100 whitespace-nowrap shadow-sm" onclick="switchTab('orderbox')">Orders</button>
            <button class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-slate-500 border border-slate-100 whitespace-nowrap shadow-sm" onclick="switchTab('history')">History</button>
            <button class="tab-btn px-6 py-2.5 rounded-full text-sm font-bold bg-white text-slate-500 border border-slate-100 whitespace-nowrap shadow-sm" onclick="switchTab('pnp')">P&P</button>
        </div>
    </div>

    <!-- Content Container -->
    <div class="max-w-2xl mx-auto px-4 pb-10">

        <!-- Buy Orders -->
        <div id="buy-tab" class="tab-content active fade-in">

        <!-- Order Box (Active Trades) -->

            </div>
        </div>

        <!-- History -->
        <div id="history-tab" class="tab-content hidden fade-in">
            <div id="history-orders" class="space-y-4">

        <!-- P&P Tab -->
        <div id="pnp-tab" class="tab-content hidden fade-in">
            <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 p-6 border border-slate-100 text-center">

                    <i class="fas fa-id-badge text-2xl"></i>

    <!-- Create Order Modal -->
    <div id="createOrderModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 modal-backdrop transition-opacity" onclick="closeCreateOrderModal()"></div>
        <div class="absolute bottom-0 inset-x-0 md:top-1/2 md:bottom-auto md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:max-w-md w-full bg-white rounded-t-3xl md:rounded-3xl p-6 shadow-2xl transform transition-transform duration-300">
            
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800">Create Order</h2>
                <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center" onclick="closeCreateOrderModal()">&times;</button>
            </div>
            
            <form id="createOrderForm" class="space-y-4 max-h-[70vh] overflow-y-auto pr-1 scrollbar-hide">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Type</label>
                        <select id="orderType" class="form-input-premium cursor-pointer" onchange="updateOrderType()">
                            <option value="buy">Buy</option>
                            <option value="sell">Sell</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Token</label>
                        <select id="tokenSelect" class="form-input-premium cursor-pointer" onchange="updateTokenPrice()">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>

                <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 flex justify-between items-center">
                    <span class="text-xs font-bold text-blue-600">Live Price</span>
                    <span id="livePrice" class="text-sm font-black text-slate-800">Loading...</span>
                </div>

                <div id="availableQuantity" class="hidden">

                        <span>Available Balance</span>
                        <span id="availableQty" class="text-slate-800">0</span>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Quantity</label>
                    <input type="number" id="quantity" class="form-input-premium" step="0.00000001" min="0" onchange="calculateAmount()" placeholder="0.00">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase mb-1 block">Total Amount (₹)</label>
                    <input type="number" id="amount" class="form-input-premium" min="100" max="10000" onchange="calculateQuantity()" placeholder="Min 100">
                </div>

                    <label class="text-xs font-bold text-slate-400 uppercase mb-2 block">Payment Methods</label>
                    <div class="grid grid-cols-2 gap-3">

                            <label class="text-sm font-semibold text-slate-700 cursor-pointer pointer-events-none">PhonePe</label>
                        </div>
                        <div class="payment-option border border-slate-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:bg-slate-50 transition-colors" onclick="togglePaymentMethod('googlepay')">
                            <input type="checkbox" id="googlepay" value="googlepay" class="accent-blue-600">
                            <label class="text-sm font-semibold text-slate-700 cursor-pointer pointer-events-none">GPay</label>
                        </div>
                        <div class="payment-option border border-slate-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:bg-slate-50 transition-colors" onclick="togglePaymentMethod('paytm')">
                            <input type="checkbox" id="paytm" value="paytm" class="accent-blue-600">
                            <label class="text-sm font-semibold text-slate-700 cursor-pointer pointer-events-none">Paytm</label>
                        </div>
                        <div class="payment-option border border-slate-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer hover:bg-slate-50 transition-colors" onclick="togglePaymentMethod('upi')">
                            <input type="checkbox" id="upi" value="upi" class="accent-blue-600">

                        </div>
                    </div>
                </div>

                <div id="paymentDetails" class="space-y-3 hidden bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Phone Number</label>
                        <input type="tel" id="phoneNumber" class="form-input-premium bg-white text-sm py-2" placeholder="Linked mobile number">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">UPI ID</label>
                        <input type="text" id="upiId" class="form-input-premium bg-white text-sm py-2" placeholder="username@upi">
                    </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all active:scale-[0.98]">
                    Post Order

            </form>
        </div>
    </div>

                <button class="w-10 h-10 rounded-full bg-blue-600 text-white hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex-shrink-0 flex items-center justify-center" onclick="sendMessage()">

    <!-- P&P View Modal -->
    <div id="pnpModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 modal-backdrop transition-opacity" onclick="closePnPModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl m-4">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-black text-slate-800">User P&P</h2>
                <button class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center" onclick="closePnPModal()">&times;</button>
            </div>

    <!-- Timer Overlay -->
    <div id="timerDisplay" class="fixed top-20 right-4 z-[60] hidden">
        <div class="bg-orange-500 text-white px-4 py-2 rounded-xl shadow-lg shadow-orange-500/30 font-bold flex items-center gap-2 animate-pulse">
            <i class="fas fa-stopwatch"></i>
            <span id="timerText"></span>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[70] transition-all duration-300 opacity-0 translate-y-10 pointer-events-none flex items-center gap-3 min-w-[300px] justify-center">
        <!-- Text injected by JS -->
    </div>

    <script>
        // Configuration
        const SUPA_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);
        
        // Global variables
        let currentUser = null;
        let livePrices = {};
        let currentTradeOrder = null;
        let priceInterval = null;
        let timers = {};
        let activeChats = {};
        
        // Token configurations
        

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            await loadAllData();
            startPriceUpdates();
            setupRealtimeSubscriptions();
        });

        // Auth functions
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                showToast('Please login to access P2P trading', 'error');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }
            currentUser = user;
            // NEW: Initialize P&P profile on login
            await initializePnPProfile();
        }

        // Navigation
        function goBack() {
            window.location.href = 'trade.html';
        }

        // Tab switching
        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.remove('active', 'bg-blue-600', 'text-white'));
            document.querySelectorAll('.tab-btn').forEach(tab => tab.classList.add('bg-white', 'text-slate-500'));
            
            const clickedBtn = event.target;
            clickedBtn.classList.remove('bg-white', 'text-slate-500');
            clickedBtn.classList.add('active'); // CSS handles blue bg

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
                content.classList.remove('active');
            });
            const target = document.getElementById(tabName + '-tab');
            target.classList.remove('hidden');
            target.classList.add('active');
            
            // Load data for the tab
            switch(tabName) {
                case 'buy': loadBuyOrders(); break;
                case 'sell': loadSellOrders(); break;
                case 'orderbox': loadOrderBox(); break;
                case 'history': loadHistory(); break;
                case 'pnp': loadPnPData(); break;
            }
        }

        // Load all data
        async function loadAllData() {
            await Promise.all([
                loadBuyOrders(),
                loadSellOrders(),
                loadOrderBox(),
                loadHistory()
            ]);
        }

        // Price updates
        
        let TOKENS = {}; // Will be populated from crypto_token_control

        async function fetchTokensFromControl() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*');
                if (error) throw error;
                
                let newTokens = {};
                let tokenSelectHtml = '';
                
                for (const token of data) {
                    // Check if p2p.html is in nosupported_js
                    if (token.nosupported_js && token.nosupported_js.includes('p2p.html')) {
                        continue;
                    }
                    
                    let currentPrice = token.manual_price || 0;
                    if (token.is_live_api && token.api_url) {
                        try {
                            const response = await fetch(token.api_url);
                            const apiData = await response.json();
                            // Assuming the API returns { price: ... } or similar standard format.
                            // Since we don't know the exact format, we'll try to extract a number.
                            // For Binance: apiData.price
                            // For Coingecko: apiData[id].inr
                            if (apiData.price) currentPrice = parseFloat(apiData.price);
                            else if (apiData[token.symbol.toLowerCase()] && apiData[token.symbol.toLowerCase()].inr) {
                                currentPrice = parseFloat(apiData[token.symbol.toLowerCase()].inr);
                            }
                        } catch (e) {
                            console.error('Failed to fetch live API price for', token.symbol, e);
                        }
                    }

                    newTokens[token.symbol] = {
                        name: token.name,
                        id: token.symbol.toLowerCase(),
                        icon: token.icon_url,
                        price: currentPrice
                    };
                    tokenSelectHtml += `<option value="${token.symbol}">${token.name} (${token.symbol})</option>`;
                }
                
                TOKENS = newTokens;
                
                const tokenSelect = document.getElementById('tokenSelect');
                if (tokenSelect) {
                    const currentVal = tokenSelect.value;
                    tokenSelect.innerHTML = tokenSelectHtml;
                    if (newTokens[currentVal]) {
                        tokenSelect.value = currentVal;
                    }
                }
            } catch (error) {
                console.error('Error fetching tokens:', error);
            }
        }

        async function fetchLivePrices() {
            try {
                await fetchTokensFromControl();
                
                // Use prices from crypto_token_control
                Object.keys(TOKENS).forEach(symbol => {
                    livePrices[symbol] = TOKENS[symbol].price || 0;
                });
                
                updatePriceDisplays();
            } catch (error) {
                console.error('Price fetch error:', error);
            }
        }


        function updatePriceDisplays() {
            // Update live price in modal
            const priceDisplay = document.getElementById('livePrice');
            const tokenSelect = document.getElementById('tokenSelect');
            if (priceDisplay && tokenSelect) {
                const selectedToken = tokenSelect.value;
                if (livePrices[selectedToken]) {
                    priceDisplay.textContent = `₹${livePrices[selectedToken].toLocaleString('en-IN')}`;
                }
            }
            // Update prices in order cards (Class name selector adjusted for Tailwind re-write)
            document.querySelectorAll('.order-card-price').forEach(el => {
                const symbol = el.dataset.symbol;
                if (symbol && livePrices[symbol]) {
                    el.textContent = `₹${livePrices[symbol].toLocaleString('en-IN')}`;
                }
            });
        }

        
        function startPriceUpdates() {
            fetchLivePrices();
            priceInterval = setInterval(() => {
                fetchLivePrices();
                silentRefresh();
            }, 5000);
        }
        
        async function silentRefresh() {
            // Silently reload data without showing loading indicators if data exists
            const currentTab = document.querySelector('.tab-btn.active').textContent.trim().toLowerCase();

        // Holdings functions
        
        async function getHoldings() {
            try {
                if (!currentUser) return {};
                
                const { data, error } = await supabase
                    .from('crypto_token_histry')
                    .select('*')
                    .eq('user_id', currentUser.id);
                    
                if (error) throw error;
                
                let holdings = {};
                data.forEach(record => {
                    if (!holdings[record.symbol]) {
                        holdings[record.symbol] = { qty: 0 };
                    }
                    if (record.action === 'buy' || record.action === 'add') {
                        holdings[record.symbol].qty += parseFloat(record.qty);
                    } else if (record.action === 'sell' || record.action === 'deduct') {
                        holdings[record.symbol].qty -= parseFloat(record.qty);
                    }
                });
                
                return holdings;
            } catch (error) {
                console.error('Error getting holdings:', error);
                return {};
            }
        }

        function updateOrderType() {
            const orderType = document.getElementById('orderType').value;
            const availableQuantity = document.getElementById('availableQuantity');
            const paymentDetails = document.getElementById('paymentDetails');
            
            if (orderType === 'sell') {
                availableQuantity.classList.remove('hidden');
                paymentDetails.classList.remove('hidden');
                updateAvailableQuantity();
            } else {
                availableQuantity.classList.add('hidden');
                paymentDetails.classList.add('hidden');
            }

        async function updateAvailableQuantity() {
            const tokenSelect = document.getElementById('tokenSelect');
            const availableQty = document.getElementById('availableQty');
            const selectedToken = tokenSelect.value;
            
            try {
                const holdings = await getHoldings();
                const holding = holdings[selectedToken];
                const qty = holding ? holding.qty : 0;
                availableQty.textContent = qty.toFixed(8);
            } catch (error) {
                availableQty.textContent = '0';
            }
        }

        function updateTokenPrice() {
            const tokenSelect = document.getElementById('tokenSelect');
            const livePrice = document.getElementById('livePrice');
            const selectedToken = tokenSelect.value;
            
            if (livePrices[selectedToken]) {
                livePrice.textContent = `₹${livePrices[selectedToken].toLocaleString('en-IN')}`;
            } else {
                livePrice.textContent = 'Loading...';
            }
            if (document.getElementById('orderType').value === 'sell') {
                updateAvailableQuantity();
            }
        }

        function calculateAmount() {
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;
            const amount = quantity * price;
            document.getElementById('amount').value = Math.round(amount);
        }

        function calculateQuantity() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;
            if (price > 0) {
                const quantity = amount / price;
                document.getElementById('quantity').value = quantity.toFixed(8);
            }
        }

        function togglePaymentMethod(method) {
            const checkbox = document.getElementById(method);
            const container = checkbox.closest('.payment-option');
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                container.classList.add('bg-blue-50', 'border-blue-200');
            } else {
                container.classList.remove('bg-blue-50', 'border-blue-200');
            }
            
            const orderType = document.getElementById('orderType').value;
            if (orderType === 'sell') {
                const hasPaymentMethods = document.querySelectorAll('.payment-option input:checked').length > 0;
                if(hasPaymentMethods) {
                    document.getElementById('paymentDetails').classList.remove('hidden');
                } else {
                    document.getElementById('paymentDetails').classList.add('hidden');
                }
            }
        }

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            const { data, error } = await supabase.from('p2p_order_id').select('id').eq('id', result).single();
            if (data) return generateOrderId();
            return result;
        }

        // Form Submission Logic (Identical)
        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (!quantity || quantity <= 0) { showToast('Please enter a valid quantity', 'error'); return; }
            if (!amount || amount < 100 || amount > 10000) { showToast('Amount must be between ₹100 and ₹10,000', 'error'); return; }
            
            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked')).map(input => input.value);
            if (selectedPaymentMethods.length === 0) { showToast('Please select at least one payment method', 'error'); return; }
            
            if (orderType === 'sell') {
                const holdings = await getHoldings();
                const holding = holdings[tokenSymbol];
                const availableQty = holding ? holding.qty : 0;
                if (quantity > availableQty) { showToast('Insufficient token balance', 'error'); return; }
                
                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;
                const needsPhone = selectedPaymentMethods.some(method => ['phonepe', 'googlepay', 'paytm'].includes(method));
                const needsUpi = selectedPaymentMethods.includes('upi');
                if (needsPhone && !phoneNumber) { showToast('Please enter phone number', 'error'); return; }
                if (needsUpi && !upiId) { showToast('Please enter UPI ID', 'error'); return; }
            }
            
            try {
                const orderIdUnique = await generateOrderId();
                const { error: idError } = await supabase.from('p2p_order_id').insert([{
                    id: orderIdUnique, user_id: currentUser.id, token_symbol: tokenSymbol, quantity: quantity, amount: amount, status: 'active'
                }]);
                if (idError) throw idError;

                const { data, error } = await supabase.from('user_p2p_order').insert([{
                    user_id: currentUser.id, username: currentUser.user_metadata?.username || 'Anonymous', order_id_unique: orderIdUnique,
                    order_type: orderType, token_symbol: tokenSymbol, quantity: quantity, amount: amount,
                    payment_methods: selectedPaymentMethods.join(','),
                    payment_details: orderType === 'sell' ? JSON.stringify({ phone: document.getElementById('phoneNumber').value, upi: document.getElementById('upiId').value }) : null,
                    status: 'active', created_at: new Date().toISOString()

        async function sendMessage() {

        async function sendAIMessage(tradeId, message, recipient) {

        // Process User Message Logic (Identical)
        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase.from('user_p2p_order_box').select(`*, order:user_p2p_order(*)`).eq('id', tradeId).single();
                if (tradeError) throw tradeError;
                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;
                
                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                        await supabase.from('user_p2p_order_box').update({ status: 'accepted' }).eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);
                        if(trade.order.order_type === 'sell') {
                           await sendAIMessage(tradeId, `Trade accepted! Buyer, pay ₹${trade.order.amount.toLocaleString('en-IN')}. Share screenshot/UTR.`, 'buyer');
                        } else {
                            const pm = trade.order.payment_methods.split(',');
                            await sendAIMessage(tradeId, `Trade accepted! Share payment details for ${pm.join(', ')} and your QR/Screenshot.`, 'seller');
                        }
                    } else if (message.includes('reject')) {
                        await supabase.from('user_p2p_order_box').update({ status: 'rejected' }).eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);
                        await sendAIMessage(tradeId, 'Trade rejected. Order is active again.', 'both');
                    }
                }
                
                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId, 'Payment details received! Buyer, please pay ₹' + trade.order.amount.toLocaleString('en-IN') + ' and share proof.', 'buyer');
                }
                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase.from('user_p2p_order_box').update({ status: 'payment_done' }).eq('id', tradeId);
                    await sendAIMessage(tradeId, 'Proof received! Seller, verify payment and click "Release Tokens".', 'seller');
                }
            } catch (error) { console.error(error); }
        }

        function startTimer(tradeId, seconds, timerType) {
            const timerId = `${tradeId}_${timerType}`;
            if (timers[timerId]) clearInterval(timers[timerId]);
            let timeLeft = seconds;
            const updateTimer = () => {
                if (timeLeft <= 0) { clearInterval(timers[timerId]); delete timers[timerId]; handleTimerExpiry(tradeId, timerType); return; }
                const display = document.getElementById('timerDisplay');
                const text = document.getElementById('timerText');
                if (display && text) {
                    display.classList.remove('hidden');
                    text.textContent = `${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }
                timeLeft--;
            };
            updateTimer();
            timers[timerId] = setInterval(updateTimer, 1000);
        }

             const d = document.getElementById('timerDisplay');
             if(d) d.classList.add('hidden');
        }

        async function releaseTokens(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase.from('user_p2p_order_box').select(`*, order:user_p2p_order(*)`).eq('id', tradeId).single();
                if (tradeError) throw tradeError;
                
                await supabase.from('user_p2p_order_box').update({ status: 'completed' }).eq('id', tradeId);
                await supabase.from('user_p2p_order').update({ status: 'completed' }).eq('id', trade.order.id);
                await supabase.from('p2p_order_id').update({ status: 'completed' }).eq('id', trade.order.order_id_unique);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'completed'),
                    updatePnPStats(trade.seller_id, 'completed')
                ]);

                // Update token history for buyer and seller
                await updateHolding(trade.buyer_id, trade.order.token_symbol, trade.order.quantity, 'buy'); // Buyer gets tokens
                
                const { error: sellerHistError } = await supabase.from('crypto_token_histry').insert([{
                    user_id: trade.seller_id,
                    symbol: trade.order.token_symbol,
                    qty: trade.order.quantity,
                    action: 'sell',
                    created_at: new Date().toISOString()
                }]);

                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id, action: 'buy', token_symbol: trade.order.token_symbol, quantity: trade.order.quantity, amount: trade.order.amount, status: 'completed', other_user_id: trade.seller_id, created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id, action: 'sell', token_symbol: trade.order.token_symbol, quantity: trade.order.quantity, amount: trade.order.amount, status: 'completed', other_user_id: trade.buyer_id, created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Tokens released! Trade completed.', 'both');
                showToast('Tokens released successfully!', 'success');
                loadAllData();
                closeChatModal();
            } catch (error) { showToast('Failed to release tokens', 'error'); }
        }

        function setupRealtimeSubscriptions() {
            supabase.channel('p2p_public_changes')

                .on('postgres_changes', { event: '*', schema: 'public', table: 'user_p2p_order_box' }, () => { loadAllData(); })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}`}, (payload) => {

        function setupChatRealtimeSubscription(tradeId) {
