    <style>
      /* ==========================================================================
           Premium UI Stylesheet for P2P Trading Platform
           ========================================================================== */

      /* --- Base & Typography --- */
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --secondary: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --background: #f8fafc;
        --surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --ring: rgba(59, 130, 246, 0.5);
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md:
          0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.3);
      }

      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background-color: var(--background);
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
        overflow-x: hidden;
      }

      /* --- Scrollbar Customization --- */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- Animations --- */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(15px);
        }
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes pulse-soft {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      @keyframes shimmer {
        0% {
          background-position: -1000px 0;
        }
        100% {
          background-position: 1000px 0;
        }
      }
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-5px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .scale-in {
        animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .float-anim {
        animation: float 3s ease-in-out infinite;
      }

      /* --- Layout & Containers --- */
      .glass-header {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: var(--shadow-lg);
      }

      /* --- Buttons & Interactive Elements --- */
      .btn-premium {
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1;
      }
      .btn-premium::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          to right,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transform: translateX(-100%);
        transition: transform 0.6s ease;
        z-index: -1;
      }
      .btn-premium:hover::before {
        transform: translateX(100%);
      }
      .btn-premium:active {
        transform: scale(0.97);
      }

      .tab-btn {
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }
      .tab-btn::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 3px;
        background: var(--primary);
        transition: all 0.3s ease;
        transform: translateX(-50%);
        border-radius: 3px 3px 0 0;
      }
      .tab-btn.active {
        color: var(--primary);
        background: rgba(59, 130, 246, 0.05);
        border-color: rgba(59, 130, 246, 0.2);
      }
      .tab-btn.active::after {
        width: 80%;
      }

      /* --- Form Elements --- */
      .form-input-premium {
        width: 100%;
        padding: 14px 18px;
        background-color: #f8fafc;
        border: 2px solid transparent;
        border-radius: var(--radius-lg);
        transition: all 0.3s ease;
        outline: none;
        font-size: 1rem;
        color: var(--text-main);
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
      }
      .form-input-premium:focus {
        background-color: #ffffff;
        border-color: var(--primary);
        box-shadow:
          0 0 0 4px rgba(59, 130, 246, 0.15),
          inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
      }
      .form-input-premium::placeholder {
        color: #94a3b8;
      }

      /* --- Custom Checkbox --- */
      .custom-checkbox {
        display: flex;
        align-items: center;
        cursor: pointer;
        position: relative;
        padding: 12px 16px;
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        transition: all 0.2s ease;
        background: white;
      }
      .custom-checkbox:hover {
        border-color: #cbd5e1;
        background: #f8fafc;
      }
      .custom-checkbox input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
      }
      .checkmark {
        height: 20px;
        width: 20px;
        background-color: #e2e8f0;
        border-radius: 4px;
        margin-right: 12px;
        position: relative;
        transition: all 0.2s ease;
      }
      .custom-checkbox:hover input ~ .checkmark {
        background-color: #cbd5e1;
      }
      .custom-checkbox input:checked ~ .checkmark {
        background-color: var(--primary);
      }
      .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 7px;
        top: 3px;
        width: 6px;
        height: 12px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .custom-checkbox input:checked ~ .checkmark:after {
        display: block;
        animation: scaleIn 0.2s ease-out forwards;
      }
      .custom-checkbox input:checked ~ .label-text {
        color: var(--primary);
        font-weight: 600;
      }
      .custom-checkbox.selected {
        border-color: var(--primary);
        background: rgba(59, 130, 246, 0.05);
      }

      /* --- Order Cards --- */
      .order-card-premium {
        background: var(--surface);
        border-radius: var(--radius-xl);
        padding: 24px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-md);
        border: 1px solid rgba(226, 232, 240, 0.6);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .order-card-premium::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--primary);
        border-radius: 4px 0 0 4px;
        opacity: 0.8;
      }
      .order-card-premium.sell-card::before {
        background: var(--danger);
      }
      .order-card-premium:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: var(--shadow-lg);
        border-color: rgba(203, 213, 225, 0.8);
      }

      /* --- Chat UI --- */
      .chat-bubble-user {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        border-radius: 20px 20px 4px 20px;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2);
        padding: 12px 16px;
        max-width: 85%;
        align-self: flex-end;
      }
      .chat-bubble-other {
        background-color: #f1f5f9;
        color: var(--text-main);
        border-radius: 20px 20px 20px 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        padding: 12px 16px;
        max-width: 85%;
        align-self: flex-start;
        border: 1px solid #e2e8f0;
      }
      .chat-bubble-ai {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        padding: 12px 16px;
        max-width: 90%;
        align-self: center;
        text-align: center;
        font-size: 0.9rem;
      }

      /* --- Modals --- */
      .modal-backdrop {
        background-color: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: opacity 0.3s ease;
      }
      .modal-content-premium {
        background: var(--surface);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      /* --- Skeleton Loaders --- */
      .skeleton {
        background: #f1f5f9;
        background-image: linear-gradient(
          to right,
          #f1f5f9 0%,
          #e2e8f0 20%,
          #f1f5f9 40%,
          #f1f5f9 100%
        );
        background-repeat: no-repeat;
        background-size: 1000px 100%;
        animation: shimmer 2s infinite linear forwards;
        border-radius: 4px;
      }
      .skeleton-card {
        background: white;
        border-radius: var(--radius-xl);
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid #e2e8f0;
      }
      .skeleton-text {
        height: 16px;
        margin-bottom: 8px;
        width: 100%;
      }
      .skeleton-text.short {
        width: 40%;
      }
      .skeleton-text.medium {
        width: 70%;
      }
      .skeleton-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
      }
      .skeleton-button {
        height: 40px;
        width: 100%;
        border-radius: var(--radius-lg);
        margin-top: 16px;
      }

      /* --- Toast Notifications --- */
      .toast-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
      }
      .toast-premium {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 16px 20px;
        box-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 300px;
        max-width: 400px;
        pointer-events: auto;
        animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        border-left: 4px solid var(--primary);
        position: relative;
        overflow: hidden;
      }
      .toast-premium.success {
        border-left-color: var(--secondary);
      }
      .toast-premium.error {
        border-left-color: var(--danger);
      }
      .toast-premium.warning {
        border-left-color: var(--warning);
      }

      .toast-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        background: rgba(0, 0, 0, 0.1);
        width: 100%;
      }
      .toast-progress-bar {
        height: 100%;
        background: var(--primary);
        width: 100%;
        transition: width linear;
      }
      .toast-premium.success .toast-progress-bar {
        background: var(--secondary);
      }
      .toast-premium.error .toast-progress-bar {
        background: var(--danger);
      }

      /* --- Badges --- */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .badge-buy {
        background: rgba(16, 185, 129, 0.1);
        color: var(--secondary);
        border: 1px solid rgba(16, 185, 129, 0.2);
      }
      .badge-sell {
        background: rgba(239, 68, 68, 0.1);
        color: var(--danger);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      .badge-neutral {
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #e2e8f0;
      }

      /* --- Stats Grid --- */
      .stats-grid-premium {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .stat-item {
        background: #f8fafc;
        padding: 12px;
        border-radius: var(--radius-md);
        border: 1px solid #e2e8f0;
        text-align: center;
      }
      .stat-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--text-muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--text-main);
      }

      /* --- Empty States --- */
      .empty-state-premium {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        background: white;
        border-radius: var(--radius-xl);
        border: 1px dashed #cbd5e1;
        margin-top: 20px;
      }
      .empty-state-icon {
        width: 80px;
        height: 80px;
        background: #f1f5f9;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        color: #94a3b8;
        font-size: 32px;
      }
      .empty-state-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 8px;
      }
      .empty-state-desc {
        color: var(--text-muted);
        font-size: 0.95rem;
        max-width: 300px;
      }
    </style>
  </head>

       * @returns {Promise<void>}

      async function fetchTokensFromControl() {
        try {
          const { data, error } = await supabase
            .from("crypto_token_control")
            .select("*");
          if (error) throw error;

          let newTokens = {};
          let tokenSelectHtml = "";

          for (const token of data) {
            // Check if p2p.html is in nosupported_js
            if (
              token.nosupported_js &&
              token.nosupported_js.includes("p2p.html")
            ) {
              continue;
            }

            let currentPrice = token.manual_price || 0;
            if (token.is_live_api && token.api_url) {
              try {
                const response = await fetch(token.api_url);
                const apiData = await response.json();
                // Assuming the API returns { price: ... } or similar standard format.
                // Since we don't know the exact format, we'll try to extract a number.
                // For Binance: apiData.price
                // For Coingecko: apiData[id].inr
                if (apiData.price) currentPrice = parseFloat(apiData.price);
                else if (
                  apiData[token.symbol.toLowerCase()] &&
                  apiData[token.symbol.toLowerCase()].inr
                ) {
                  currentPrice = parseFloat(
                    apiData[token.symbol.toLowerCase()].inr,
                  );
                }
              } catch (e) {
                console.error(
                  "Failed to fetch live API price for",
                  token.symbol,
                  e,
                );
              }
            }

            newTokens[token.symbol] = {
              name: token.name,
              id: token.symbol.toLowerCase(),
              icon: token.icon_url,
              price: currentPrice,
            };
            tokenSelectHtml += `<option value="${token.symbol}">${token.name} (${token.symbol})</option>`;
          }

          TOKENS = newTokens;

          const tokenSelect = document.getElementById("tokenSelect");
          if (tokenSelect) {
            const currentVal = tokenSelect.value;
            tokenSelect.innerHTML = tokenSelectHtml;
            if (newTokens[currentVal]) {
              tokenSelect.value = currentVal;
            }
          }
        } catch (error) {
          console.error("Error fetching tokens:", error);
        }
      }

      async function fetchLivePrices() {

          });

          updatePriceDisplays();

      // Holdings functions

      /**
       * Retrieves the current user's token holdings from the 'crypto_token_histry' table.
       * @returns {Promise<Object>} An object mapping token symbols to their quantities.
       */
      async function getHoldings() {
        try {
          if (!currentUser) return {};

          const { data, error } = await supabase
            .from("crypto_token_histry")
            .select("*")
            .eq("user_id", currentUser.id);

          if (error) throw error;

          let holdings = {};
          data.forEach((record) => {
            holdings[record.symbol] = { qty: parseFloat(record.qty) || 0 };
          });

          return holdings;
        } catch (error) {
          console.error("Error getting holdings:", error);
          return {};
        }
      }

      /**
       * Updates or creates a token balance record in the 'crypto_token_histry' table.
       * @param {string} userId - The UUID of the user.
       * @param {string} symbol - The token symbol (e.g., 'BTC', 'ETH').
       * @param {number} qty - The quantity of tokens involved in the transaction.
       * @param {string} action - The type of transaction ('buy', 'sell', 'add', 'deduct').
       * @returns {Promise<void>}
       */
      async function updateHolding(userId, symbol, qty, action) {
        try {
          // Check if a row already exists for this user and token
          const { data: existingRows, error: fetchError } = await supabase
            .from("crypto_token_histry")
            .select("*")
            .eq("user_id", userId)
            .eq("symbol", symbol);

          if (fetchError) throw fetchError;

          let currentQty = 0;
          let rowId = null;

          if (existingRows && existingRows.length > 0) {
            // Row exists, get current quantity and ID
            currentQty = parseFloat(existingRows[0].qty) || 0;
            rowId = existingRows[0].id;
          }

          // Calculate new quantity based on action
          let newQty = currentQty;
          const amount = parseFloat(qty);
          if (action === "buy" || action === "add") {
            newQty += amount;
          } else if (action === "sell" || action === "deduct") {
            newQty -= amount;
          }

          if (rowId) {
            // Update existing row
            const { error: updateError } = await supabase
              .from("crypto_token_histry")
              .update({
                qty: newQty,
                action: action,
                created_at: new Date().toISOString(),
              })
              .eq("id", rowId);
            if (updateError) throw updateError;
          } else {
            // Create new row
            const { error: insertError } = await supabase
              .from("crypto_token_histry")
              .insert([
                {
                  user_id: userId,
                  symbol: symbol,
                  qty: newQty,
                  action: action,
                  created_at: new Date().toISOString(),
                },
              ]);
            if (insertError) throw insertError;
          }
        } catch (error) {
          console.error("Error updating holding:", error);
        }
      }

      // --- LOAD ORDER BOX (Redesigned) ---
      async function loadOrderBox(silent = false) {
        try {
          // Fetch active trades user is involved in
          const { data: trades, error: tradesError } = await supabase
            .from("user_p2p_order_box")
            .select(`*, order:user_p2p_order(*)`)
            .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)
            .order("created_at", { ascending: false });

          if (tradesError) throw tradesError;

          // Fetch user's own created orders
          const engagedOrderIds = trades.map((t) => t.order_id);
          const { data: myOrders, error: myOrdersError } = await supabase
            .from("user_p2p_order")
            .select("*")
            .eq("user_id", currentUser.id)
            .eq("status", "active")
            .not("id", "in", `(${engagedOrderIds.join(",")})`);

          if (myOrdersError) throw myOrdersError;

          const container = document.getElementById("order-box");
          if (!silent && container.innerHTML.includes("Loading"))
            container.innerHTML = "";
          if (trades.length === 0 && myOrders.length === 0) {
            container.innerHTML = `
                             <div class="text-center py-12 bg-white rounded-3xl border border-dashed border-slate-300">
                                 <i class="fas fa-box-open text-4xl text-slate-200 mb-3"></i>
                                 <h3 class="text-slate-500 font-bold">No Active Orders</h3>
                                 <p class="text-xs text-slate-400">Your trades will appear here.</p>
                             </div>
                         `;
            return;
          }

          let combinedHtml = "";

          // Render trades
          combinedHtml += await Promise.all(
            trades.map(async (trade) => {
              const isOwner = trade.order.user_id === currentUser.id;
              const isSeller = trade.seller_id === currentUser.id;
              const otherUser = isSeller ? "Buyer" : "Seller";
              const otherUserId = isSeller ? trade.buyer_id : trade.seller_id;
              const isTradeFinished =
                trade.status === "completed" ||
                trade.status === "cancelled" ||
                trade.status === "rejected";

              // Dynamic Status Color
              let statusColor = "text-amber-500 bg-amber-50";
              if (trade.status === "completed")
                statusColor = "text-emerald-500 bg-emerald-50";
              if (trade.status === "cancelled" || trade.status === "rejected")
                statusColor = "text-rose-500 bg-rose-50";
              if (trade.status === "payment_done")
                statusColor = "text-blue-500 bg-blue-50";

              return `
                             <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 relative mb-4">

      function updateOrderType() {
        const orderType = document.getElementById("orderType").value;
        const availableQuantity = document.getElementById("availableQuantity");
        const paymentDetails = document.getElementById("paymentDetails");

        if (orderType === "sell") {
          availableQuantity.classList.remove("hidden");
          paymentDetails.classList.remove("hidden");
          updateAvailableQuantity();
        } else {
          availableQuantity.classList.add("hidden");
          paymentDetails.classList.add("hidden");
        }
      }

      async function updateAvailableQuantity() {
        const tokenSelect = document.getElementById("tokenSelect");
        const availableQty = document.getElementById("availableQty");
        const selectedToken = tokenSelect.value;

        try {
          const holdings = await getHoldings();
          const holding = holdings[selectedToken];
          const qty = holding ? holding.qty : 0;
          availableQty.textContent = qty.toFixed(8);
        } catch (error) {
          availableQty.textContent = "0";
        }
      }

      function updateTokenPrice() {
        const tokenSelect = document.getElementById("tokenSelect");
        const livePrice = document.getElementById("livePrice");
        const selectedToken = tokenSelect.value;

        if (livePrices[selectedToken]) {
          livePrice.textContent = `₹${livePrices[selectedToken].toLocaleString("en-IN")}`;
        } else {
          livePrice.textContent = "Loading...";
        }
        if (document.getElementById("orderType").value === "sell") {
          updateAvailableQuantity();
        }
      }

      function calculateAmount() {
        const quantity =
          parseFloat(document.getElementById("quantity").value) || 0;
        const tokenSelect = document.getElementById("tokenSelect");
        const selectedToken = tokenSelect.value;
        const price = livePrices[selectedToken] || 0;
        const amount = quantity * price;
        document.getElementById("amount").value = Math.round(amount);
      }

      function calculateQuantity() {
        const amount = parseFloat(document.getElementById("amount").value) || 0;
        const tokenSelect = document.getElementById("tokenSelect");
        const selectedToken = tokenSelect.value;
        const price = livePrices[selectedToken] || 0;
        if (price > 0) {
          const quantity = amount / price;
          document.getElementById("quantity").value = quantity.toFixed(8);
        }
      }

      function togglePaymentMethod(method) {
        const checkbox = document.getElementById(method);
        const container = checkbox.closest(".payment-option");
        checkbox.checked = !checkbox.checked;

        if (checkbox.checked) {
          container.classList.add("bg-blue-50", "border-blue-200");
        } else {
          container.classList.remove("bg-blue-50", "border-blue-200");
        }

        const orderType = document.getElementById("orderType").value;
        if (orderType === "sell") {
          const hasPaymentMethods =
            document.querySelectorAll(".payment-option input:checked").length >
            0;
          if (hasPaymentMethods) {
            document
              .getElementById("paymentDetails")
              .classList.remove("hidden");
          } else {
            document.getElementById("paymentDetails").classList.add("hidden");
          }
        }
      }

      async function generateOrderId() {
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let result = "";
        for (let i = 0; i < 8; i++) {
          result += characters.charAt(
            Math.floor(Math.random() * characters.length),
          );
        }
        const { data, error } = await supabase
          .from("p2p_order_id")
          .select("id")
          .eq("id", result)
          .maybeSingle();
        if (data) return generateOrderId();
        return result;
      }

      // Form Submission Logic (Identical)
      document
        .getElementById("createOrderForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const orderType = document.getElementById("orderType").value;
          const tokenSymbol = document.getElementById("tokenSelect").value;
          const quantity = parseFloat(
            document.getElementById("quantity").value,
          );
          const amount = parseFloat(document.getElementById("amount").value);

          if (!quantity || quantity <= 0) {
            showToast("Please enter a valid quantity", "error");
            return;
          }
          if (!amount || amount < 100 || amount > 10000) {
            showToast("Amount must be between ₹100 and ₹10,000", "error");
            return;
          }

          const selectedPaymentMethods = Array.from(
            document.querySelectorAll(".payment-option input:checked"),
          ).map((input) => input.value);
          if (selectedPaymentMethods.length === 0) {
            showToast("Please select at least one payment method", "error");
            return;
          }

          if (orderType === "sell") {
            const holdings = await getHoldings();
            const holding = holdings[tokenSymbol];
            const availableQty = holding ? holding.qty : 0;
            if (quantity > availableQty) {
              showToast("Insufficient token balance", "error");
              return;
            }

            const phoneNumber = document.getElementById("phoneNumber").value;
            const upiId = document.getElementById("upiId").value;
            const needsPhone = selectedPaymentMethods.some((method) =>
              ["phonepe", "googlepay", "paytm"].includes(method),
            );
            const needsUpi = selectedPaymentMethods.includes("upi");
            if (needsPhone && !phoneNumber) {
              showToast("Please enter phone number", "error");
              return;
            }
            if (needsUpi && !upiId) {
              showToast("Please enter UPI ID", "error");
              return;
            }
          }

          try {
            const orderIdUnique = await generateOrderId();
            const { error: idError } = await supabase
              .from("p2p_order_id")
              .insert([
                {
                  id: orderIdUnique,
                  user_id: currentUser.id,
                  token_symbol: tokenSymbol,
                  quantity: quantity,
                  amount: amount,
                  status: "active",
                },
              ]);
            if (idError) throw idError;

            const { data, error } = await supabase
              .from("user_p2p_order")
              .insert([
                {
                  user_id: currentUser.id,
                  username: currentUser.user_metadata?.username || "Anonymous",
                  order_id_unique: orderIdUnique,
                  order_type: orderType,
                  token_symbol: tokenSymbol,
                  quantity: quantity,
                  amount: amount,
                  payment_methods: selectedPaymentMethods.join(","),
                  payment_details:
                    orderType === "sell"
                      ? JSON.stringify({
                          phone: document.getElementById("phoneNumber").value,
                          upi: document.getElementById("upiId").value,
                        })
                      : null,
                  status: "active",
                  created_at: new Date().toISOString(),
                },
              ])
              .select()
              .single();

            if (error) throw error;

            // Deduct tokens if it's a sell order
            if (orderType === "sell") {
              await updateHolding(
                currentUser.id,
                tokenSymbol,
                quantity,
                "sell",
              );
            }

            showToast("Order created successfully!", "success");
            closeCreateOrderModal();
            loadAllData();
          } catch (error) {
            console.error("Create order error:", error);
            showToast("Failed to create order", "error");
          }
        });

      // Trade Request Functions (Identical Logic)
      async function requestSellToOrder(orderId) {
        try {
          const { data: order, error: orderError } = await supabase
            .from("user_p2p_order")
            .select("*")
            .eq("id", orderId)
            .single();
          if (orderError) throw orderError;
          if (order.status !== "active") {
            showToast("Order unavailable.", "error");
            loadAllData();
            return;
          }

          const holdings = await getHoldings();
          const holding = holdings[order.token_symbol];
          const availableQty = holding ? holding.qty : 0;
          if (availableQty < order.quantity) {
            showToast("Insufficient balance", "error");
            return;
          }

          await supabase
            .from("user_p2p_order")
            .update({ status: "pending" })
            .eq("id", orderId);

          const { data, error } = await supabase
            .from("user_p2p_order_box")
            .insert([
              {
                order_id: orderId,
                buyer_id: order.user_id,
                buyer_username: order.username,
                seller_id: currentUser.id,
                seller_username:
                  currentUser.user_metadata?.username || "Anonymous",
                status: "pending",
                created_at: new Date().toISOString(),
              },
            ])
            .select()
            .single();

          if (error) throw error;

          // Deduct tokens from seller
          await updateHolding(
            currentUser.id,
            order.token_symbol,
            order.quantity,
            "sell",
          );
          await sendAIMessage(
            data.id,
            `${data.seller_username} wants to sell ${order.token_symbol} tokens to you. Type "accept" to proceed or "reject" to decline.`,
            "buyer",
          );
          showToast("Sell request sent!", "success");
          loadAllData();
        } catch (error) {
          showToast("Failed to send request", "error");
        }
      }

      // Process User Message Logic (Identical)
      async function processUserMessage(tradeId, message) {
        try {
          const { data: trade, error: tradeError } = await supabase
            .from("user_p2p_order_box")
            .select(`*, order:user_p2p_order(*)`)
            .eq("id", tradeId)
            .single();
          if (tradeError) throw tradeError;
          const isOrderCreator = trade.order.user_id === currentUser.id;
          const isBuyer = trade.buyer_id === currentUser.id;

          if (trade.status === "pending") {
            if (isOrderCreator && message.includes("accept")) {
              await supabase
                .from("user_p2p_order_box")
                .update({ status: "accepted" })
                .eq("id", tradeId);
              await supabase
                .from("user_p2p_order")
                .update({ status: "trading" })
                .eq("id", trade.order_id);
              if (trade.order.order_type === "sell") {
                await sendAIMessage(
                  tradeId,
                  `Trade accepted! Buyer, pay ₹${trade.order.amount.toLocaleString("en-IN")}. Share screenshot/UTR.`,
                  "buyer",
                );
              } else {
                const pm = trade.order.payment_methods.split(",");
                await sendAIMessage(
                  tradeId,
                  `Trade accepted! Share payment details for ${pm.join(", ")} and your QR/Screenshot.`,
                  "seller",
                );
              }
            } else if (message.includes("reject")) {
              await supabase
                .from("user_p2p_order_box")
                .update({ status: "rejected" })
                .eq("id", tradeId);
              await supabase
                .from("user_p2p_order")
                .update({ status: "active" })
                .eq("id", trade.order_id);

              // Return tokens to seller if order was a buy order (seller initiated trade)
              if (trade.order.order_type === "buy") {
                await updateHolding(
                  trade.seller_id,
                  trade.order.token_symbol,
                  trade.order.quantity,
                  "buy",
                );
              }

              await sendAIMessage(
                tradeId,
                "Trade rejected. Order is active again.",
                "both",
              );
            }
          }

          if (
            trade.status === "accepted" &&
            !isBuyer &&
            (message.includes("image") ||
              message.includes("phone") ||
              message.includes("upi"))
          ) {
            await sendAIMessage(
              tradeId,
              "Payment details received! Buyer, please pay ₹" +
                trade.order.amount.toLocaleString("en-IN") +
                " and share proof.",
              "buyer",
            );
          }
          if (
            trade.status === "accepted" &&
            isBuyer &&
            (message.includes("paid") ||
              message.includes("transaction") ||
              message.includes("utr") ||
              message.includes("image"))
          ) {
            await supabase
              .from("user_p2p_order_box")
              .update({ status: "payment_done" })
              .eq("id", tradeId);
            await sendAIMessage(
              tradeId,
              'Proof received! Seller, verify payment and click "Release Tokens".',
              "seller",
            );
          }
        } catch (error) {
          console.error(error);
        }
      }

      function startTimer(tradeId, seconds, timerType) {
        const timerId = `${tradeId}_${timerType}`;
        if (timers[timerId]) clearInterval(timers[timerId]);
        let timeLeft = seconds;
        const updateTimer = () => {
          if (timeLeft <= 0) {
            clearInterval(timers[timerId]);
            delete timers[timerId];
            handleTimerExpiry(tradeId, timerType);
            return;
          }
          const display = document.getElementById("timerDisplay");
          const text = document.getElementById("timerText");
          if (display && text) {
            display.classList.remove("hidden");
            text.textContent = `${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, "0")}`;
          }
          timeLeft--;
        };
        updateTimer();
        timers[timerId] = setInterval(updateTimer, 1000);
      }

      async function handleTimerExpiry(tradeId, timerType) {
        const d = document.getElementById("timerDisplay");
        if (d) d.classList.add("hidden");
      }

      /**
       * Completes a trade by releasing tokens from the seller to the buyer.
       * Updates the status of the trade box, the original order, and the order ID to 'completed'.
       * Updates P&P stats for both users.
       * Records the transaction in 'user_p2p_history' for both users.
       * Updates token balances in 'crypto_token_histry' for both users.
       * Sends an automated AI message to the chat confirming the release.
       * @param {string} tradeId - The UUID of the trade in 'user_p2p_order_box'.
       * @returns {Promise<void>}
       */
      async function releaseTokens(tradeId) {
        try {
          const { data: trade, error: tradeError } = await supabase
            .from("user_p2p_order_box")
            .select(`*, order:user_p2p_order(*)`)
            .eq("id", tradeId)
            .single();
          if (tradeError) throw tradeError;

          await supabase
            .from("user_p2p_order_box")
            .update({ status: "completed" })
            .eq("id", tradeId);
          await supabase
            .from("user_p2p_order")
            .update({ status: "completed" })
            .eq("id", trade.order.id);
          await supabase
            .from("p2p_order_id")
            .update({ status: "completed" })
            .eq("id", trade.order.order_id_unique);

          await Promise.all([
            updatePnPStats(trade.buyer_id, "completed"),
            updatePnPStats(trade.seller_id, "completed"),
          ]);

          // Update token history for buyer and seller
          await updateHolding(
            trade.buyer_id,
            trade.order.token_symbol,
            trade.order.quantity,
            "buy",
          ); // Buyer gets tokens

          // Note: Seller tokens were already deducted when the order was created or the trade was initiated.

          await Promise.all([
            supabase.from("user_p2p_history").insert([
              {
                user_id: trade.buyer_id,
                action: "buy",
                token_symbol: trade.order.token_symbol,
                quantity: trade.order.quantity,
                amount: trade.order.amount,
                status: "completed",
                other_user_id: trade.seller_id,
                created_at: new Date().toISOString(),
              },
            ]),
            supabase.from("user_p2p_history").insert([
              {
                user_id: trade.seller_id,
                action: "sell",
                token_symbol: trade.order.token_symbol,
                quantity: trade.order.quantity,
                amount: trade.order.amount,
                status: "completed",
                other_user_id: trade.buyer_id,
                created_at: new Date().toISOString(),
              },
            ]),
          ]);

          await sendAIMessage(
            tradeId,
            "Tokens released! Trade completed.",
            "both",
          );
          showToast("Tokens released successfully!", "success");
          loadAllData();
          closeChatModal();
        } catch (error) {
          showToast("Failed to release tokens", "error");
        }
      }

      async function cancelTrade(tradeId) {
        try {
          const { data: trade, error: tradeError } = await supabase
            .from("user_p2p_order_box")
            .select("*, order:user_p2p_order(*)")
            .eq("id", tradeId)
            .single();
          if (tradeError) throw tradeError;

          await supabase
            .from("user_p2p_order_box")
            .update({ status: "cancelled" })
            .eq("id", tradeId);
          await supabase
            .from("user_p2p_order")
            .update({ status: "active" })
            .eq("id", trade.order_id);

          await Promise.all([
            updatePnPStats(trade.buyer_id, "uncompleted"),
            updatePnPStats(trade.seller_id, "uncompleted"),
          ]);

          // Return tokens to seller if order was a buy order (seller initiated trade)
          if (trade.order.order_type === "buy") {
            await updateHolding(
              trade.seller_id,
              trade.order.token_symbol,
              trade.order.quantity,
              "buy",
            );
          }

          await Promise.all([
            supabase.from("user_p2p_history").insert([
              {
                user_id: trade.buyer_id,
                action: "buy",
                token_symbol: trade.order.token_symbol,
                quantity: trade.order.quantity,
                amount: trade.order.amount,
                status: "cancelled",
                other_user_id: trade.seller_id,
                created_at: new Date().toISOString(),
              },
            ]),
            supabase.from("user_p2p_history").insert([
              {
                user_id: trade.seller_id,
                action: "sell",
                token_symbol: trade.order.token_symbol,
                quantity: trade.order.quantity,
                amount: trade.order.amount,
                status: "cancelled",
                other_user_id: trade.buyer_id,
                created_at: new Date().toISOString(),
              },
            ]),
          ]);

          await sendAIMessage(tradeId, "Trade cancelled.", "both");
          showToast("Trade cancelled", "success");
          loadAllData();
        } catch (error) {
          showToast("Failed to cancel", "error");
        }
      }

      async function cancelOrder(orderId) {
        try {
          const { data: order, error } = await supabase
            .from("user_p2p_order")
            .select("*")
            .eq("id", orderId)
            .single();
          if (error || !order) throw error;

          await supabase
            .from("user_p2p_order")
            .update({ status: "cancelled" })
            .eq("id", orderId);
          await supabase
            .from("p2p_order_id")
            .update({ status: "cancelled" })
            .eq("id", order.order_id_unique);
          await updatePnPStats(currentUser.id, "uncompleted");

          await supabase.from("user_p2p_history").insert([
            {
              user_id: currentUser.id,
              action: order.order_type,
              token_symbol: order.token_symbol,
              quantity: order.quantity,
              amount: order.amount,
              status: "cancelled",
              other_user_id: null,
              created_at: new Date().toISOString(),
            },
          ]);

          // Return tokens if it was a sell order
          if (order.order_type === "sell") {
            await updateHolding(
              currentUser.id,
              order.token_symbol,
              order.quantity,
              "buy",
            );
          }

          showToast("Order cancelled", "success");
          loadAllData();
        } catch (error) {
          showToast("Failed to cancel order", "error");
        }
      }

      function setupRealtimeSubscriptions() {
        supabase
          .channel("p2p_public_changes")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "user_p2p_order" },
            () => {
              loadAllData();
            },
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "user_p2p_order_box" },
            () => {
              loadAllData();
            },
          )
          .on(
            "postgres_changes",
            {
              event: "UPDATE",
              schema: "public",
              table: "user-p&p",
              filter: `user_id=eq.${currentUser?.id}`,
            },
            (payload) => {
              if (
                !document.getElementById("pnp-tab").classList.contains("hidden")
              )
                loadPnPData();
            },
          )
          .subscribe();
      }

      function setupChatRealtimeSubscription(tradeId) {
        if (activeChats[tradeId]) supabase.removeChannel(activeChats[tradeId]);
        const chatChannel = supabase
          .channel(`trade_chat_${tradeId}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "trade_chat",
              filter: `trade_id=eq.${tradeId}`,
            },
            () => {
              loadChatMessages(tradeId);
            },
          )
          .subscribe();
        activeChats[tradeId] = chatChannel;
      }

      /**
       * Displays a premium toast notification with progress bar and animations.
       * @param {string} message - The message to display.
       * @param {string} type - The type of toast ('success', 'error', 'warning', 'info').
       * @param {number} duration - Duration in milliseconds before the toast disappears.
       */
      function showToast(message, type = "success", duration = 4000) {
        const container = document.getElementById("toastContainer");
        if (!container) return;

        const toast = document.createElement("div");
        toast.className = "toast-premium " + type;

        let icon = "info-circle";
        let iconColor = "text-blue-500";
        if (type === "success") {
          icon = "check-circle";
          iconColor = "text-emerald-500";
        }
        if (type === "error") {
          icon = "exclamation-circle";
          iconColor = "text-rose-500";
        }
        if (type === "warning") {
          icon = "exclamation-triangle";
          iconColor = "text-amber-500";
        }

        toast.innerHTML =
          '<div class="text-2xl ' +
          iconColor +
          '"><i class="fas fa-' +
          icon +
          '"></i></div>' +
          '<div class="flex-1">' +
          '<div class="font-bold text-sm text-slate-800 capitalize">' +
          type +
          "</div>" +
          '<div class="text-sm text-slate-600">' +
          message +
          "</div>" +
          "</div>" +
          '<button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 transition-colors">' +
          '<i class="fas fa-times"></i>' +
          "</button>" +
          '<div class="toast-progress">' +
          '<div class="toast-progress-bar" style="transition-duration: ' +
          duration +
          'ms;"></div>' +
          "</div>";

        container.appendChild(toast);

        // Animate progress bar
        setTimeout(() => {
          const progressBar = toast.querySelector(".toast-progress-bar");
          if (progressBar) progressBar.style.width = "0%";
        }, 50);

        // Remove toast after duration
        setTimeout(() => {
          toast.style.animation = "fadeOut 0.3s forwards";
          setTimeout(() => {
            if (toast.parentElement) toast.remove();
          }, 300);
        }, duration);
      }

      document
        .getElementById("chatInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") sendMessage();
        });

      window.addEventListener("beforeunload", function () {
        if (priceInterval) clearInterval(priceInterval);
        Object.values(timers).forEach((timer) => clearInterval(timer));
        supabase.removeAllChannels();
      });

      async function getUID(userId) {
        try {
          const { data, error } = await supabase
            .from("uid")
            .select("uid")
            .eq("user_id", userId)
            .maybeSingle();
          if (error || !data) return "Unavailable";
          return data.uid;
        } catch (e) {
          return "Unavailable";
        }
      }

      async function initializePnPProfile() {
        try {
          const { data } = await supabase
            .from("user-p&p")
            .select("user_id")
            .eq("user_id", currentUser.id)
            .maybeSingle();
          if (!data) {
            await supabase
              .from("user-p&p")
              .insert([{ user_id: currentUser.id }]);
          }
        } catch (e) {
          console.error("Error initializing PnP profile:", e);
        }
      }

      async function loadPnPData() {
        const uid = await getUID(currentUser.id);
        document.getElementById("pnp-uid").textContent = uid;
        const { data } = await supabase
          .from("user-p&p")
          .select("*")
          .eq("user_id", currentUser.id)
          .maybeSingle();
        if (data) {
          document.getElementById("userRole").value = data.role;
          document.getElementById("pnp-completed-orders").textContent =
            data.completed_orders;
          document.getElementById("pnp-uncompleted-orders").textContent =
            data.uncompleted_orders;
        }
      }

      async function updateUserRole() {
        const newRole = document.getElementById("userRole").value;
        const { data } = await supabase
          .from("user-p&p")
          .select("role_last_updated")
          .eq("user_id", currentUser.id)
          .maybeSingle();
        if (data && data.role_last_updated) {
          const lastUpdated = new Date(data.role_last_updated);
          const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
          if (lastUpdated > twentyFourHoursAgo) {
            showToast("Role change available in 24h", "error");
            loadPnPData();
            return;
          }
        }
        const { error: updateError } = await supabase
          .from("user-p&p")
          .update({
            role: newRole,
            role_last_updated: new Date().toISOString(),
          })
          .eq("user_id", currentUser.id);
        if (updateError) showToast("Failed to update role", "error");
        else showToast("Role updated successfully", "success");
      }

      async function openPnPModal(userId, uidOnly = false) {
        const modal = document.getElementById("pnpModal");
        const modalBody = document.getElementById("pnpModalBody");
        modal.classList.remove("hidden");
        modalBody.innerHTML = `<div class="text-center py-6 text-slate-400"><i class="fas fa-circle-notch fa-spin"></i> Loading...</div>`;

        const uid = await getUID(userId);
        if (uidOnly) {
          modalBody.innerHTML = `
                         <div class="mb-4">
                             <label class="text-xs font-bold text-slate-400 uppercase">User's UID</label>
                             <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mt-1 font-mono text-center font-bold">${uid}</div>
                         </div>
                     `;
          return;
        }

        const { data, error } = await supabase
          .from("user-p&p")
          .select("*")
          .eq("user_id", userId)
          .maybeSingle();
        if (error || !data) {
          modalBody.innerHTML = `<div class="text-center py-6">Profile not found</div>`;
          return;
        }

        modalBody.innerHTML = `
                     <div class="mb-4">
                         <label class="text-xs font-bold text-slate-400 uppercase">User's UID</label>
                         <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 mt-1 font-mono text-center font-bold">${uid}</div>
                     </div>
                      <div class="mb-6">
                         <label class="text-xs font-bold text-slate-400 uppercase">Role</label>
                         <div class="text-lg font-bold capitalize text-center text-slate-700">${data.role}</div>
                     </div>
                     <div class="grid grid-cols-2 gap-4">
                         <div class="bg-emerald-500 rounded-2xl p-3 text-white text-center">
                             <div class="text-[10px] uppercase font-bold opacity-80">Completed</div>
                             <div class="text-2xl font-black">${data.completed_orders}</div>
                         </div>
                         <div class="bg-rose-500 rounded-2xl p-3 text-white text-center">
                             <div class="text-[10px] uppercase font-bold opacity-80">Incomplete</div>
                             <div class="text-2xl font-black">${data.uncompleted_orders}</div>
                         </div>
                     </div>
                 `;
      }

      function closePnPModal() {
        document.getElementById("pnpModal").classList.add("hidden");
      }
      async function updatePnPStats(userId, type) {
        const { data, error } = await supabase.rpc("update_pnp_stats", {
          p_user_id: userId,
          p_type: type,
        });
        if (error) console.error("Error updating PnP stats:", error);
      }
    </script>
  </body>
