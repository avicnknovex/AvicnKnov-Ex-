<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0533 0%, #0f0020 50%, #000000 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(124, 58, 237, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .back-btn, .add-order-btn {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .back-btn:hover, .add-order-btn:hover {
            background: #6d28d9;
            transform: scale(1.05);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: #7c3aed;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #7c3aed;
            transition: all 0.3s;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-symbol {
            font-size: 18px;
            font-weight: bold;
            color: #7c3aed;
        }

        .order-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .buy-type {
            background: #f5f3ff;
            color: #7c3aed;
        }

        .sell-type {
            background: #ffe8e8;
            color: #f44336;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .price-display {
            color: #7c3aed;
        }

        .payment-methods {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .payment-method {
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 12px;
            color: #666;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 100px;
        }

        .buy-btn {
            background: #7c3aed;
            color: white;
        }

        .sell-btn {
            background: #f44336;
            color: white;
        }

        .cancel-btn {
            background: #ff9800;
            color: white;
        }

        .report-btn {
            background: #e7c200;
            color: white;
        }

        .chat-btn {
            background: #2196F3;
            color: white;
        }

        .release-btn {
            background: #9c27b0;
            color: white;
        }

        .reject-btn {
            background: #795548;
            color: white;
        }

        .pnp-btn {
            background: #673AB7;
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-option:hover {
            border-color: #7c3aed;
            background: #f5f3ff;
        }

        .payment-option.selected {
            border-color: #7c3aed;
            background: #ede9fe;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        /* Chat Modal */
        .chat-container {
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .ai-sender {
            color: #7c3aed;
        }

        .message-content {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid #7c3aed;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .ai-message .message-content {
            border-left-color: #2196F3;
            background: #e3f2fd;
        }

        .chat-image {
            max-width: 200px;
            border-radius: 8px;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .send-btn, .image-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .send-btn {
            background: #7c3aed;
            color: white;
        }

        .image-btn {
            background: #2196F3;
            color: white;
        }

        .timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff9800;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1001;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1002;
            transform: translateX(100%);
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: #7c3aed;
        }

        .toast.error {
            background: #f44336;
        }

        .live-price {
            color: #7c3aed;
            font-weight: bold;
            font-size: 18px;
        }

        #pnp-tab .pnp-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        #pnp-tab .uid-display {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        #pnp-tab .role-selector {
            margin-bottom: 30px;
        }

        #pnp-tab .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        #pnp-tab .stat-box {
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .stat-box {
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .stat-box h4 {
            font-size: 16px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-box p {
            font-size: 32px;
            font-weight: bold;
        }

        .green-box { background: linear-gradient(135deg, #7c3aed, #a78bfa); }
        .red-box { background: linear-gradient(135deg, #f44336, #E57373); }

        /* Token Icon Styles */
        .token-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(124, 58, 237, 0.3);
        }

        .token-icon img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .token-icon-text {
            font-size: 10px;
            font-weight: 700;
            color: white;
            text-align: center;
            line-height: 1;
        }

        .available-qty-box {
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 16px;
            font-weight: 600;
            color: #7c3aed;
        }

        .uid-display {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c4b5fd;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }

        /* SVG icon in buttons */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">&#8592; Back to Trade</button>
            <h1 style="color: white; font-size: 24px;">P2P Trading Platform</h1>
            <button class="add-order-btn" onclick="openCreateOrderModal()">+ Create Order</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('buy')">Buy Orders</button>
            <button class="tab" onclick="switchTab('sell')">Sell Orders</button>
            <button class="tab" onclick="switchTab('orderbox')">Order Box</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('pnp')">P&amp;P</button>
        </div>

        <div id="buy-tab" class="tab-content active">
            <div id="buy-orders">
                <div class="loading">Loading buy orders...</div>
            </div>
        </div>

        <div id="sell-tab" class="tab-content">
            <div id="sell-orders">
                <div class="loading">Loading sell orders...</div>
            </div>
        </div>

        <div id="orderbox-tab" class="tab-content">
            <div id="order-box">
                <div class="loading">Loading your active orders...</div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div id="history-orders">
                <div class="loading">Loading history...</div>
            </div>
        </div>

        <div id="pnp-tab" class="tab-content">
            <div class="pnp-container">
                <div class="form-group">
                    <label class="form-label">Your Unique ID (UID)</label>
                    <div id="pnp-uid" class="uid-display">Loading...</div>
                </div>
                <div class="form-group role-selector">
                    <label class="form-label">Select Your Role</label>
                    <select id="userRole" class="form-select" onchange="updateUserRole()">
                        <option value="both">Both (Buyer &amp; Seller)</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p id="pnp-completed-orders">-</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p id="pnp-uncompleted-orders">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Order Modal -->
    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create New Order</h2>
                <button class="close-btn" onclick="closeCreateOrderModal()">&times;</button>
            </div>

            <form id="createOrderForm">
                <div class="form-group">
                    <label class="form-label">Order Type</label>
                    <select id="orderType" class="form-select" onchange="updateOrderType()">
                        <option value="buy">Buy Order</option>
                        <option value="sell">Sell Order</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Select Token</label>
                    <select id="tokenSelect" class="form-select" onchange="updateTokenPrice()">
                        <option value="">Loading tokens...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Live Price</label>
                    <div id="livePrice" class="live-price">Loading...</div>
                </div>

                <div id="availableQuantity" class="form-group" style="display: none;">
                    <label class="form-label">Available Quantity</label>
                    <div id="availableQty" class="available-qty-box">0</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="quantity" class="form-input" step="0.00000001" min="0" onchange="calculateAmount()">
                </div>

                <div class="form-group">
                    <label class="form-label">Amount (&#8377;)</label>
                    <input type="number" id="amount" class="form-input" min="100" max="10000" onchange="calculateQuantity()">
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Methods</label>
                    <div class="payment-options">
                        <div class="payment-option" onclick="togglePaymentMethod('phonepe')">
                            <input type="checkbox" id="phonepe" value="phonepe">
                            <label for="phonepe">PhonePe</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('googlepay')">
                            <input type="checkbox" id="googlepay" value="googlepay">
                            <label for="googlepay">Google Pay</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('paytm')">
                            <input type="checkbox" id="paytm" value="paytm">
                            <label for="paytm">Paytm</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('upi')">
                            <input type="checkbox" id="upi" value="upi">
                            <label for="upi">UPI</label>
                        </div>
                    </div>
                </div>

                <div id="paymentDetails" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Phone Number (for PhonePe / Paytm / Google Pay)</label>
                        <input type="tel" id="phoneNumber" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">UPI ID</label>
                        <input type="text" id="upiId" class="form-input">
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Order</button>
            </form>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Trade Chat</h2>
                <button class="close-btn" onclick="closeChatModal()">&times;</button>
            </div>

            <div class="chat-container">
                <div id="chatMessages" class="chat-messages">
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type your message...">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage()">
                    <button class="image-btn" onclick="document.getElementById('imageInput').click()">
                        <span class="btn-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                        </span>
                    </button>
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <div id="tradeActions" style="margin-top: 15px; display: none;">
            </div>
        </div>
    </div>

    <!-- PnP Modal -->
    <div id="pnpModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">User P&amp;P Profile</h2>
                <button class="close-btn" onclick="closePnPModal()">&times;</button>
            </div>
            <div id="pnpModalBody">
                <div class="loading">Loading user profile...</div>
            </div>
        </div>
    </div>

    <div id="timerDisplay" class="timer-display" style="display: none;">
        <span id="timerText"></span>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Configuration
        var SUPA_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';

        // Initialize Supabase
        var supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        // Global variables
        let currentUser = null;
        let livePrices = {};
        let currentTradeOrder = null;
        let priceInterval = null;
        let timers = {};
        let activeChats = {};

        // ============================================================
        // NEW: availableTokens loaded from crypto_token_control table
        // ============================================================
        let availableTokens = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            await loadTokensFromDB();   // Load tokens from crypto_token_control
            await loadAllData();
            startPriceUpdates();
            setupRealtimeSubscriptions();
        });

        // Auth functions
        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                showToast('Please login to access P2P trading', 'error');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }
            currentUser = user;
            await initializePnPProfile();
        }

        // Navigation
        function goBack() {
            window.location.href = 'trade.html';
        }

        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            switch(tabName) {
                case 'buy':
                    loadBuyOrders();
                    break;
                case 'sell':
                    loadSellOrders();
                    break;
                case 'orderbox':

                    break;
                case 'history':

                    break;
                case 'pnp':

        }

        // ============================================================
        // TOKEN LOADING — crypto_token_control TABLE
        // Loads all tokens from DB. Filters out tokens whose
        // nosupported_js column contains 'p2p.html'.
        // Populates the token dropdown for order creation.
        // Provides token name, full_name, icon data, and price info.
        // ============================================================
        async function loadTokensFromDB() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;

                // Filter: exclude tokens with 'p2p.html' in nosupported_js
                availableTokens = (data || []).filter(token => {
                    const ns = (token.nosupported_js || '').toLowerCase();
                    return !ns.includes('p2p.html');
                });

                // Initialize prices from DB manual_price
                availableTokens.forEach(token => {
                    if (!livePrices[token.symbol]) {
                        livePrices[token.symbol] = Number(token.manual_price || 0);
                    }
                });

                // Populate the dropdown
                populateTokenDropdown();

            } catch (error) {
                console.error('Error loading tokens from crypto_token_control:', error);
                availableTokens = [];
            }
        }

        // Populate the token <select> dropdown
        function populateTokenDropdown() {
            const tokenSelect = document.getElementById('tokenSelect');
            if (!tokenSelect) return;

            if (availableTokens.length === 0) {
                tokenSelect.innerHTML = '<option value="">No tokens available</option>';
                return;
            }

            tokenSelect.innerHTML = availableTokens.map(token => {
                const displayName = token.full_name
                    ? `${token.full_name} (${token.symbol})`
                    : `${token.name || token.symbol} (${token.symbol})`;
                return `<option value="${token.symbol}">${displayName}</option>`;
            }).join('');

            // Trigger price update for the first token
            updateTokenPrice();
        }

        // Find token data by symbol
        function getTokenData(symbol) {
            return availableTokens.find(t => t.symbol === symbol) || null;
        }

        // Render token icon based on icon_type from crypto_token_control
        // icon_type: 'emoji' | 'image' | 'text' | null
        function renderTokenIcon(token) {
            if (!token) {
                return `<div class="token-icon"><span class="token-icon-text">?</span></div>`;
            }
            if (token.icon_type === 'image' && token.icon_url) {
                return `<div class="token-icon">
                    <img src="${token.icon_url}" alt="${token.symbol}"
                         onerror="this.parentElement.innerHTML='<span class=\\'token-icon-text\\'>${(token.symbol||'').substring(0,3)}</span>'">
                </div>`;
            } else if (token.icon_type === 'emoji' && token.icon_url) {
                return `<div class="token-icon" style="background:transparent;border-color:transparent;">
                    <span style="font-size:24px;line-height:1;">${token.icon_url}</span>
                </div>`;
            } else if (token.icon_type === 'text' && token.icon_url) {
                return `<div class="token-icon"><span class="token-icon-text">${token.icon_url}</span></div>`;
            } else {
                // Default: abbreviation badge
                return `<div class="token-icon">
                    <span class="token-icon-text">${(token.symbol || '??').substring(0, 3)}</span>
                </div>`;
            }
        }

        // ============================================================
        // PRICE SYSTEM — Driven by crypto_token_control
        // If is_live_api=true and api_url is set: fetch live from API
        // Otherwise: simulate small fluctuation around manual_price
        // Updates every 2 seconds silently in the background
        // ============================================================
        async function fetchLivePrices() {
            if (!availableTokens || availableTokens.length === 0) return;

            const apiTokens = availableTokens.filter(t => t.is_live_api && t.api_url);
            const manualTokens = availableTokens.filter(t => !t.is_live_api);

            // Live API tokens
            for (const token of apiTokens) {
                try {
                    const res = await fetch(token.api_url);
                    const json = await res.json();
                    const key = Object.keys(json)[0];
                    if (key && json[key] && json[key].inr) {
                        livePrices[token.symbol] = Number(json[key].inr);
                    }
                } catch (e) {
                    // Silent fail — keep existing price
                }
            }

            // Manual price simulation (small fluctuation so it looks live)
            manualTokens.forEach(token => {
                const basePrice = Number(token.manual_price || 0);
                if (basePrice <= 0) return;
                const minPrice = Number(token.manual_min_price || basePrice * 0.9);
                const maxPrice = Number(token.manual_max_price || basePrice * 1.1);
                const current = livePrices[token.symbol] || basePrice;
                const volatility = current * 0.002;
                const change = (Math.random() - 0.5) * volatility;
                let newPrice = current + change;
                if (newPrice < minPrice) newPrice = minPrice + volatility;
                if (newPrice > maxPrice) newPrice = maxPrice - volatility;
                livePrices[token.symbol] = newPrice;
            });

            updatePriceDisplays();
        }

        function updatePriceDisplays() {
            const priceDisplay = document.getElementById('livePrice');
            const tokenSelect = document.getElementById('tokenSelect');
            if (priceDisplay && tokenSelect) {
                const selectedToken = tokenSelect.value;
                if (selectedToken && livePrices[selectedToken]) {
                    priceDisplay.textContent = `\u20B9${livePrices[selectedToken].toLocaleString('en-IN', { maximumFractionDigits: 6 })}`;
                }
            }

            document.querySelectorAll('.order-card').forEach(card => {
                const symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol]) {
                    const priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = `\u20B9${livePrices[symbol].toLocaleString('en-IN', { maximumFractionDigits: 6 })}`;
                    }
                }
            });
        }

        function startPriceUpdates() {
            fetchLivePrices();
            priceInterval = setInterval(fetchLivePrices, 2000);
        }

        // ============================================================
        // HOLDINGS SYSTEM — crypto_token_histry TABLE
        //
        // REMOVED: getHoldings() [used localStorage/parent window]
        // REMOVED: updateHolding() [used localStorage/parent window]
        //
        // ADDED: getNetHolding(symbol, userId)
        //   - Queries crypto_token_histry for user
        //   - Sums all action='Buying' rows minus action='Selling' rows
        //   - Returns net available quantity
        //
        // ADDED: addTokenHolding(userId, symbol, qty, price, total)
        //   - Inserts a 'Buying' row in crypto_token_histry for buyer
        //   - Called when releaseTokens() completes a trade
        //
        // ADDED: cutTokenHolding(userId, symbol, qty, price, total)
        //   - Inserts a 'Selling' row in crypto_token_histry for seller
        //   - Called when releaseTokens() completes a trade
        // ============================================================

        /**
         * Get net token quantity for a user from crypto_token_histry.
         * Net = sum(Buying qty) - sum(Selling qty) for the given symbol.
         */
        async function getNetHolding(symbol, userId) {
            try {
                const uid = userId || (currentUser && currentUser.id);
                if (!uid || !symbol) return 0;

                const { data, error } = await supabase
                    .from('crypto_token_histry')
                    .select('action, qty')
                    .eq('user_id', uid)
                    .eq('symbol', symbol);

                if (error || !data) return 0;

                let net = 0;
                data.forEach(row => {
                    const qty = Number(row.qty || 0);
                    if (row.action === 'Buying') net += qty;
                    else if (row.action === 'Selling') net -= qty;
                });

                return Math.max(0, net);
            } catch (e) {
                console.error('getNetHolding error:', e);
                return 0;
            }
        }

        /**
         * Add tokens to buyer's holding by inserting a 'Buying' row
         * in crypto_token_histry. If a row for this symbol already
         * exists, this still inserts a new row — net is calculated
         * dynamically by summing all rows. No row merging needed.
         */
        async function addTokenHolding(userId, symbol, qty, pricePerToken, totalAmount) {
            try {
                const { error } = await supabase
                    .from('crypto_token_histry')
                    .insert([{
                        user_id: userId,
                        symbol: symbol,
                        action: 'Buying',
                        qty: qty,
                        total_amount: totalAmount || 0,
                        blockchain_used: 'P2P',
                        status: 'active',
                        created_at: new Date().toISOString()
                    }]);
                if (error) console.error('addTokenHolding error:', error);
            } catch (e) {
                console.error('addTokenHolding exception:', e);
            }
        }

        /**
         * Cut tokens from seller's holding by inserting a 'Selling' row
         * in crypto_token_histry. Net quantity is recalculated from
         * all rows, so the seller's displayed balance decreases correctly.
         */
        async function cutTokenHolding(userId, symbol, qty, pricePerToken, totalAmount) {
            try {
                const { error } = await supabase
                    .from('crypto_token_histry')
                    .insert([{
                        user_id: userId,
                        symbol: symbol,
                        action: 'Selling',
                        qty: qty,
                        total_amount: totalAmount || 0,
                        blockchain_used: 'P2P',
                        status: 'active',
                        created_at: new Date().toISOString()
                    }]);
                if (error) console.error('cutTokenHolding error:', error);
            } catch (e) {
                console.error('cutTokenHolding exception:', e);
            }
        }

            if (!tokenSelect || !livePrice) return;
            const selectedToken = tokenSelect.value;

            if (selectedToken && livePrices[selectedToken]) {
                livePrice.textContent = `\u20B9${livePrices[selectedToken].toLocaleString('en-IN', { maximumFractionDigits: 6 })}`;

        function calculateAmount() {
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;

            const amount = quantity * price;
            document.getElementById('amount').value = Math.round(amount);
        }

        function calculateQuantity() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;

            if (price > 0) {

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }

            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();

            if (data) {
                return generateOrderId();
            }

            return result;
        }

        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);

            if (!tokenSymbol) {
                showToast('Please select a token', 'error');
                return;
            }

            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }

            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between \u20B9100 and \u20B910,000', 'error');
                return;
            }

            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked'))
                .map(input => input.value);

            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }

            if (orderType === 'sell') {
                // Check available quantity from crypto_token_histry
                const availableQty = await getNetHolding(tokenSymbol, currentUser.id);

                if (quantity > availableQty) {
                    showToast('Insufficient token balance', 'error');
                    return;
                }

                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;

                const needsPhone = selectedPaymentMethods.some(method =>
                    ['phonepe', 'googlepay', 'paytm'].includes(method)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');

                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }

                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }

            try {
                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);

                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully!', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            }
        });

        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;

                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'accepted' })
                            .eq('id', tradeId);

                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);

                        if(trade.order.order_type === 'sell') {
                            await sendAIMessage(tradeId,
                                `Trade accepted! Buyer, please make the payment of \u20B9${trade.order.amount.toLocaleString('en-IN')} using one of the available methods. After paying, please share the screenshot with transaction ID and UTR number.`, 'buyer'
                            );
                        } else {
                            const paymentMethods = trade.order.payment_methods.split(',');
                            let promptMessage = 'Trade accepted! Please send your payment details (e.g., PhonePe, Google Pay, Paytm, UPI) and a screenshot of the account where you want to receive payment.';

                            if (paymentMethods.length > 0) {
                                promptMessage = `Trade accepted! Please share your payment details for these methods: ${paymentMethods.join(', ')} and a screenshot of the account where you want to receive payment.`;
                            }
                            await sendAIMessage(tradeId, promptMessage, 'seller');
                        }

                    } else if (message.includes('reject')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'rejected' })
                            .eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);

                        await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                    }
                }

                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId,
                        'Payment details received! Buyer, please make the payment of \u20B9' + trade.order.amount.toLocaleString('en-IN') + ' to the seller. Be sure to share a screenshot, transaction ID, and UTR number after you\'ve paid.', 'buyer'
                    );
                }

                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase
                        .from('user_p2p_order_box')
                        .update({ status: 'payment_done' })
                        .eq('id', tradeId);

                    await sendAIMessage(tradeId,
                        'Payment proof received! Seller, please check your bank/wallet for the payment and click "Release Tokens" once confirmed.', 'seller'
                    );
                }

            } catch (error) {
                console.error('Process user message error:', error);
            }
        }

        function startTimer(tradeId, seconds, timerType) {
            const timerId = `${tradeId}_${timerType}`;

            if (timers[timerId]) {
                clearInterval(timers[timerId]);
            }

            let timeLeft = seconds;

            const updateTimer = () => {
                if (timeLeft <= 0) {
                    clearInterval(timers[timerId]);
                    delete timers[timerId];
                    handleTimerExpiry(tradeId, timerType);
                    return;
                }

                const timerDisplay = document.getElementById('timerDisplay');
                const timerText = document.getElementById('timerText');

                if (timerDisplay && timerText) {
                    timerDisplay.style.display = 'block';
                    timerText.textContent = `Timer: ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }

                timeLeft--;
            };

            updateTimer();
            timers[timerId] = setInterval(updateTimer, 1000);
        }

        async function handleTimerExpiry(tradeId, timerType) {
            try {
                const timerDisplay = document.getElementById('timerDisplay');
                if(timerDisplay) timerDisplay.style.display = 'none';

            } catch (error) {
                console.error('Handle timer expiry error:', error);
            }
        }

        // Trade actions

        /**
         * releaseTokens — Called by the seller when payment is confirmed.
         * 1. Cuts tokens from seller via cutTokenHolding (inserts 'Selling' row in crypto_token_histry)
         * 2. Adds tokens to buyer via addTokenHolding (inserts 'Buying' row in crypto_token_histry)
         * 3. Marks trade and order as completed in all related tables
         * 4. Updates PnP stats and inserts history records for both users
         */
        async function releaseTokens(tradeId) {
    try {
        const { data: trade, error: tradeError } = await supabase
            .from('user_p2p_order_box')
            .select('*, order:user_p2p_order(*)')
            .eq('id', tradeId)
            .single();

        if (tradeError) throw tradeError;

        const symbol = trade.order.token_symbol;
        const qty = Number(trade.order.quantity);
        const amount = Number(trade.order.amount);

        // NAYA SYSTEM: Direct backend RPC ko call karna
        const { error: rpcError } = await supabase.rpc('release_p2p_tokens', {
            p_trade_id: tradeId,
            p_seller_id: trade.seller_id,
            p_buyer_id: trade.buyer_id,
            p_symbol: symbol,
            p_qty: qty,
            p_amount: amount,
            p_order_id: trade.order.id
        });

        if (rpcError) throw rpcError;

        // PnP Stats aur History update karna (yeh dono apna-apna log banayenge)
        await Promise.all([
            updatePnPStats(trade.buyer_id, 'completed'),
            updatePnPStats(trade.seller_id, 'completed'),
            supabase.from('user_p2p_history').insert([
                { user_id: trade.buyer_id, action: 'buy', token_symbol: symbol, quantity: qty, amount: amount, status: 'completed', other_user_id: trade.seller_id, created_at: new Date().toISOString() },
                { user_id: trade.seller_id, action: 'sell', token_symbol: symbol, quantity: qty, amount: amount, status: 'completed', other_user_id: trade.buyer_id, created_at: new Date().toISOString() }
            ])
        ]);

        await sendAIMessage(tradeId, 'Tokens released successfully! Trade completed.', 'both');

        showToast('Tokens released successfully!', 'success');
        loadAllData();
        closeChatModal();

    } catch (error) {
        console.error('Release tokens error:', error);
        showToast('Failed to release tokens', 'error');
    }
        }

        function setupRealtimeSubscriptions() {
            supabase
                .channel('p2p_public_changes')
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order_box' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}`},
                    (payload) => {
                        if(document.getElementById('pnp-tab').classList.contains('active')) {
                           loadPnPData();
                        }
                    }
                )
                .subscribe();
        }

        function setupChatRealtimeSubscription(tradeId) {
            if (activeChats[tradeId]) {
                supabase.removeChannel(activeChats[tradeId]);
            }
            const chatChannel = supabase
                .channel(`trade_chat_${tradeId}`)
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'trade_chat', filter: `trade_id=eq.${tradeId}` },
                    (payload) => {
                        loadChatMessages(tradeId);
                    }
                )
                .subscribe();
            activeChats[tradeId] = chatChannel;
        }

                .single();

            if (data) {
                document.getElementById('userRole').value = data.role;
                document.getElementById('pnp-completed-orders').textContent = data.completed_orders;
                document.getElementById('pnp-uncompleted-orders').textContent = data.uncompleted_orders;
            }
        }

        async function updateUserRole() {
            const newRole = document.getElementById('userRole').value;
            const { data, error } = await supabase
                .from('user-p&p')
                .select('role_last_updated')
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.role_last_updated) {
                const lastUpdated = new Date(data.role_last_updated);
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastUpdated > twentyFourHoursAgo) {
                    showToast('You can only change your role once every 24 hours.', 'error');
                    loadPnPData();
                    return;
                }
            }

            const { error: updateError } = await supabase
                .from('user-p&p')
                .update({ role: newRole, role_last_updated: new Date().toISOString() })
                .eq('user_id', currentUser.id);

            if (updateError) {
                showToast('Failed to update role.', 'error');
            } else {
                showToast('Role updated successfully.', 'success');
            }
        }

        async function openPnPModal(userId, uidOnly = false) {
            const modal = document.getElementById('pnpModal');
            const modalBody = document.getElementById('pnpModalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = `<div class="loading">Loading user profile...</div>`;

            const uid = await getUID(userId);

            if (uidOnly) {
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">User's UID</label>
                        <div class="uid-display">${uid}</div>
                    </div>
                `;
                return;
            }

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                modalBody.innerHTML = `<div class="empty-state"><h3>Profile not found</h3></div>`;
                return;
            }

            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">User's UID</label>
                    <div class="uid-display">${uid}</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="uid-display" style="text-transform: capitalize;">${data.role}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p>${data.completed_orders}</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p>${data.uncompleted_orders}</p>
                    </div>
                </div>
            `;
        }

        function closePnPModal() {
            document.getElementById('pnpModal').style.display = 'none';
        }

        async function updatePnPStats(userId, type) {
            const { data, error } = await supabase.rpc('update_pnp_stats', {
                p_user_id: userId,
                p_type: type
            });
            if(error) console.error('Error updating PnP stats:', error);
        }
    </script>
</body>
</html>
