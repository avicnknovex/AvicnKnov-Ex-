<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0533 0%, #0d0d1a 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(120, 40, 200, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(160, 80, 255, 0.25);
        }

        .back-btn, .add-order-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .back-btn:hover, .add-order-btn:hover {
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            transform: scale(1.05);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(160, 80, 255, 0.2);
            border-radius: 10px;
            color: #ccc;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(120, 40, 200, 0.4);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(160, 80, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border-left: 4px solid #a855f7;
            transition: all 0.3s;
            color: #e0e0e0;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(120, 40, 200, 0.3);
            background: rgba(255, 255, 255, 0.09);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-icon-display {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(120, 40, 200, 0.3);
            border: 1px solid rgba(160, 80, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #c084fc;
            overflow: hidden;
            flex-shrink: 0;
        }

        .token-icon-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .token-symbol {
            font-size: 18px;
            font-weight: bold;
            color: #c084fc;
        }

        .order-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .buy-type {
            background: rgba(120, 40, 200, 0.2);
            color: #c084fc;
            border: 1px solid rgba(160, 80, 255, 0.4);
        }

        .sell-type {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: #e0e0e0;
        }

        .price-display {
            color: #c084fc;
            font-weight: bold;
        }

        .payment-methods {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .payment-method {
            padding: 4px 8px;
            background: rgba(120, 40, 200, 0.15);
            border-radius: 15px;
            font-size: 12px;
            color: #a78bfa;
            border: 1px solid rgba(160, 80, 255, 0.2);
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 100px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
        }

        .sell-btn {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
        }

        .cancel-btn {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: white;
        }

        .report-btn {
            background: linear-gradient(135deg, #b7791f, #d97706);
            color: white;
        }

        .chat-btn {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
        }

        .release-btn {
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            color: white;
        }

        .reject-btn {
            background: linear-gradient(135deg, #5d4037, #795548);
            color: white;
        }

        .pnp-btn {
            background: linear-gradient(135deg, #4a1d96, #6d28d9);
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a0d2e;
            border: 1px solid rgba(160, 80, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            color: #e0e0e0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: #e0e0e0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(160, 80, 255, 0.3);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #a855f7;
        }

        .form-select option {
            background: #1a0d2e;
            color: #e0e0e0;
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border: 2px solid rgba(160, 80, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #ccc;
        }

        .payment-option:hover {
            border-color: #a855f7;
            background: rgba(120, 40, 200, 0.1);
        }

        .payment-option.selected {
            border-color: #a855f7;
            background: rgba(120, 40, 200, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #6d28d9, #9333ea);
            transform: translateY(-2px);
        }

        /* Chat Modal */
        .chat-container {
            height: 400px;
            border: 2px solid rgba(160, 80, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #888;
        }

        .ai-sender {
            color: #a855f7;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid #a855f7;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
        }

        .ai-message .message-content {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .chat-image {
            max-width: 200px;
            border-radius: 8px;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(160, 80, 255, 0.2);
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(160, 80, 255, 0.3);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
        }

        .send-btn, .image-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: white;
        }

        .image-btn {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
        }

        .timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            z-index: 1001;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 24px;
            color: #aaa;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1002;
            transform: translateX(100%);
            transition: transform 0.3s;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .toast.error {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
        }

        .live-price {
            color: #c084fc;
            font-weight: bold;
            font-size: 18px;
        }

        #pnp-tab .pnp-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }
        #pnp-tab .uid-display {
            background: rgba(120, 40, 200, 0.15);
            border: 1px solid rgba(160, 80, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
            color: #e0e0e0;
        }
        #pnp-tab .role-selector {
            margin-bottom: 30px;
        }
        #pnp-tab .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        #pnp-tab .stat-box {
            padding: 25px;
            border-radius: 12px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .stat-box h4 {
            font-size: 16px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .stat-box p {
            font-size: 32px;
            font-weight: bold;
        }
        .green-box { background: linear-gradient(135deg, #7c3aed, #a855f7); }
        .red-box { background: linear-gradient(135deg, #c0392b, #e74c3c); }

        /* Token select in modal with icon */
        .token-select-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .token-select-option:hover {
            background: rgba(120, 40, 200, 0.15);
        }
        .token-select-option.selected {
            background: rgba(120, 40, 200, 0.25);
            border: 1px solid rgba(160, 80, 255, 0.4);
        }
        #tokenSelectWrapper {
            position: relative;
        }
        #tokenDropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a0d2e;
            border: 1px solid rgba(160, 80, 255, 0.3);
            border-radius: 8px;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 4px;
        }
        #tokenDropdown.open {
            display: block;
        }
        #tokenSelectDisplay {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(160, 80, 255, 0.3);
            border-radius: 8px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }
        #tokenSelectDisplay .left-part {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chevron-icon {
            width: 16px;
            height: 16px;
            fill: #aaa;
        }
        .section-divider {
            border: none;
            border-top: 1px solid rgba(160, 80, 255, 0.15);
            margin: 12px 0;
        }

        /* Icon in order card header */
        .token-full-name {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">&#8592; Back to Trade</button>
            <h1 style="color: white; font-size: 24px;">P2P Trading Platform</h1>
            <button class="add-order-btn" onclick="openCreateOrderModal()">+ Create Order</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('buy')">Buy Orders</button>
            <button class="tab" onclick="switchTab('sell')">Sell Orders</button>
            <button class="tab" onclick="switchTab('orderbox')">Order Box</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('pnp')">P&amp;P</button>
        </div>

        <div id="buy-tab" class="tab-content active">
            <div id="buy-orders">
                <div class="loading">Loading buy orders...</div>
            </div>
        </div>

        <div id="sell-tab" class="tab-content">
            <div id="sell-orders">
                <div class="loading">Loading sell orders...</div>
            </div>
        </div>

        <div id="orderbox-tab" class="tab-content">
            <div id="order-box">
                <div class="loading">Loading your active orders...</div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div id="history-orders">
                <div class="loading">Loading history...</div>
            </div>
        </div>

        <div id="pnp-tab" class="tab-content">
            <div class="pnp-container">
                <div class="form-group">
                    <label class="form-label">Your Unique ID (UID)</label>
                    <div id="pnp-uid" class="uid-display">Loading...</div>
                </div>
                <div class="form-group role-selector">
                    <label class="form-label">Select Your Role</label>
                    <select id="userRole" class="form-select" onchange="updateUserRole()">
                        <option value="both">Both (Buyer &amp; Seller)</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p id="pnp-completed-orders">-</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p id="pnp-uncompleted-orders">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create New Order</h2>
                <button class="close-btn" onclick="closeCreateOrderModal()">&times;</button>
            </div>

            <form id="createOrderForm">
                <div class="form-group">
                    <label class="form-label">Order Type</label>
                    <select id="orderType" class="form-select" onchange="updateOrderType()">
                        <option value="buy">Buy Order</option>
                        <option value="sell">Sell Order</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Select Token</label>
                    <div id="tokenSelectWrapper">
                        <div id="tokenSelectDisplay" onclick="toggleTokenDropdown()">
                            <span class="left-part">
                                <span id="selectedTokenIcon" class="token-icon-display" style="width:28px;height:28px;font-size:12px;display:inline-flex;">--</span>
                                <span id="selectedTokenLabel">Select Token</span>
                            </span>
                            <svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                        </div>
                        <div id="tokenDropdown"></div>
                    </div>
                    <input type="hidden" id="tokenSelect" value="">
                </div>

                <div class="form-group">
                    <label class="form-label">Live Price</label>
                    <div id="livePrice" class="live-price">Select a token</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="quantity" class="form-input" step="0.00000001" min="0" onchange="calculateAmount()">
                </div>

                <div class="form-group">
                    <label class="form-label">Amount (&#8377;)</label>
                    <input type="number" id="amount" class="form-input" min="100" max="10000" onchange="calculateQuantity()">
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Methods</label>
                    <div class="payment-options">
                        <div class="payment-option" onclick="togglePaymentMethod('phonepe')">
                            <input type="checkbox" id="phonepe" value="phonepe">
                            <label for="phonepe">PhonePe</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('googlepay')">
                            <input type="checkbox" id="googlepay" value="googlepay">
                            <label for="googlepay">Google Pay</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('paytm')">
                            <input type="checkbox" id="paytm" value="paytm">
                            <label for="paytm">Paytm</label>
                        </div>
                        <div class="payment-option" onclick="togglePaymentMethod('upi')">
                            <input type="checkbox" id="upi" value="upi">
                            <label for="upi">UPI</label>
                        </div>
                    </div>
                </div>

                <div id="paymentDetails" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">Phone Number (for PhonePe/Paytm/Google Pay)</label>
                        <input type="tel" id="phoneNumber" class="form-input">
                    </div>
                    <div class="form-group">
                        <label class="form-label">UPI ID</label>
                        <input type="text" id="upiId" class="form-input">
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Order</button>
            </form>
        </div>
    </div>

    <div id="chatModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Trade Chat</h2>
                <button class="close-btn" onclick="closeChatModal()">&times;</button>
            </div>

            <div class="chat-container">
                <div id="chatMessages" class="chat-messages">
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Type your message...">
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage()">
                    <button class="image-btn" onclick="document.getElementById('imageInput').click()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                    </button>
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <div id="tradeActions" style="margin-top: 15px; display: none;">
            </div>
        </div>
    </div>

    <div id="pnpModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">User P&amp;P Profile</h2>
                <button class="close-btn" onclick="closePnPModal()">&times;</button>
            </div>
            <div id="pnpModalBody">

        // Initialize Supabase
        var supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        // Global variables
        let currentUser = null;

        let selectedTokenValue = '';   // Currently selected token symbol in create order modal

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {

        // =============================================
        // TOKEN CONTROL - crypto_token_control table
        // =============================================

        async function loadTokenControlData() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*');
                if (error) throw error;
                // Filter out tokens that have 'p2p.html' in nosupported_js
                tokenControlData = (data || []).filter(token => {
                    const ns = (token.nosupported_js || '').toLowerCase();
                    return !ns.includes('p2p.html');
                });
            } catch (err) {
                console.error('Error loading token control data:', err);
                tokenControlData = [];
            }
        }

        function buildTokenIconHtml(token, size = 36) {
            const iconType = (token.icon_type || '').toLowerCase();
            const iconUrl = token.icon_url || '';
            const symbol = token.symbol || '';

            if (iconType === 'image' && iconUrl) {
                return `<div class="token-icon-display" style="width:${size}px;height:${size}px;"><img src="${iconUrl}" alt="${symbol}"></div>`;
            } else if (iconType === 'emoji' && iconUrl) {
                // We replace emoji with styled text for premium look
                return `<div class="token-icon-display" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.4)}px;">${iconUrl}</div>`;
            } else if (iconType === 'text' && iconUrl) {
                return `<div class="token-icon-display" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.35)}px;">${iconUrl}</div>`;
            } else {
                // No icon - show first 2 chars of symbol
                return `<div class="token-icon-display" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.32)}px;">${symbol.substring(0,2)}</div>`;
            }
        }

        function buildTokenIconInline(token, size = 36) {
            // Returns element content for inline usage (inside existing .token-icon-display div)
            const iconType = (token.icon_type || '').toLowerCase();
            const iconUrl = token.icon_url || '';
            const symbol = token.symbol || '';

            if (iconType === 'image' && iconUrl) {
                return `<img src="${iconUrl}" alt="${symbol}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
            } else if ((iconType === 'emoji' || iconType === 'text') && iconUrl) {
                return iconUrl;
            } else {
                return symbol.substring(0, 2);
            }
        }

        function getTokenData(symbol) {
            return tokenControlData.find(t => t.symbol === symbol) || null;
        }

        // =============================================
        // PRICE SYSTEM - from crypto_token_control
        // =============================================

        async function fetchLivePrices() {
            try {
                for (const token of tokenControlData) {
                    const symbol = token.symbol;
                    if (token.is_live_api && token.api_url) {
                        try {
                            const response = await fetch(token.api_url);
                            const data = await response.json();
                            // Try common structures
                            if (data && typeof data === 'object') {
                                // CoinGecko: { "bitcoin": { "inr": 1234 } }
                                const keys = Object.keys(data);
                                if (keys.length > 0) {
                                    const first = data[keys[0]];
                                    if (first && first.inr) {
                                        livePrices[symbol] = first.inr;
                                    } else if (first && first.INR) {
                                        livePrices[symbol] = first.INR;
                                    } else if (typeof first === 'number') {
                                        livePrices[symbol] = first;
                                    } else if (data.price) {
                                        livePrices[symbol] = parseFloat(data.price);
                                    } else if (data.inr) {
                                        livePrices[symbol] = data.inr;
                                    }
                                }
                            }
                        } catch (apiErr) {
                            // If API fails, fallback to manual
                            livePrices[symbol] = parseFloat(token.manual_price) || 0;
                        }
                    } else {
                        // Use manual price
                        livePrices[symbol] = parseFloat(token.manual_price) || 0;
                    }
                }
                updatePriceDisplays();
            } catch (error) {
                console.error('Price fetch error:', error);
            }
        }

        function updatePriceDisplays() {
            // Update modal price display
            const priceDisplay = document.getElementById('livePrice');
            if (priceDisplay && selectedTokenValue) {
                if (livePrices[selectedTokenValue] !== undefined) {
                    priceDisplay.textContent = `\u20B9${livePrices[selectedTokenValue].toLocaleString('en-IN')}`;
                }
            }

            // Update all order cards silently
            document.querySelectorAll('.order-card').forEach(card => {
                const symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol] !== undefined) {
                    const priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = `\u20B9${livePrices[symbol].toLocaleString('en-IN')}`;
                    }
                }
            });
        }

        function startPriceUpdates() {
            fetchLivePrices();
            priceInterval = setInterval(fetchLivePrices, 2000);
        }

        // =============================================
        // TOKEN DROPDOWN in Create Order Modal
        // =============================================

        function buildTokenDropdown() {
            const dropdown = document.getElementById('tokenDropdown');
            if (!tokenControlData.length) {
                dropdown.innerHTML = `<div style="padding:12px;color:#888;">No tokens available</div>`;
                return;
            }
            dropdown.innerHTML = tokenControlData.map(token => {
                const iconType = (token.icon_type || '').toLowerCase();
                const iconUrl = token.icon_url || '';
                let iconHtml = '';
                if (iconType === 'image' && iconUrl) {
                    iconHtml = `<div class="token-icon-display" style="width:26px;height:26px;flex-shrink:0;"><img src="${iconUrl}" alt="${token.symbol}"></div>`;
                } else if ((iconType === 'emoji' || iconType === 'text') && iconUrl) {
                    iconHtml = `<div class="token-icon-display" style="width:26px;height:26px;font-size:10px;flex-shrink:0;">${iconUrl}</div>`;
                } else {
                    iconHtml = `<div class="token-icon-display" style="width:26px;height:26px;font-size:9px;flex-shrink:0;">${token.symbol.substring(0,2)}</div>`;
                }
                return `<div class="token-select-option" onclick="selectToken('${token.symbol}')">
                    ${iconHtml}
                    <span style="font-weight:bold;color:#e0e0e0;">${token.symbol}</span>
                    <span style="color:#888;font-size:13px;margin-left:4px;">${token.name || token.full_name || ''}</span>
                </div>`;
            }).join('');
        }

        function toggleTokenDropdown() {
            const dd = document.getElementById('tokenDropdown');
            if (!dd.innerHTML) buildTokenDropdown();
            dd.classList.toggle('open');
        }

        function selectToken(symbol) {
            selectedTokenValue = symbol;
            document.getElementById('tokenSelect').value = symbol;
            document.getElementById('tokenDropdown').classList.remove('open');

            const token = getTokenData(symbol);
            const display = document.getElementById('tokenSelectDisplay');
            const iconSpan = document.getElementById('selectedTokenIcon');
            const labelSpan = document.getElementById('selectedTokenLabel');

            if (token) {
                iconSpan.innerHTML = buildTokenIconInline(token, 28);
                iconSpan.style.fontSize = '11px';
                labelSpan.textContent = `${token.symbol} — ${token.name || token.full_name || ''}`;
            }

            if (document.getElementById('orderType').value === 'sell') {
                updateAvailableQuantityFromHistory();

        // =============================================

        async function checkAuth() {
            const { data: { user } } = await supabase.auth.getUser();

        // =============================================
        // LOAD ORDER BOX
        // =============================================

        async function loadOrderBox() {
            try {
                const { data: trades, error: tradesError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`*, order:user_p2p_order(*)`)
                    .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)
                    .in('status', ['pending', 'accepted', 'payment_done'])
                    .order('created_at', { ascending: false });

                if (tradesError) throw tradesError;

                const engagedOrderIds = trades.map(t => t.order_id);
                const { data: myOrders, error: myOrdersError } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('status', 'active')
                    .not('id', 'in', `(${engagedOrderIds.join(',')})`);

                if (myOrdersError) throw myOrdersError;

                const container = document.getElementById('order-box');
                if (trades.length === 0 && myOrders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Active Trades or Orders</h3>
                            <p>You don't have any active trades or created orders.</p>
                        </div>
                    `;
                    return;
                }

                let combinedHtml = '';

                combinedHtml += await Promise.all(trades.map(async trade => {
                    const isOwner = trade.order.user_id === currentUser.id;
                    const isSeller = trade.seller_id === currentUser.id;
                    const otherUser = isSeller ? 'Buyer' : 'Seller';
                    const otherUserId = isSeller ? trade.buyer_id : trade.seller_id;
                    const isTradeFinished = (trade.status === 'completed' || trade.status === 'cancelled' || trade.status === 'rejected');
                    const tokenData = getTokenData(trade.order.token_symbol);
                    const iconHtml = tokenData ? buildTokenIconHtml(tokenData, 32) : `<div class="token-icon-display" style="width:32px;height:32px;font-size:11px;">${trade.order.token_symbol.substring(0,2)}</div>`;

                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <div class="token-info">
                                    ${iconHtml}
                                    <span class="token-symbol">${trade.order.token_symbol}</span>
                                    <span class="order-type ${isSeller ? 'sell-type' : 'buy-type'}">
                                        ${isSeller ? 'SELLING' : 'BUYING'}
                                    </span>
                                </div>
                                <div class="detail-value">Order ID: ${trade.order.order_id_unique}</div>
                                <div class="detail-value">Status: ${trade.status}</div>
                            </div>

                            <div class="order-details">
                                <div class="detail-item">
                                    <div class="detail-label">QUANTITY</div>
                                    <div class="detail-value">${trade.order.quantity}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">AMOUNT</div>
                                    <div class="detail-value">\u20B9${trade.order.amount.toLocaleString('en-IN')}</div>
                                </div>
                                <div class="detail-item">
                                    <div class="detail-label">${otherUser}</div>
                                    <div class="detail-value">${isSeller ? trade.buyer_username : trade.seller_username}</div>
                                </div>
                            </div>

                            <div class="order-actions">
                                ${!isTradeFinished ? `
                                    <button class="action-btn chat-btn" onclick="openChat('${trade.id}')">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="white" style="margin-right:4px;vertical-align:middle;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                                        Chat
                                    </button>
                                    <button class="action-btn report-btn" onclick="goToHelpPage()">
                                        Report
                                    </button>
                                ` : ''}

                                ${trade.status === 'pending' && isOwner ? `
                                    <button class="action-btn reject-btn" onclick="rejectTrade('${trade.id}')">
                                        Reject
                                    </button>
                                ` : ''}

                                ${trade.status === 'accepted' ? `
                                    <button class="action-btn pnp-btn" onclick="openPnPModal('${otherUserId}')">P&amp;P</button>
                                ` : ''}

                                ${trade.status === 'payment_done' && isSeller ? `
                                    <button class="action-btn release-btn" onclick="releaseTokens('${trade.id}')">
                                        Release Tokens
                                    </button>
                                ` : ''}

                                ${trade.status !== 'pending' && !isTradeFinished ? `
                                    <button class="action-btn cancel-btn" onclick="cancelTrade('${trade.id}')">
                                        Cancel Trade
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }));

                combinedHtml += myOrders.map(order => {
                    const tokenData = getTokenData(order.token_symbol);
                    const iconHtml = tokenData ? buildTokenIconHtml(tokenData, 32) : `<div class="token-icon-display" style="width:32px;height:32px;font-size:11px;">${order.token_symbol.substring(0,2)}</div>`;
                    return `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="token-info">
                                ${iconHtml}
                                <span class="token-symbol">${order.token_symbol}</span>
                                <span class="order-type ${order.order_type === 'buy' ? 'buy-type' : 'sell-type'}">
                                    MY ${order.order_type.toUpperCase()} ORDER
                                </span>
                            </div>
                            <div class="detail-value">Status: ${order.status}</div>
                        </div>
                        <div class="order-details">
                            <div class="detail-item">
                                <div class="detail-label">QUANTITY</div>
                                <div class="detail-value">${order.quantity}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">AMOUNT</div>
                                <div class="detail-value">\u20B9${order.amount.toLocaleString('en-IN')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">WAITING FOR</div>
                                <div class="detail-value">${order.order_type === 'buy' ? 'A Seller' : 'A Buyer'}</div>
                            </div>
                        </div>
                        <div class="order-actions">
                            <button class="action-btn cancel-btn" onclick="cancelOrder('${order.id}')">
                                Cancel Order
                            </button>
                        </div>
                    </div>
                `}).join('');

                container.innerHTML = combinedHtml.replace(/,/g, '');

            } catch (error) {
                console.error('Load order box error:', error);
                showToast('Failed to load order box', 'error');
            }
        }

        // =============================================
        // LOAD HISTORY
        // =============================================

        async function loadHistory() {
            try {
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

                const { data, error } = await supabase
                    .from('user_p2p_history')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .gte('created_at', twentyFourHoursAgo)
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                const container = document.getElementById('history-orders');
                if (data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Trade History in last 24h</h3>
                            <p>You haven't completed any trades recently.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(trade => `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="token-info">
                                <span class="token-symbol">${trade.token_symbol}</span>
                                <span class="order-type ${trade.action === 'buy' ? 'buy-type' : 'sell-type'}">
                                    ${trade.action.toUpperCase()}
                                </span>
                            </div>
                            <div class="detail-value">${new Date(trade.created_at).toLocaleString()}</div>
                        </div>

                        <div class="order-details">
                            <div class="detail-item">
                                <div class="detail-label">QUANTITY</div>
                                <div class="detail-value">${trade.quantity}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">AMOUNT</div>
                                <div class="detail-value">\u20B9${trade.amount.toLocaleString('en-IN')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">STATUS</div>
                                <div class="detail-value">${trade.status}</div>
                            </div>
                        </div>
                        <div class="order-actions">
                           <button class="action-btn pnp-btn" onclick="openPnPModal('${trade.other_user_id}', true)">View Other User's UID</button>
                        </div>

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }

            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();

            if (data) {
                return generateOrderId();
            }

            return result;
        }

        // =============================================
        // CREATE ORDER SUBMIT
        // =============================================

        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);

            if (!tokenSymbol) {
                showToast('Please select a token', 'error');
                return;
            }

            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }

            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between \u20B9100 and \u20B910,000', 'error');
                return;
            }

            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked'))
                .map(input => input.value);

            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }

            if (orderType === 'sell') {
                // Check balance from crypto_token_histry table
                const availableQty = await getUserTokenBalance(currentUser.id, tokenSymbol);

                if (quantity > availableQty) {
                    showToast('Insufficient token balance', 'error');
                    return;
                }

                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;

                const needsPhone = selectedPaymentMethods.some(method =>
                    ['phonepe', 'googlepay', 'paytm'].includes(method)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');

                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }

                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }

            try {
                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);

                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully!', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            }
        });

        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;

                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'accepted' })
                            .eq('id', tradeId);

                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);

                        if (trade.order.order_type === 'sell') {
                            await sendAIMessage(tradeId,
                                `Trade accepted! Buyer, please make the payment of \u20B9${trade.order.amount.toLocaleString('en-IN')} using one of the available methods. After paying, please share the screenshot with transaction ID and UTR number.`, 'buyer'
                            );
                        } else {
                            const paymentMethods = trade.order.payment_methods.split(',');
                            let promptMessage = 'Trade accepted! Please send your payment details (e.g., PhonePe, Google Pay, Paytm, UPI) and a screenshot of the account where you want to receive payment.';

                            if (paymentMethods.length > 0) {
                                promptMessage = `Trade accepted! Please share your payment details for these methods: ${paymentMethods.join(', ')} and a screenshot of the account where you want to receive payment.`;
                            }
                            await sendAIMessage(tradeId, promptMessage, 'seller');
                        }

                    } else if (message.includes('reject')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'rejected' })
                            .eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);

                        await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                    }
                }

                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId,
                        'Payment details received! Buyer, please make the payment of \u20B9' + trade.order.amount.toLocaleString('en-IN') + ' to the seller. Be sure to share a screenshot, transaction ID, and UTR number after you\'ve paid.', 'buyer'
                    );
                }

                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase
                        .from('user_p2p_order_box')
                        .update({ status: 'payment_done' })
                        .eq('id', tradeId);

                    await sendAIMessage(tradeId,
                        'Payment proof received! Seller, please check your bank/wallet for the payment and click "Release Tokens" once confirmed.', 'seller'
                    );
                }

            } catch (error) {
                console.error('Process user message error:', error);
            }
        }

        function startTimer(tradeId, seconds, timerType) {
            const timerId = `${tradeId}_${timerType}`;

            if (timers[timerId]) {
                clearInterval(timers[timerId]);
            }

            let timeLeft = seconds;

            const updateTimer = () => {
                if (timeLeft <= 0) {
                    clearInterval(timers[timerId]);
                    delete timers[timerId];
                    handleTimerExpiry(tradeId, timerType);
                    return;
                }

                const timerDisplay = document.getElementById('timerDisplay');
                const timerText = document.getElementById('timerText');

                if (timerDisplay && timerText) {
                    timerDisplay.style.display = 'block';
                    timerText.textContent = `Timer: ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }

                timeLeft--;
            };

            updateTimer();
            timers[timerId] = setInterval(updateTimer, 1000);
        }

        async function handleTimerExpiry(tradeId, timerType) {
            try {
                const timerDisplay = document.getElementById('timerDisplay');
                if (timerDisplay) timerDisplay.style.display = 'none';
            } catch (error) {
                console.error('Handle timer expiry error:', error);
            }
        }

        // =============================================
        // RELEASE TOKENS - crypto_token_histry
        // Seller se cut, Buyer ko add
        // =============================================

        async function updateTokenHistry(userId, symbol, qtyChange) {
            // qtyChange: positive = add, negative = cut
            try {
                // Check if row exists
                const { data: existing, error: fetchErr } = await supabase
                    .from('crypto_token_histry')
                    .select('*')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .single();

                if (existing && !fetchErr) {
                    // Row exists - update qty
                    const newQty = parseFloat(existing.qty) + qtyChange;
                    const finalQty = newQty < 0 ? 0 : newQty;
                    await supabase
                        .from('crypto_token_histry')
                        .update({
                            qty: finalQty,
                            action: qtyChange > 0 ? 'buy' : 'sell',
                            created_at: new Date().toISOString()
                        })
                        .eq('user_id', userId)
                        .eq('symbol', symbol);
                } else {
                    // Row does not exist - insert new
                    if (qtyChange > 0) {
                        await supabase
                            .from('crypto_token_histry')
                            .insert([{
                                user_id: userId,
                                symbol: symbol,
                                action: 'buy',
                                qty: qtyChange,
                                price_at_transacti: livePrices[symbol] || 0,
                                total_amount: (livePrices[symbol] || 0) * qtyChange,
                                blockchain_used: '',
                                status: 'active',
                                created_at: new Date().toISOString()
                            }]);
                    }
                    // If cut on non-existing row, nothing to do
                }
            } catch (err) {
                console.error('updateTokenHistry error:', err);
            }
        }

        async function releaseTokens(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`
                        *,
                        order:user_p2p_order(*)
                    `)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const symbol = trade.order.token_symbol;
                const qty = parseFloat(trade.order.quantity);

                // Cut tokens from seller, Add tokens to buyer - crypto_token_histry
                await updateTokenHistry(trade.seller_id, symbol, -qty);
                await updateTokenHistry(trade.buyer_id, symbol, qty);

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'completed' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.id);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.order_id_unique);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'completed'),
                    updatePnPStats(trade.seller_id, 'completed')
                ]);

                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id,
                        action: 'buy',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.seller_id,
                        created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id,
                        action: 'sell',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'completed',
                        other_user_id: trade.buyer_id,
                        created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Tokens released successfully! Trade completed.', 'both');

                showToast('Tokens released successfully!', 'success');
                loadAllData();
                closeChatModal();

            } catch (error) {
                console.error('Release tokens error:', error);
                showToast('Failed to release tokens', 'error');
            }
        }

                await updatePnPStats(currentUser.id, 'uncompleted');

                await supabase.from('user_p2p_history').insert([{
                    user_id: currentUser.id,
                    action: order.order_type,
                    token_symbol: order.token_symbol,
                    quantity: order.quantity,
                    amount: order.amount,
                    status: 'cancelled',
                    other_user_id: null,
                    created_at: new Date().toISOString()
                }]);

                showToast('Order cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel order error:', error);
                showToast('Failed to cancel order', 'error');
            }
        }

        // =============================================
        // REJECT TRADE
        // =============================================

        async function rejectTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'rejected' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                showToast('Trade rejected', 'success');
                loadAllData();

            } catch (error) {
                console.error('Reject trade error:', error);
                showToast('Failed to reject trade', 'error');
            }
        }

        // =============================================
        // REALTIME SUBSCRIPTIONS
        // =============================================

        function setupRealtimeSubscriptions() {
            supabase
                .channel('p2p_public_changes')
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order_box' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}`},
                    (payload) => {
                        if (document.getElementById('pnp-tab').classList.contains('active')) {
                            loadPnPData();
                        }
                    }
                )
                .subscribe();
        }

        function setupChatRealtimeSubscription(tradeId) {
            if (activeChats[tradeId]) {
                supabase.removeChannel(activeChats[tradeId]);
            }
            const chatChannel = supabase
                .channel(`trade_chat_${tradeId}`)
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'trade_chat', filter: `trade_id=eq.${tradeId}` },
                    (payload) => {
                        loadChatMessages(tradeId);
                    }
                )
                .subscribe();
            activeChats[tradeId] = chatChannel;
        }

        // =============================================
        // UTILITY
        // =============================================

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (priceInterval) {
                clearInterval(priceInterval);
            }

            Object.values(timers).forEach(timer => {
                clearInterval(timer);
            });
            supabase.removeAllChannels();
        });

        async function getUID(userId) {
            try {
                const { data, error } = await supabase
                    .from('uid')
                    .select('uid')
                    .eq('user_id', userId)
                    .single();
                if (error || !data) return "Unavailable";
                return data.uid;
            } catch (e) {
                return "Unavailable";
            }
        }

        async function initializePnPProfile() {
            const { data, error } = await supabase
                .from('user-p&p')
                .select('user_id')
                .eq('user_id', currentUser.id)
                .single();

            if (!data) {
                await supabase.from('user-p&p').insert([{ user_id: currentUser.id }]);
            }
        }

        async function loadPnPData() {
            const uid = await getUID(currentUser.id);
            document.getElementById('pnp-uid').textContent = uid;

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();

            if (data) {
                document.getElementById('userRole').value = data.role;
                document.getElementById('pnp-completed-orders').textContent = data.completed_orders;
                document.getElementById('pnp-uncompleted-orders').textContent = data.uncompleted_orders;
            }
        }

        async function updateUserRole() {
            const newRole = document.getElementById('userRole').value;
            const { data, error } = await supabase
                .from('user-p&p')
                .select('role_last_updated')
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.role_last_updated) {
                const lastUpdated = new Date(data.role_last_updated);
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastUpdated > twentyFourHoursAgo) {
                    showToast('You can only change your role once every 24 hours.', 'error');
                    loadPnPData();
                    return;
                }
            }

            const { error: updateError } = await supabase
                .from('user-p&p')
                .update({ role: newRole, role_last_updated: new Date().toISOString() })
                .eq('user_id', currentUser.id);

            if (updateError) {
                showToast('Failed to update role.', 'error');
            } else {
                showToast('Role updated successfully.', 'success');
            }
        }

        async function openPnPModal(userId, uidOnly = false) {
            const modal = document.getElementById('pnpModal');
            const modalBody = document.getElementById('pnpModalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = `<div class="loading">Loading user profile...</div>`;

            const uid = await getUID(userId);

            if (uidOnly) {
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">User's UID</label>
                        <div class="uid-display">${uid}</div>
                    </div>
                `;
                return;
            }

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                modalBody.innerHTML = `<div class="empty-state"><h3>Profile not found</h3></div>`;
                return;
            }

            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">User's UID</label>
                    <div class="uid-display">${uid}</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="uid-display" style="text-transform: capitalize;">${data.role}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p>${data.completed_orders}</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p>${data.uncompleted_orders}</p>
                    </div>
                </div>
            `;
        }

        function closePnPModal() {
            document.getElementById('pnpModal').style.display = 'none';
        }

        async function updatePnPStats(userId, type) {
            const { data, error } = await supabase.rpc('update_pnp_stats', {
                p_user_id: userId,
                p_type: type
            });
            if (error) console.error('Error updating PnP stats:', error);
        }
    </script>
</body>
</html>
