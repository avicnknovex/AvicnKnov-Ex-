<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #160b2e 40%, #0a0a15 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(139, 92, 246, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 15px 22px;
            border-radius: 18px;
            margin-bottom: 22px;
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.12), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .back-btn, .add-order-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
            letter-spacing: 0.3px;
        }

        .back-btn:hover, .add-order-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: scale(1.05);
            box-shadow: 0 6px 22px rgba(139, 92, 246, 0.5);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            justify-content: center;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .tab {
            padding: 11px 22px;
            background: transparent;
            border: 1px solid rgba(139, 92, 246, 0.18);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .tab:hover {
            background: rgba(139, 92, 246, 0.18);
            color: white;
            border-color: rgba(139, 92, 246, 0.4);
        }

        .tab.active {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border-color: #8b5cf6;
            box-shadow: 0 4px 18px rgba(139, 92, 246, 0.4);
        }

        .tab-content {
            display: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 22px;
            min-height: 400px;
        }

        .tab-content.active {
            display: block;
        }

        .order-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            border-left: 4px solid #8b5cf6;
            transition: all 0.3s ease;
            color: #1a1a2e;
        }

        .order-card.sell-order {
            border-left-color: #f44336;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.25);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-symbol {
            font-size: 17px;
            font-weight: bold;
            color: #8b5cf6;
        }

        .order-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .buy-type {
            background: #ede9fe;
            color: #7c3aed;
        }

        .sell-type {
            background: #ffe8e8;
            color: #f44336;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 14px;
            margin-bottom: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .detail-value {
            font-size: 15px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .price-display {
            color: #8b5cf6;
            font-weight: bold;
            font-size: 15px;
        }

        .payment-methods {
            display: flex;
            gap: 7px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .payment-method {
            padding: 4px 10px;
            background: #f3f0ff;
            border: 1px solid #ddd6fe;
            border-radius: 15px;
            font-size: 12px;
            color: #7c3aed;
            font-weight: 500;
        }

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 100px;
            padding: 10px 14px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s ease;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .buy-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .sell-btn {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }

        .cancel-btn {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }

        .report-btn {
            background: linear-gradient(135deg, #e7c200, #c9a800);
            color: white;
        }

        .chat-btn {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            color: white;
        }

        .release-btn {
            background: linear-gradient(135deg, #9c27b0, #6a1b9a);
            color: white;
        }

        .reject-btn {
            background: linear-gradient(135deg, #795548, #4e342e);
            color: white;
        }

        .pnp-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.05);
            opacity: 0.92;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.72);
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f0eeff;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .close-btn {
            background: #f5f3ff;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #7c3aed;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            background: #ede9fe;
            color: #6d28d9;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a2e;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            color: #1a1a2e;
            background: #fafafa;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #8b5cf6;
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            font-size: 14px;
            color: #333;
        }

        .payment-option:hover {
            border-color: #8b5cf6;
            background: #faf8ff;
        }

        .payment-option.selected {
            border-color: #8b5cf6;
            background: #ede9fe;
            color: #6d28d9;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 18px rgba(139, 92, 246, 0.35);
            letter-spacing: 0.4px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(139, 92, 246, 0.45);
        }

        /* Chat Modal */
        .chat-container {
            height: 380px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8f7ff;
        }

        .chat-message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }

        .ai-sender {
            color: #8b5cf6;
        }

        .message-content {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid #8b5cf6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            font-size: 14px;
            color: #1a1a2e;
            line-height: 1.5;
        }

        .ai-message .message-content {
            border-left-color: #2196F3;
            background: #e3f2fd;
        }

        .chat-image {
            max-width: 200px;
            border-radius: 8px;
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            padding: 12px 15px;
            background: white;
            border-top: 1px solid #e5e7eb;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s;
            color: #1a1a2e;
        }

        .chat-input:focus {
            border-color: #8b5cf6;
        }

        .send-btn, .image-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .send-btn {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .send-btn:hover {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
        }

        .image-btn {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            color: white;
            padding: 10px 13px;
        }

        .image-btn:hover {
            background: linear-gradient(135deg, #1976D2, #0d47a1);
        }

        .timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 1001;
            box-shadow: 0 4px 18px rgba(255, 152, 0, 0.4);
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 15px;
        }

        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.25);
            border-top-color: #8b5cf6;
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
            margin: 15px auto 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.45);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.65);
        }

        .empty-state p {
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 24px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            z-index: 1002;
            transform: translateX(130%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            max-width: 320px;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .toast.error {
            background: linear-gradient(135deg, #f44336, #c62828);
        }

        .live-price {
            color: #8b5cf6;
            font-weight: bold;
            font-size: 16px;
        }

        /* Token icon styles */
        .token-icon-img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ede9fe;
        }

        .token-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .token-badge-text {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            color: #a78bfa;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            flex-shrink: 0;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* SVG icon styles */
        .btn-icon {
            width: 16px;
            height: 16px;
            display: inline-block;
            vertical-align: middle;
        }

        /* P&P Tab Styles */
        #pnp-tab .pnp-container {
            max-width: 800px;
            margin: auto;
            text-align: center;
        }

        #pnp-tab .uid-display {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.35);
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
            color: #e9d5ff;
        }

        .uid-display {
            background: #f5f3ff;
            border: 1px solid #ddd6fe;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
            color: #4c1d95;
        }

        #pnp-tab .role-selector {
            margin-bottom: 30px;
        }

        #pnp-tab .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        #pnp-tab .stat-box {
            padding: 25px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-box {
            padding: 25px;
            border-radius: 16px;
            color: white;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
        }

        .stat-box h4 {
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.85;
        }

        .stat-box p {
            font-size: 36px;
            font-weight: bold;
        }

        .green-box {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }

        .red-box {
            background: linear-gradient(135deg, #f44336, #b71c1c);
        }

        /* Token loading state in select */
        .token-select-loading {
            color: #999;
            font-style: italic;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.8);
        }

        /* Price refresh indicator - subtle pulse */
        @keyframes pricePulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .price-updating {
            animation: pricePulse 1.5s ease-in-out;
        }

        /* Available quantity display */
        #availableQty {
            font-size: 18px;
            font-weight: bold;
            color: #8b5cf6;
            padding: 8px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 18px !important;
            }
            .tab {
                padding: 9px 14px;
                font-size: 12px;
            }
            .stat-box p {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:4px;">
                    <path d="M19 12H5M12 5l-7 7 7 7"/>
                </svg>
                Back
            </button>
            <h1 style="color: white; font-size: 22px; font-weight: 700; letter-spacing: 0.5px;">P2P Trading Platform</h1>
            <button class="add-order-btn" onclick="openCreateOrderModal()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:4px;">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Create Order
            </button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('buy')">Buy Orders</button>
            <button class="tab" onclick="switchTab('sell')">Sell Orders</button>
            <button class="tab" onclick="switchTab('orderbox')">Order Box</button>
            <button class="tab" onclick="switchTab('history')">History</button>
            <button class="tab" onclick="switchTab('pnp')">P&amp;P</button>
        </div>

        <div id="buy-tab" class="tab-content active">
            <div id="buy-orders">
                <div class="loading">Loading buy orders...</div>
            </div>
        </div>

        <div id="sell-tab" class="tab-content">
            <div id="sell-orders">
                <div class="loading">Loading sell orders...</div>
            </div>
        </div>

        <div id="orderbox-tab" class="tab-content">
            <div id="order-box">
                <div class="loading">Loading your active orders...</div>
            </div>
        </div>

        <div id="history-tab" class="tab-content">
            <div id="history-orders">
                <div class="loading">Loading history...</div>
            </div>
        </div>

        <div id="pnp-tab" class="tab-content">
            <div class="pnp-container">
                <div class="form-group">
                    <label class="form-label">Your Unique ID (UID)</label>
                    <div id="pnp-uid" class="uid-display">Loading...</div>
                </div>
                <div class="form-group role-selector">
                    <label class="form-label">Select Your Role</label>
                    <select id="userRole" class="form-select" onchange="updateUserRole()">
                        <option value="both">Both (Buyer &amp; Seller)</option>
                        <option value="buyer">Buyer</option>
                        <option value="seller">Seller</option>
                    </select>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p id="pnp-completed-orders">-</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p id="pnp-uncompleted-orders">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Order Modal -->
    <div id="createOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Create New Order</h2>
                <button class="close-btn" onclick="closeCreateOrderModal()">&times;</button>
            </div>

        // ===== LOAD TOKENS FROM crypto_token_control TABLE =====
        async function loadTokensFromTable() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                // Filter tokens: exclude if nosupported_js contains 'p2p.html'
                availableTokens = (data || []).filter(token => {
                    if (!token.nosupported_js) return true;
                    return !token.nosupported_js.includes('p2p.html');
                });

                // Build lookup map
                tokenDataMap = {};
                availableTokens.forEach(token => {
                    tokenDataMap[token.symbol] = token;
                });

                // Populate token select dropdown
                const tokenSelect = document.getElementById('tokenSelect');
                if (availableTokens.length === 0) {
                    tokenSelect.innerHTML = '<option value="">No tokens available</option>';
                } else {
                    tokenSelect.innerHTML = availableTokens.map(token =>
                        `<option value="${token.symbol}">${token.full_name || token.name || token.symbol} (${token.symbol})</option>`
                    ).join('');
                }

                // Load initial prices
                await fetchLivePrices();

            } catch (error) {
                console.error('Load tokens from table error:', error);
                document.getElementById('tokenSelect').innerHTML = '<option value="">Error loading tokens</option>';
            }
        }

        // ===== GET TOKEN ICON HTML =====
        function getTokenIconHtml(symbol) {
            const token = tokenDataMap[symbol];
            if (!token) {
                return `<span class="token-badge">${(symbol || '??').substring(0, 2).toUpperCase()}</span>`;
            }

            if (token.icon_url) {
                if (token.icon_type === 'emoji') {
                    // Show emoji icon as-is from database
                    return `<span class="token-badge-text" style="font-size:18px;background:transparent;border:none;">${token.icon_url}</span>`;
                } else {
                    // Image URL
                    return `<img src="${token.icon_url}" class="token-icon-img" alt="${symbol}"
                        onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\\'token-badge\\'>${(symbol || '').substring(0, 2).toUpperCase()}</span>')">`;
                }
            }

            // Text fallback
            return `<span class="token-badge">${(symbol || '??').substring(0, 2).toUpperCase()}</span>`;
        }

        // ===== FETCH LIVE PRICES from crypto_token_control =====
        async function fetchLivePrices() {
            if (availableTokens.length === 0) return;

            for (const token of availableTokens) {
                try {
                    if (token.is_live_api && token.api_url) {
                        // Try to fetch from live API
                        try {
                            const response = await fetch(token.api_url);
                            if (!response.ok) throw new Error('API error');
                            const data = await response.json();

                            let price = null;

                            // Try to extract INR price from various API response formats
                            // Format 1: CoinGecko { "bitcoin": { "inr": 12345 } }
                            for (const key of Object.keys(data)) {
                                const val = data[key];
                                if (val && typeof val === 'object') {
                                    if (val.inr !== undefined) { price = val.inr; break; }
                                    if (val.INR !== undefined) { price = val.INR; break; }
                                    if (val.price !== undefined) { price = val.price; break; }
                                }
                            }

                            // Format 2: { "price": 12345 }
                            if (price === null && data.price !== undefined) price = data.price;

                            // Format 3: { "data": { "price": 12345 } }
                            if (price === null && data.data && data.data.price !== undefined) price = data.data.price;

                            // Format 4: direct number
                            if (price === null && typeof data === 'number') price = data;

                            if (price !== null && price > 0) {
                                livePrices[token.symbol] = parseFloat(price);
                            } else {
                                // Fallback to manual price
                                livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                            }
                        } catch (apiErr) {
                            // API failed, use manual price
                            livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                        }
                    } else {
                        // Use manual price from table
                        livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                    }
                } catch (e) {
                    livePrices[token.symbol] = parseFloat(token.manual_price) || 0;
                }
            }

            updatePriceDisplays();
        }

        // ===== UPDATE PRICE DISPLAYS =====
        function updatePriceDisplays() {
            const priceDisplay = document.getElementById('livePrice');
            const tokenSelect = document.getElementById('tokenSelect');
            if (priceDisplay && tokenSelect && tokenSelect.value) {
                const selectedToken = tokenSelect.value;
                if (livePrices[selectedToken] !== undefined) {
                    priceDisplay.textContent = `\u20B9${livePrices[selectedToken].toLocaleString('en-IN')}`;
                    priceDisplay.classList.add('price-updating');
                    setTimeout(() => priceDisplay.classList.remove('price-updating'), 1500);
                }
            }

            // Update price displays in all order cards
            document.querySelectorAll('.order-card').forEach(card => {
                const symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol] !== undefined) {
                    const priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = `\u20B9${livePrices[symbol].toLocaleString('en-IN')}`;
                    }
                }
            });
        }

        // ===== START PRICE UPDATES (every 2 seconds) =====
        function startPriceUpdates() {
            fetchLivePrices();
            priceInterval = setInterval(fetchLivePrices, 2000);

        // ===== GET TOKEN BALANCE from crypto_token_histry =====
        async function getTokenBalance(userId, symbol) {
            try {
                const { data, error } = await supabase

        // ===== ADD TOKEN TO crypto_token_histry =====
        // If record exists for this user+symbol, add qty to existing row
        // If not, create new row
        async function addTokenToHistory(userId, symbol, qty, priceAtTx, totalAmt) {
            try {
                const qtyNum = parseFloat(qty) || 0;
                if (qtyNum <= 0) return;

                // Check if record already exists for this user + symbol
                const { data: existing, error: fetchError } = await supabase
                    .from('crypto_token_histry')
                    .select('id, qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .maybeSingle();

                if (fetchError) {
                    console.error('addTokenToHistory fetch error:', fetchError);
                }

                if (existing) {
                    // Record exists - add qty to existing
                    const newQty = (parseFloat(existing.qty) || 0) + qtyNum;
                    const { error: updateError } = await supabase
                        .from('crypto_token_histry')
                        .update({ qty: newQty })
                        .eq('id', existing.id);

                    if (updateError) throw updateError;
                } else {
                    // No record - create new row
                    const tokenInfo = tokenDataMap[symbol];
                    let blockchainStr = null;
                    if (tokenInfo && tokenInfo.blockchains) {
                        try {
                            blockchainStr = typeof tokenInfo.blockchains === 'string'
                                ? tokenInfo.blockchains
                                : JSON.stringify(tokenInfo.blockchains);
                        } catch(e) {}
                    }

                    const { error: insertError } = await supabase
                        .from('crypto_token_histry')
                        .insert([{
                            user_id: userId,
                            symbol: symbol,
                            action: 'buying',
                            qty: qtyNum,
                            price_at_transacti: parseFloat(priceAtTx) || 0,
                            total_amount: parseFloat(totalAmt) || 0,
                            blockchain_used: blockchainStr,
                            status: 'active'
                        }]);

                    if (insertError) throw insertError;
                }
            } catch (error) {
                console.error('addTokenToHistory error:', error);
                throw error;
            }
        }

        // ===== CUT TOKEN FROM crypto_token_histry =====
        // Subtract qty from user's existing token row
        async function cutTokenFromHistory(userId, symbol, qty) {
            try {
                const qtyNum = parseFloat(qty) || 0;
                if (qtyNum <= 0) return;

                // Find existing record
                const { data: existing, error: fetchError } = await supabase
                    .from('crypto_token_histry')
                    .select('id, qty')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .maybeSingle();

                if (fetchError) {
                    console.error('cutTokenFromHistory fetch error:', fetchError);
                    return;
                }

                if (existing) {
                    const currentQty = parseFloat(existing.qty) || 0;
                    const newQty = Math.max(0, currentQty - qtyNum);
                    const { error: updateError } = await supabase
                        .from('crypto_token_histry')
                        .update({ qty: newQty })
                        .eq('id', existing.id);

                    if (updateError) throw updateError;
                }
            } catch (error) {
                console.error('cutTokenFromHistory error:', error);
                throw error;
            }
        }

        // ===== LOAD ORDER BOX =====
        async function loadOrderBox() {
            try {
                const { data: trades, error: tradesError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`*, order:user_p2p_order(*)`)
                    .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)
                    .in('status', ['pending', 'accepted', 'payment_done'])
                    .order('created_at', { ascending: false });

                if (tradesError) throw tradesError;

                const engagedOrderIds = trades.map(t => t.order_id);
                const { data: myOrders, error: myOrdersError } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .eq('status', 'active')
                    .not('id', 'in', `(${engagedOrderIds.join(',')})`);

                if (myOrdersError) throw myOrdersError;

                const container = document.getElementById('order-box');
                if (trades.length === 0 && myOrders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h3>No Active Trades or Orders</h3>
                            <p>You don't have any active trades or created orders.</p>
                        </div>
                    `;
                    return;
                }

                let combinedHtml = '';

                combinedHtml += await Promise.all(trades.map(async trade => {
                    const isOwner = trade.order.user_id === currentUser.id;
                    const isSeller = trade.seller_id === currentUser.id;
                    const otherUser = isSeller ? 'Buyer' : 'Seller';
                    const otherUserId = isSeller ? trade.buyer_id : trade.seller_id;
                    const isTradeFinished = (trade.status === 'completed' || trade.status === 'cancelled' || trade.status === 'rejected');

                    return `
                        <div class="order-card ${isSeller ? 'sell-order' : ''}">
                            <div class="order-header">
                                <div class="token-info">
                                    ${getTokenIconHtml(trade.order.token_symbol)}
                                    <span class="token-symbol">${trade.order.token_symbol}</span>
                                    <span class="order-type ${isSeller ? 'sell-type' : 'buy-type'}">
                                        ${isSeller ? 'SELLING' : 'BUYING'}
                                    </span>
                                </div>
                                <div>
                                    <div class="detail-value" style="font-size:13px;color:#888;">Order: ${trade.order.order_id_unique}</div>
                                    <div class="detail-value" style="font-size:13px;color:#8b5cf6;margin-top:2px;">Status: ${trade.status}</div>

        // ===== CREATE ORDER MODAL =====
        function openCreateOrderModal() {
            document.getElementById('createOrderModal').style.display = 'block';
            updateTokenPrice();
        }

        function closeCreateOrderModal() {
            document.getElementById('createOrderModal').style.display = 'none';
            document.getElementById('createOrderForm').reset();
            // Unselect all payment options
            document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelectorAll('.payment-option input').forEach(cb => cb.checked = false);
            updateOrderType();
        }

        function updateOrderType() {
            const orderType = document.getElementById('orderType').value;
            const availableQuantity = document.getElementById('availableQuantity');
            const paymentDetails = document.getElementById('paymentDetails');

            if (orderType === 'sell') {
                availableQuantity.style.display = 'block';
                paymentDetails.style.display = 'block';
                updateAvailableQuantity();
            } else {
                availableQuantity.style.display = 'none';
                paymentDetails.style.display = 'none';
            }
        }

        // ===== UPDATE AVAILABLE QUANTITY using crypto_token_histry =====
        async function updateAvailableQuantity() {
            const tokenSelect = document.getElementById('tokenSelect');
            const availableQty = document.getElementById('availableQty');
            const selectedToken = tokenSelect.value;

            if (!selectedToken || !currentUser) {
                availableQty.textContent = '0';
                return;
            }

            try {
                const qty = await getTokenBalance(currentUser.id, selectedToken);
                availableQty.textContent = parseFloat(qty).toFixed(8);
            } catch (error) {
                console.error('Error getting available quantity:', error);
                availableQty.textContent = '0';
            }
        }

        // ===== UPDATE TOKEN PRICE =====
        function updateTokenPrice() {
            const tokenSelect = document.getElementById('tokenSelect');
            const livePrice = document.getElementById('livePrice');
            if (!tokenSelect || !tokenSelect.value) return;
            const selectedToken = tokenSelect.value;

            if (livePrices[selectedToken] !== undefined) {
                livePrice.textContent = `\u20B9${livePrices[selectedToken].toLocaleString('en-IN')}`;
            } else {
                livePrice.textContent = 'Loading...';
            }

            if (document.getElementById('orderType').value === 'sell') {
                updateAvailableQuantity();
            }
        }

        // ===== CALCULATE AMOUNT & QUANTITY =====
        function calculateAmount() {
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;
            const amount = quantity * price;
            document.getElementById('amount').value = Math.round(amount);
        }

        function calculateQuantity() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const tokenSelect = document.getElementById('tokenSelect');
            const selectedToken = tokenSelect.value;
            const price = livePrices[selectedToken] || 0;
            if (price > 0) {
                const quantity = amount / price;
                document.getElementById('quantity').value = quantity.toFixed(8);
            }
        }

        // ===== TOGGLE PAYMENT METHOD =====
        function togglePaymentMethod(method) {
            const checkbox = document.getElementById(method);
            const option = checkbox.parentElement;
            checkbox.checked = !checkbox.checked;
            if (checkbox.checked) {
                option.classList.add('selected');
            } else {
                option.classList.remove('selected');
            }
            const orderType = document.getElementById('orderType').value;
            if (orderType === 'sell') {
                const hasPaymentMethods = document.querySelectorAll('.payment-option input:checked').length > 0;
                document.getElementById('paymentDetails').style.display = hasPaymentMethods ? 'block' : 'none';
            }
        }

        // ===== GENERATE ORDER ID =====
        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();
            if (data) {
                return generateOrderId();
            }
            return result;
        }

        // ===== CREATE ORDER FORM SUBMIT =====
        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);

            if (!tokenSymbol) {
                showToast('Please select a token', 'error');
                return;
            }

            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }

            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between \u20B9100 and \u20B910,000', 'error');
                return;
            }

            const selectedPaymentMethods = Array.from(document.querySelectorAll('.payment-option input:checked'))
                .map(input => input.value);

            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }

            if (orderType === 'sell') {
                // Check balance from crypto_token_histry
                const availableQty = await getTokenBalance(currentUser.id, tokenSymbol);

                if (quantity > availableQty) {
                    showToast('Insufficient token balance', 'error');
                    return;
                }

                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;

                const needsPhone = selectedPaymentMethods.some(method =>
                    ['phonepe', 'googlepay', 'paytm'].includes(method)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');

                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }

                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }

            try {
                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);

                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully!', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            }
        });

        // ===== TRADE REQUEST: SELL TO BUY ORDER =====
        async function requestSellToOrder(orderId) {
            try {
                const { data: order, error: orderError } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('id', orderId)
                    .single();

                if (orderError) throw orderError;

                if (order.status !== 'active') {
                    showToast('This order is no longer available.', 'error');
                    loadAllData();
                    return;
                }

                // Check balance from crypto_token_histry
                const availableQty = await getTokenBalance(currentUser.id, order.token_symbol);

                if (availableQty < order.quantity) {
                    showToast('Insufficient token balance', 'error');
                    return;
                }

                await supabase.from('user_p2p_order').update({ status: 'pending' }).eq('id', orderId);

                const { data, error } = await supabase
                    .from('user_p2p_order_box')
                    .insert([{
                        order_id: orderId,
                        buyer_id: order.user_id,
                        buyer_username: order.username,
                        seller_id: currentUser.id,
                        seller_username: currentUser.user_metadata?.username || 'Anonymous',
                        status: 'pending',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                await sendAIMessage(data.id,
                    `${data.seller_username} wants to sell ${order.token_symbol} tokens to you. Type "accept" to proceed or "reject" to decline.`, 'buyer'
                );

                showToast('Sell request sent!', 'success');
                loadAllData();

            } catch (error) {
                console.error('Request sell error:', error);
                showToast('Failed to send sell request', 'error');
            }
        }

        async function loadChatMessages(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*')
                    .eq('id', tradeId)
                    .single();
                if (tradeError) throw tradeError;

                const { data: messages, error: messagesError } = await supabase
                    .from('trade_chat')
                    .select('*')
                    .eq('trade_id', tradeId)
                    .order('created_at', { ascending: true });

                if (messagesError) throw messagesError;

                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = messages.map(message => {
                    const senderRole = message.sender_id === trade.buyer_id
                        ? 'Buyer'
                        : (message.sender_id === trade.seller_id ? 'Seller' : '');

                    return `
                        <div class="chat-message ${message.sender_type === 'ai' ? 'ai-message' : ''}">
                            <div class="message-sender ${message.sender_type === 'ai' ? 'ai-sender' : ''}">
                                ${message.sender_type === 'ai' ? 'AvicnKnov Agent 2.0' : senderRole + ' ' + message.sender_username}
                            </div>
                            <div class="message-content">
                                ${message.message_type === 'text' ? message.content :
                                  message.message_type === 'image' ? `<img src="${message.content}" class="chat-image">` :
                                  message.content
                                }
                            </div>
                        </div>
                    `;
                }).join('');

                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                console.error('Load chat messages error:', error);
            }
        }

        async function sendMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            if (!message || !currentTradeOrder) return;

            try {
                const { error } = await supabase
                    .from('trade_chat')
                    .insert([{
                        trade_id: currentTradeOrder,
                        sender_id: currentUser.id,
                        sender_username: currentUser.user_metadata?.username || 'Anonymous',
                        sender_type: 'user',
                        message_type: 'text',
                        content: message,
                        created_at: new Date().toISOString()
                    }]);

                if (error) throw error;
                chatInput.value = '';
                await processUserMessage(currentTradeOrder, message.toLowerCase());

            } catch (error) {
                console.error('Send message error:', error);
                showToast('Failed to send message', 'error');
            }
        }

        async function sendImage() {
            const imageInput = document.getElementById('imageInput');
            const file = imageInput.files[0];
            if (!file || !currentTradeOrder) return;

            try {
                const fileName = `${Date.now()}_${file.name}`;
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('user-p2p-image')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: { publicUrl } } = supabase.storage
                    .from('user-p2p-image')
                    .getPublicUrl(fileName);

                const { error } = await supabase
                    .from('trade_chat')
                    .insert([{
                        trade_id: currentTradeOrder,
                        sender_id: currentUser.id,
                        sender_username: currentUser.user_metadata?.username || 'Anonymous',
                        sender_type: 'user',
                        message_type: 'image',
                        content: publicUrl,
                        created_at: new Date().toISOString()
                    }]);

                if (error) throw error;
                imageInput.value = '';
                await processUserMessage(currentTradeOrder, 'image');

            } catch (error) {
                console.error('Send image error:', error);
                showToast('Failed to send image', 'error');
            }
        }

        // ===== PROCESS USER MESSAGE =====
        async function processUserMessage(tradeId, message) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`*, order:user_p2p_order(*)`)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const isOrderCreator = trade.order.user_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;

                if (trade.status === 'pending') {
                    if (isOrderCreator && message.includes('accept')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'accepted' })
                            .eq('id', tradeId);

                        await supabase.from('user_p2p_order').update({ status: 'trading' }).eq('id', trade.order_id);

                        if (trade.order.order_type === 'sell') {
                            await sendAIMessage(tradeId,
                                `Trade accepted! Buyer, please make the payment of \u20B9${trade.order.amount.toLocaleString('en-IN')} using one of the available methods. After paying, please share the screenshot with transaction ID and UTR number.`, 'buyer'
                            );
                        } else {
                            const paymentMethods = trade.order.payment_methods.split(',');
                            let promptMessage = 'Trade accepted! Please send your payment details (e.g., PhonePe, Google Pay, Paytm, UPI) and a screenshot of the account where you want to receive payment.';
                            if (paymentMethods.length > 0) {
                                promptMessage = `Trade accepted! Please share your payment details for these methods: ${paymentMethods.join(', ')} and a screenshot of the account where you want to receive payment.`;
                            }
                            await sendAIMessage(tradeId, promptMessage, 'seller');
                        }

                    } else if (message.includes('reject')) {
                        await supabase
                            .from('user_p2p_order_box')
                            .update({ status: 'rejected' })
                            .eq('id', tradeId);
                        await supabase.from('user_p2p_order').update({ status: 'active' }).eq('id', trade.order_id);
                        await sendAIMessage(tradeId, 'Trade rejected by the order creator. The order is now available again.', 'both');
                    }
                }

                if (trade.status === 'accepted' && !isBuyer && (message.includes('image') || message.includes('phone') || message.includes('upi'))) {
                    await sendAIMessage(tradeId,
                        'Payment details received! Buyer, please make the payment of \u20B9' + trade.order.amount.toLocaleString('en-IN') + ' to the seller. Be sure to share a screenshot, transaction ID, and UTR number after you\'ve paid.', 'buyer'
                    );
                }

                if (trade.status === 'accepted' && isBuyer && (message.includes('paid') || message.includes('transaction') || message.includes('utr') || message.includes('image'))) {
                    await supabase
                        .from('user_p2p_order_box')
                        .update({ status: 'payment_done' })
                        .eq('id', tradeId);
                    await sendAIMessage(tradeId,
                        'Payment proof received! Seller, please check your bank/wallet for the payment and click "Release Tokens" once confirmed.', 'seller'
                    );
                }

            } catch (error) {
                console.error('Process user message error:', error);
            }
        }

        // ===== REJECT TRADE =====
        async function rejectTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'rejected' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await sendAIMessage(tradeId, 'Trade rejected. The order is now available again.', 'both');
                showToast('Trade rejected', 'success');
                loadAllData();

            } catch (error) {
                console.error('Reject trade error:', error);
                showToast('Failed to reject trade', 'error');
            }
        }

        // ===== TIMER =====
        function startTimer(tradeId, seconds, timerType) {
            const timerId = `${tradeId}_${timerType}`;
            if (timers[timerId]) {
                clearInterval(timers[timerId]);
            }
            let timeLeft = seconds;
            const updateTimer = () => {
                if (timeLeft <= 0) {
                    clearInterval(timers[timerId]);
                    delete timers[timerId];
                    handleTimerExpiry(tradeId, timerType);
                    return;
                }
                const timerDisplay = document.getElementById('timerDisplay');
                const timerText = document.getElementById('timerText');
                if (timerDisplay && timerText) {
                    timerDisplay.style.display = 'block';
                    timerText.textContent = `Timer: ${Math.floor(timeLeft / 60)}:${(timeLeft % 60).toString().padStart(2, '0')}`;
                }
                timeLeft--;
            };
            updateTimer();
            timers[timerId] = setInterval(updateTimer, 1000);
        }

        async function handleTimerExpiry(tradeId, timerType) {
            try {
                const timerDisplay = document.getElementById('timerDisplay');
                if (timerDisplay) timerDisplay.style.display = 'none';
            } catch (error) {
                console.error('Handle timer expiry error:', error);
            }
        }

        // ===== RELEASE TOKENS =====
        // Transfer tokens: cut from seller's crypto_token_histry, add to buyer's
        async function releaseTokens(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select(`*, order:user_p2p_order(*)`)
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                const tokenSymbol = trade.order.token_symbol;
                const tokenQty = trade.order.quantity;
                const tokenPrice = livePrices[tokenSymbol] || 0;
                const totalAmt = trade.order.amount || 0;

                console.log(`P2P Transfer: ${tokenQty} ${tokenSymbol} from ${trade.seller_id} to ${trade.buyer_id}`);

                // Transfer tokens via crypto_token_histry:
                // 1. Cut from seller
                await cutTokenFromHistory(trade.seller_id, tokenSymbol, tokenQty);
                // 2. Add to buyer
                await addTokenToHistory(trade.buyer_id, tokenSymbol, tokenQty, tokenPrice, totalAmt);

                // Update trade status
                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'completed' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.id);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'completed' })
                    .eq('id', trade.order.order_id_unique);

                // Update P&P stats
                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'completed'),
                    updatePnPStats(trade.seller_id, 'completed')
                ]);

                // Add to history tables
                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id,
                        action: 'buy',
                        token_symbol: tokenSymbol,
                        quantity: tokenQty,
                        amount: totalAmt,
                        status: 'completed',
                        other_user_id: trade.seller_id,
                        created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id,
                        action: 'sell',
                        token_symbol: tokenSymbol,
                        quantity: tokenQty,
                        amount: totalAmt,
                        status: 'completed',
                        other_user_id: trade.buyer_id,
                        created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Tokens released successfully! Trade completed.', 'both');

                showToast('Tokens released successfully!', 'success');
                loadAllData();
                closeChatModal();

            } catch (error) {
                console.error('Release tokens error:', error);
                showToast('Failed to release tokens', 'error');
            }
        }

        // ===== CANCEL TRADE =====
        async function cancelTrade(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();

                if (tradeError) throw tradeError;

                await supabase
                    .from('user_p2p_order_box')
                    .update({ status: 'cancelled' })
                    .eq('id', tradeId);

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'active' })
                    .eq('id', trade.order_id);

                await Promise.all([
                    updatePnPStats(trade.buyer_id, 'uncompleted'),
                    updatePnPStats(trade.seller_id, 'uncompleted')
                ]);

                await Promise.all([
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.buyer_id,
                        action: 'buy',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'cancelled',
                        other_user_id: trade.seller_id,
                        created_at: new Date().toISOString()
                    }]),
                    supabase.from('user_p2p_history').insert([{
                        user_id: trade.seller_id,
                        action: 'sell',
                        token_symbol: trade.order.token_symbol,
                        quantity: trade.order.quantity,
                        amount: trade.order.amount,
                        status: 'cancelled',
                        other_user_id: trade.buyer_id,
                        created_at: new Date().toISOString()
                    }])
                ]);

                await sendAIMessage(tradeId, 'Trade has been cancelled.', 'both');
                showToast('Trade cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel trade error:', error);
                showToast('Failed to cancel trade', 'error');
            }
        }

        // ===== CANCEL ORDER =====
        async function cancelOrder(orderId) {
            try {
                const { data: order, error } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('id', orderId)
                    .single();

                if (error || !order) throw error || new Error('Order not found');

                await supabase
                    .from('user_p2p_order')
                    .update({ status: 'cancelled' })
                    .eq('id', orderId);

                await supabase
                    .from('p2p_order_id')
                    .update({ status: 'cancelled' })
                    .eq('id', order.order_id_unique);

                await updatePnPStats(currentUser.id, 'uncompleted');

                await supabase.from('user_p2p_history').insert([{
                    user_id: currentUser.id,
                    action: order.order_type,
                    token_symbol: order.token_symbol,
                    quantity: order.quantity,
                    amount: order.amount,
                    status: 'cancelled',
                    other_user_id: null,
                    created_at: new Date().toISOString()
                }]);

                showToast('Order cancelled', 'success');
                loadAllData();

            } catch (error) {
                console.error('Cancel order error:', error);
                showToast('Failed to cancel order', 'error');
            }
        }

        // ===== REALTIME SUBSCRIPTIONS =====
        function setupRealtimeSubscriptions() {
            supabase
                .channel('p2p_public_changes')
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: '*', schema: 'public', table: 'user_p2p_order_box' },
                    () => { loadAllData(); }
                )
                .on('postgres_changes',
                    { event: 'UPDATE', schema: 'public', table: 'user-p&p', filter: `user_id=eq.${currentUser?.id}` },
                    (payload) => {
                        if (document.getElementById('pnp-tab').classList.contains('active')) {
                            loadPnPData();
                        }
                    }
                )
                .subscribe();
        }

        function setupChatRealtimeSubscription(tradeId) {
            if (activeChats[tradeId]) {
                supabase.removeChannel(activeChats[tradeId]);
            }
            const chatChannel = supabase
                .channel(`trade_chat_${tradeId}`)
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'trade_chat', filter: `trade_id=eq.${tradeId}` },
                    (payload) => { loadChatMessages(tradeId); }
                )
                .subscribe();
            activeChats[tradeId] = chatChannel;
        }

        // ===== UTILITY: SHOW TOAST =====
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== CHAT INPUT ENTER KEY =====
        document.getElementById('chatInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // ===== CLEANUP ON UNLOAD =====
        window.addEventListener('beforeunload', function() {
            if (priceInterval) {
                clearInterval(priceInterval);
            }
            Object.values(timers).forEach(timer => {
                clearInterval(timer);
            });
            supabase.removeAllChannels();
        });

        // ===== GET UID =====
        async function getUID(userId) {
            try {
                const { data, error } = await supabase
                    .from('uid')
                    .select('uid')
                    .eq('user_id', userId)
                    .single();
                if (error || !data) return "Unavailable";
                return data.uid;
            } catch (e) {
                return "Unavailable";
            }
        }

        // ===== INITIALIZE P&P PROFILE =====
        async function initializePnPProfile() {
            const { data, error } = await supabase
                .from('user-p&p')
                .select('user_id')
                .eq('user_id', currentUser.id)
                .single();

            if (!data) {
                await supabase.from('user-p&p').insert([{ user_id: currentUser.id }]);
            }
        }

        // ===== LOAD P&P DATA =====
        async function loadPnPData() {
            const uid = await getUID(currentUser.id);
            document.getElementById('pnp-uid').textContent = uid;

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', currentUser.id)
                .single();

            if (data) {
                document.getElementById('userRole').value = data.role;
                document.getElementById('pnp-completed-orders').textContent = data.completed_orders;
                document.getElementById('pnp-uncompleted-orders').textContent = data.uncompleted_orders;
            }
        }

        // ===== UPDATE USER ROLE =====
        async function updateUserRole() {
            const newRole = document.getElementById('userRole').value;
            const { data, error } = await supabase
                .from('user-p&p')
                .select('role_last_updated')
                .eq('user_id', currentUser.id)
                .single();

            if (data && data.role_last_updated) {
                const lastUpdated = new Date(data.role_last_updated);
                const twentyFourHoursAgo = new Date(Date.now() - 24 * 60 * 60 * 1000);
                if (lastUpdated > twentyFourHoursAgo) {
                    showToast('You can only change your role once every 24 hours.', 'error');
                    loadPnPData();
                    return;
                }
            }

            const { error: updateError } = await supabase
                .from('user-p&p')
                .update({ role: newRole, role_last_updated: new Date().toISOString() })
                .eq('user_id', currentUser.id);

            if (updateError) {
                showToast('Failed to update role.', 'error');
            } else {
                showToast('Role updated successfully.', 'success');
            }
        }

        // ===== OPEN P&P MODAL =====
        async function openPnPModal(userId, uidOnly = false) {
            const modal = document.getElementById('pnpModal');
            const modalBody = document.getElementById('pnpModalBody');
            modal.style.display = 'block';
            modalBody.innerHTML = `<div class="loading">Loading user profile...</div>`;

            const uid = await getUID(userId);

            if (uidOnly) {
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label class="form-label">User's UID</label>
                        <div class="uid-display">${uid}</div>
                    </div>
                `;
                return;
            }

            const { data, error } = await supabase
                .from('user-p&p')
                .select('*')
                .eq('user_id', userId)
                .single();

            if (error || !data) {
                modalBody.innerHTML = `<div class="empty-state"><h3>Profile not found</h3></div>`;
                return;
            }

            modalBody.innerHTML = `
                <div class="form-group">
                    <label class="form-label">User's UID</label>
                    <div class="uid-display">${uid}</div>
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <div class="uid-display" style="text-transform: capitalize;">${data.role}</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box green-box">
                        <h4>Completed Orders</h4>
                        <p>${data.completed_orders}</p>
                    </div>
                    <div class="stat-box red-box">
                        <h4>Uncompleted Orders</h4>
                        <p>${data.uncompleted_orders}</p>
                    </div>
                </div>
            `;
        }

        // ===== CLOSE P&P MODAL =====
        function closePnPModal() {
            document.getElementById('pnpModal').style.display = 'none';
        }

        // ===== UPDATE P&P STATS =====
        async function updatePnPStats(userId, type) {
            const { data, error } = await supabase.rpc('update_pnp_stats', {
                p_user_id: userId,
                p_type: type
            });
            if (error) console.error('Error updating PnP stats:', error);
        }
    </script>
