<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Trading - AvicnKnov</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* =========================================================
           PREMIUM DARK CRYPTO THEME - BASE RESET
        ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #050b18;
            --bg-secondary: #0a1428;
            --bg-card: #0d1a2e;
            --bg-card-hover: #112035;
            --bg-modal: #0a1428;
            --accent-gold: #f0b429;
            --accent-gold-dim: #c8930a;
            --accent-green: #00d4aa;
            --accent-green-dim: #00a882;
            --accent-red: #ff4757;
            --accent-red-dim: #cc3344;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-teal: #14b8a6;
            --text-primary: #e8eaf6;
            --text-secondary: #94a3b8;
            --text-muted: #4a5568;
            --border-color: rgba(240, 180, 41, 0.15);
            --border-glow: rgba(0, 212, 170, 0.3);
            --glow-green: 0 0 20px rgba(0, 212, 170, 0.25);
            --glow-gold: 0 0 20px rgba(240, 180, 41, 0.25);
            --glow-red: 0 0 20px rgba(255, 71, 87, 0.25);
            --gradient-primary: linear-gradient(135deg, #0a1428 0%, #050b18 100%);
            --gradient-card: linear-gradient(145deg, #0d1a2e, #091525);
            --gradient-green: linear-gradient(135deg, #00d4aa, #00a882);
            --gradient-gold: linear-gradient(135deg, #f0b429, #c8930a);
            --gradient-red: linear-gradient(135deg, #ff4757, #cc3344);
            --gradient-blue: linear-gradient(135deg, #3b82f6, #2563eb);
            --gradient-purple: linear-gradient(135deg, #8b5cf6, #7c3aed);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(0, 212, 170, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(240, 180, 41, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(59, 130, 246, 0.03) 0%, transparent 50%);
        }

        /* =========================================================
           SCROLLBAR STYLING
        ========================================================= */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(240, 180, 41, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(240, 180, 41, 0.6);
        }

        /* =========================================================
           CONTAINER & LAYOUT
        ========================================================= */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px;
        }

        /* =========================================================
           HEADER
        ========================================================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px;
            border-radius: var(--radius-xl);
            margin-bottom: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(240, 180, 41, 0.5), rgba(0, 212, 170, 0.5), transparent);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #f0b429, #00d4aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .header-badge {
            background: linear-gradient(135deg, rgba(240,180,41,0.15), rgba(0,212,170,0.15));
            border: 1px solid rgba(240,180,41,0.3);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn, .add-order-btn {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            letter-spacing: 0.3px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: translateX(-2px);
        }

        .add-order-btn {
            background: var(--gradient-green);
            color: #fff;
            box-shadow: var(--glow-green);
        }

        .add-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 170, 0.4);
        }

        /* =========================================================
           REFRESH INDICATOR
        ========================================================= */
        .refresh-indicator {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.2);
            color: var(--accent-green);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            letter-spacing: 0.5px;
        }

        .refresh-indicator.show {
            opacity: 1;
        }

        /* =========================================================
           TABS
        ========================================================= */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 18px;
            background: rgba(13, 26, 46, 0.6);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 6px;
            backdrop-filter: blur(10px);
        }

        .tab {
            flex: 1;
            padding: 10px 8px;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .tab.active {
            background: var(--gradient-gold);
            color: var(--bg-primary);
            box-shadow: var(--glow-gold);
        }

        /* =========================================================
           TAB CONTENT
        ========================================================= */
        .tab-content {
            display: none;
            background: rgba(13, 26, 46, 0.5);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: 20px;
            min-height: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           TOKEN FILTER BAR
        ========================================================= */
        .token-filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .token-filter-bar::-webkit-scrollbar {
            display: none;
        }

        .token-filter-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            transition: var(--transition);
        }

        .token-filter-chip:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .token-filter-chip.active {
            background: rgba(240, 180, 41, 0.12);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .token-chip-icon {
            font-size: 14px;
            line-height: 1;
        }

        /* =========================================================
           ORDER CARDS
        ========================================================= */
        .order-card {
            background: var(--gradient-card);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--gradient-green);
            border-radius: 3px 0 0 3px;
        }

        .order-card.sell-card::before {
            background: var(--gradient-red);
        }

        .order-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-glow);
            box-shadow: var(--glow-green), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .order-card.sell-card:hover {
            box-shadow: var(--glow-red), 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .token-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .token-icon-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(240, 180, 41, 0.1);
            border: 1px solid rgba(240, 180, 41, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
            overflow: hidden;
            flex-shrink: 0;
        }

        .token-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .token-info-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .token-symbol {
            font-size: 15px;
            font-weight: 800;
            color: var(--accent-gold);
            letter-spacing: 0.5px;
        }

        .token-fullname {
            font-size: 11px;
            color: var(--text-muted);
        }

        .order-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .buy-type {
            background: rgba(0, 212, 170, 0.12);
            color: var(--accent-green);
            border: 1px solid rgba(0, 212, 170, 0.25);
        }

        .sell-type {
            background: rgba(255, 71, 87, 0.12);
            color: var(--accent-red);
            border: 1px solid rgba(255, 71, 87, 0.25);
        }

        .price-display {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .payment-methods {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .payment-method {
            padding: 3px 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 100px;
            padding: 9px 14px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .buy-btn {
            background: var(--gradient-green);
            color: #fff;
            box-shadow: var(--glow-green);
        }

        .sell-btn {
            background: var(--gradient-red);
            color: white;
            box-shadow: var(--glow-red);
        }

        .cancel-btn {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
        }

        .report-btn {
            background: linear-gradient(135deg, #f9a825, #f57f17);
            color: white;
        }

        .chat-btn {
            background: var(--gradient-blue);
            color: white;
        }

        .release-btn {
            background: var(--gradient-purple);
            color: white;
        }

        .reject-btn {
            background: linear-gradient(135deg, #795548, #4e342e);
            color: white;
        }

        .pnp-btn {
            background: linear-gradient(135deg, #673AB7, #4527A0);
            color: white;
        }

        /* =========================================================
           MODAL STYLES
        ========================================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-modal);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 28px;
            width: 92%;
            max-width: 500px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: rgba(255, 71, 87, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* =========================================================
           FORM STYLES
        ========================================================= */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--text-primary);
            transition: var(--transition);
            outline: none;
        }

        .form-select option {
            background: var(--bg-modal);
            color: var(--text-primary);
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-gold);
            background: rgba(240, 180, 41, 0.04);
            box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .payment-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-secondary);
            font-size: 13px;
        }

        .payment-option:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(240, 180, 41, 0.05);
        }

        .payment-option.selected {
            border-color: var(--accent-gold);
            background: rgba(240, 180, 41, 0.1);
            color: var(--accent-gold);
        }

        .payment-option input[type="checkbox"] {
            accent-color: var(--accent-gold);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient-green);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--glow-green);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 170, 0.5);
        }

        /* =========================================================
           LIVE PRICE DISPLAY
        ========================================================= */
        .live-price {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 180, 41, 0.08);
            border: 1px solid rgba(240, 180, 41, 0.2);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-gold);
        }

        .live-price-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .available-balance-box {
            background: rgba(0, 212, 170, 0.06);
            border: 1px solid rgba(0, 212, 170, 0.2);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .balance-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .balance-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* =========================================================
           TOKEN SELECT DROPDOWN (custom styled)
        ========================================================= */
        .token-select-wrapper {
            position: relative;
        }

        .token-select-display {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .token-select-display:hover {
            border-color: var(--accent-gold);
        }

        .token-select-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* =========================================================
           CHAT MODAL
        ========================================================= */
        .chat-container {
            height: 380px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .chat-messages {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
        }

        .chat-message {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ai-sender {
            color: var(--accent-gold) !important;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent-green);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.5;
        }

        .ai-message .message-content {
            border-left-color: var(--accent-gold);
            background: rgba(240, 180, 41, 0.06);
            color: var(--text-primary);
        }

        .chat-image {
            max-width: 200px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .chat-input-container {
            display: flex;
            gap: 8px;
            padding: 12px;

<body>

    <!-- BACKGROUND REFRESH INDICATOR (invisible to user) -->

         CHAT MODAL
    ============================ -->
    <div id="chatModal" class="modal">

    <!-- ===========================
         JAVASCRIPT
    ============================ -->
    <script>
        // ============================================================
        // SUPABASE CONFIGURATION
        // ============================================================
        var SUPA_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';

        var supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        // ============================================================
        // GLOBAL VARIABLES
        // ============================================================
        let currentUser = null;
        let livePrices = {};
        let currentTradeOrder = null;
        let priceInterval = null;
        let backgroundRefreshInterval = null;
        let timers = {};
        let activeChats = {};
        let p2pTokens = [];           // Tokens from crypto_token_control table
        let activeTokenFilter = 'all'; // For buy/sell tab token filter chips
        let currentTokenData = {};    // Map of symbol -> token data

        // ============================================================
        // INITIALIZATION
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            await checkAuth();
            await loadP2PTokens();
            await loadAllData();
            startPriceUpdates();
            setupRealtimeSubscriptions();
            startBackgroundRefresh();
        });

        // ============================================================
        // AUTH FUNCTIONS
        // ============================================================
        async function checkAuth() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    showToast('Please login to access P2P trading', 'error');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                    return;
                }
                currentUser = user;
                await initializePnPProfile();
            } catch (err) {
                console.error('Auth check error:', err);
            }
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function goBack() {
            window.location.href = 'trade.html';
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');

            switch (tabName) {
                case 'buy':     loadBuyOrders(); break;
                case 'sell':    loadSellOrders(); break;
                case 'orderbox': loadOrderBox(); break;
                case 'history': loadHistory(); break;
                case 'pnp':     loadPnPData(); break;
            }
        }

        // ============================================================
        // LOAD ALL DATA
        // ============================================================
        async function loadAllData() {
            await Promise.all([
                loadBuyOrders(),
                loadSellOrders(),
                loadOrderBox(),
                loadHistory()
            ]);
        }

        // ============================================================
        // BACKGROUND SILENT REFRESH (every 5 seconds)
        // ============================================================
        function startBackgroundRefresh() {
            if (backgroundRefreshInterval) {
                clearInterval(backgroundRefreshInterval);
            }
            backgroundRefreshInterval = setInterval(async () => {
                await silentRefresh();
            }, 5000);
        }

        async function silentRefresh() {
            try {
                // Update prices silently
                await fetchAndUpdateAllPrices();
                // Refresh data in background without showing loading states
                const activeTab = document.querySelector('.tab-content.active');
                if (!activeTab) return;

                const tabId = activeTab.id;
                if (tabId === 'buy-tab') await loadBuyOrders(true);
                else if (tabId === 'sell-tab') await loadSellOrders(true);
                else if (tabId === 'orderbox-tab') await loadOrderBox(true);
                else if (tabId === 'history-tab') await loadHistory(true);
            } catch (err) {
                // Silent - no error toast for background refresh
            }
        }

        // ============================================================
        // TOKEN CONTROL - Load tokens from crypto_token_control table
        // ============================================================
        async function loadP2PTokens() {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_control')
                    .select('*')
                    .order('id', { ascending: true });

                if (error) throw error;

                // Filter: only tokens NOT blocked for p2p.html in nosupported_js
                p2pTokens = (data || []).filter(token => {
                    if (!token.nosupported_js) return true;
                    const blocked = token.nosupported_js.toLowerCase();
                    return !blocked.includes('p2p.html');
                });

                // Build lookup map
                currentTokenData = {};
                p2pTokens.forEach(t => {
                    currentTokenData[t.symbol] = t;
                });

                // Populate token dropdown in create order modal
                populateTokenDropdown();

                // Build filter chips for buy/sell tabs
                buildTokenFilterChips();

                // Fetch initial prices
                await fetchAndUpdateAllPrices();

            } catch (err) {
                console.error('Load P2P tokens error:', err);
            }
        }

        function populateTokenDropdown() {
            const tokenSelect = document.getElementById('tokenSelect');
            if (!tokenSelect) return;

            tokenSelect.innerHTML = '';

            if (p2pTokens.length === 0) {
                tokenSelect.innerHTML = '<option value="">No tokens available</option>';
                return;
            }

            p2pTokens.forEach(token => {
                const option = document.createElement('option');

        // ============================================================
        // PRICE FETCHING FROM crypto_token_control
        // ============================================================
        async function fetchAndUpdateAllPrices() {
            if (p2pTokens.length === 0) return;

            const apiTokens = p2pTokens.filter(t => t.is_live_api && t.api_url);
            const manualTokens = p2pTokens.filter(t => !t.is_live_api || !t.api_url);

            // Manual price tokens: set directly
            manualTokens.forEach(token => {
                if (token.manual_price) {
                    livePrices[token.symbol] = parseFloat(token.manual_price);
                }
            });

            // API price tokens: fetch from each api_url
            for (const token of apiTokens) {
                try {
                    const response = await fetch(token.api_url);
                    const data = await response.json();
                    // Try common response patterns
                    let price = null;
                    if (typeof data === 'number') {
                        price = data;
                    } else if (data.price) {
                        price = parseFloat(data.price);
                    } else if (data.inr) {
                        price = parseFloat(data.inr);
                    } else if (data[token.symbol.toLowerCase()]) {
                        const t = data[token.symbol.toLowerCase()];
                        price = t.inr || t.price || t.usd;
                    } else {
                        // Try CoinGecko pattern: { "bitcoin": { "inr": 7000000 } }
                        const keys = Object.keys(data);
                        if (keys.length > 0 && data[keys[0]]) {
                            const innerObj = data[keys[0]];
                            price = innerObj.inr || innerObj.price || innerObj.usd;
                        }
                    }
                    if (price && !isNaN(price)) {
                        livePrices[token.symbol] = price;
                    }
                } catch (err) {
                    // If API fails, fallback to manual price
                    if (token.manual_price) {
                        livePrices[token.symbol] = parseFloat(token.manual_price);
                    }
                }
            }

            updateAllPriceDisplays();
        }

        function updateAllPriceDisplays() {
            // Update price in order create modal
            const tokenSelect = document.getElementById('tokenSelect');
            if (tokenSelect && tokenSelect.value) {
                updateTokenPrice();

            // Update price displays in order cards
            document.querySelectorAll('.order-card[data-symbol]').forEach(card => {
                const symbol = card.dataset.symbol;
                if (symbol && livePrices[symbol]) {
                    const priceEl = card.querySelector('.price-display');
                    if (priceEl) {
                        priceEl.textContent = '₹' + livePrices[symbol].toLocaleString('en-IN', {maximumFractionDigits: 4});
                    }
                }
            });
        }

        function startPriceUpdates() {

        /**
         * Get user's token balance from crypto_token_histry
         * Balance = SUM of qty where action='credit' minus SUM where action='debit'
         * Only records with status='active' are counted
         */
        async function getTokenBalanceFromDB(userId, symbol) {
            try {
                const { data, error } = await supabase
                    .from('crypto_token_histry')
                    .select('action, qty, status')
                    .eq('user_id', userId)
                    .eq('symbol', symbol)
                    .eq('status', 'active');

                if (error) throw error;

                let balance = 0;
                (data || []).forEach(record => {
                    const qty = parseFloat(record.qty) || 0;
                    if (record.action === 'credit' || record.action === 'buy' || record.action === 'add') {
                        balance += qty;
                    } else if (record.action === 'debit' || record.action === 'sell' || record.action === 'deduct') {
                        balance -= qty;
                    }
                });

                return Math.max(balance, 0);
            } catch (err) {
                console.error('getTokenBalanceFromDB error:', err);
                return 0;
            }
        }

        /**
         * Deduct tokens from seller's account when sell order is accepted and tokens released
         */
        async function deductTokenFromSeller(userId, symbol, qty, priceAtTx, totalAmount) {
            try {
                const { error } = await supabase
                    .from('crypto_token_histry')
                    .insert([{
                        user_id: userId,
                        symbol: symbol,
                        action: 'debit',
                        qty: qty,
                        price_at_transaction: priceAtTx || livePrices[symbol] || 0,
                        total_amount: totalAmount || 0,
                        blockchain_used: getBestBlockchain(symbol),
                        status: 'active'
                    }]);
                if (error) throw error;
            } catch (err) {
                console.error('deductTokenFromSeller error:', err);
            }
        }

        /**
         * Get best blockchain string for a token symbol from crypto_token_control
         */
        function getBestBlockchain(symbol) {
            const tokenData = currentTokenData[symbol];
            if (!tokenData) return 'unknown';
            try {
                const chains = tokenData.blockchains;
                if (Array.isArray(chains) && chains.length > 0) return chains[0];
                if (typeof chains === 'string') return chains;
            } catch (e) {}
            return symbol.toLowerCase();
        }

                    await window.parent.updateHolding(symbol, qty, costInr);

        function updateOrderType() {
            const orderType = document.getElementById('orderType').value;

            const paymentDetails = document.getElementById('paymentDetails');

            if (orderType === 'sell') {
                availableQuantity.style.display = 'block';

        async function updateAvailableQuantity() {
            const tokenSelect = document.getElementById('tokenSelect');
            const availableQtyEl = document.getElementById('availableQty');
            const selectedToken = tokenSelect.value;

            if (!selectedToken) {
                availableQtyEl.textContent = '0.00000000';
                return;
            }

            try {
                // First try: crypto_token_histry table
                const dbBalance = await getTokenBalanceFromDB(currentUser.id, selectedToken);

                if (dbBalance > 0) {
                    availableQtyEl.textContent = dbBalance.toFixed(8) + ' ' + selectedToken;
                    return;
                }

                // Fallback: localStorage holdings
                const holdings = await getHoldings();
                const holding = holdings[selectedToken];
                const qty = holding ? holding.qty : 0;
                availableQtyEl.textContent = qty.toFixed(8) + ' ' + selectedToken;
            } catch (error) {
                console.error('Error getting available quantity:', error);
                availableQtyEl.textContent = '0.00000000';
            }
        }

        function updateTokenPrice() {
            const tokenSelect = document.getElementById('tokenSelect');
            const livePriceText = document.getElementById('livePriceText');
            const selectedToken = tokenSelect ? tokenSelect.value : '';

            if (!selectedToken) {
                if (livePriceText) livePriceText.textContent = 'Select a token';
                return;
            }

            const price = livePrices[selectedToken];
            const tokenData = currentTokenData[selectedToken];

            if (price && price > 0) {
                if (livePriceText) {
                    livePriceText.textContent = '₹' + price.toLocaleString('en-IN', { maximumFractionDigits: 6 });
                }
            } else {
                // Try manual price
                if (tokenData && tokenData.manual_price) {
                    const manualPrice = parseFloat(tokenData.manual_price);
                    livePrices[selectedToken] = manualPrice;
                    if (livePriceText) {
                        livePriceText.textContent = '₹' + manualPrice.toLocaleString('en-IN', { maximumFractionDigits: 6 });
                    }
                } else {
                    if (livePriceText) livePriceText.textContent = 'Loading...';
                }
            }

            if (document.getElementById('orderType').value === 'sell') {
                updateAvailableQuantity();
            }
        }

        function calculateAmount() {
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const selectedToken = document.getElementById('tokenSelect').value;
            const price = livePrices[selectedToken] || 0;

            if (price > 0 && quantity > 0) {
                const amount = quantity * price;
                document.getElementById('amount').value = Math.round(amount);
            }
        }

        function calculateQuantity() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const selectedToken = document.getElementById('tokenSelect').value;
            const price = livePrices[selectedToken] || 0;

            if (price > 0 && amount > 0) {
                const quantity = amount / price;
                document.getElementById('quantity').value = quantity.toFixed(8);
            }
        }

        function togglePaymentMethod(method) {
            const checkbox = document.getElementById(method);
            const option = checkbox.parentElement;

            checkbox.checked = !checkbox.checked;
            option.classList.toggle('selected', checkbox.checked);

            const orderType = document.getElementById('orderType').value;
            if (orderType === 'sell') {
                const hasPaymentMethods = document.querySelectorAll('.payment-option input:checked').length > 0;
                document.getElementById('paymentDetails').style.display = hasPaymentMethods ? 'block' : 'none';
            }
        }

        async function generateOrderId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 8; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }

            const { data, error } = await supabase
                .from('p2p_order_id')
                .select('id')
                .eq('id', result)
                .single();

            if (data) {
                return generateOrderId();
            }

            return result;
        }

        // ============================================================
        // CREATE ORDER FORM SUBMIT
        // ============================================================
        document.getElementById('createOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const orderType = document.getElementById('orderType').value;
            const tokenSymbol = document.getElementById('tokenSelect').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const amount = parseFloat(document.getElementById('amount').value);

            if (!tokenSymbol) {
                showToast('Please select a token', 'error');
                return;
            }

            if (!quantity || quantity <= 0) {
                showToast('Please enter a valid quantity', 'error');
                return;
            }

            if (!amount || amount < 100 || amount > 10000) {
                showToast('Amount must be between ₹100 and ₹10,000', 'error');
                return;
            }

            const selectedPaymentMethods = Array.from(
                document.querySelectorAll('.payment-option input:checked')
            ).map(input => input.value);

            if (selectedPaymentMethods.length === 0) {
                showToast('Please select at least one payment method', 'error');
                return;
            }

            if (orderType === 'sell') {
                // Check balance from crypto_token_histry first
                let availableQty = 0;

                const dbBalance = await getTokenBalanceFromDB(currentUser.id, tokenSymbol);

                if (dbBalance > 0) {
                    availableQty = dbBalance;
                } else {
                    // Fallback to localStorage
                    const holdings = await getHoldings();
                    const holding = holdings[tokenSymbol];
                    availableQty = holding ? holding.qty : 0;
                }

                if (quantity > availableQty) {
                    showToast('Insufficient token balance. Available: ' + availableQty.toFixed(8) + ' ' + tokenSymbol, 'error');
                    return;
                }

                const phoneNumber = document.getElementById('phoneNumber').value;
                const upiId = document.getElementById('upiId').value;

                const needsPhone = selectedPaymentMethods.some(m =>
                    ['phonepe', 'googlepay', 'paytm'].includes(m)
                );
                const needsUpi = selectedPaymentMethods.includes('upi');

                if (needsPhone && !phoneNumber) {
                    showToast('Please enter phone number for selected payment methods', 'error');
                    return;
                }

                if (needsUpi && !upiId) {
                    showToast('Please enter UPI ID', 'error');
                    return;
                }
            }

            try {
                const submitBtn = this.querySelector('.submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Creating...';

                const orderIdUnique = await generateOrderId();

                const { error: idError } = await supabase
                    .from('p2p_order_id')
                    .insert([{
                        id: orderIdUnique,
                        user_id: currentUser.id,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        status: 'active'
                    }]);

                if (idError) throw idError;

                const { data, error } = await supabase
                    .from('user_p2p_order')
                    .insert([{
                        user_id: currentUser.id,
                        username: currentUser.user_metadata?.username || 'Anonymous',
                        order_id_unique: orderIdUnique,
                        order_type: orderType,
                        token_symbol: tokenSymbol,
                        quantity: quantity,
                        amount: amount,
                        payment_methods: selectedPaymentMethods.join(','),
                        payment_details: orderType === 'sell' ? JSON.stringify({
                            phone: document.getElementById('phoneNumber').value,
                            upi: document.getElementById('upiId').value
                        }) : null,
                        status: 'active',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                showToast('Order created successfully! 🎉', 'success');
                closeCreateOrderModal();
                loadAllData();

            } catch (error) {
                console.error('Create order error:', error);
                showToast('Failed to create order', 'error');
            } finally {
                const submitBtn = document.querySelector('#createOrderForm .submit-btn');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Create Order';
                }
            }
        });

        async function requestSellToOrder(orderId) {
            try {
                const { data: order, error: orderError } = await supabase
                    .from('user_p2p_order')
                    .select('*')
                    .eq('id', orderId)
                    .single();

                if (orderError) throw orderError;

                if (order.status !== 'active') {
                    showToast('This order is no longer available.', 'error');
                    loadAllData();
                    return;
                }

                // Check balance from crypto_token_histry
                let availableQty = 0;
                const dbBalance = await getTokenBalanceFromDB(currentUser.id, order.token_symbol);

                if (dbBalance > 0) {
                    availableQty = dbBalance;
                } else {
                    const holdings = await getHoldings();
                    const holding = holdings[order.token_symbol];
                    availableQty = holding ? holding.qty : 0;
                }

                if (availableQty < order.quantity) {
                    showToast('Insufficient token balance for this order', 'error');
                    return;
                }

                await supabase.from('user_p2p_order').update({ status: 'pending' }).eq('id', orderId);

                const { data, error } = await supabase
                    .from('user_p2p_order_box')
                    .insert([{
                        order_id: orderId,
                        buyer_id: order.user_id,
                        buyer_username: order.username,
                        seller_id: currentUser.id,
                        seller_username: currentUser.user_metadata?.username || 'Anonymous',
                        status: 'pending',
                        created_at: new Date().toISOString()
                    }])
                    .select()
                    .single();

                if (error) throw error;

                await sendAIMessage(data.id,
                    `${data.seller_username} wants to sell ${order.token_symbol} tokens to you. Type "accept" to proceed or "reject" to decline.`, 'buyer'
                );

                showToast('Sell request sent! ✅', 'success');
                loadAllData();

            } catch (error) {
                console.error('Request sell error:', error);
                showToast('Failed to send sell request', 'error');
            }
        }

        async function loadChatMessages(tradeId) {
            try {
                const { data: trade, error: tradeError } = await supabase
                    .from('user_p2p_order_box')
                    .select('*, order:user_p2p_order(*)')
                    .eq('id', tradeId)
                    .single();
                if (tradeError) throw tradeError;

                // Update trade room info bar
                if (trade.order) {
                    const tradeRoomInfo = document.getElementById('tradeRoomInfo');
                    const tradeRoomToken = document.getElementById('tradeRoomToken');
                    const tradeRoomStatus = document.getElementById('tradeRoomStatus');
                    tradeRoomInfo.style.display = 'flex';
                    tradeRoomToken.textContent = `${trade.order.token_symbol} — ₹${trade.order.amount.toLocaleString('en-IN')}`;
                    tradeRoomStatus.textContent = trade.status;
                    tradeRoomStatus.className = 'status-badge status-' + (trade.status || 'pending');
                }

                const { data: messages, error: messagesError } = await supabase
                    .from('trade_chat')
                    .select('*')
                    .eq('trade_id', tradeId)
                    .order('created_at', { ascending: true });

                if (messagesError) throw messagesError;

                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = messages.map(message => {
                    const senderRole = message.sender_id === trade.buyer_id ? 'Buyer'
                        : (message.sender_id === trade.seller_id ? 'Seller' : '');

                    return `
                        <div class="chat-message ${message.sender_type === 'ai' ? 'ai-message' : ''}">
                            <div class="message-sender ${message.sender_type === 'ai' ? 'ai-sender' : ''}">
                                ${message.sender_type === 'ai'
                                    ? '🤖 AvicnKnov Agent 2.0'
                                    : senderRole + ' — ' + message.sender_username}
                            </div>
                            <div class="message-content">
                                ${message.message_type === 'text'
                                    ? message.content
                                    : message.message_type === 'image'
                                        ? `<img src="${message.content}" class="chat-image" alt="Payment screenshot">`
                                        : message.content
                                }
                            </div>
                        </div>
                    `;
                }).join('');

                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Show trade action buttons
                const tradeActions = document.getElementById('tradeActions');
                const isSeller = trade.seller_id === currentUser.id;
                const isBuyer = trade.buyer_id === currentUser.id;
                const isOwner = trade.order && trade.order.user_id === currentUser.id;

                let actionsHtml = '';

                if (trade.status === 'payment_done' && isSeller) {
                    actionsHtml += `
                        <button class="action-btn release-btn" onclick="releaseTokens('${tradeId}')">
                            🔓 Release Tokens
                        </button>
                    `;
                }

                if (trade.status !== 'pending' && !['completed', 'cancelled', 'rejected'].includes(trade.status)) {
                    actionsHtml += `
                        <button class="action-btn cancel-btn" onclick="cancelTrade('${tradeId}')">
                            ✗ Cancel Trade
                        </button>
                    `;
                }

                if (trade.status === 'pending' && isOwner) {
                    actionsHtml += `
                        <button class="action-btn reject-btn" onclick="rejectTrade('${tradeId}')">
                            ✗ Reject Trade
                        </button>
                    `;
                }

                tradeActions.innerHTML = actionsHtml;

            } catch (error) {
                console.error('Load chat messages error:', error);
            }
        }

        async function sendMessage() {
            const chatInput = document.getElementById('chatInput');

            if (!message || !currentTradeOrder) return;

            try {
                const { error } = await supabase

        async function sendAIMessage(tradeId, message, recipient) {
            try {
                const { error } = await supabase
                    .from('trade_chat')
                    .insert([{
                        trade_id: tradeId,
                        sender_id: null,
                        sender_username: 'AvicnKnov Agent 2.0',

            } catch (error) {

            }
