<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdraw Funds - AvicnKnov Ex</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }

      /* Custom Scrollbar */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animations */
      .fade-in { animation: fadeIn 0.5s ease-out forwards; }
      .slide-up { animation: slideUp 0.5s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { 
        from { transform: translateY(20px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-12">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            ArrowLeft, Landmark, Bitcoin, Users, ShieldCheck, 
            Clock, Headphones, Copy, CheckCircle2, Mail, ChevronRight, AlertCircle 
        } from 'lucide-react';

        const WithdrawalPage = () => {
            const [copied, setCopied] = useState(false);
            const supportEmail = "help.avicnkvonteam@gmail.com";

            // --- Navigation Fix: Smart Back Logic (PRESERVED) ---
            const handleBack = () => {
                const fromSubPage = document.referrer.includes('withdrawal-upi.html') || 
                                    document.referrer.includes('withdrawal-crypto.html') || 
                                    document.referrer.includes('withdrawal-p2p.html');

                if (fromSubPage) {
                    window.location.href = 'dashboard.html';
                } else if (window.history.length > 1 && document.referrer !== "") {
                    window.history.back();
                } else {
                    window.location.href = 'dashboard.html';
                }
            };

            const navigateTo = (page) => {
                window.location.href = page;
            };

            const handleCopyEmail = () => {
                navigator.clipboard.writeText(supportEmail);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen text-slate-800 relative overflow-hidden">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <button 
                                onClick={handleBack} 
                                className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100"
                            >
                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <h1 className="text-xl font-black text-slate-800 tracking-tight">
                                Withdraw Funds
                            </h1>
                            <div className="w-10"></div> {/* Spacer for alignment */}
                        </div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 sm:px-6 pt-6">
                        
                        {/* Withdrawal Options */}
                        <section className="space-y-4 slide-up">
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider mb-4 ml-1">Select Withdrawal Method</p>
                            
                            {/* Option 1: UPI */}
                            <WithdrawalOption 
                                title="Withdraw via UPI / Bank"
                                subtitle="Direct transfer to your bank account"
                                icon={<Landmark className="w-6 h-6 text-white" />}
                                gradient="bg-gradient-to-tr from-indigo-500 to-purple-600"
                                shadow="shadow-indigo-500/30"
                                onClick={() => navigateTo('withdrawal-upi.html')}
                            />

                            {/* Option 2: Crypto */}
                            <WithdrawalOption 
                                title="Withdraw Crypto"
                                subtitle="USDT, BTC, ETH to external wallet"
                                icon={<Bitcoin className="w-6 h-6 text-white" />}
                                gradient="bg-gradient-to-tr from-amber-400 to-orange-500"
                                shadow="shadow-orange-500/30"
                                onClick={() => navigateTo('withdrawal-crypto.html')}
                            />

                            {/* Option 3: P2P */}
                            <WithdrawalOption 
                                title="P2P Withdrawal"
                                subtitle="Sell assets directly to verified peers"
                                icon={<Users className="w-6 h-6 text-white" />}
                                gradient="bg-gradient-to-tr from-emerald-400 to-green-600"
                                shadow="shadow-emerald-500/30"
                                onClick={() => navigateTo('withdrawal-p2p.html')}
                            />
                        </section>

                        {/* Security & Info Policy */}
                        <section className="mt-10 slide-up" style={{ animationDelay: '0.1s' }}>
                            <div className="bg-white rounded-3xl p-6 border border-slate-100 shadow-xl shadow-slate-200/50">
                                <div className="flex items-start gap-4 mb-5">
                                    <div className="p-3 bg-blue-50 rounded-2xl shrink-0 text-blue-500">
                                        <ShieldCheck className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h4 className="text-lg font-bold text-slate-800 mb-2">Secure Processing</h4>
                                        <p className="text-sm text-slate-500 leading-relaxed font-medium">
                                            Our withdrawal gateway is designed for speed and security. <span className="text-blue-600 font-bold">AvicnKnov</span> guarantees that your funds will reach their destination safely.
                                        </p>
                                    </div>
                                </div>
                                
                                <div className="flex items-center gap-3 pt-4 border-t border-slate-100">
                                    <Clock className="w-4 h-4 text-amber-500" />
                                    <p className="text-xs text-slate-400 font-bold">
                                        Processing time: Instant to 24 hours.
                                    </p>
                                </div>
                            </div>
                        </section>

                        {/* Support Section */}
                        <section className="mt-8 mb-8 slide-up" style={{ animationDelay: '0.2s' }}>
                            <div className="flex items-center justify-between mb-4 px-1">
                                <h3 className="text-lg font-bold text-slate-800">Support & Assistance</h3>
                                <button 
                                    onClick={() => window.location.href = 'help.html#/help'}
                                    className="flex items-center gap-2 text-xs font-bold text-blue-600 hover:text-blue-700 transition-colors px-4 py-2 rounded-full bg-blue-50 hover:bg-blue-100"
                                >
                                    <Headphones className="w-3.5 h-3.5" />
                                    <span>Help Center</span>
                                </button>
                            </div>

                            <div className="bg-white rounded-3xl border border-slate-100 p-5 shadow-sm">
                                <p className="text-slate-500 text-sm mb-5 leading-relaxed font-medium">
                                    Facing issues with a withdrawal? Don't worry. Our dedicated support team is here to resolve your queries immediately.
                                </p>

                                {/* Email Copy Box (Dark Theme Contrast) */}
                                <div 
                                    onClick={handleCopyEmail}
                                    className="group cursor-pointer relative overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 p-1 transition-transform active:scale-95 duration-200"
                                >
                                    <div className="bg-slate-800 rounded-xl p-4 flex items-center justify-between border border-slate-700 group-hover:border-slate-600 transition-colors">
                                        <div className="flex items-center gap-4 overflow-hidden">
                                            <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white text-slate-300 transition-colors duration-300">
                                                <Mail className="w-5 h-5" />
                                            </div>
                                            <div className="flex flex-col overflow-hidden">
                                                <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-0.5">Official Support Email</span>
                                                <span className="text-sm font-mono font-bold text-white truncate">
                                                    {supportEmail}
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="ml-2 pl-3 border-l border-slate-700 group-hover:border-slate-600 transition-colors">
                                            {copied ? (
                                                <CheckCircle2 className="w-5 h-5 text-emerald-400 animate-bounce" />
                                            ) : (
                                                <Copy className="w-5 h-5 text-slate-500 group-hover:text-blue-400" />
                                            )}
                                        </div>
                                    </div>
                                    
                                    {copied && (
                                        <div className="absolute inset-0 bg-slate-900/90 flex items-center justify-center backdrop-blur-[1px] z-20 rounded-2xl">
                                            <div className="flex items-center gap-2 bg-emerald-500 text-white px-4 py-2 rounded-full font-bold shadow-lg text-xs">
                                                <CheckCircle2 className="w-4 h-4" /> Copied!
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            );
        };

        // Reusable Option Card Component
        const WithdrawalOption = ({ title, subtitle, icon, gradient, shadow, onClick }) => (
            <button 
                onClick={onClick}
                className={`w-full group relative overflow-hidden bg-white rounded-3xl p-5 text-left transition-all duration-300 hover:shadow-2xl hover:-translate-y-1 shadow-xl shadow-slate-200/50 border border-slate-100`}
            >
                <div className="flex items-center justify-between relative z-10">
                    <div className="flex items-center gap-4">
                        <div className={`w-14 h-14 rounded-2xl ${gradient} flex items-center justify-center shadow-lg ${shadow}`}>
                            {icon}
                        </div>
                        <div>
                            <h3 className="text-lg font-black text-slate-800 mb-0.5 group-hover:text-blue-600 transition-colors">{title}</h3>
                            <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">{subtitle}</p>
                        </div>
                    </div>
                    <div className="w-8 h-8 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center group-hover:bg-blue-50 group-hover:text-blue-500 transition-colors">
                        <ChevronRight className="w-5 h-5" />
                    </div>
                </div>
            </button>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<WithdrawalPage />);
    </script>
</body>
</html>
