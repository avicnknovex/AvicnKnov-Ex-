
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Achievement System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #FFD700;
            --neon-blue: #00f3ff;
            --bg-dark: #050505;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 215, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Header Section --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            font-size: 24px;
            color: var(--gold);
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn:hover { transform: translateX(-5px); text-shadow: 0 0 10px var(--gold); }

        .my-ach-btn {
            background: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            color: #000;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            border: none;
            transition: 0.3s;
        }
        .my-ach-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--gold); }

        /* --- Main Content --- */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .ach-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
            backdrop-filter: blur(15px);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ach-card:hover { border-color: var(--gold); background: rgba(255,215,0,0.05); }

        /* Icon with Glow Effect */
        .ach-icon {
            width: 90px;
            height: 90px;
            background: #000;
            border: 3px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin-right: 25px;
            box-shadow: 0 0 15px var(--gold);
            position: relative;
            z-index: 2;
        }

        .ach-icon.glow-anim { animation: pulseGlow 2s infinite; }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px var(--gold); transform: scale(1); }
            50% { box-shadow: 0 0 30px var(--gold); transform: scale(1.05); }
            100% { box-shadow: 0 0 10px var(--gold); transform: scale(1); }
        }

        .ach-details { flex-grow: 1; }
        .ach-details h2 { font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 22px; margin-bottom: 5px; }
        .ach-details p { color: #ccc; font-size: 16px; margin-bottom: 8px; }
        .reward-tag { color: var(--neon-blue); font-weight: bold; font-size: 14px; text-transform: uppercase; }

        /* Buttons State */
        .btn-action {
            padding: 12px 30px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border: none;
            min-width: 130px;
            cursor: not-allowed;
            background: #222;
            color: #555;
            transition: 0.3s;
        }

        .btn-action.unlocked {
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.5);
        }

        .btn-action.claimed {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            cursor: default;
        }

        /* --- My Achievements Sidebar --- */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 999; display: none;
        }

        #myAchSection {
            position: fixed; right: -450px; top: 0; width: 400px; height: 100%;
            background: #0a0a0a; border-left: 2px solid var(--gold);
            z-index: 1000; padding: 30px; transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column;
        }

        #myAchSection.active { right: 0; }

        .close-panel { position: absolute; top: 20px; right: 20px; font-size: 30px; cursor: pointer; color: var(--gold); }

        .ach-list-scroll { overflow-y: auto; margin-top: 30px; flex-grow: 1; }

        .no-ach-text { text-align: center; margin-top: 100px; color: #555; font-size: 20px; font-family: 'Orbitron'; }

        /* Animation for Claim */
        .claim-move {
            animation: moveTowardsBag 1s ease-in-out forwards;
        }

        @keyframes moveTowardsBag {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.5) translate(100px, -200px) rotate(360deg); opacity: 0.7; }
            100% { transform: scale(1) translate(0, 0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="back-btn" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-chevron-left"></i> BACK
        </div>
        <div class="my-ach-btn" onclick="openMyAchievements()">
            MY ACHIEVEMENTS
        </div>
    </div>

    <div class="container" id="mainAchievementList">
        </div>

    <div class="overlay" id="overlay" onclick="closeMyAchievements()"></div>
    <div id="myAchSection">
        <div class="close-panel" onclick="closeMyAchievements()">&times;</div>
        <h1 style="color: var(--gold); font-family: 'Orbitron'; text-align: center;">COLLECTION</h1>
        <div id="collectionItems" class="ach-list-scroll">
            </div>
    </div>

    <audio id="successSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

    <script>
        const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const CURRENT_USER_UID = "USER_777"; // Dynamic UID setup karein login ke baad

        // 1. Static Achievement List (As per your request)
        const coreAchievements = [
            { id: 'ach_01', name: 'Master Trader', icon: '🏆', criteria: 'Trade ₹5,00,00,000 in total volume', reward_text: 'Reward: ₹10 - ₹10,00,000', file: 'favourites-all.js' },
            { id: 'ach_02', name: 'AVICNKNOV TRADER', icon: '💎', criteria: 'Deposit ₹1,000 to your wallet', reward_text: 'Reward: ₹100 Bonus', file: 'wallet-balance.js' },
            { id: 'ach_03', name: 'CTO TRADER', icon: '🛡️', criteria: 'Complete 10,000 Crypto Trades', reward_text: 'Reward: ₹370 Fixed', file: 'market-crypto.js' },
            { id: 'ach_04', name: 'P2P MASTER', icon: '🤝', criteria: 'Complete 100 P2P Orders', reward_text: 'Reward: ₹100 - ₹1,00,000', file: 'p2p.html' },
            { id: 'ach_05', name: 'ENTRY MASTER', icon: '👤', criteria: 'Participate in any Event section', reward_text: 'Reward: ₹10 - ₹1,000', file: 'events.html' }
        ];

        async function init() {
            renderList();
            checkUserGlobalStatus();
        }

        // List Render Function
        async function renderList() {
            const listDiv = document.getElementById('mainAchievementList');
            listDiv.innerHTML = '';

            // Fetch extra achievements from achievement-control table
            const { data: dbAch } = await _supabase.from('achievement-control').select('*');
            const totalAch = [...coreAchievements, ...(dbAch || [])];

            // Fetch already claimed achievements
            const { data: claimed } = await _supabase.from('my-achievements').select('achievement_id').eq('uid', CURRENT_USER_UID);
            const claimedIds = claimed ? claimed.map(c => c.achievement_id) : [];

            totalAch.forEach(ach => {
                const isClaimed = claimedIds.includes(ach.id);
                const card = document.createElement('div');
                card.className = 'ach-card';
                card.id = `card-${ach.id}`;

                card.innerHTML = `
                    <div class="ach-icon glow-anim" id="icon-${ach.id}">${ach.icon}</div>
                    <div class="ach-details">
                        <h2>${ach.name}</h2>
                        <p>${ach.criteria}</p>
                        <div class="reward-tag">${ach.reward_text}</div>
                    </div>
                    <button class="btn-action ${isClaimed ? 'claimed' : ''}" id="btn-${ach.id}" 
                            onclick="handleClaim('${ach.id}', '${ach.name}')" ${isClaimed ? 'disabled' : ''}>
                        ${isClaimed ? 'CLAIMED' : 'LOCKED'}
                    </button>
                `;
                listDiv.appendChild(card);
                
                if(!isClaimed) simulateTaskDetection(ach);
            });
        }

        // Real-time task detection simulation (Jo aapne JS files boli unse connect karne ke liye)
        function simulateTaskDetection(ach) {
            // Yahan logic aayega jo check karega ki user ne task complete kiya ya nahi
            // Example: Agar User UID ke 'all_achievement' column mein 'all' likha hai
            // To button turant 'UNLOCKED' ho jayega
        }

        async function checkUserGlobalStatus() {
            const { data } = await _supabase.from('my-achievements').select('*').eq('uid', CURRENT_USER_UID).eq('all_achievement', 'all');
            if(data && data.length > 0) {
                // Unlock all buttons logic
                const btns = document.querySelectorAll('.btn-action:not(.claimed)');
                btns.forEach(b => {
                    b.classList.add('unlocked');
                    b.innerText = "CLAIM NOW";
                });
            }
        }

        // --- Claim Logic with Sound and Movement ---
        async function handleClaim(id, name) {
            const btn = document.getElementById(`btn-${id}`);
            if(!btn.classList.contains('unlocked')) return;

            const icon = document.getElementById(`icon-${id}`);
            const sound = document.getElementById('successSound');

            // 1. Premium Animation & Sound
            icon.classList.add('claim-move');
            sound.play();

            // 2. Probabilistic Reward Calculation
            let reward = calculateReward(id);

            // 3. Update Supabase
            const { error } = await _supabase.from('my-achievements').insert([{
                uid: CURRENT_USER_UID,
                achievement_id: id,
                achievement_name: name,
                reward_amount: reward,
                claimed_at: new Date().toISOString()
            }]);

            if(!error) {
                setTimeout(() => {
                    btn.classList.remove('unlocked');
                    btn.classList.add('claimed');
                    btn.innerText = "CLAIMED";
                    btn.disabled = true;
                    icon.classList.remove('claim-move');
                    // Add to wallet balance logic can be added here
                }, 1000);
            }
        }

        function calculateReward(id) {
            const rand = Math.random() * 100;
            if(id === 'ach_01') { // Master Trader
                if(rand <= 0.1) return 1000000; // 0.1% chance for 10 Lakh
                if(rand <= 5) return 1000; // 5% chance for 1000
                return Math.floor(Math.random() * 50) + 10;
            }
            if(id === 'ach_02') return 100;
            if(id === 'ach_03') return 370;
            return 50; // Default
        }

        // --- My Achievements Sidebar Functions ---
        function openMyAchievements() {
            document.getElementById('myAchSection').classList.add('active');
            document.getElementById('overlay').style.display = 'block';
            fetchCollection();
        }

        function closeMyAchievements() {
            document.getElementById('myAchSection').classList.remove('active');
            document.getElementById('overlay').style.display = 'none';
        }

        async function fetchCollection() {
            const container = document.getElementById('collectionItems');
            const { data } = await _supabase.from('my-achievements').select('*').eq('uid', CURRENT_USER_UID);

            if(!data || data.length === 0) {
                container.innerHTML = `<div class="no-ach-text">NO ACHIEVEMENTS YET</div>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div style="background: rgba(255,215,0,0.1); border: 1px solid var(--gold); padding: 15px; border-radius: 12px; margin-bottom: 15px;">
                    <div style="font-weight: bold; color: gold;">${item.achievement_name}</div>
                    <div style="font-size: 14px; color: #00f3ff;">Reward Won: ₹${item.reward_amount}</div>
                    <div style="font-size: 11px; opacity: 0.6; margin-top: 5px;">Claimed: ${new Date(item.claimed_at).toLocaleString()}</div>
                </div>
            `).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
