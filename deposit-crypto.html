<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Crypto - AvicnKnov Exchange</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: white;
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
      
      .fade-in { animation: fadeIn 0.3s ease-out; }
      .slide-up { animation: slideUp 0.3s ease-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, Search, X, Copy, CheckCircle2, UploadCloud, 
            AlertCircle, Loader2, ChevronRight, Wallet
        } from 'lucide-react';

        // --- Supabase ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const DepositCrypto = () => {
            const [tokens, setTokens] = useState([]);
            const [loading, setLoading] = useState(true);
            const [search, setSearch] = useState('');
            const [selectedTokenSymbol, setSelectedTokenSymbol] = useState(null);
            const [selectedNetworkData, setSelectedNetworkData] = useState(null);
            const [amount, setAmount] = useState('');
            const [screenshot, setScreenshot] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [successMsg, setSuccessMsg] = useState('');

            // --- Navigation ---
const handleBack = () => {
    /**
     * window.history.length > 1 check karta hai ki kya pichhe jaane ke liye koi page hai.
     * document.referrer check karta hai ki user kisi link se aaya hai ya direct URL se.
     */
    if (window.history.length > 1 && document.referrer !== "") {
        // User jahan se aaya tha (Trade, Assets, ya Dashboard), wahi wapas bhej dega 
        // Isse Main HTML ke icons aur state disturb nahi honge.
        window.history.back();
    } else {
        // Agar koi history nahi milti (rare case), to default dashboard par bhej dega.
        window.location.href = 'dashboard.html';
    }
};

            // --- Fetch ---
            useEffect(() => {
                const fetchTokens = async () => {
                    try {
                        const { data, error } = await supabase
                            .from('user-crypto-control')
                            .select('*')
                            .order('token_symbol', { ascending: true });
                        if (error) throw error;
                        setTokens(data || []);
                    } catch (err) { console.error(err); } 
                    finally { setLoading(false); }
                };
                fetchTokens();
            }, []);

            // --- Derived State ---
            const uniqueTokens = Array.from(new Set(tokens.map(t => t.token_symbol)))
                .map(symbol => tokens.find(t => t.token_symbol === symbol));

            const filteredTokens = uniqueTokens.filter(t => 
                t.token_name.toLowerCase().includes(search.toLowerCase()) || 
                t.token_symbol.toLowerCase().includes(search.toLowerCase())
            );

            const availableNetworks = selectedTokenSymbol 
                ? tokens.filter(t => t.token_symbol === selectedTokenSymbol) 
                : [];

            // --- Handlers ---
            const handleTokenClick = (symbol) => {
                setSelectedTokenSymbol(symbol);
                setSearch('');
                const nets = tokens.filter(t => t.token_symbol === symbol);
                if (nets.length === 1) setSelectedNetworkData(nets[0]);
                else setSelectedNetworkData(null);
            };

            const handleCloseModal = () => {
                setSelectedTokenSymbol(null);
                setSelectedNetworkData(null);
                setAmount('');
                setScreenshot(null);
                setSuccessMsg('');
            };

            const handleSubmit = async () => {
                if (!selectedNetworkData || !amount || !screenshot) {
                    alert("Please fill all details and upload proof.");
                    return;
                }
                if (parseFloat(amount) < selectedNetworkData.min_deposit) {
                    alert(`Min deposit is ${selectedNetworkData.min_deposit}`);
                    return;
                }

                setSubmitting(true);
                try {
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) { alert("Please login."); setSubmitting(false); return; }

                    const userId = user.id;
                    const timestamp = new Date().toISOString();

                    // Upload
                    const ext = screenshot.name.split('.').pop();
                    const fileName = `crypto/${userId}/${Date.now()}.${ext}`;
                    const { error: upErr } = await supabase.storage.from('upi-payment-control').upload(fileName, screenshot);
                    if (upErr) throw upErr;
                    
                    const { data: { publicUrl } } = supabase.storage.from('upi-payment-control').getPublicUrl(fileName);

                    // Insert Deposit
                    await supabase.from('user-crypto-deposit').insert([{
                        user_id: userId,
                        token_name: selectedNetworkData.token_name,
                        network: selectedNetworkData.network,
                        amount: parseFloat(amount),
                        screenshot_url: publicUrl,
                        created_at: timestamp
                    }]);

                    // Insert Transaction
                    await supabase.from('user-transactions').insert([{
                        user_id: userId,
                        type: 'deposit',
                        method: 'Crypto',
                        amount: parseFloat(amount),
                        status: 'pending',
                        description: `Deposit ${selectedNetworkData.token_symbol} (${selectedNetworkData.network})`,
                        created_at: timestamp
                    }]);

                    setSuccessMsg("Submitted successfully. Reloading...");
                    setTimeout(() => window.location.reload(), 3000);

                } catch (e) {
                    console.error(e);
                    alert("Error: " + e.message);
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 text-white relative font-sans">
                     {/* Search & List UI (Same as React Component above) */}
                     {/* ... Simplified for brevity, follows exact logic of the React file ... */}
                     
                     <div className="p-4 relative z-10 max-w-xl mx-auto">
                        <header className="flex items-center mb-6 pt-2">
                             <button onClick={handleBack} className="p-2 bg-slate-900 rounded-full border border-slate-700">
                                <ArrowLeft className="w-5 h-5" />
                             </button>
                             <h1 className="ml-4 text-xl font-bold">Deposit Crypto</h1>
                        </header>

                        <div className="relative mb-6">
                            <Search className="absolute left-4 top-3.5 w-5 h-5 text-slate-500" />
                            <input 
                                className="w-full bg-slate-900 border border-slate-800 rounded-xl py-3 pl-12 text-white focus:border-blue-500 outline-none" 
                                placeholder="Search Coin"
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                            />
                        </div>

                        {loading ? <div className="text-center py-10"><Loader2 className="animate-spin inline" /></div> : (
                            <div className="space-y-3">
                                {filteredTokens.map(t => (
                                    <div key={t.id} onClick={() => handleTokenClick(t.token_symbol)} className="flex items-center justify-between p-4 bg-slate-900/50 border border-slate-800 rounded-xl cursor-pointer hover:border-blue-500/50">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-300">
                                                {t.token_symbol[0]}
                                            </div>
                                            <div>
                                                <p className="font-bold">{t.token_symbol}</p>
                                                <p className="text-xs text-slate-400">{t.token_name}</p>
                                            </div>
                                        </div>
                                        <ChevronRight className="w-5 h-5 text-slate-600" />
                                    </div>
                                ))}
                            </div>
                        )}
                     </div>

                     {selectedTokenSymbol && (
                         <div className="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 fade-in">
                            <div className="w-full max-w-lg bg-slate-900 rounded-t-3xl sm:rounded-3xl border border-slate-800 h-[85vh] flex flex-col slide-up">
                                <div className="flex justify-between p-5 border-b border-slate-800">
                                    <h2 className="font-bold text-lg">Deposit {selectedTokenSymbol}</h2>
                                    <button onClick={handleCloseModal}><X className="w-6 h-6 text-slate-400" /></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-6 flex-1">
                                    {successMsg ? (
                                        <div className="text-center py-10">
                                            <CheckCircle2 className="w-16 h-16 text-green-500 mx-auto mb-4" />
                                            <h3 className="text-xl font-bold">Submitted!</h3>
                                            <p className="text-slate-400">{successMsg}</p>
                                        </div>
                                    ) : (
                                        <>
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase">Select Blockchain</label>
                                                <div className="grid grid-cols-2 gap-3 mt-2">
                                                    {availableNetworks.map(n => (
                                                        <button 
                                                            key={n.id} 
                                                            onClick={() => setSelectedNetworkData(n)}
                                                            className={`p-3 rounded-xl border text-sm font-medium ${selectedNetworkData?.id === n.id ? 'bg-blue-600 border-blue-500' : 'bg-slate-950 border-slate-800'}`}
                                                        >
                                                            {n.network}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>

                                            {selectedNetworkData && (
                                                <div className="space-y-6 fade-in">
                                                    <div className="flex gap-4 text-center">
                                                        <div className="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                                            <p className="text-xs text-slate-500 uppercase">Fee</p>
                                                            <p className="font-mono font-bold">{selectedNetworkData.network_fee}</p>
                                                        </div>
                                                        <div className="flex-1 bg-slate-950 border border-slate-800 p-3 rounded-xl">
                                                            <p className="text-xs text-slate-500 uppercase">Min Deposit</p>
                                                            <p className="font-mono font-bold">{selectedNetworkData.min_deposit}</p>
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase">Address</label>
                                                        <div onClick={() => navigator.clipboard.writeText(selectedNetworkData.address)} className="bg-slate-950 border border-slate-700 p-4 rounded-xl flex justify-between mt-1 cursor-pointer">
                                                            <span className="font-mono text-sm truncate pr-2">{selectedNetworkData.address}</span>
                                                            <Copy className="w-5 h-5 text-slate-500" />
                                                        </div>
                                                    </div>

                                                    {selectedNetworkData.memo && (
                                                        <div>
                                                            <label className="text-xs font-bold text-slate-400 uppercase">Memo</label>
                                                            <div onClick={() => navigator.clipboard.writeText(selectedNetworkData.memo)} className="bg-slate-950 border border-slate-700 p-4 rounded-xl flex justify-between mt-1 cursor-pointer">
                                                                <span className="font-mono text-sm">{selectedNetworkData.memo}</span>
                                                                <Copy className="w-5 h-5 text-slate-500" />
                                                            </div>
                                                            <p className="text-xs text-red-400 mt-1 font-bold">Memo is REQUIRED</p>
                                                        </div>
                                                    )}

                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase">Amount</label>
                                                        <input type="number" value={amount} onChange={e => setAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 mt-1 font-mono text-lg" placeholder="0.00" />
                                                    </div>

                                                    <div>
                                                        <label className="text-xs font-bold text-slate-400 uppercase">Screenshot</label>
                                                        <input type="file" className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 mt-2" onChange={e => setScreenshot(e.target.files[0])} />
                                                    </div>

                                                    <button onClick={handleSubmit} disabled={submitting} className="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold">
                                                        {submitting ? "Processing..." : "Deposit"}
                                                    </button>
                                                </div>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                         </div>
                     )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<DepositCrypto />);
    </script>
</body>
</html>
