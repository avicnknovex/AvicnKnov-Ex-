<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Futures – AvicnKnov Ex</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
    /* Premium Font Styling */
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f8f9fc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Top Tab Premium Animation */
    .tab-btn {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 14px; /* Smooth corners */
      position: relative;
    }
    
    /* Click Effect */
    .tab-btn:active {
        transform: scale(0.95);
    }

    /* Active State for Top Tabs (Premium Pill Effect) */
    .tab-btn.active {
      background-color: #eff6ff; /* Light Blue Background */
      color: #2563eb; /* Blue 600 */
      font-weight: 800; /* Extra Bold */
      box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.15); /* Soft Glow */
    }

    /* Section Transition */
    .section {
      display: none;
      width: 100%; /* Force Full Width */
      animation: fadeInEffect 0.4s ease-out forwards;
    }
    .section.active {
      display: block;
    }

    /* Simplified Animation - ONLY Opacity to prevent layout jumps */
    @keyframes fadeInEffect {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body class="bg-[#f8f9fc] pb-20">

  <!-- Sticky Header Container -->
  <div class="sticky top-0 z-50 bg-white/95 backdrop-blur-xl border-b border-gray-100 shadow-sm transition-all duration-300 py-3">
    
    <!-- 🔝 Top Tabs (Premium Selective Effect) -->
    <div class="tabs flex justify-between px-2 gap-2 overflow-x-auto scrollbar-hide">
      <div class="tab-btn active flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showFutures('usdc')">USD-C</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showFutures('usdm')">USD-M</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showFutures('nexus')">NEXUS</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showFutures('primex')">PRIME&X</div>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="p-4 min-h-[600px] w-full">

    <!-- ✅ Section Content Areas (Styled as Premium Cards) -->    
    <div class="section active w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[400px] p-4" id="usdc">
      <!-- Content injected by futures-usdc.js -->
    </div>

    <div class="section w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[400px] p-4" id="usdm">
      <!-- Content injected by futures-usdm.js -->
    </div>

    <div class="section w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[400px] p-4" id="nexus">
      <!-- Content injected by futures-nexus.js -->
    </div>

    <div class="section w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[400px] p-4" id="primex">
      <!-- Content injected by futures-primex.js -->
    </div>

  </div>

  <!-- ✅ JavaScript to switch tabs -->    
  <script>  
    function showFutures(tabId) {  
      const tabs = document.querySelectorAll(".tab-btn");  
      tabs.forEach(t => t.classList.remove("active"));  

      const sections = document.querySelectorAll(".section");  
      sections.forEach(s => s.classList.remove("active"));  

      // Activate Button by matching onclick attribute text
      const activeBtn = Array.from(tabs).find(btn => btn.getAttribute('onclick').includes(tabId));
      if(activeBtn) activeBtn.classList.add("active");
      
      // Activate Content
      const target = document.getElementById(tabId);
      if(target) target.classList.add("active");
    }  
  </script>

  <!-- ✅ External JS Files -->
  <script src="futures-usdc.js"></script>
  <script src="futures-usdm.js"></script>
  <script src="futures-nexus.js"></script>
  <script src="futures-primex.js"></script>

</body>  
</html>
