<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Markets – AvicnKnov Ex</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
    /* Premium Font Styling */
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #f8f9fc;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide Scrollbar */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Top Tab Premium Animation */
    .tab-btn {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-radius: 14px; /* Smooth corners */
      position: relative;
    }
    
    /* Click Effect */
    .tab-btn:active {
        transform: scale(0.95);
    }

    /* Active State for Top Tabs (Premium Pill Effect) */
    .tab-btn.active {
      background-color: #eff6ff; /* Light Blue Background */
      color: #2563eb; /* Blue 600 */
      font-weight: 800; /* Extra Bold */
      box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.15); /* Soft Glow */
    }

    /* Remove old underline effect */
    .tab-btn::after {
      display: none;
    }

    /* Sub-Tab Pill Style (fav-tab) */
    .fav-tab {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Default State */
    .fav-tab {
        background-color: #f1f5f9; /* Slightly gray background for inactive */
        color: #64748b;
        border: 1px solid transparent;
    }
    /* Active State */
    .fav-tab.active {
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        transform: translateY(-1px);
    }

    /* Section Transition */
    .section {
      display: none;
      width: 100%; /* Force Full Width */
      animation: smoothFade 0.4s ease-out forwards;
    }
    .section.active {
      display: block;
    }
    
    /* Content Transition */
    .fav-content {
      display: none;
      width: 100%; /* Force Full Width to prevent corner expansion glitch */
      animation: smoothFade 0.4s ease-out forwards;
      transform-origin: center top; /* Ensure animation origin is centered */
    }
    .fav-content.active {
      display: block;
    }

    /* Improved Animation - No Scale, just Fade & Lift */
    @keyframes smoothFade {
      0% { 
        opacity: 0; 
        transform: translateY(10px); /* Start slightly lower */
      }
      100% { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }
  </style>
</head>

<body class="bg-[#f8f9fc] pb-20">

  <!-- Sticky Header Container (Search Removed) -->
  <div class="sticky top-0 z-50 bg-white/95 backdrop-blur-xl border-b border-gray-100 shadow-sm transition-all duration-300 py-2">
    
    <!-- 🔝 Top Tabs (Premium Selective Effect) -->
    <div class="tabs flex justify-between px-2 gap-2 overflow-x-auto scrollbar-hide">
      <!-- Added mx-1 and py-3 for better touch targets and spacing for the pill effect -->
      <div class="tab-btn active flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showSection('favourites')">Favourites</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showSection('market')">Market</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showSection('alpha')">Alpha</div>
      <div class="tab-btn flex-1 text-center py-3 cursor-pointer text-sm font-medium text-slate-500 hover:text-slate-800 whitespace-nowrap" onclick="showSection('flach')">Flach</div>
    </div>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="p-4 min-h-[600px] w-full">

    <!-- ⭐ Favourites Section -->
    <div class="section active w-full" id="favourites">
      <!-- Added w-full and flex-1 to buttons to stretch them -->
      <div class="fav-tabs flex w-full gap-3 pb-4 px-1 overflow-x-auto scrollbar-hide">
        <button class="fav-tab flex-1 active py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFavTab('all', event)">All</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFavTab('holdings', event)">Holdings</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFavTab('spot', event)">Spot</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFavTab('futures', event)">Futures</button>
      </div>
      
      <!-- Content Areas - Added w-full explicitly -->
      <div id="all" class="fav-content active w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="holdings" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="spot" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="futures" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
    </div>

    <!-- 📊 Market Section -->
    <div class="section w-full" id="market">
      <div class="fav-tabs flex w-full gap-3 pb-4 px-1 overflow-x-auto scrollbar-hide">
        <button class="fav-tab flex-1 active py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showMarketTab('crypto', event)">Crypto</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showMarketTab('market-spot', event)">Spot</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showMarketTab('usdm', event)">USD-M</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showMarketTab('coinm', event)">COIN-M</button>
      </div>

      <div id="crypto" class="fav-content active w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="market-spot" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="usdm" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="coinm" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
    </div>

    <!-- 🧠 Alpha Section -->
    <div class="section w-full" id="alpha">
      <div class="fav-tabs flex w-full gap-3 pb-4 px-1 overflow-x-auto scrollbar-hide">
        <button class="fav-tab flex-1 active py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showAlphaTab('alpha-all', event)">All</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showAlphaTab('alpha-coinm', event)">COIN-M</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showAlphaTab('alpha-mark', event)">Mark</button>
      </div>

      <div id="alpha-all" class="fav-content active w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="alpha-coinm" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="alpha-mark" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
    </div>

    <!-- ⚡ Flach Section -->
    <div class="section w-full" id="flach">
      <div class="fav-tabs flex w-full gap-3 pb-4 px-1 overflow-x-auto scrollbar-hide">
        <button class="fav-tab flex-1 active py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFlachTab('rubikb', event)">RUBIK-B</button>
        <button class="fav-tab flex-1 py-3 rounded-xl text-xs font-bold cursor-pointer whitespace-nowrap" onclick="showFlachTab('plqn', event)">PLQN</button>
      </div>

      <div id="rubikb" class="fav-content active w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
      <div id="plqn" class="fav-content w-full bg-white rounded-3xl shadow-sm border border-slate-100 min-h-[300px] p-4"></div>
    </div>

  </div>

  <!-- 🔁 JavaScript Logic (Preserved) -->
  <script>
    // Section Switch
    function showSection(sectionId) {
      document.querySelectorAll(".tab-btn").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));

      document.getElementById(sectionId).classList.add("active");
      document.querySelectorAll(".tab-btn").forEach(btn => {
        if (btn.textContent.trim().toLowerCase() === sectionId) {
          btn.classList.add("active");
        }
      });
    }

    // Favourites Tabs
    function showFavTab(tabId, event) {
      const tabs = document.querySelectorAll("#favourites .fav-tab");
      const contents = document.querySelectorAll("#favourites .fav-content");

      tabs.forEach(tab => tab.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));

      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
    }

    // Market Tabs
    function showMarketTab(tabId, event) {
      const tabs = document.querySelectorAll("#market .fav-tab");
      const contents = document.querySelectorAll("#market .fav-content");

      tabs.forEach(tab => tab.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));

      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
    }

    // Alpha Tabs
    function showAlphaTab(tabId, event) {
      const tabs = document.querySelectorAll("#alpha .fav-tab");
      const contents = document.querySelectorAll("#alpha .fav-content");

      tabs.forEach(tab => tab.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));

      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
    }

    // Flach Tabs
    function showFlachTab(tabId, event) {
      const tabs = document.querySelectorAll("#flach .fav-tab");
      const contents = document.querySelectorAll("#flach .fav-content");

      tabs.forEach(tab => tab.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));

      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
    }
  </script>

  <script src="favourites-all.js"></script>

  <script src="favourites-spot.js"></script>

  <script src="market-crypto.js"></script>

  <script src="alpha-all.js"></script>

  <script src="flach-rubikb.js"></script>
  <script src="flach-plqn.js"></script>

</body>
</html>
