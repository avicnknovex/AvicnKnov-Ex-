<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AvicnKnov Ex – Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
      body, html {
        height:100%; width:100%;
        background: url('https://imgpx.com/mbRZiaEdwWxL.png') no-repeat center center fixed;
        background-size: cover;
        display:flex; align-items:center; justify-content:center;
      }
      .container {
        background: rgba(0, 0, 0, 0.65);
        padding: 30px; border-radius: 15px;
        box-shadow: 0 0 20px #00ffe1;
        max-width: 400px;
        width: 90%;
        text-align: center;
        color: white;
      }
      .title {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #00ffe1;
        text-shadow: 0 0 8px #00ffe1;
      }
      .menu {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 15px;
        gap: 10px;
      }
      .menu button {
        background: rgba(255,255,255,0.1);
        border: none;
        padding: 10px 16px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .menu button.active {
        background: #00ffe1;
        color: black;
        font-weight: bold;
      }
      .form {
        display: none;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }
      .form.active {
        display: flex;
      }
      .form input:not([type="checkbox"]), .form select {
        padding: 12px;
        border: none;
        border-radius: 6px;
        width: 100%;
        outline: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background: rgba(255,255,255,0.2);
        color: white;
      }
      .form select option {
          color: black;
          background: #333;
      }
      .form button {
        padding: 12px;
        border: none;
        border-radius: 6px;
        width: 100%;
        background: #00ffe1;
        color: black;
        font-weight: bold;
        cursor: pointer;
      }
      /* Support Button CSS */
      .support-link {
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 50px;
          height: 50px;
          background: #00ffe1;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 12px rgba(0, 255, 225, 0.5);
          transition: transform 0.3s;
          text-decoration: none;
          z-index: 100;
      }
      .support-link:hover {
          transform: scale(1.1);
      }
      .support-icon {
          font-size: 30px; 
          color: black;
          line-height: 1; 
      }
      /* Policy Checkbox Styling */
      .policy-container {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 10px;
        text-align: left;
        font-size: 0.8rem;
      }
      .policy-container input[type="checkbox"] {
        margin-top: 3px;
        width: auto;
        min-width: 15px; 
        height: 15px;
        cursor: pointer;
        accent-color: #00ffe1; 
      }
      .policy-container a {
        color: #00ffe1;
        text-decoration: underline;
        font-weight: bold;
        cursor: pointer;
      }
      .auth-type-selector {
        display: flex; 
        gap: 5px; 
        margin-bottom: 5px;
      }
      .auth-type-selector button {
          flex: 1;
          background: rgba(255,255,255,0.1);
          color: white;
          border: 1px solid rgba(255,255,255,0.1);
          padding: 8px 12px; 
          font-weight: normal; 
          transition: background 0.3s;
      }
      .auth-type-selector button.active {
          background: #00ffe1;
          color: black;
          border: 1px solid #00ffe1;
          font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">AvicnKnov Ex</div>
      <div class="menu">
        <button id="btn-login" onclick="showForm('login')">Login</button>
        <button id="btn-register" onclick="showForm('register')">Create Account</button>
      </div>

      <div id="login" class="form">
        <input type="text" id="login-identifier" placeholder="Gmail or Phone Number">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="showForm('forgot')" style="background: none; color: #00ffe1; font-weight: normal; border: 1px solid #00ffe1; margin-top: 5px;">Forgot Password?</button>
      </div>

      <div id="register" class="form">
        <div class="auth-type-selector">
            <button id="reg-type-email" class="active" onclick="setRegType('email')">Use Gmail</button>
            <button id="reg-type-phone" onclick="setRegType('phone')">Use Phone Number</button>
        </div>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-username" placeholder="Username">
        <select id="reg-country"></select>
        <select id="reg-gender"> 
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="date" id="reg-dob">

        <input type="email" id="reg-email" placeholder="Gmail">
        <input type="text" id="reg-phone" placeholder="Phone Number (e.g., +919876543210)" style="display:none;">
        
        <input type="password" id="reg-pass" placeholder="Password (8-16 chars)">
        
        <div class="policy-container">
            <input type="checkbox" id="reg-policy-check">
            <label for="reg-policy-check">
                I confirm I am creating this account voluntarily and agree to the 
                <a href="policy.html" target="_blank">Policy</a>, 
                <a href="service.html" target="_blank">Service</a>, and 
                <a href="community.html" target="_blank">Community Guideline</a>.
            </label>
        </div>
        <button id="reg-btn" onclick="register()">Register</button>

        <div id="wtq-display-section" style="display: none; padding: 15px; background: rgba(0, 255, 225, 0.1); border-radius: 8px; margin-top: 15px;">
            <p style="margin-bottom: 10px; color: #00ffe1;">Your Unique WTQ ID:</p>
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #333; padding: 8px; border-radius: 6px;">
                <strong id="generated-wtq-id" style="font-size: 1.2rem; color: white; letter-spacing: 1px;"></strong>
                <button onclick="copyWTQID()" style="width: auto; padding: 5px 10px; background: #00ffe1; color: black; font-weight: normal;">Copy</button>
            </div>
            <button onclick="redirectToAgent('register')" style="margin-top: 15px;">Verify Agent</button>
            <p id="wtq-timer" style="margin-top: 10px; font-size: 0.8rem; color: #ccc;"></p>
        </div>
        </div>

      <div id="forgot" class="form">
        <div class="auth-type-selector">
            <button id="forgot-type-email" class="active" onclick="setForgotType('email')">Use Gmail</button>
            <button id="forgot-type-phone" onclick="setForgotType('phone')">Use Phone Number</button>
        </div>
        <input type="email" id="forgot-email" placeholder="Registered Gmail">
        <input type="text" id="forgot-phone" placeholder="Registered Phone Number" style="display:none;">

        <button onclick="resetPassword()">Send Reset Link</button>
      </div>
    </div>
    
    <a href="support.html" class="support-link">
        <span class="support-icon">❓</span>
    </a>
