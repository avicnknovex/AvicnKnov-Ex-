<html lang="en">
<head>

    <style>
        /* Modern Premium Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, html {
            height: 100%;
            width: 100%;
            /* Black & Purple Theme Background Animated */
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract Premium Glowing Orbs for Background effect */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: pulseOrb 8s infinite alternate ease-in-out;
        }
        body::before {
            width: 300px; height: 300px;
            background: rgba(147, 51, 234, 0.3);
            top: 10%; left: 15%;
        }
        body::after {
            width: 250px; height: 250px;
            background: rgba(255, 255, 255, 0.1);
            bottom: 15%; right: 15%;
            animation-delay: 2s;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4;}
            100% { transform: scale(1.3) translate(20px, 30px); opacity: 0.7;}
        }

        .container {
            background: rgba(15, 10, 25, 0.85);
            backdrop-filter: blur(15px);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(168, 85, 247, 0.2);
            max-width: 420px;
            width: 90%;
            text-align: center;
            color: white;
            z-index: 10;
            animation: formEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes formEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Exchange Logo Animations */
        .exchange-logo {
            width: 85px;
            height: auto;
            margin: -60px auto 15px; /* Adjusting up visually */
            display: block;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1), transparent);
            animation: 
                dropFromTop 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                levitateAndGlow 5s infinite ease-in-out alternate;
        }

        @keyframes dropFromTop {
            0% { transform: translateY(-100px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes levitateAndGlow {
            0% {
                transform: translateY(0);
                filter: drop-shadow(0 0 5px rgba(168, 85, 247, 0.5));
            }
            100% {
                transform: translateY(-8px);
                filter: drop-shadow(0 0 25px rgba(168, 85, 247, 1)) drop-shadow(0 0 10px #ffffff);
            }

        .title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #a855f7, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientText 4s linear infinite;
        }
        @keyframes gradientText {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .menu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
            background: rgba(0,0,0,0.4);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.1);
        }

        .menu button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            color: #ccc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .menu button.active {
            background: #a855f7;
            color: white;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .form {

            flex-direction: column;
            gap: 15px;
            opacity: 0;
            transform: translateY(10px);
        }

        .form.active {
            display: flex;
            animation: fadeUp 0.4s forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .form input:not([type="checkbox"]), .form select {
            padding: 14px 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            width: 100%;

            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;

        .form input:not([type="checkbox"]):focus, .form select:focus {

            background: rgba(255,255,255,0.08);

        .eye-btn {

            color: #888;

        .form > button:not(.btn-link) {

            background: linear-gradient(135deg, #b065f7, #8e30dd);

        .btn-link {

            color: #a855f7 !important;
            font-weight: normal !important;
            border: 1px solid rgba(168,85,247, 0.3) !important;
            margin-top: 5px;
            box-shadow: none !important;

        .btn-link:hover {
            border-color: #a855f7 !important;

        /* Auth Type Selector */

            font-weight: bold;

        .policy-container a:hover {

        /* Support Button (Replaced Emoji) */
        .support-link {

            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #1e1e1e, #333);
            border: 2px solid #a855f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
            text-decoration: none;
            z-index: 100;
            overflow: hidden;
            animation: bounceFloat 3s infinite ease-in-out;
        }
        .support-link:before {
            content:'';
            position: absolute;
            top: 0; left:-100%;
            width:50%; height:100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s;
        }
        .support-link:hover:before {
            left: 150%;
        }
        .support-link svg {
            color: #fff;
            width: 26px;
            height: 26px;
        }
        @keyframes bounceFloat {
            0%, 100% { transform: translateY(0); box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4); }
            50% { transform: translateY(-8px); box-shadow: 0 10px 25px rgba(168, 85, 247, 0.7); }

        /* WTQ Block styling updated */
        #wtq-display-section {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-top: 10px;
            animation: fadeInWTQ 0.5s ease;
        }
        @keyframes fadeInWTQ { from{opacity:0; transform: scale(0.9);} to{opacity:1; transform:scale(1);} }
        .wtq-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Custom Notification Toast (Premium Design Replacing native alerts) */
        #custom-toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            pointer-events: none;
        }

        .custom-toast {
            min-width: 300px;
            padding: 14px 20px;
            background: rgba(15, 10, 25, 0.95);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-left: 4px solid #fff;
            pointer-events: all;
            animation: toastEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .custom-toast.success { border-left-color: #22c55e; box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2); }
        .custom-toast.error { border-left-color: #ef4444; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.2); }
        .custom-toast.info { border-left-color: #a855f7; box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2); }

        .custom-toast svg { width: 22px; height: 22px; flex-shrink: 0; }
        .toast-msg { flex: 1; text-align: left; line-height: 1.4; }
        
        @keyframes toastEnter {
            0% { transform: translateY(-40px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes toastExit {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }
    </style>
</head>

    <script>
        // Supabase Credentials - Strict adherence: Kept Original values unedited
        const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';

        // ==========================================

        // Custom Alert Logic Override: Makes backend logic still run exactly 
        // as you wanted without changing all logic strings of code!
        window.alert = function(msg) {
            const container = document.getElementById('custom-toast-container');
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            
            let svgIcon = `<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>`; // default info
            
            if(msg.includes('❌') || msg.toLowerCase().includes('fail') || msg.toLowerCase().includes('error')) {
                toast.classList.add('error');
                svgIcon = `<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
            } else if (msg.includes('✅') || msg.toLowerCase().includes('success') || msg.includes('initiated')) {
                toast.classList.add('success');
                svgIcon = `<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            } else {
                toast.classList.add('info');
            }

            msg = msg.replace('❌', '').replace('✅', '').replace('🔗', '').trim();

            toast.innerHTML = `${svgIcon}<div class="toast-msg">${msg}</div>`;
            container.appendChild(toast);

                toast.style.animation = "toastExit 0.3s forwards";
                setTimeout(() => { toast.remove(); }, 300);

        function generateWTQID() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 12; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }
        
        function generateWalletID() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 12; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 24; i++) {

            let result = '0x';
            for (let i = 0; i < 40; i++) {

            return result;

        function copyWTQID() {
            const wtqId = document.getElementById('generated-wtq-id').textContent;
            navigator.clipboard.writeText(wtqId).then(() => {
                alert("✅ WTQ ID copied securely!");
            }, () => {
                alert("❌ Failed to copy WTQ ID. Please copy manually.");
            });
        }

        function showForm(formId) {
            const forms = document.querySelectorAll('.form');
            const buttons = document.querySelectorAll('.menu button');
            
            forms.forEach(f => f.classList.remove('active'));
            buttons.forEach(b => b.classList.remove('active'));
            
            document.getElementById(formId).classList.add('active');
            
            const menuButton = document.getElementById(`btn-${formId}`);
            if (menuButton) {
                menuButton.classList.add('active');
            } else if (formId === 'forgot') {
                document.getElementById('btn-login').classList.add('active');
            }
            
            document.getElementById('wtq-display-section').style.display = 'none';
        }

        function closeAllForms(event) {
            const forms = document.querySelectorAll('.form');
            const buttons = document.querySelectorAll('.menu button');
            forms.forEach(f => f.classList.remove('active'));
            buttons.forEach(b => b.classList.remove('active'));
        }

        function setRegType(type) {
            registrationType = type;
            const emailInput = document.getElementById('reg-email');
            const phoneInput = document.getElementById('reg-phone');
            const btnEmail = document.getElementById('reg-type-email');
            const btnPhone = document.getElementById('reg-type-phone');
            const regButton = document.getElementById('reg-btn');
            
            document.getElementById('wtq-display-section').style.display = 'none'; 

            if (type === 'email') {
                emailInput.style.display = 'block';
                phoneInput.style.display = 'none';
                btnEmail.classList.add('active');
                btnPhone.classList.remove('active');
                regButton.textContent = 'Create My Account';
            } else { 
                emailInput.style.display = 'none';
                phoneInput.style.display = 'block';
                btnPhone.classList.add('active');
                btnEmail.classList.remove('active');
                regButton.textContent = 'Create Account & Get ID';
            }
        }

        function setForgotType(type) {
            forgotType = type;
            const emailInput = document.getElementById('forgot-email');
            const phoneInput = document.getElementById('forgot-phone');
            const btnEmail = document.getElementById('forgot-type-email');
            const btnPhone = document.getElementById('forgot-type-phone');
            const resetBtn = document.querySelector('#forgot button');

            if (type === 'email') {
                emailInput.style.display = 'block';
                phoneInput.style.display = 'none';
                btnEmail.classList.add('active');
                btnPhone.classList.remove('active');
                resetBtn.textContent = 'Send Reset Link';
            } else { 
                emailInput.style.display = 'none';
                phoneInput.style.display = 'block';
                btnPhone.classList.add('active');
                btnEmail.classList.remove('active');
                resetBtn.textContent = 'Forgot Agent'; 
            }
        }

        async function login() {
            const identifier = document.getElementById('login-identifier').value.trim(); 
            const pass = document.getElementById('login-pass').value;

            if (!identifier || !pass) return alert("❌ Please fill all login fields correctly.");

            const isEmail = identifier.includes('@'); 
            
            if (isEmail) {
                let { data, error } = await sb.auth.signInWithPassword({ email: identifier, password: pass });
                if (error) {
                    if (error.message.includes('Email not confirmed')) {
                        alert("❌ Login Failed: Email not verified. Please check your Gmail.");
                    } else {
                        alert("❌ Login Failed (Gmail): " + error.message);
                    }
                } else if (data.session) {
                    window.location.href = "main.html";
                }
            } else {
                const cleanNumber = identifier.replace(/[^0-9+]/g, ''); 
                const dummyEmail = cleanNumber + PHONE_LOGIN_DOMAIN;
                let { data, error } = await sb.auth.signInWithPassword({ email: dummyEmail, password: pass });

                if (error) {
                    const { data: unverifiedData } = await sb.from('user-verify').select('wtq_id, is_verified').eq('phone_number', cleanNumber).maybeSingle();
                    if (unverifiedData && unverifiedData.is_verified === false) {
                        alert("❌ Account not verified. Use the 'Verify Agent' securely to complete process.");
                    } else {
                        alert("❌ Login Failed: Credentials incorrect or User not found.");
                    }
                } else if (data.session) {
                    window.location.href = "main.html";
                }
            }
        }

        async function register() {
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-username').value;
            const country = document.getElementById('reg-country').value;
            const gender = document.getElementById('reg-gender').value; 
            const dob = document.getElementById('reg-dob').value;
            const pass = document.getElementById('reg-pass').value;
            const email = document.getElementById('reg-email').value;
            const phone = document.getElementById('reg-phone').value;
            const policyChecked = document.getElementById('reg-policy-check').checked; 

            const identifier = registrationType === 'email' ? email : phone;

            if (!name || !username || !country || !gender || !dob || !identifier || !pass || !policyChecked) {
                return alert("❌ Please fill all details and accept the required policy.");
            }
            
            if (pass.length < 8 || pass.length > 16) {
                return alert("❌ Password strict range must be between 8 to 16 characters.");
            }
            
            const age = new Date().getFullYear() - new Date(dob).getFullYear();
            if (age < 17 || age > 110) return alert("❌ Age limit violation. You must be 17+ to enter.");
            
            const regButton = document.getElementById('reg-btn');
            regButton.disabled = true;
            const originalTxt = regButton.textContent;
            regButton.textContent = 'Processing securely...';

            if (registrationType === 'email') {
                const { error: verifyInsertError } = await sb.from('user-verify-gmail').insert([{ email, password: pass, full_name: name, username, country, gender, dob, phone_number: phone }]);
                if (verifyInsertError) {
                    regButton.disabled = false;
                    regButton.textContent = originalTxt;
                    return alert("❌ Registration Blocked: " + verifyInsertError.message);
                }
                
                let { error: authError } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: 'https://avicnknovex.github.io/AvicnKnov-Ex-/success.html' } });
                regButton.disabled = false;
                regButton.textContent = originalTxt;
                if (authError) return alert("❌ Server Auth Failed: " + authError.message);
                alert("✅ Registered successfully! Check your Gmail mailbox quickly to verify.");
            } else {
                const phoneNumber = phone.trim();
                const { data: verifiedUser } = await sb.from('user-details').select('wtq_id').eq('phone_number', phoneNumber).maybeSingle();
                if (verifiedUser) {
                    regButton.disabled = false;
                    regButton.textContent = originalTxt;
                    return alert("❌ Registration Error: Mobile Number is already in our verified database.");
                }
                const newWTQID = generateWTQID();
                const { error: insertError } = await sb.from('user-verify').insert({ phone_number: phoneNumber, password_hash: pass, wtq_id: newWTQID, full_name: name, username, country, gender, dob });
                regButton.disabled = false;
                regButton.textContent = originalTxt;
                if (insertError) return alert("❌ Security DB failed: " + insertError.message);
                
                document.getElementById('generated-wtq-id').textContent = newWTQID;
                document.getElementById('wtq-display-section').style.display = 'block';
                alert("✅ Creation securely initiated! Important: Copy the WTQ ID displayed below.");
            }
        }

        async function resetPassword() {
            const email = document.getElementById('forgot-email').value;
            const phone = document.getElementById('forgot-phone').value;
            if (forgotType === 'email') {
                if (!email) return alert("❌ Required Error: Type valid email address.");
                let { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: 'https://avicnknovex.github.io/AvicnKnov-Ex-/reset-password.html' });
                if (error) alert("❌ Gateway Error Failed: " + error.message);
                else alert("✅ Link properly pushed and dispatched to " + email);
            } else {
                const { data } = await sb.from('user-details').select('wtq_id').eq('phone_number', phone).maybeSingle();
                if (!data) return alert("❌ Server: Match not found within existing network tables.");
                window.location.href = `agent.html?action=forgot&id=${data.wtq_id}`;
            }
        }

        async function createWalletForUser(userId, fullName, username) {
            const { data: existingWallet } = await sb.from('wallet_user_profile').select('id').eq('uid', userId).maybeSingle();
            if (!existingWallet) {
                const walletId = generateWalletID();
                const recoveryId = generateRecoveryID();
                const walletAddr = generateWalletAddress();
                
                await sb.from('wallet_user_profile').insert([{
                    uid: userId,
                    full_name: fullName,
                    username: username,
                    wallet_name: `${username}`,
                    wallet_id: walletId,
                    recovery_id: recoveryId,
                    lock_code: '000000',
                    status: 'active'
                }]);
                
                await sb.from('user_wallet_balance').insert([{
                    uid: userId,
                    wallet_address: walletAddr,
                    balance: 0.00
                }]);
            }
        }

        sb.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session?.user) {
                const userEmail = session.user.email;
                
                if (userEmail && !userEmail.endsWith(PHONE_LOGIN_DOMAIN)) {
                    const { data: tempUser } = await sb.from('user-verify-gmail').select('*').eq('email', userEmail).maybeSingle();
                    if (tempUser) {
                        await sb.from('user-profile-data').insert([{ full_name: tempUser.full_name, username: tempUser.username, country: tempUser.country, gender: tempUser.gender, dob: tempUser.dob, email: tempUser.email, phone_number: tempUser.phone_number, created_at: new Date() }]);
                        await sb.from('user-details').insert([{ full_name: tempUser.full_name, username: tempUser.username, country: tempUser.country, gender: tempUser.gender, dob: tempUser.dob, email: tempUser.email, password: tempUser.password, created_at: new Date() }]);
                        await sb.from('qineq_users').insert([{ user_id: session.user.id, username: tempUser.username, full_name: tempUser.full_name, country: tempUser.country, gender: tempUser.gender, followers_count: 0, following_count: 0, post_count: 0, verify_tick: null }]);
                        
                        await createWalletForUser(session.user.id, tempUser.full_name, tempUser.username);

                        await sb.from('user-verify-gmail').delete().eq('email', userEmail);
                        window.location.href = "main.html";
                    } else {
                        const { data: pData } = await sb.from('user-profile-data').select('full_name, username').eq('email', userEmail).maybeSingle();
                        if (pData) {
                            await createWalletForUser(session.user.id, pData.full_name, pData.username);
                        }
                        window.location.href = "main.html";
                    }
                } 
                else if (userEmail && userEmail.endsWith(PHONE_LOGIN_DOMAIN)) {
                    const cleanPhone = userEmail.replace(PHONE_LOGIN_DOMAIN, '');
                    const { data: existingQineq } = await sb.from('qineq_users').select('user_id').eq('user_id', session.user.id).maybeSingle();
                    
                    if (!existingQineq) {
                        const { data: profileData } = await sb.from('user-profile-data').select('*').eq('phone_number', cleanPhone).maybeSingle();
                        if (profileData) {
                            await sb.from('qineq_users').insert([{
                                user_id: session.user.id,
                                username: profileData.username,
                                full_name: profileData.full_name,
                                country: profileData.country,
                                gender: profileData.gender,
                                followers_count: 0,
                                following_count: 0,
                                post_count: 0,
                                verify_tick: null
                            }]);
                            
                            await createWalletForUser(session.user.id, profileData.full_name, profileData.username);
                        }
                    } else {
                        const { data: pData } = await sb.from('user-profile-data').select('full_name, username').eq('phone_number', cleanPhone).maybeSingle();
                        if (pData) {
                            await createWalletForUser(session.user.id, pData.full_name, pData.username);
                        }
                    }
                    window.location.href = "main.html";
                }
            }
        });
