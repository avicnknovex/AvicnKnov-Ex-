<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AvicnKnov Ex – Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
      body, html {
        height:100%; width:100%;
        background: url('https://imgpx.com/mbRZiaEdwWxL.png') no-repeat center center fixed;
        background-size: cover;
        display:flex; align-items:center; justify-content:center;
      }
      .container {
        background: rgba(0, 0, 0, 0.65);
        padding: 30px; border-radius: 15px;
        box-shadow: 0 0 20px #00ffe1;
        max-width: 400px;
        width: 90%;
        text-align: center;
        color: white;
      }
      .title {
        font-size: 2rem;
        margin-bottom: 20px;
        color: #00ffe1;
        text-shadow: 0 0 8px #00ffe1;
      }
      .menu {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 15px;
        gap: 10px;
      }
      .menu button {
        background: rgba(255,255,255,0.1);
        border: none;
        padding: 10px 16px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s;
      }
      .menu button.active {
        background: #00ffe1;
        color: black;
        font-weight: bold;
      }
      .form {
        display: none;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }
      .form.active {
        display: flex;
      }
      .form input[type="email"], .form input[type="password"], .form input[type="text"], 
      .form input[type="date"], .form button, .form select {
        padding: 12px;
        border: none;
        border-radius: 6px;
        width: 100%;
        outline: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
      }
      .form input:not([type="checkbox"]), .form select {
        background: rgba(255,255,255,0.2);
        color: white;
      }
      .form select option {
          color: black;
          background: #333;
      }
      .form button {
        background: #00ffe1;
        color: black;
        font-weight: bold;
        cursor: pointer;
      }
      /* New Support Button CSS */
      .support-link {
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 50px;
          height: 50px;
          background: #00ffe1;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 12px rgba(0, 255, 225, 0.5);
          transition: transform 0.3s;
          text-decoration: none;
          z-index: 100;
      }
      .support-link:hover {
          transform: scale(1.1);
      }
      .support-icon {
          font-size: 30px; 
          color: black;
          line-height: 1; 
      }
      /* New Policy Checkbox Styling */
      .policy-container {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 10px;
        text-align: left;
        font-size: 0.8rem;
      }
      .policy-container input[type="checkbox"] {
        margin-top: 3px;
        width: auto;
        min-width: 15px; 
        height: 15px;
        cursor: pointer;
        /* Custom checkmark color */
        accent-color: #00ffe1; 
      }
      .policy-container a {
        color: #00ffe1;
        text-decoration: underline;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">AvicnKnov Ex</div>
      <div class="menu">
        <button id="btn-login" onclick="showForm('login')">Login</button>
        <button id="btn-register" onclick="showForm('register')">Create Account</button>
      </div>

      <div id="login" class="form">
        <input type="email" id="login-email" placeholder="Gmail">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="showForm('forgot')" style="background: none; color: #00ffe1; font-weight: normal; border: 1px solid #00ffe1; margin-top: 5px;">Forgot Password?</button>
      </div>

      <div id="register" class="form">
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-username" placeholder="Username">
        <select id="reg-country"></select>
        <select id="reg-gender"> 
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="date" id="reg-dob">
        <input type="email" id="reg-email" placeholder="Gmail">
        <input type="password" id="reg-pass" placeholder="Password (8-16 chars)">
        
        <div class="policy-container">
            <input type="checkbox" id="reg-policy-check">
            <label for="reg-policy-check">
                I confirm I am creating this account voluntarily and agree to the 
                <a href="policy.html" target="_blank">Policy</a>, 
                <a href="service.html" target="_blank">Service</a>, and 
                <a href="community.html" target="_blank">Community Guideline</a>.
            </label>
        </div>
        <button onclick="register()">Register</button>
      </div>

      <div id="forgot" class="form">
        <input type="email" id="forgot-email" placeholder="Registered Gmail">
        <button onclick="resetPassword()">Send Reset Link</button>
      </div>
    </div>
    
    <a href="support.html" class="support-link">
        <span class="support-icon">❓</span>
    </a>

    <script>
      // Supabase Credentials - CONFIRMED TO BE CORRECT
      const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      function showForm(formId) {
        const forms = document.querySelectorAll('.form');
        const buttons = document.querySelectorAll('.menu button');
        forms.forEach(f => f.classList.remove('active'));
        buttons.forEach(b => b.classList.remove('active'));
        
        document.getElementById(formId).classList.add('active');
        
        const menuButton = document.getElementById(`btn-${formId}`);
        if (menuButton) {
            menuButton.classList.add('active');
        } else if (formId === 'forgot') {
            document.getElementById('btn-login').classList.add('active');
        }
      }

      async function login() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        if (!email || !pass) return alert("Fill all fields");
        let { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) alert("❌ " + error.message);
        else window.location.href = "main.html";
      }

      // 🛑 यह 'register()' फ़ंक्शन फिक्स किया गया है। 🛑
      async function register() {
        // Get all fields
        const name = document.getElementById('reg-name').value;
        const username = document.getElementById('reg-username').value;
        const country = document.getElementById('reg-country').value;
        const gender = document.getElementById('reg-gender').value; 
        const dob = document.getElementById('reg-dob').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const policyChecked = document.getElementById('reg-policy-check').checked; 

        // Validation 
        if (!name || !username || !country || !gender || !dob || !email || !pass) {
            return alert("Fill all fields");
        }
        
        if (pass.length < 8 || pass.length > 16) {
            return alert("Password must be between 8 and 16 characters.");
        }
        
        if (!policyChecked) {
            return alert("You must agree to the Policy, Service, and Community Guidelines.");
        }

        const age = new Date().getFullYear() - new Date(dob).getFullYear();
        if (age < 17 || age > 110) return alert("Age must be between 17 and 110");

        // 1. Supabase Signup (Account Creation)
        let { data: authData, error: authError } = await sb.auth.signUp({
          email,
          password: pass,
          options: {
            data: { full_name: name, dob, username, country, gender }, 
            emailRedirectTo: 'https://avicnknovex.netlify.app/success.html'
          }
        });

        if (authError) {
            return alert("❌ " + authError.message);
        }
        
        // 2. Insert details into 'user-details' table (FIXED LOGIC)
        // यह Logic Supabase Auth में सफल साइनअप के तुरंत बाद चलता है।
        // authData.user में नए user की ID (newUserId) उपलब्ध होती है।
        if (authData.user) {
            const newUserId = authData.user.id;
            const currentTimestamp = new Date().toISOString();

            let { error: dbError } = await sb
                .from('user-details')
                .insert([
                    {
                        id: newUserId, 
                        full_name: name,
                        username: username,
                        email: email, // Email भी सेव किया जा रहा है 
                        date_of_birth: dob,
                        country: country,
                        gender: gender,
                        created_at: currentTimestamp, // अकाउंट बनाने का समय
                    }
                ]);

            if (dbError) {
                console.error("Profile insert error:", dbError);
                // Auth सफल हो गया है, इसलिए उपयोगकर्ता को वेरिफिकेशन के लिए अलर्ट करते हैं
                // लेकिन DB त्रुटि के बारे में भी बताते हैं।
                return alert("✅ Registered! Check your Gmail to verify. Note: There was an error saving your full profile details to the 'user-details' table: " + dbError.message);
            }
        }


        alert("✅ Registered! Check your Gmail to verify.");
      }

      async function resetPassword() {
        const email = document.getElementById('forgot-email').value;
        if (!email) return alert("Enter your Gmail");
        let { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://avicnknovex.netlify.app/reset-password.html'
        });
        if (error) alert("❌ " + error.message);
        else alert("🔗 Reset link sent to " + email);
      }

      // Helper function to populate the Country dropdown
      const countries = [
          "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo (Brazzaville)", "Congo (Kinshasa)", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czechia", "Denmark", "Djibouti", "Dominica", "Dominican Republic", "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland", "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Ivory Coast", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Kosovo", "Kuwait", "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Korea", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Palestine State", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines", "Samoa", "San Marino", "Sao Tome and Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Korea", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Timor-Leste", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
      ];
      function populateCountries() {
          const select = document.getElementById('reg-country');
          const defaultOption = document.createElement('option');
          defaultOption.value = "";
          defaultOption.textContent = "Select Country";
          defaultOption.disabled = true;
          defaultOption.selected = true;
          select.appendChild(defaultOption);

          countries.forEach(country => {
              const option = document.createElement('option');
              option.value = country;
              option.textContent = country;
              select.appendChild(option);
          });
      }

      window.onload = () => {
        const forms = document.querySelectorAll('.form');
        forms.forEach(f => f.classList.remove('active'));
        const buttons = document.querySelectorAll('.menu button');
        buttons.forEach(b => b.classList.remove('active'));
        
        populateCountries(); 
      };
    </script>
  </body>
</html>
