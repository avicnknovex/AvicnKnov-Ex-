<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AvicnKnov Ex – Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

      * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

      /* ── BACKGROUND ── */
      body, html {
        height:100%; width:100%;
        background: #0a0010;
        display:flex; align-items:center; justify-content:center;
        overflow: hidden;
        position: relative;
      }

      /* Animated purple-black gradient background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at 20% 20%, rgba(120,0,255,0.18) 0%, transparent 60%),
          radial-gradient(ellipse at 80% 80%, rgba(80,0,200,0.22) 0%, transparent 60%),
          radial-gradient(ellipse at 60% 10%, rgba(180,0,255,0.10) 0%, transparent 50%),
          linear-gradient(135deg, #0a0010 0%, #110022 50%, #0d001a 100%);
        z-index: 0;
        animation: bgPulse 8s ease-in-out infinite alternate;
      }

      @keyframes bgPulse {
        0%   { opacity: 1; filter: hue-rotate(0deg); }
        100% { opacity: 0.85; filter: hue-rotate(25deg); }
      }

      /* Floating particles */
      .particles {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        animation: floatParticle linear infinite;
        opacity: 0;
      }

      @keyframes floatParticle {
        0%   { transform: translateY(100vh) scale(0); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 0.6; }
        100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
      }

      /* ── CONTAINER ── */
      .container {
        position: relative;
        z-index: 10;
        background: rgba(15, 0, 30, 0.72);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        padding: 36px 32px 28px;
        border-radius: 22px;
        border: 1px solid rgba(160, 60, 255, 0.28);
        box-shadow:
          0 0 0 1px rgba(180,80,255,0.10),
          0 8px 40px rgba(120,0,255,0.25),
          0 2px 8px rgba(0,0,0,0.6),
          inset 0 1px 0 rgba(255,255,255,0.06);
        max-width: 420px;
        width: 92%;
        text-align: center;
        color: white;
        cursor: default;
        animation: containerIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes containerIn {
        from { opacity: 0; transform: translateY(30px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* ── LOGO ── */
      .logo-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
        animation: logoEntry 1s cubic-bezier(0.16,1,0.3,1) both;
      }

      @keyframes logoEntry {
        from { opacity: 0; transform: translateY(-30px) scale(0.8); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .logo-img {
        width: 72px;
        height: 72px;
        object-fit: contain;
        border-radius: 18px;
        animation: logoFloat 3s ease-in-out infinite, logoGlow 5s ease-in-out infinite;
        filter: drop-shadow(0 0 10px rgba(180,80,255,0.5));
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-6px); }
      }

      @keyframes logoGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(180,80,255,0.5)) drop-shadow(0 0 20px rgba(120,0,255,0.3)); }
        50%       { filter: drop-shadow(0 0 18px rgba(200,100,255,0.9)) drop-shadow(0 0 36px rgba(160,0,255,0.55)); }
      }

      /* Extra pulse animation every 5 seconds */
      .logo-img.pulse-effect {
        animation: logoFloat 3s ease-in-out infinite, logoGlowPulse 0.6s ease-in-out 3, logoGlow 5s ease-in-out infinite 1.8s;
      }

      @keyframes logoGlowPulse {
        0%   { filter: drop-shadow(0 0 10px rgba(180,80,255,0.5)); transform: scale(1); }
        50%  { filter: drop-shadow(0 0 30px rgba(220,120,255,1)) drop-shadow(0 0 60px rgba(180,0,255,0.8)); transform: scale(1.1); }
        100% { filter: drop-shadow(0 0 10px rgba(180,80,255,0.5)); transform: scale(1); }
      }

      /* ── TITLE ── */
      .title {
        font-size: 1.7rem;
        font-weight: 800;
        margin-bottom: 22px;
        letter-spacing: 1.5px;
        background: linear-gradient(135deg, #c87aff 0%, #ffffff 50%, #a040ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        filter: drop-shadow(0 0 12px rgba(180,80,255,0.5));
      }

      /* ── MENU ── */
      .menu {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 18px;
        gap: 8px;
      }
      .menu button {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        padding: 9px 18px;
        color: rgba(255,255,255,0.75);
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.3px;
        transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      }
      .menu button:hover {
        background: rgba(180,80,255,0.12);
        border-color: rgba(180,80,255,0.35);
        color: white;
        transform: translateY(-1px);
      }
      .menu button.active {
        background: linear-gradient(135deg, #9d3fff, #6a00d4);
        border-color: rgba(180,80,255,0.6);
        color: white;
        font-weight: 700;
        box-shadow: 0 4px 18px rgba(140,0,255,0.4), 0 0 0 1px rgba(200,120,255,0.2);
      }

      /* ── FORMS ── */
      .form {
        display: none;
        flex-direction: column;
        gap: 11px;
        margin-top: 4px;
        animation: formSlideIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
      }
      .form.active { display: flex; }

      @keyframes formSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Input wrapper for password eye */
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      .form input:not([type="checkbox"]), .form select {
        padding: 12px 14px;
        border: 1px solid rgba(180,80,255,0.2);
        border-radius: 10px;
        width: 100%;
        outline: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background: rgba(255,255,255,0.06);
        color: white;
        font-size: 0.9rem;
        font-family: 'Inter', sans-serif;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      }

      .form input:not([type="checkbox"]):focus, .form select:focus {
        border-color: rgba(180,80,255,0.6);
        background: rgba(255,255,255,0.09);
        box-shadow: 0 0 0 3px rgba(140,0,255,0.15), 0 0 12px rgba(180,80,255,0.1);
      }

      .form input::placeholder { color: rgba(255,255,255,0.38); }

      .form select option { color: #eee; background: #1a0035; }

      /* Password input with eye icon */
      .input-wrapper input[type="password"],
      .input-wrapper input[type="text"] {
        padding-right: 44px;
      }

      .eye-toggle {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: rgba(180,80,255,0.7);
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: color 0.2s, transform 0.2s;
        border-radius: 4px;
        z-index: 2;
      }

      .eye-toggle:hover { color: #c87aff; transform: translateY(-50%) scale(1.15); }

      .eye-toggle svg {
        width: 18px;
        height: 18px;
        transition: opacity 0.2s;
      }

      .eye-toggle.eye-blink {
        animation: eyeBlink 0.3s cubic-bezier(0.16,1,0.3,1);
      }

      @keyframes eyeBlink {
        0%   { transform: translateY(-50%) scaleY(1); }
        40%  { transform: translateY(-50%) scaleY(0.15); }
        100% { transform: translateY(-50%) scaleY(1); }
      }

      /* ── BUTTONS ── */
      .form > button, .form button[onclick="login()"], .form button[onclick="register()"], .form button[onclick="resetPassword()"] {
        padding: 13px;
        border: none;
        border-radius: 10px;
        width: 100%;
        background: linear-gradient(135deg, #9d3fff 0%, #6a00d4 100%);
        color: white;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
        box-shadow: 0 4px 18px rgba(140,0,255,0.35);
        position: relative;
        overflow: hidden;
      }

      .form > button::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent);
        opacity: 0;
        transition: opacity 0.2s;
      }

      .form > button:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(140,0,255,0.55); }
      .form > button:hover::after { opacity: 1; }
      .form > button:active { transform: translateY(0px); }

      /* Forgot password secondary button */
      #login .form-secondary-btn {
        background: transparent !important;
        color: #c87aff !important;
        font-weight: 500 !important;
        border: 1px solid rgba(180,80,255,0.3) !important;
        margin-top: 2px;
        box-shadow: none !important;
        font-size: 0.875rem !important;
      }
      #login .form-secondary-btn:hover {
        background: rgba(180,80,255,0.08) !important;
        border-color: rgba(180,80,255,0.55) !important;
        transform: translateY(-1px) !important;
      }

      /* ── AUTH TYPE SELECTOR ── */
      .auth-type-selector {
        display: flex;
        gap: 6px;
        margin-bottom: 2px;
      }
      .auth-type-selector button {
        flex: 1;
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.65);
        border: 1px solid rgba(255,255,255,0.10);
        padding: 9px 12px;
        font-weight: 500;
        font-size: 0.85rem;
        border-radius: 9px;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
      }
      .auth-type-selector button:hover {
        background: rgba(180,80,255,0.10);
        border-color: rgba(180,80,255,0.3);
        color: white;
      }
      .auth-type-selector button.active {
        background: linear-gradient(135deg, #9d3fff, #6a00d4);
        color: white;
        border-color: rgba(180,80,255,0.5);
        font-weight: 700;
        box-shadow: 0 3px 14px rgba(140,0,255,0.35);
      }

      /* ── POLICY CONTAINER ── */
      .policy-container {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 4px;
        text-align: left;
        font-size: 0.78rem;
        color: rgba(255,255,255,0.6);
        line-height: 1.5;
      }
      .policy-container input[type="checkbox"] {
        margin-top: 2px;
        width: auto;
        min-width: 15px;
        height: 15px;
        cursor: pointer;
        accent-color: #9d3fff;
        flex-shrink: 0;
      }
      .policy-container a {
        color: #c87aff;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid rgba(200,120,255,0.35);
        transition: color 0.2s;
      }
      .policy-container a:hover { color: #e0b0ff; }

      /* ── WTQ DISPLAY ── */
      #wtq-display-section {
        padding: 16px;
        background: rgba(120,0,255,0.10);
        border: 1px solid rgba(180,80,255,0.25);
        border-radius: 12px;
        margin-top: 8px;
      }
      #wtq-display-section p { color: #c87aff; margin-bottom: 10px; font-size: 0.88rem; }
      #wtq-display-section > div {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(0,0,0,0.35);
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid rgba(180,80,255,0.2);
      }
      #generated-wtq-id {
        font-size: 1.15rem;
        color: white;
        letter-spacing: 2px;
        font-weight: 700;
        font-family: 'Courier New', monospace;
      }

      /* Small inline copy button */
      .copy-wtq-btn {
        padding: 5px 11px !important;
        width: auto !important;
        background: linear-gradient(135deg, #9d3fff, #6a00d4) !important;
        color: white !important;
        font-size: 0.78rem !important;
        font-weight: 600 !important;
        border-radius: 6px !important;
        box-shadow: 0 2px 8px rgba(140,0,255,0.3) !important;
      }

      /* ── SUPPORT BUTTON ── */
      .support-link {
        position: fixed;
        bottom: 22px;
        right: 22px;
        width: 54px;
        height: 54px;
        background: linear-gradient(135deg, #9d3fff, #6a00d4);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(140,0,255,0.5), 0 0 0 1px rgba(200,120,255,0.2);
        text-decoration: none;
        z-index: 100;
        transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), box-shadow 0.3s;
        animation: supportPulse 3s ease-in-out infinite;
      }
      .support-link:hover {
        transform: scale(1.12) translateY(-2px);
        box-shadow: 0 8px 30px rgba(140,0,255,0.7), 0 0 0 2px rgba(200,120,255,0.4);
      }

      @keyframes supportPulse {
        0%, 100% { box-shadow: 0 4px 20px rgba(140,0,255,0.5), 0 0 0 1px rgba(200,120,255,0.2); }
        50%       { box-shadow: 0 4px 30px rgba(180,80,255,0.75), 0 0 0 3px rgba(200,120,255,0.15); }
      }

      .support-icon-svg {
        width: 24px;
        height: 24px;
        color: white;
      }

      /* ── PREMIUM TOAST NOTIFICATION ── */
      .toast-container {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        pointer-events: none;
        width: 340px;
        max-width: 92vw;
      }

      .toast {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 18px;
        border-radius: 14px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
        color: white;
        font-size: 0.88rem;
        font-weight: 500;
        line-height: 1.45;
        pointer-events: all;
        animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
        position: relative;
        overflow: hidden;
      }

      .toast::before {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 4px;
        border-radius: 14px 0 0 14px;
      }

      .toast.success { background: rgba(20,0,40,0.92); }
      .toast.success::before { background: linear-gradient(180deg, #9d3fff, #4caf50); }

      .toast.error { background: rgba(20,0,40,0.92); }
      .toast.error::before { background: linear-gradient(180deg, #ff4b6e, #c62828); }

      .toast.info { background: rgba(20,0,40,0.92); }
      .toast.info::before { background: linear-gradient(180deg, #9d3fff, #5b67f8); }

      .toast-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        margin-top: 1px;
      }

      .toast-msg { flex: 1; }

      .toast-close {
        background: none;
        border: none;
        color: rgba(255,255,255,0.45);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        padding: 0 0 0 6px;
        margin-top: -1px;
        flex-shrink: 0;
        transition: color 0.2s;
        pointer-events: all;
      }
      .toast-close:hover { color: white; }

      @keyframes toastIn {
        from { opacity: 0; transform: translateY(-16px) scale(0.94); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes toastOut {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to   { opacity: 0; transform: translateY(-10px) scale(0.95); }
      }

      .toast.removing { animation: toastOut 0.3s cubic-bezier(0.4,0,1,1) both; }

      /* ── DIVIDER ── */
      .form-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(180,80,255,0.3), transparent);
        margin: 2px 0;
      }

      /* ── DATE INPUT DARK ── */
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.7) sepia(1) hue-rotate(240deg);
        cursor: pointer;
      }
    </style>
  </head>
  <body onclick="closeAllForms(event)">

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container" onclick="event.stopPropagation()">

      <!-- Logo -->
      <div class="logo-wrapper">
        <img
          id="exchange-logo"
          class="logo-img"
          src="https://hwrvqyipozrsxyjdpqag.supabase.co/storage/v1/object/public/AvicnKnov%20Ex%20Image/1774528165689%20(2).png"
          alt="AvicnKnov Ex Logo"
          onerror="this.style.display='none'"
        />
      </div>

      <div class="title">AvicnKnov Ex</div>

      <div class="menu">
        <button id="btn-login" onclick="showForm('login')">Login</button>
        <button id="btn-register" onclick="showForm('register')">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="login" class="form">
        <input type="text" id="login-identifier" placeholder="Gmail or Phone Number">
        <div class="input-wrapper">
          <input type="password" id="login-pass" placeholder="Password">
          <button type="button" class="eye-toggle" onclick="togglePassword('login-pass', this)" title="Show/Hide Password">
            <svg id="eye-icon-login-pass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <button onclick="login()">Login</button>
        <button class="form-secondary-btn" onclick="showForm('forgot')">Forgot Password?</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="register" class="form">
        <div class="auth-type-selector">
          <button id="reg-type-email" class="active" onclick="setRegType('email')">Use Gmail</button>
          <button id="reg-type-phone" onclick="setRegType('phone')">Use Phone Number</button>
        </div>
        <input type="text" id="reg-name" placeholder="Full Name">
        <input type="text" id="reg-username" placeholder="Username">
        <select id="reg-country"></select>
        <select id="reg-gender">
          <option value="" disabled selected>Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="reg-dob">
        <input type="email" id="reg-email" placeholder="Gmail">
        <input type="text" id="reg-phone" placeholder="Phone Number (e.g., +919876543210)" style="display:none;">
        <div class="input-wrapper">
          <input type="password" id="reg-pass" placeholder="Password (8-16 chars)">
          <button type="button" class="eye-toggle" onclick="togglePassword('reg-pass', this)" title="Show/Hide Password">
            <svg id="eye-icon-reg-pass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="policy-container">
          <input type="checkbox" id="reg-policy-check">
          <label for="reg-policy-check">
            I confirm I am creating this account voluntarily and agree to the
            <a href="policy.html" target="_blank">Policy</a>,
            <a href="service.html" target="_blank">Service</a>, and
            <a href="community.html" target="_blank">Community Guideline</a>.
          </label>
        </div>
        <button id="reg-btn" onclick="register()">Register</button>

        <div id="wtq-display-section" style="display: none; padding: 15px; background: rgba(0, 255, 225, 0.1); border-radius: 8px; margin-top: 15px;">
          <p style="margin-bottom: 10px; color: #c87aff;">Your Unique WTQ ID:</p>
          <div style="display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,0.35); padding: 8px; border-radius: 6px;">
            <strong id="generated-wtq-id" style="font-size: 1.2rem; color: white; letter-spacing: 1px;"></strong>
            <button class="copy-wtq-btn" onclick="copyWTQID()" style="width: auto; padding: 5px 10px; background: #9d3fff; color: white; font-weight: normal; border: none; border-radius: 6px; cursor: pointer;">Copy</button>
          </div>
          <button onclick="redirectToAgent('register')" style="margin-top: 15px; width:100%; padding:11px; border:none; border-radius:10px; background:linear-gradient(135deg,#9d3fff,#6a00d4); color:white; font-weight:700; cursor:pointer;">Verify Agent</button>
          <p id="wtq-timer" style="margin-top: 10px; font-size: 0.8rem; color: #ccc;"></p>
        </div>
      </div>

      <!-- FORGOT FORM -->
      <div id="forgot" class="form">
        <div class="auth-type-selector">
          <button id="forgot-type-email" class="active" onclick="setForgotType('email')">Use Gmail</button>
          <button id="forgot-type-phone" onclick="setForgotType('phone')">Use Phone Number</button>
        </div>
        <input type="email" id="forgot-email" placeholder="Registered Gmail">

      // ── PREMIUM TOAST ──
      function showToast(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;

        const icons = {
          success: `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>`,
          error:   `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#ff4b6e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
          info:    `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="#c87aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-width="3"/></svg>`,
        };

        toast.innerHTML = `
          ${icons[type] || icons.info}
          <span class="toast-msg">${message}</span>
          <button class="toast-close" onclick="removeToast(this.parentElement)">✕</button>
        `;
        container.appendChild(toast);

        const timer = setTimeout(() => removeToast(toast), duration);
        toast._timer = timer;
      }

      function removeToast(toast) {
        if (!toast || toast._removing) return;
        toast._removing = true;
        clearTimeout(toast._timer);
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      }

      // Replace native alert with toast
      window._nativeAlert = window.alert;
      window.alert = function(msg) {
        let type = 'info';
        if (msg.startsWith('✅') || msg.toLowerCase().includes('success') || msg.toLowerCase().includes('copied') || msg.toLowerCase().includes('sent') || msg.toLowerCase().includes('registered') || msg.toLowerCase().includes('initiated')) type = 'success';
        if (msg.startsWith('❌') || msg.toLowerCase().includes('failed') || msg.toLowerCase().includes('error') || msg.toLowerCase().includes('invalid') || msg.toLowerCase().includes('not found') || msg.toLowerCase().includes('already')) type = 'error';
        showToast(msg.replace(/^[✅❌🔗]\s?/, ''), type, 5000);
      };

      // ── PASSWORD EYE TOGGLE ──
      function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);

        input.type = isHidden ? 'text' : 'password';

        btn.classList.remove('eye-blink');

      // ── UTILITY FUNCTIONS ──
      function generateWTQID() {
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 12; i++) {
          result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
      }

      function generateWalletID() {
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 12; i++) {
          result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
      }

      function generateRecoveryID() {
        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 24; i++) {
          result += characters.charAt(Math.floor(Math.random() * characters.length));
        }
        return result;
      }

      function generateWalletAddress() {
        const hex = '0123456789abcdef';
        let result = '0x';
        for (let i = 0; i < 40; i++) {
          result += hex.charAt(Math.floor(Math.random() * 16));
        }
        return result;
      }

      // ── MAIN AUTH LOGIC ──
      async function login() {
        const identifier = document.getElementById('login-identifier').value.trim();
        const pass = document.getElementById('login-pass').value;
        if (!identifier || !pass) return alert("Fill all fields");
        const isEmail = identifier.includes('@');
        if (isEmail) {
          let { data, error } = await sb.auth.signInWithPassword({ email: identifier, password: pass });
          if (error) {
            if (error.message.includes('Email not confirmed')) {
              alert("❌ Login Failed: Email not verified. Check your Gmail.");
            } else {
              alert("❌ Login Failed (Gmail): " + error.message);
            }
          } else if (data.session) {
            window.location.href = "main.html";
          }
        } else {
          const cleanNumber = identifier.replace(/[^0-9+]/g, '');
          const dummyEmail = cleanNumber + PHONE_LOGIN_DOMAIN;
          let { data, error } = await sb.auth.signInWithPassword({ email: dummyEmail, password: pass });
          if (error) {
            const { data: unverifiedData } = await sb.from('user-verify').select('wtq_id, is_verified').eq('phone_number', cleanNumber).maybeSingle();
            if (unverifiedData && unverifiedData.is_verified === false) {
              alert("❌ Account not verified. Please use the 'Verify Agent' button on the registration page to complete verification.");
            } else {
              alert("❌ Login Failed: Account not found or credentials incorrect.");
            }
          } else if (data.session) {
            window.location.href = "main.html";
          }
        }
      }

      async function register() {
        const name = document.getElementById('reg-name').value;
        const username = document.getElementById('reg-username').value;
        const country = document.getElementById('reg-country').value;
        const gender = document.getElementById('reg-gender').value;
        const dob = document.getElementById('reg-dob').value;
        const pass = document.getElementById('reg-pass').value;
        const email = document.getElementById('reg-email').value;
        const phone = document.getElementById('reg-phone').value;
        const policyChecked = document.getElementById('reg-policy-check').checked;
        const identifier = registrationType === 'email' ? email : phone;
        if (!name || !username || !country || !gender || !dob || !identifier || !pass || !policyChecked) {
          return alert("Fill all fields and agree to the policy.");
        }
        if (pass.length < 8 || pass.length > 16) {
          return alert("Password must be between 8 and 16 characters.");
        }
        const age = new Date().getFullYear() - new Date(dob).getFullYear();
        if (age < 17 || age > 110) return alert("Age must be between 17 and 110");
        const regButton = document.getElementById('reg-btn');
        regButton.disabled = true;
        regButton.textContent = 'Processing...';

        if (registrationType === 'email') {
          const { error: verifyInsertError } = await sb.from('user-verify-gmail').insert([{ email, password: pass, full_name: name, username, country, gender, dob, phone_number: phone }]);
          if (verifyInsertError) {
            regButton.disabled = false;
            regButton.textContent = 'Register';
            return alert("❌ Registration Failed: " + verifyInsertError.message);
          }
          let { error: authError } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: 'https://avicnknovex.github.io/AvicnKnov-Ex-/success.html' } });
          regButton.disabled = false;
          regButton.textContent = 'Register';
          if (authError) return alert("❌ Registration Failed (Auth): " + authError.message);
          alert("✅ Registered! Check your Gmail to verify.");
        } else {
          const phoneNumber = phone.trim();
          const { data: verifiedUser } = await sb.from('user-details').select('wtq_id').eq('phone_number', phoneNumber).maybeSingle();
          if (verifiedUser) {
            regButton.disabled = false;
            regButton.textContent = 'Create Account & Get ID';
            return alert("This number is already registered.");
          }
          const newWTQID = generateWTQID();
          const { error: insertError } = await sb.from('user-verify').insert({ phone_number: phoneNumber, password_hash: pass, wtq_id: newWTQID, full_name: name, username, country, gender, dob });
          regButton.disabled = false;
          regButton.textContent = 'Create Account & Get ID';
          if (insertError) return alert("❌ Registration failed: " + insertError.message);
          document.getElementById('generated-wtq-id').textContent = newWTQID;
          document.getElementById('wtq-display-section').style.display = 'block';
          alert("✅ Account creation initiated! Copy WTQ ID.");
        }
      }

        }
      }

      async function createWalletForUser(userId, fullName, username) {

        if (!existingWallet) {
          const walletId = generateWalletID();
          const recoveryId = generateRecoveryID();
          const walletAddr = generateWalletAddress();
          await sb.from('wallet_user_profile').insert([{
            uid: userId,
            full_name: fullName,
            username: username,
            wallet_name: `${username}`,
            wallet_id: walletId,
            recovery_id: recoveryId,
            lock_code: '000000',
            status: 'active'
          }]);
          await sb.from('user_wallet_balance').insert([{
            uid: userId,
            wallet_address: walletAddr,
            balance: 0.00
          }]);
        }
      }

                await createWalletForUser(session.user.id, pData.full_name, pData.username);
              }

            window.location.href = "main.html";
          }
        }
      });
