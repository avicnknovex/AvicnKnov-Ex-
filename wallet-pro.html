<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Balance Card (Premium Glassmorphism) */
        .balance-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        /* Cool glowing effect behind balance */
        .balance-card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 150px;
            background: var(--primary);
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .balance-card > * {
            position: relative;
            z-index: 1;
        }

        .balance-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* Action Buttons */
        .action-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px 10px;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: var(--primary);
        }

        .action-icon {
            font-size: 20px;
            color: var(--primary);
        }

        /* Custom Toggle Switch */
        .switch-container {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 30px;
            display: flex;
            position: relative;
            padding: 5px;
            margin-bottom: 20px;
        }

        .switch-slider {
            position: absolute;
            top: 5px;
            left: 5px;
            width: calc(50% - 5px);
            height: calc(100% - 10px);
            background: var(--primary);
            border-radius: 25px;
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1;
        }

        .switch-btn {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .switch-btn.active {
            color: #fff;
        }

        /* Dynamic Content Area */
        .content-area {
            position: relative;
            min-height: 200px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skeleton Loader for Balance */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
            height: 40px;
            width: 150px;
            margin: 0 auto;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

    <div class="balance-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance-amount" id="balance-container">
            <div class="skeleton"></div> </div>
    </div>

    <div class="action-row">
        <a href="wallet-deposit.html" class="action-btn">
            <span class="action-icon">↓</span>
            Deposit
        </a>
        <a href="wallet-withdrawal.html" class="action-btn">
            <span class="action-icon">↑</span>
            Withdrawal
        </a>
        <a href="wallet-transaction.html" class="action-btn">
            <span class="action-icon">⟲</span>
            Transactions
        </a>
    </div>

    <div class="switch-container">
        <div class="switch-slider" id="switch-slider"></div>
        <div class="switch-btn active" id="btn-all" onclick="switchTab('all')">All</div>
        <div class="switch-btn" id="btn-trades" onclick="switchTab('trades')">Trades</div>
    </div>

    <div class="content-area">
        <div id="content-all" class="tab-content active">
            </div>
        <div id="content-trades" class="tab-content">
            </div>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE CONNECTION & FETCH BALANCE
        // ==========================================
        const SUPABASE_URL = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZMp';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchBalance() {
            try {
                // Table 'user-wallet-balance' se balance fetch kar rahe hain
                // Note: Aapko yahan par `.eq('user_id', myUserId)` lagana pad sakta hai real app mein
                const { data, error } = await supabase
                    .from('user-wallet-balance')
                    .select('balance')
                    .limit(1)
                    .single();

                if (error) throw error;

                // Balance milne par UI update karo
                const balance = data?.balance || 0;
                document.getElementById('balance-container').innerHTML = `₹${balance.toLocaleString('en-IN')}`;
            } catch (error) {
                console.error('Error fetching balance:', error);
                document.getElementById('balance-container').innerHTML = '₹0';
            }
        }
        
        // Load balance immediately
        fetchBalance();

        // ==========================================
        // 2. SMOOTH TAB SWITCHING & DYNAMIC JS LOAD
        // ==========================================
        const slider = document.getElementById('switch-slider');
        const btnAll = document.getElementById('btn-all');
        const btnTrades = document.getElementById('btn-trades');
        const contentAll = document.getElementById('content-all');
        const contentTrades = document.getElementById('content-trades');

        // Track loaded scripts taaki baar baar load na ho
        const loadedScripts = {};

        function loadScript(scriptName) {
            // Agar pehle se load nahi hua hai tabhi load karo
            if (!loadedScripts[scriptName]) {
                const script = document.createElement('script');
                script.src = scriptName;
                script.type = 'text/javascript';
                script.onerror = () => {
                    // Agar aapne JS file nahi banayi hai, to error chupchap console mein jayega, UI break nahi hoga
                    console.log(`Waiting for ${scriptName} to be created...`);
                };
                document.body.appendChild(script);
                loadedScripts[scriptName] = true;
            }
        }

        function switchTab(tab) {
            // Slider Animation
            if (tab === 'all') {
                slider.style.transform = 'translateX(0)';
                btnAll.classList.add('active');
                btnTrades.classList.remove('active');
                
                contentAll.classList.add('active');
                contentTrades.classList.remove('active');

                // Dynamically load All JS
                loadScript('wallet-all.js');

            } else if (tab === 'trades') {
                slider.style.transform = 'translateX(100%)';
                btnTrades.classList.add('active');
                btnAll.classList.remove('active');
                
                contentTrades.classList.add('active');
                contentAll.classList.remove('active');

                // Dynamically load Trades JS
                loadScript('wallet-holding.js');
            }
        }

        // Initialize default view by loading 'All' file script
        window.onload = () => {
            loadScript('wallet-all.js');
        };
    </script>
</body>
</html>
