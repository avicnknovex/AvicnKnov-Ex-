<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Deposit - AvicnKnov Ex</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Animations */
      .fade-in { animation: fadeIn 0.6s ease-out forwards; }
      .slide-up { animation: slideUp 0.6s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      /* Premium Shine Animation for Button */
      @keyframes shine {
        0% { transform: translateX(-100%); }
        20% { transform: translateX(100%); }
        100% { transform: translateX(100%); }
      }
      .shine-effect::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: translateX(-100%);
        animation: shine 3s infinite;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-12">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            ArrowLeft, Bot, ShieldCheck, Zap, AlertTriangle, 
            Headphones, Mail, Copy, CheckCircle2, ShoppingCart, Sparkles 
        } from 'lucide-react';

        const DepositP2P = () => {
            const [copied, setCopied] = useState(false);
            const supportEmail = "help.avicnkvonteam@gmail.com";

            // --- Navigation Logic (Preserved) ---
            const handleBack = () => {
                if (window.history.length > 1 && document.referrer !== "") {
                    window.history.back();
                } else {
                    window.location.href = 'dashboard.html';
                }
            };

            const handleSupport = () => {
                window.location.href = 'help.html#/help';
            };

            const handleOpenP2PMarket = () => {
                window.location.href = 'p2p.html';
            };

            const handleCopyEmail = () => {
                navigator.clipboard.writeText(supportEmail);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen text-slate-800 relative overflow-hidden">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto flex items-center justify-between">
                            <button 
                                onClick={handleBack} 
                                className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100"
                            >
                                <ArrowLeft className="w-5 h-5" />
                            </button>
                            <h1 className="text-xl font-black text-slate-800 tracking-tight">
                                P2P Deposit
                            </h1>
                            <div className="w-10"></div>
                        </div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 sm:px-6 pt-6">
                        
                        {/* AI & Features Section */}
                        <section className="space-y-6 slide-up">
                            <div className="bg-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden">
                                {/* Decorative Blur */}
                                <div className="absolute top-0 right-0 w-32 h-32 bg-purple-50 rounded-full blur-3xl opacity-60 pointer-events-none"></div>
                                
                                <div className="flex items-center gap-4 mb-4 relative z-10">
                                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-purple-500/20 text-white">
                                        <Bot className="w-6 h-6" />
                                    </div>
                                    <h2 className="text-lg font-black text-slate-800">AI-Powered P2P</h2>
                                </div>

                                <p className="text-slate-500 text-sm leading-relaxed mb-6 font-medium relative z-10">
                                    Our P2P system is built for speed and security. We have integrated an <span className="text-purple-600 font-bold">AI Assistant</span> that helps facilitate trades efficiently, reducing the chance of scams and ensuring smooth transactions.
                                </p>

                                <div className="grid grid-cols-2 gap-4 relative z-10">
                                    <div className="flex items-center gap-2 text-xs font-bold text-slate-600 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                        <ShieldCheck className="w-4 h-4 text-emerald-500" />
                                        <span>Scam Protection</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs font-bold text-slate-600 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                        <Zap className="w-4 h-4 text-amber-500" />
                                        <span>Fast Transactions</span>
                                    </div>
                                </div>
                            </div>

                            {/* Safety Notice */}
                            <div className="bg-amber-50 border border-amber-100 rounded-3xl p-5 shadow-sm">
                                <div className="flex items-start gap-3">
                                    <div className="bg-amber-100 p-2 rounded-full shrink-0">
                                        <AlertTriangle className="w-5 h-5 text-amber-600" />
                                    </div>
                                    <div>
                                        <h3 className="text-sm font-bold text-amber-800 mb-1">Safety Notice</h3>
                                        <p className="text-xs text-amber-700/80 leading-relaxed font-medium">
                                            You can deposit funds via P2P. Please be aware that while we strive for safety, P2P transactions involve counterparties. <span className="font-bold">Trade responsibly.</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Help & Support Section */}
                        <section className="mt-8 slide-up" style={{ animationDelay: '0.1s' }}>
                            <div className="flex items-center justify-between mb-4 px-1">
                                <h3 className="text-lg font-bold text-slate-800">Need Help?</h3>
                                <button 
                                    onClick={handleSupport}
                                    className="flex items-center gap-2 text-xs font-bold text-purple-600 hover:text-purple-700 transition-colors bg-purple-50 hover:bg-purple-100 px-4 py-2 rounded-full"
                                >
                                    <Headphones className="w-3.5 h-3.5" />
                                    Help Center
                                </button>
                            </div>

                            <div className="bg-white rounded-3xl border border-slate-100 p-5 shadow-sm">
                                <p className="text-slate-500 text-sm mb-5 leading-relaxed font-medium">
                                    Facing issues with P2P? Our support team is ready to assist. Contact us directly for the fastest response.
                                </p>

                                {/* Email Copy Box (Dark Contrast for Emphasis) */}
                                <div 
                                    onClick={handleCopyEmail}
                                    className="group cursor-pointer relative overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 p-1 transition-transform active:scale-95 duration-200"
                                >
                                    <div className="bg-slate-800 rounded-xl p-4 flex items-center justify-between border border-slate-700 group-hover:border-slate-600 transition-colors">
                                        <div className="flex items-center gap-4 overflow-hidden">
                                            <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center group-hover:bg-purple-600 text-slate-300 group-hover:text-white transition-colors duration-300">
                                                <Mail className="w-5 h-5" />
                                            </div>
                                            <div className="flex flex-col overflow-hidden">
                                                <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-0.5">Direct Support Email</span>
                                                <span className="text-sm font-mono font-bold text-white truncate">
                                                    {supportEmail}
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="ml-2 pl-3 border-l border-slate-700 group-hover:border-slate-600 transition-colors">
                                            {copied ? (
                                                <CheckCircle2 className="w-5 h-5 text-emerald-400 animate-bounce" />
                                            ) : (
                                                <Copy className="w-5 h-5 text-slate-500 group-hover:text-purple-400" />
                                            )}
                                        </div>
                                    </div>
                                    
                                    {copied && (
                                        <div className="absolute inset-0 bg-slate-900/90 flex items-center justify-center backdrop-blur-[1px] z-20 rounded-2xl">
                                            <div className="flex items-center gap-2 bg-emerald-500 text-white px-4 py-2 rounded-full font-bold shadow-lg text-xs">
                                                <CheckCircle2 className="w-4 h-4" /> Copied!
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* NEW PREMIUM P2P MARKET BUTTON */}
                        <div className="mt-8 mb-8 slide-up" style={{ animationDelay: '0.2s' }}>
                            <button 
                                onClick={handleOpenP2PMarket}
                                className="w-full relative overflow-hidden bg-gradient-to-r from-violet-600 to-indigo-600 rounded-3xl p-1 shadow-xl shadow-indigo-500/30 group transition-transform active:scale-95 shine-effect"
                            >
                                <div className="bg-white/10 backdrop-blur-sm rounded-[20px] p-5 flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-white shadow-inner">
                                            <ShoppingCart className="w-6 h-6" />
                                        </div>
                                        <div className="text-left">
                                            <h4 className="text-white font-black text-lg leading-tight mb-1">Buy via P2P Market</h4>
                                            <span className="text-indigo-100 text-[10px] font-bold uppercase tracking-widest">Start Fast Deposit</span>
                                        </div>
                                    </div>
                                    <Sparkles className="w-6 h-6 text-yellow-300 animate-pulse" />
                                </div>
                            </button>
                            <div className="mt-4 flex items-center justify-center gap-2">
                                <span className="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                                <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Secure AI Verification Active</p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<DepositP2P />);
    </script>
</body>
</html>
