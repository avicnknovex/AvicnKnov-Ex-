<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Deposit - AvicnKnov Exchange</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');

      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: white;
      }
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Animations */
      .fade-in { animation: fadeIn 0.6s ease-out forwards; }
      .slide-up { animation: slideUp 0.6s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      /* Glassmorphism */
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(51, 65, 85, 0.5);
      }

      /* Premium Purple Glow Button */
      .premium-p2p-btn {
        position: relative;
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .premium-p2p-btn:hover {
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        transform: translateY(-3px);
      }
      .premium-p2p-btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -100%;
        width: 100%;
        height: 200%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transform: rotate(25deg);
        animation: premium-shine 4s infinite;
      }
      @keyframes premium-shine {
        0% { left: -100%; }
        20% { left: 100%; }
        100% { left: 100%; }
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            ArrowLeft, Bot, ShieldCheck, Zap, AlertTriangle, 
            Headphones, Mail, Copy, CheckCircle2, ShoppingCart, Sparkles 
        } from 'lucide-react';

        const DepositP2P = () => {
            const [copied, setCopied] = useState(false);
            const supportEmail = "help.avicnkvonteam@gmail.com";

            // BACK BUTTON LOGIC: Goes back to deposit.html
            const handleBack = () => {
                window.location.href = 'deposit.html';
            };

            const handleSupport = () => {
                window.location.href = 'help.html#/help';
            };

            const handleOpenP2PMarket = () => {
                window.location.href = 'p2p.html';
            };

            const handleCopyEmail = () => {
                navigator.clipboard.writeText(supportEmail);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-white relative overflow-hidden pb-12">
                    
                    {/* Background Ambience */}
                    <div className="fixed inset-0 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[120px]"></div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 sm:px-6">
                        
                        {/* Header */}
                        <header className="pt-6 pb-8 flex items-center fade-in">
                            <button 
                                onClick={handleBack} 
                                className="p-2.5 rounded-full bg-slate-900 border border-slate-700 hover:bg-slate-800 transition-all group"
                            >
                                <ArrowLeft className="w-5 h-5 text-gray-400 group-hover:text-white" />
                            </button>
                            <h1 className="ml-4 text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-300">
                                P2P Deposit
                            </h1>
                        </header>

                        {/* AI & Features Section */}
                        <section className="space-y-6 slide-up">
                            <div className="glass-panel p-6 rounded-2xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl group-hover:bg-purple-500/30 transition-all"></div>
                                
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="p-2 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg shadow-lg shadow-purple-900/20">
                                        <Bot className="w-6 h-6 text-white" />
                                    </div>
                                    <h2 className="text-xl font-bold text-white">AI-Powered P2P Trading</h2>
                                </div>

                                <p className="text-slate-300 text-sm leading-relaxed mb-6">
                                    We have built this P2P system to be highly safe and secure. Transactions here are incredibly fast. 
                                    For your benefit, we have integrated an <span className="text-purple-400 font-bold">AI Assistant</span> 
                                    that helps you buy and sell orders efficiently. This allows you to trade with ease and significantly 
                                    reduces the chance of scams.
                                </p>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="flex items-center gap-2 text-xs text-slate-400">
                                        <ShieldCheck className="w-4 h-4 text-emerald-400" />
                                        <span>Scam Protection</span>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs text-slate-400">
                                        <Zap className="w-4 h-4 text-yellow-400" />
                                        <span>Fast Transactions</span>
                                    </div>
                                </div>
                            </div>

                            {/* SPECIFIC DISCLAIMER FOR DEPOSIT */}
                            <div className="bg-amber-500/5 border border-amber-500/20 rounded-2xl p-5">
                                <div className="flex items-start gap-3">
                                    <AlertTriangle className="w-6 h-6 text-amber-500 shrink-0 mt-1" />
                                    <div>
                                        <h3 className="text-base font-bold text-amber-500 mb-1">Safety Notice</h3>
                                        <p className="text-xs text-slate-300 leading-relaxed">
                                            You can deposit funds here using P2P. However, please be aware that 
                                            <span className="text-white font-semibold"> some transactions are safe, and some may not be. </span> 
                                            It is your choice to proceed. Our team will not be responsible for any issues.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Help & Support Section */}
                        <section className="mt-10 slide-up" style={{ animationDelay: '0.1s' }}>
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-lg font-semibold text-white">Need Help?</h3>
                                <button 
                                    onClick={handleSupport}
                                    className="flex items-center gap-2 text-xs font-bold text-purple-400 hover:text-purple-300 transition-colors bg-purple-500/10 px-3 py-1.5 rounded-full"
                                >
                                    <Headphones className="w-3.5 h-3.5" />
                                    Help Center
                                </button>
                            </div>

                            <div className="glass-panel p-6 rounded-2xl">
                                <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                                    If you face any problems with the P2P system, you can visit our Help & Support section. 
                                    We are ready to assist you with any P2P-related issues. For the fastest response, 
                                    please contact us directly via email.
                                </p>

                                {/* Premium Email Box */}
                                <div 
                                    onClick={handleCopyEmail}
                                    className="group cursor-pointer relative overflow-hidden rounded-xl border border-slate-700 bg-slate-900/80 p-4 transition-all duration-300 hover:border-purple-500/50 hover:shadow-lg hover:shadow-purple-500/10"
                                >
                                    <div className="flex items-center justify-between relative z-10">
                                        <div className="flex items-center gap-4 overflow-hidden">
                                            <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-purple-600 transition-colors duration-300">
                                                <Mail className="w-5 h-5 text-slate-300 group-hover:text-white" />
                                            </div>
                                            <div className="flex flex-col overflow-hidden">
                                                <span className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-0.5">Direct Support Email</span>
                                                <span className="text-sm sm:text-base font-mono font-medium text-white truncate group-hover:text-purple-100 transition-colors">
                                                    {supportEmail}
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="ml-2 pl-3 border-l border-slate-700 group-hover:border-slate-600 transition-colors">
                                            {copied ? (
                                                <CheckCircle2 className="w-5 h-5 text-emerald-400 animate-bounce" />
                                            ) : (
                                                <Copy className="w-5 h-5 text-slate-500 group-hover:text-purple-400" />
                                            )}
                                        </div>
                                    </div>
                                    
                                    {/* Success Toast */}
                                    {copied && (
                                        <div className="absolute inset-0 bg-emerald-500/10 flex items-center justify-center backdrop-blur-[2px] z-20">
                                            <div className="bg-emerald-500 text-white text-xs px-3 py-1 rounded-full font-bold shadow-lg flex items-center gap-1">
                                                <CheckCircle2 className="w-3 h-3" /> Copied!
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* NEW PREMIUM P2P MARKET BUTTON */}
                        <div className="mt-10 slide-up" style={{ animationDelay: '0.2s' }}>
                            <button 
                                onClick={handleOpenP2PMarket}
                                className="premium-p2p-btn w-full bg-gradient-to-r from-purple-700 via-purple-600 to-indigo-700 p-[1.5px] rounded-2xl shadow-2xl shadow-purple-900/30 group"
                            >
                                <div className="bg-slate-950/40 group-hover:bg-transparent transition-all duration-300 rounded-[15px] py-4 px-6 flex items-center justify-between">
                                    <div className="flex items-center gap-4">
                                        <div className="bg-purple-500/20 p-2.5 rounded-xl group-hover:bg-white/20 transition-all">
                                            <ShoppingCart className="w-6 h-6 text-purple-300 group-hover:text-white" />
                                        </div>
                                        <div className="text-left">
                                            <h4 className="text-white font-extrabold text-lg leading-none mb-1 group-hover:translate-x-1 transition-transform">Buy via P2P Market</h4>
                                            <span className="text-purple-300/80 text-[10px] font-bold uppercase tracking-[0.15em] group-hover:text-white transition-colors">Start Fast Deposit</span>
                                        </div>
                                    </div>
                                    <Sparkles className="w-5 h-5 text-purple-400 group-hover:text-white animate-pulse" />
                                </div>
                            </button>
                            <div className="mt-4 flex items-center justify-center gap-2">
                                <span className="w-1.5 h-1.5 bg-purple-500 rounded-full animate-ping"></span>
                                <p className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Secure AI Verification Active</p>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<DepositP2P />);
    </script>
</body>
</html>
