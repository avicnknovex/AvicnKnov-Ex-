<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVX Premium Wallet</title>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #ffffff;
            --card: #f8fafc;
            --text: #0f172a;
            --sub: #64748b;
            --acc: #4f46e5; /* Indigo */
            --acc-g: linear-gradient(135deg, #4f46e5, #4338ca);
            --danger: #ef4444;
            --border: 1px solid #e2e8f0;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; height: 100vh; position: relative; padding-bottom: 90px; /* Space for Bottom Nav */ }

        /* --- LOADERS & ANIMATIONS --- */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999; background: #fff;
            display: none; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 80px; transition: opacity 0.5s;
        }
        #loading-bg {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            opacity: 0.1; transition: background-image 1s ease-in-out; filter: grayscale(1);
        }
        .load-content { position: relative; z-index: 2; text-align: center; width: 85%; }
        .load-bar-wrap { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .load-bar { height: 100%; background: var(--acc); width: 0%; transition: width 0.3s; }
        .load-txt { font-size: 14px; color: var(--sub); font-weight: 600; letter-spacing: 0.5px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- DASHBOARD --- */
        #dashboard-view { display: none; width: 100%; }
        
        /* VIEWS (Home, Market, Trade, Pro) */
        .main-view { display: none; animation: fadeIn 0.3s ease; }
        .main-view.active { display: block; }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

        /* Header */
        .dash-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 20px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); 
            position: sticky; top: 0; z-index: 50; border-bottom: var(--border); 
        }
        .profile-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; padding: 2px; border: 1px solid #e2e8f0; cursor: pointer; z-index: 2; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
        
        .nav-toggle-container {
            position: absolute; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; z-index: 1;
        }
        .nav-toggle { 
            background: #f1f5f9; border-radius: 20px; padding: 4px; 
            display: flex; border: 1px solid #e2e8f0; pointer-events: auto;
            flex-direction: row-reverse;
        }
        .nav-opt { padding: 6px 16px; border-radius: 16px; font-size: 12px; font-weight: 700; color: var(--sub); cursor: pointer; transition: 0.3s; }
        .nav-opt.active { background: #fff; color: var(--text); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .header-icons { display: flex; gap: 12px; z-index: 2; }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px; background: #fff; display: flex; align-items: center; justify-content: center; color: var(--text); border: var(--border); cursor: pointer; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .notif-badge { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; }

        /* Balance Card */
        .bal-card { margin: 20px; padding: 25px; background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 28px; box-shadow: 0 15px 40px -10px rgba(15, 23, 42, 0.4); text-align: center; position: relative; overflow: hidden; color: #fff; }
        .bal-card::before { content:''; position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: var(--acc); filter: blur(80px); opacity: 0.4; }
        .bal-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .bal-amount { font-size: 36px; font-weight: 800; margin: 10px 0; color: #fff; }
        .curr-sel { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 11px; outline: none; }

        .addr-box { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: space-between; font-family: monospace; font-size: 12px; color: #cbd5e1; margin-top: 15px; border: 1px dashed rgba(255,255,255,0.2); }
        .addr-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }
        
        /* Main Actions */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 0 20px 20px 20px; }
        .act-btn { 
            border: none; border-radius: 18px; padding: 15px 0; color: #fff; font-size: 12px; font-weight: 700; 
            cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; 
            transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .act-btn:active { transform: scale(0.98); }
        .act-btn svg { width: 24px; height: 24px; color: #fff; }
        .act-deposit { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
        .act-withdraw { background: linear-gradient(135deg, #10b981, #047857); }
        .act-history { background: linear-gradient(135deg, #f97316, #9a3412); }

        /* Secondary Nav Grid */
        .sec-nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 20px 20px 20px; }
        .sec-btn {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
            padding: 15px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            text-decoration: none; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .sec-btn:active { transform: scale(0.97); background: #f8fafc; }
        .sec-icon { width: 42px; height: 42px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
        .sec-icon svg { width: 24px; height: 24px; stroke-width: 2; }
        .si-1 { background: #e0e7ff; color: #4338ca; } 
        .si-2 { background: #dbeafe; color: #1d4ed8; } 
        .si-3 { background: #d1fae5; color: #047857; } 
        .si-4 { background: #ffedd5; color: #c2410c; } 
        .si-5 { background: #fce7f3; color: #be185d; } 
        .si-6 { background: #f3f4f6; color: #374151; } 
        .sec-label { font-size: 11px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }

        /* News Carousel */
        .news-frame {
            margin: 0 20px 25px 20px; height: 140px; background: #fff; border-radius: 20px;
            border: 1px solid #e2e8f0; overflow: hidden; position: relative;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); display: flex; align-items: center;
        }
        .news-track { display: flex; height: 100%; transition: transform 0.5s ease-in-out; width: 100%; }
        .news-slide {
            min-width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; padding: 0; box-sizing: border-box; cursor: pointer; text-decoration: none; position: relative;
        }
        .ns-img { width: 100%; height: 100%; object-fit: cover; }
        .ns-video { width: 100%; height: 100%; object-fit: cover; }
        .ns-text { padding: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
        .ns-badge { background: #e0e7ff; color: var(--acc); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .ns-msg { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.4; }

        /* Tabs & Content */
        .tab-bar { display: flex; padding: 0 20px; gap: 10px; margin-bottom: 15px; justify-content: space-between; }
        .tab-pill { flex: 1; padding: 10px 0; border-radius: 12px; background: transparent; border: 1px solid #e2e8f0; color: var(--sub); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
        .tab-pill.active { background: var(--text); color: #fff; border-color: var(--text); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .content-area { padding: 0 20px; min-height: 300px; }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
            border-top: 1px solid #e2e8f0; 
            /* Fixed: Reduced bottom padding to 4px */
            padding: 8px 20px 4px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            z-index: 9000; box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
        }
        .b-nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; color: #94a3b8; transition: all 0.3s;
        }
        .b-nav-item.active { color: var(--acc); transform: translateY(-2px); }
        .b-nav-icon { width: 24px; height: 24px; }
        .b-nav-icon svg { width: 100%; height: 100%; stroke-width: 2; }
        .b-nav-item.active .b-nav-icon svg { stroke-width: 2.5; fill: rgba(99, 102, 241, 0.1); }
        .b-nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }

        /* Notifications Panel */
        #notif-panel { position: fixed; top: 0; right: -100%; width: 100%; height: 100%; background: #fff; z-index: 9500; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; }
        #notif-panel.active { right: 0; }
        .notif-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
        .notif-item { background: #f8fafc; border-radius: 16px; padding: 15px; margin-bottom: 10px; border: var(--border); position: relative; }
        .notif-title { font-weight: 700; font-size: 14px; margin-bottom: 5px; color: var(--text); }
        .notif-msg { font-size: 12px; color: var(--sub); line-height: 1.4; }
        .notif-btn { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #eef2ff; color: var(--acc); border-radius: 8px; font-size: 11px; font-weight: 700; text-decoration: none; }

        /* Helpers */
        .hidden { display: none !important; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
    </style>
</head>
<body>

    <!-- 1. LOADING SCREEN -->
    <div id="loading-screen">
        <div id="loading-bg"></div>
        <div class="load-content">
            <h2 id="load-msg" style="color:#0f172a">Loading Wallet...</h2>
            <div class="load-bar-wrap"><div class="load-bar" id="prog-bar"></div></div>
            <div class="load-txt" id="pct-txt">0%</div>
        </div>
    </div>

    <!-- 4. DASHBOARD WRAPPER -->
    <div id="dashboard-view">
        
        <!-- HOME VIEW (Active Default) -->
        <div id="view-home" class="main-view active">
            <!-- Header (Attached to Home) -->
            <div class="dash-header">
                <div class="profile-btn" onclick="location.href='wallet-profile.html'">
                    <img id="dash-profile-img" src="" class="profile-img">
                </div>
                <div class="nav-toggle-container">
                    <div class="nav-toggle">
                        <div class="nav-opt active" onclick="location.reload()">Wallet</div>
                        <div class="nav-opt" onclick="WalletApp.goToExchange()">Exchange</div>
                    </div>
                </div>
                <div class="header-icons">
                    <div class="icon-btn" onclick="location.href='help.html'">?</div>
                    <div class="icon-btn" onclick="WalletApp.toggleNotif()">🔔<div class="notif-badge" id="notif-dot"></div></div>
                </div>
            </div>

            <!-- Home Content -->
            <div class="bal-card">
                <select class="curr-sel" id="curr-switch" onchange="WalletApp.updateBalanceDisplay()">
                    <option value="INR" selected>INR</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
                <div class="bal-label">Total Balance</div>
                <div class="bal-amount" id="dash-balance">₹0.00</div>
                <div class="addr-box">
                    <span class="addr-txt" id="dash-addr">Loading...</span>
                    <span style="cursor:pointer; color:#fff;" onclick="WalletApp.copyText('dash-addr')">📋</span>
                </div>
            </div>

            <div class="action-grid">
                <div class="act-btn act-deposit" onclick="location.href='wallet-deposit.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>Deposit</div>
                <div class="act-btn act-withdraw" onclick="location.href='wallet-withdrawal.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Withdraw</div>
                <div class="act-btn act-history" onclick="location.href='wallet-transaction.html'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>History</div>
            </div>

            <div class="sec-nav-grid">
                <a href="wallet-nex.html" class="sec-btn"><div class="sec-icon si-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span class="sec-label">WALLET&NEX</span></a>
                <a href="avinq.html" class="sec-btn"><div class="sec-icon si-2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></div><span class="sec-label">AVINQ</span></a>
                <a href="wallet-trade.html" class="sec-btn"><div class="sec-icon si-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><span class="sec-label">TRADE</span></a>
                <a href="wallet-event.html" class="sec-btn"><div class="sec-icon si-4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><span class="sec-label">EVENT</span></a>
                <a href="smart-adix.html" class="sec-btn"><div class="sec-icon si-5"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 16v.01"/><path d="M12 12v.01"/></svg></div><span class="sec-label">SMART&ADIX</span></a>
                <a href="wallet-more.html" class="sec-btn"><div class="sec-icon si-6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></div><span class="sec-label">MORE</span></a>
            </div>

            <div class="news-frame">
                <div id="news-track" class="news-track"><!-- JS Injected --></div>
            </div>

            <div class="tab-bar">
                <div class="tab-pill active" onclick="WalletApp.switchTab('all')">All </div>
                <div class="tab-pill" onclick="WalletApp.switchTab('crypto')">Crypto</div>
                <div class="tab-pill" onclick="WalletApp.switchTab('spot')">Spot</div>
                <div class="tab-pill" onclick="WalletApp.switchTab('holdings')">Holdings</div>
            </div>

            <div id="wallet-content" class="content-area">
                <div id="all"></div>
                <div id="crypto" style="display:none"></div>
                <div id="spot" style="display:none"></div>
                <div id="holdings" style="display:none"></div>
            </div>
        </div>

        <!-- MARKET VIEW (Connector for wallet-market.js) -->
        <div id="view-market" class="main-view">
            <!-- wallet-market.js will inject content here if ID matches its config -->
            <div id="market-root" style="padding-top:20px;"></div> 
        </div>

        <!-- TRADE VIEW (Connector for wallet-trade.js) -->
        <div id="view-convert" class="main-view">
            <!-- wallet-trade.js will inject content here -->
            <div id="convert-root" style="padding-top:20px;"></div>
        </div>

        <!-- PRO VIEW (Connector for wallet-pro.js) -->
        <div id="view-pro" class="main-view">
            <!-- wallet-pro.js will inject content here -->
            <div id="pro-root" style="padding-top:20px;"></div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <div class="bottom-nav">
            <div class="b-nav-item active" id="nav-home" onclick="WalletApp.switchBottomNav('home')">
                <div class="b-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <span class="b-nav-label">Home</span>
            </div>
            <div class="b-nav-item" id="nav-market" onclick="WalletApp.switchBottomNav('market')">
                <div class="b-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                </div>
                <span class="b-nav-label">Market</span>
            </div>
            <div class="b-nav-item" id="nav-convert" onclick="WalletApp.switchBottomNav('convert')">
                <div class="b-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </div>
                <span class="b-nav-label">convert</span>
            </div>
            <div class="b-nav-item" id="nav-pro" onclick="WalletApp.switchBottomNav('pro')">
                <div class="b-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <span class="b-nav-label">Wallet&Pro</span>
            </div>
        </div>

    </div>

    <!-- 5. NOTIFICATION PANEL -->
    <div id="notif-panel">
        <div class="notif-header">
            <h2 style="color:var(--text)">Notifications</h2>
            <button class="close-btn" onclick="WalletApp.toggleNotif()">×</button>
        </div>
        <div id="notif-list"></div>
    </div>

    <!-- SCRIPTS -->
    <!-- Home Tab Scripts -->
    <script src="wallet-all.js"></script>
    <script src="wallet-crypto.js"></script>
    <script src="wallet-spot.js"></script>
    <script src="wallet-holding.js"></script>
    
    <!-- External Module Scripts -->
    <script src="wallet-market.js"></script>
    <script src="wallet-convert.js"></script>
    <script src="wallet-pro.js"></script>

    <script>
    /* ==========================================================
       PREMIUM WALLET LOGIC + NEWS ENGINE + BOTTOM NAV
       ========================================================== */
    const CONFIG = {
        SUPA_URL: 'https://hwrvqyipozrsxyjdpqag.supabase.co',
        SUPA_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM',
        BUCKET: 'user-wallet-image',
        NEWS_TABLE: 'wallet_news'
    };

    const supa = supabase.createClient(CONFIG.SUPA_URL, CONFIG.SUPA_KEY);

    const WalletApp = {
        user: null,
        profile: null,
        balanceData: null,
        baseBalance: 0,
        tempImageFile: null,
        generatedRecoveryId: '',
        
        // News State
        newsData: [],
        currentSlide: 0,
        newsInterval: null,
        
        // --- INIT ---
        async init() {
            const { data: { user } } = await supa.auth.getUser();
            if(!user) { alert("Please log in first"); return; }
            this.user = user;

            // Fetch Profile - Logic simplified for auto-created wallets
            const { data } = await supa.from('wallet_user_profile')
                .select('*')
                .eq('uid', user.id)
                .neq('status', 'deleted') 
                .order('created_at', { ascending: true })
                .limit(1)
                .maybeSingle();

            if (data) {
                this.profile = data;
                this.loadDashboard();
            } else {
                // If profile is missing (Old User Case), user will instruct later.
                // For now, load dashboard with placeholders to prevent stuck state
                this.profile = { full_name: 'User', username: 'user', wallet_name: 'Main Wallet', profile_image_url: null };
                this.loadDashboard();
            }
        },

                // --- ULTRA FAST INSTANT NAVIGATION ---
        switchBottomNav(viewId) {
            // Turant view switch karo
            document.querySelectorAll('.main-view').forEach(v => v.classList.remove('active'));
            const targetView = document.getElementById(`view-${viewId}`);
            if(targetView) targetView.classList.add('active');
            
            // Bottom Nav active state update karo
            document.querySelectorAll('.b-nav-item').forEach(i => i.classList.remove('active'));
            const navId = (viewId === 'convert') ? 'nav-convert' : `nav-${viewId}`;
            const activeNav = document.getElementById(navId);
            if(activeNav) activeNav.classList.add('active');

            // Agar data purana hai ya pehle load nahi hua, tabhi init chalao
            // Isse click karne par baar-baar loading nahi hogi
            if (viewId === 'market' && typeof MarketApp !== 'undefined') {
                MarketApp.render(); // Render function fast hota hai
            } else if (viewId === 'convert' && typeof ConvertApp !== 'undefined') {
                ConvertApp.render();
            } else if (viewId === 'pro' && typeof ProApp !== 'undefined') {
                ProApp.render();
            }

            window.scrollTo(0, 0);
        },
        
        // --- DASHBOARD LOGIC (Home View) ---
        async loadDashboard() {
            document.getElementById('dashboard-view').style.display = 'block';
            
            // Ensure Home is active by default
            this.switchBottomNav('home');

            if(this.profile.profile_image_url) document.getElementById('dash-profile-img').src = this.profile.profile_image_url;

            // FIX: Use maybeSingle() for balance as well
            const { data: balData } = await supa.from('user_wallet_balance')
                .select('*')
                .eq('uid', this.user.id)
                .limit(1)
                .maybeSingle();
                
            if(balData) {
                this.baseBalance = Number(balData.balance);
                document.getElementById('dash-addr').innerText = balData.wallet_address;
                this.updateBalanceDisplay();
            }

            this.loadNotifications();
            this.initNewsSystem(); 
        },

        // --- FORMS ---
        closeForms() { document.querySelectorAll('.form-screen').forEach(el => el.style.display = 'none'); },

        updateBalanceDisplay() {
            const curr = document.getElementById('curr-switch').value;
            let val = this.baseBalance;
            let sym = '₹';
            if(curr === 'USD') { val = val * 0.012; sym = '$'; }
            if(curr === 'EUR') { val = val * 0.011; sym = '€'; }
            document.getElementById('dash-balance').innerText = sym + val.toLocaleString('en-US', {minimumFractionDigits: 2});
        },

        // --- NEWS CAROUSEL SYSTEM ---
        async initNewsSystem() {
            const { data } = await supa.from(CONFIG.NEWS_TABLE).select('*').eq('is_active', true).order('sort_order');
            if(data && data.length > 0) {
                this.newsData = data;
                this.renderNews();
                if(data.length > 1) this.startNewsTimer();
            } else {
                document.querySelector('.news-frame').style.display = 'none';
            }
        },

        renderNews() {
            const track = document.getElementById('news-track');
            track.innerHTML = '';
            
            this.newsData.forEach(item => {
                let content = '';
                let clickAttr = item.action_url ? `onclick="location.href='${item.action_url}'"` : '';
                
                if (item.type === 'image') {
                    content = `<img src="${item.content_url}" class="ns-img">`;
                } else if (item.type === 'video') {
                    content = `<video src="${item.content_url}" class="ns-video" controls onplay="WalletApp.pauseNews()" onended="WalletApp.resumeNews()"></video>`;
                    clickAttr = ''; 
                } else if (item.type === 'text') {
                    content = `
                        <div class="ns-text">
                            <span class="ns-badge">NEWS</span>
                            <span class="ns-msg">${item.text_content}</span>
                        </div>`;
                }

                const slide = document.createElement('div');
                slide.className = 'news-slide';
                slide.innerHTML = content;
                if(clickAttr && item.type !== 'video') {
                    slide.setAttribute('onclick', `location.href='${item.action_url}'`);
                }
                track.appendChild(slide);
            });
        },

        startNewsTimer() {
            this.clearNewsTimer();
            this.newsInterval = setInterval(() => {
                this.nextSlide();
            }, 8000); // 8 Seconds
        },

        clearNewsTimer() { if(this.newsInterval) clearInterval(this.newsInterval); },
        pauseNews() { this.clearNewsTimer(); },
        resumeNews() { this.nextSlide(); this.startNewsTimer(); },

        nextSlide() {
            this.currentSlide = (this.currentSlide + 1) % this.newsData.length;
            const track = document.getElementById('news-track');
            track.style.transform = `translateX(-${this.currentSlide * 100}%)`;
        },

        // --- NOTIFICATIONS & TABS ---
        async loadNotifications() {
            const { data } = await supa.from('wallet_notification').select('*').or(`target_uid.eq.${this.user.id},target_uid.is.null`).order('created_at', { ascending: false });
            const list = document.getElementById('notif-list');
            list.innerHTML = '';
            if(data && data.length > 0) {
                document.getElementById('notif-dot').style.display = 'block';
                data.forEach(n => {
                    const btn = n.platform_url ? `<a href="${n.platform_url}" target="_blank" class="notif-btn">Open ${n.platform_name || 'Link'}</a>` : '';
                    list.innerHTML += `<div class="notif-item"><div class="notif-title">${n.title}</div><div class="notif-msg">${n.message}</div>${btn}</div>`;
                });
            } else { list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">No notifications</div>'; }
        },

        toggleNotif() { document.getElementById('notif-panel').classList.toggle('active'); },

        switchTab(tabId) {
            document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            ['all', 'crypto', 'spot', 'holdings'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
        },

        goToExchange() { document.body.style.opacity = '0'; setTimeout(() => location.href = 'assets.html', 300); },

        // --- UTILS ---
        generateId(len) { return Array(len).fill(0).map(()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*36)]).join(''); },
        generateAddress() { return '0x' + Array(28).fill(0).map(()=>'abcdef0123456789'[Math.floor(Math.random()*16)]).join(''); },
        copyText(id) { navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert("Copied!")); },

        startLoadingSequence(cb) {
            const s=document.getElementById('loading-screen'), b=document.getElementById('loading-bg'), t=document.getElementById('pct-txt'), p=document.getElementById('prog-bar');
            s.style.display='flex';
            let pr=0; const int = setInterval(() => {
                pr+=5; p.style.width=pr+'%'; t.innerText=pr+'%';
                if(pr>=100) { clearInterval(int); cb(); }
            }, 100);
        }
    };

    window.onload = () => WalletApp.init();

    </script>
</body>
</html>
