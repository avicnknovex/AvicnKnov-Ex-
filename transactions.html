<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - AvicnKnov Exchange</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Slate 950 */
        color: white;
      }
      
      /* Mono font for IDs and Numbers */
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
      
      /* Animations */
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .slide-up { animation: slideUp 0.4s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { 
        from { transform: translateY(15px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
      }

      /* Card Hover Glow Effect */
      .tx-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tx-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        border-color: rgba(59, 130, 246, 0.3);
      }
    </style>

    <!-- Import Map for React & Supabase -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, Search, Filter, ArrowDownLeft, ArrowUpRight, 
            Copy, CheckCircle2, Clock, XCircle, Loader2, AlertCircle, 
            HelpCircle, Calendar, RefreshCw
        } from 'lucide-react';

        // --- Supabase Configuration ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- Helper Function ---
        const generateDescription = (type, status) => {
            const t = type?.toLowerCase() || '';
            const s = status?.toLowerCase() || '';

            if (t === 'deposit') {
                if (s === 'pending') return "Abhi aapka deposit verify ke liye hai. Hamari team jald hi verify karegi.";
                if (s === 'processing') return "Abhi aapka deposit processing mein hai. Kuch hi samay mein add ho jayega.";
                if (s === 'successful' || s === 'success') return "Aapka deposit account mein successfully add kar diya gaya hai. Aap check kar sakte ho.";
                if (s === 'canceled' || s === 'cancelled') return "Kuch technical problem ke karan deposit cancel kar diya gaya hai. Aap help and support section par jakar hamari team se contact karein.";
            } else if (t === 'withdrawal') {
                if (s === 'pending') return "Aapka withdrawal pending hai. Di gayi details verify hote hi amount submit kar diya jayega.";
                if (s === 'processing') return "Abhi aapka withdrawal processing mein hai. Bus kuch hi samay mein details par send kar diya jayega.";
                if (s === 'successful' || s === 'success') return "Aapka withdrawal di gayi details par send kar diya gaya hai. Aap check kar sakte ho.";
                if (s === 'canceled' || s === 'cancelled') return "Kuch technical problem ke karan withdrawal cancel kar diya gaya hai. Aap help and support section mein jakar hamari team se sampark karein.";
            }
            return "Transaction details updated.";
        };

        const TransactionsPage = () => {
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('all'); 

            // --- Navigation ---
            const handleBack = () => {
                window.location.href = 'dashboard.html';
            };

            const handleReport = () => {
                window.location.href = 'help.html#/help';
            };

            // --- Main Data Processing ---
            const processAndFetchTransactions = async () => {
                setLoading(true);
                try {
                    // 1. Get User
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) return; 
                    const userId = user.id;

                    // 2. Fetch Raw Data
                    const { data: rawTransactions, error } = await supabase
                        .from('user-transactions')
                        .select('*')
                        .eq('user_id', userId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    if (!rawTransactions) { setTransactions([]); return; }

                    const updates = [];
                    const processedData = rawTransactions.map((tx) => {
                        let updatedTx = { ...tx };
                        let needsUpdate = false;
                        let updatePayload = {};

                        // REMOVED: Order ID generation
                        // REMOVED: Description DB updates

                        // A. Check 24 Hour Expiry for Pending (KEEP)
                        const createdTime = new Date(updatedTx.created_at).getTime();
                        const currentTime = Date.now();
                        const hoursDiff = (currentTime - createdTime) / (1000 * 60 * 60);

                        if (updatedTx.status === 'pending' && hoursDiff > 24) {
                            updatedTx.status = 'canceled';
                            updatePayload.status = 'canceled';
                            needsUpdate = true;
                        }

                        // Queue DB update if status changed
                        if (needsUpdate) {
                            updates.push(
                                supabase
                                    .from('user-transactions')
                                    .update(updatePayload)
                                    .eq('id', updatedTx.id)
                            );
                        }

                        return updatedTx;
                    });

                    // Execute DB Updates
                    if (updates.length > 0) {
                        await Promise.all(updates);
                    }

                    // Set Data
                    setTransactions(processedData);

                } catch (err) {
                    console.error('Error processing transactions:', err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                processAndFetchTransactions();
            }, []);

            // --- Filtering ---
            const filteredData = transactions.filter(tx => {
                if (filter === 'all') return true;
                return tx.type.toLowerCase() === filter;
            });

            return (
                <div className="min-h-screen bg-slate-950 text-white relative overflow-x-hidden pb-10">
                    
                    {/* Background Ambience */}
                    <div className="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
                        <div className="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-blue-600/5 rounded-full blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-emerald-600/5 rounded-full blur-[120px]"></div>
                    </div>

                    <div className="relative z-10 max-w-2xl mx-auto px-4 sm:px-6">
                        
                        {/* Header Section */}
                        <div className="sticky top-0 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800/50 z-30 pt-6 pb-4 -mx-4 px-4 sm:-mx-6 sm:px-6 mb-6">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <button 
                                        onClick={handleBack} 
                                        className="p-2.5 rounded-full bg-slate-900 border border-slate-700 hover:bg-slate-800 hover:border-slate-600 transition-all active:scale-95 group"
                                    >
                                        <ArrowLeft className="w-5 h-5 text-slate-400 group-hover:text-white" />
                                    </button>
                                    <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
                                        Transactions
                                    </h1>
                                </div>
                                <button 
                                    onClick={processAndFetchTransactions} 
                                    className="p-2 text-slate-500 hover:text-blue-400 hover:bg-slate-900 rounded-full transition-all"
                                >
                                    <RefreshCw className={`w-5 h-5 ${loading ? 'animate-spin' : ''}`} />
                                </button>
                            </div>

                            {/* Filter Tabs */}
                            <div className="flex p-1 bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden">
                                <FilterTab label="All" active={filter === 'all'} onClick={() => setFilter('all')} />
                                <FilterTab label="Deposits" active={filter === 'deposit'} onClick={() => setFilter('deposit')} />
                                <FilterTab label="Withdrawals" active={filter === 'withdrawal'} onClick={() => setFilter('withdrawal')} />
                            </div>
                        </div>

                        {/* Content Area */}
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-20 animate-pulse">
                                <Loader2 className="w-10 h-10 text-blue-500 animate-spin mb-4" />
                                <p className="text-slate-400 text-sm">Syncing with blockchain...</p>
                            </div>
                        ) : filteredData.length === 0 ? (
                            <div className="flex flex-col items-center justify-center py-24 text-center px-6 fade-in">
                                <div className="w-20 h-20 bg-slate-900/50 rounded-full flex items-center justify-center mb-6 border border-slate-800 shadow-inner">
                                    <Search className="w-9 h-9 text-slate-600" />
                                </div>
                                <h3 className="text-lg font-semibold text-white mb-2">No Transactions Found</h3>
                                <p className="text-slate-500 text-sm max-w-xs leading-relaxed">
                                    Your {filter !== 'all' ? filter : ''} history will appear here once you make a transaction.
                                </p>
                            </div>
                        ) : (
                            <div className="space-y-4 pb-8 fade-in">
                                {filteredData.map((tx, index) => (
                                    <TransactionCard 
                                        key={tx.id || index} 
                                        tx={tx} 
                                        style={{ animationDelay: `${index * 50}ms` }}
                                        onReport={handleReport}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FilterTab = ({ label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`flex-1 py-2.5 text-xs sm:text-sm font-medium transition-all duration-300 rounded-lg ${
                    active 
                    ? 'bg-slate-800 text-white shadow-lg shadow-black/20' 
                    : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                }`}
            >
                {label}
            </button>
        );

        const TransactionCard = ({ tx, style, onReport }) => {
            const [copied, setCopied] = useState(false);

            // Determine Status Styles
            const getStatusConfig = (status) => {
                const s = status?.toLowerCase() || 'pending';
                switch(s) {
                    case 'successful':
                    case 'success':
                        return {
                            color: 'text-emerald-400',
                            bg: 'bg-emerald-500/10',
                            border: 'border-emerald-500/20',
                            icon: <CheckCircle2 className="w-3.5 h-3.5" />,
                            label: 'Successful'
                        };
                    case 'pending':
                        return {
                            color: 'text-amber-400',
                            bg: 'bg-amber-500/10',
                            border: 'border-amber-500/20',
                            icon: <Clock className="w-3.5 h-3.5" />,
                            label: 'Pending'
                        };
                    case 'processing':
                        return {
                            color: 'text-blue-400',
                            bg: 'bg-blue-500/10',
                            border: 'border-blue-500/20',
                            icon: <Loader2 className="w-3.5 h-3.5 animate-spin" />,
                            label: 'Processing'
                        };
                    case 'canceled':
                    case 'cancelled':
                        return {
                            color: 'text-red-400',
                            bg: 'bg-red-500/10',
                            border: 'border-red-500/20',
                            icon: <XCircle className="w-3.5 h-3.5" />,
                            label: 'Canceled'
                        };
                    default:
                        return {
                            color: 'text-slate-400',
                            bg: 'bg-slate-800',
                            border: 'border-slate-700',
                            icon: <AlertCircle className="w-3.5 h-3.5" />,
                            label: status
                        };
                }
            };

            const statusStyle = getStatusConfig(tx.status);
            const isDeposit = tx.type === 'deposit';

            const handleCopy = () => {
                if (tx.order_id) {
                    navigator.clipboard.writeText(tx.order_id);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            // Format Date
            const dateObj = new Date(tx.created_at);
            const dateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

            // DESCRIPTION LOGIC: Use DB value if present, else fallback
            const displayDescription = tx.description && tx.description.trim() !== "" 
                ? tx.description 
                : generateDescription(tx.type, tx.status);

            return (
                <div className="tx-card slide-up bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-2xl p-5 relative overflow-hidden group" style={style}>
                    
                    {/* Decoration Line */}
                    <div className={`absolute left-0 top-0 bottom-0 w-1 ${isDeposit ? 'bg-emerald-500/50' : 'bg-red-500/50'}`}></div>

                    {/* Top Row: Type & Amount */}
                    <div className="flex justify-between items-start mb-4 pl-3">
                        <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-inner ${isDeposit ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                                {isDeposit ? <ArrowDownLeft className="w-5 h-5" /> : <ArrowUpRight className="w-5 h-5" />}
                            </div>
                            <div>
                                <h3 className="font-semibold text-white capitalize">{tx.type}</h3>
                                <p className="text-xs text-slate-400 uppercase tracking-wider font-medium">{tx.method || 'Unknown'}</p>
                            </div>
                        </div>
                        <div className="text-right">
                            <span className={`block text-lg font-bold font-mono tracking-tight ${isDeposit ? 'text-emerald-400' : 'text-white'}`}>
                                {isDeposit ? '+' : '-'} ₹{Number(tx.amount).toLocaleString('en-IN')}
                            </span>
                        </div>
                    </div>

                    {/* Middle Row: Order ID & Date */}
                    <div className="bg-slate-950/50 rounded-xl p-3 mb-4 border border-slate-800/50 flex flex-col sm:flex-row sm:items-center justify-between gap-3 ml-3">
                        {/* Order ID */}
                        <div className="flex flex-col gap-1">
                            <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Order ID</span>
                            <button 
                                onClick={handleCopy}
                                className="flex items-center gap-2 text-sm font-mono text-slate-300 hover:text-white transition-colors group/copy"
                            >
                                {tx.order_id || '---'}
                                {tx.order_id && (
                                    copied ? <CheckCircle2 className="w-3.5 h-3.5 text-emerald-500" /> : <Copy className="w-3.5 h-3.5 text-slate-600 group-hover/copy:text-blue-400" />
                                )}
                            </button>
                        </div>

                        {/* Date/Time */}
                        <div className="flex items-center gap-2 sm:justify-end border-t sm:border-t-0 sm:border-l border-slate-800 pt-2 sm:pt-0 sm:pl-3">
                             <Calendar className="w-3.5 h-3.5 text-slate-600" />
                             <div className="text-xs text-slate-400 font-mono">
                                <span>{dateStr}</span> <span className="text-slate-600">|</span> <span>{timeStr}</span>
                             </div>
                        </div>
                    </div>

                    {/* Bottom Row: Status & Actions */}
                    <div className="flex items-center justify-between pl-3 pt-1">
                        {/* Status Badge */}
                        <div className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border shadow-sm ${statusStyle.bg} ${statusStyle.border} ${statusStyle.color}`}>
                            {statusStyle.icon}
                            <span className="uppercase tracking-wider">{statusStyle.label}</span>
                        </div>

                        {/* Report Issue */}
                        <button 
                            onClick={onReport}
                            className="flex items-center gap-1.5 text-xs font-medium text-slate-500 hover:text-red-400 transition-colors px-2 py-1"
                        >
                            <AlertCircle className="w-3.5 h-3.5" />
                            <span>Report Issue</span>
                        </button>
                    </div>

                    {/* Description Section */}
                    {displayDescription && (
                        <div className="mt-4 ml-3 pt-3 border-t border-slate-800/50 flex items-start gap-2 animate-in fade-in">
                            <HelpCircle className="w-3.5 h-3.5 text-blue-500/70 mt-0.5 shrink-0" />
                            <p className="text-xs text-slate-400 italic leading-relaxed">
                                {displayDescription}
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TransactionsPage />);
    </script>
</body>
</html>
