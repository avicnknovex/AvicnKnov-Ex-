<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transactions - AvicnKnov Ex</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
      
      body {
        font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #f8f9fc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Mono font for IDs and Numbers */
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Animations */
      .fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .slide-up { animation: slideUp 0.4s ease-out forwards; }
      
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { 
        from { transform: translateY(15px); opacity: 0; } 
        to { transform: translateY(0); opacity: 1; } 
      }

      /* Card Hover Glow Effect */
      .tx-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tx-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.05);
      }
    </style>

    <!-- Import Map for React & Supabase -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
      }
    }
    </script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#f8f9fc] pb-10">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { createClient } from '@supabase/supabase-js';
        import { 
            ArrowLeft, Search, Filter, ArrowDownLeft, ArrowUpRight, 
            Copy, CheckCircle2, Clock, XCircle, Loader2, AlertCircle, 
            HelpCircle, Calendar, RefreshCw, FileText
        } from 'lucide-react';

        // --- Supabase Configuration ---
        const supabaseUrl = 'https://hwrvqyipozrsxyjdpqag.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cnZxeWlwb3pyc3h5amRwcWFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA5MDc2NzksImV4cCI6MjA2NjQ4MzY3OX0.s43NjpUGDAJhs9qEmnwIXEY5aOh3gl6XqPdEveodFZM';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // --- Helper Function ---
        const generateDescription = (type, status) => {
            const t = type?.toLowerCase() || '';
            const s = status?.toLowerCase() || '';

            if (t === 'deposit') {
                if (s === 'pending') return "Abhi aapka deposit verify ke liye hai. Hamari team jald hi verify karegi.";
                if (s === 'processing') return "Abhi aapka deposit processing mein hai. Kuch hi samay mein add ho jayega.";
                if (s === 'successful' || s === 'success') return "Aapka deposit account mein successfully add kar diya gaya hai. Aap check kar sakte ho.";
                if (s === 'canceled' || s === 'cancelled') return "Kuch technical problem ke karan deposit cancel kar diya gaya hai. Aap help and support section par jakar hamari team se contact karein.";
            } else if (t === 'withdrawal') {
                if (s === 'pending') return "Aapka withdrawal pending hai. Di gayi details verify hote hi amount submit kar diya jayega.";
                if (s === 'processing') return "Abhi aapka withdrawal processing mein hai. Bus kuch hi samay mein details par send kar diya jayega.";
                if (s === 'successful' || s === 'success') return "Aapka withdrawal di gayi details par send kar diya gaya hai. Aap check kar sakte ho.";
                if (s === 'canceled' || s === 'cancelled') return "Kuch technical problem ke karan withdrawal cancel kar diya gaya hai. Aap help and support section mein jakar hamari team se sampark karein.";
            }
            return "Transaction details updated.";
        };

        const TransactionsPage = () => {
            const [transactions, setTransactions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('all'); 

            // --- Navigation ---
            const handleBack = () => {
                if (window.history.length > 1 && document.referrer !== "") {
                    window.history.back();
                } else {
                    window.location.href = 'dashboard.html';
                }
            };

            const handleReport = () => {
                window.location.href = 'help.html#/help';
            };

            // --- Main Data Processing ---
            const processAndFetchTransactions = async () => {
                setLoading(true);
                try {
                    // 1. Get User
                    const { data: { user } } = await supabase.auth.getUser();
                    if (!user) return; 
                    const userId = user.id;

                    // 2. Fetch Raw Data
                    const { data: rawTransactions, error } = await supabase
                        .from('user-transactions')
                        .select('*')
                        .eq('user_id', userId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    if (!rawTransactions) { setTransactions([]); return; }

                    const updates = [];
                    const processedData = rawTransactions.map((tx) => {
                        let updatedTx = { ...tx };
                        let needsUpdate = false;
                        let updatePayload = {};

                        // Check 24 Hour Expiry for Pending (KEEP)
                        const createdTime = new Date(updatedTx.created_at).getTime();
                        const currentTime = Date.now();
                        const hoursDiff = (currentTime - createdTime) / (1000 * 60 * 60);

                        if (updatedTx.status === 'pending' && hoursDiff > 24) {
                            updatedTx.status = 'canceled';
                            updatePayload.status = 'canceled';
                            needsUpdate = true;
                        }

                        // Queue DB update if status changed
                        if (needsUpdate) {
                            updates.push(
                                supabase
                                    .from('user-transactions')
                                    .update(updatePayload)
                                    .eq('id', updatedTx.id)
                            );
                        }

                        return updatedTx;
                    });

                    // Execute DB Updates
                    if (updates.length > 0) {
                        await Promise.all(updates);
                    }

                    // Set Data
                    setTransactions(processedData);

                } catch (err) {
                    console.error('Error processing transactions:', err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                processAndFetchTransactions();
            }, []);

            // --- Filtering ---
            const filteredData = transactions.filter(tx => {
                if (filter === 'all') return true;
                return tx.type.toLowerCase() === filter;
            });

            return (
                <div className="min-h-screen text-slate-800 relative">
                    
                    {/* Sticky Header */}
                    <div className="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-gray-100 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto">
                            <div className="flex items-center justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <button 
                                        onClick={handleBack} 
                                        className="w-10 h-10 rounded-full bg-slate-50 text-slate-600 flex items-center justify-center hover:bg-slate-100 transition-colors shadow-sm border border-slate-100"
                                    >
                                        <ArrowLeft className="w-5 h-5" />
                                    </button>
                                    <h1 className="text-xl font-black text-slate-800 tracking-tight">Transactions</h1>
                                </div>
                                <button 
                                    onClick={processAndFetchTransactions} 
                                    className="w-10 h-10 rounded-full bg-slate-50 text-slate-500 hover:text-blue-600 hover:bg-blue-50 flex items-center justify-center transition-all shadow-sm border border-slate-100"
                                >
                                    <RefreshCw className={`w-5 h-5 ${loading ? 'animate-spin' : ''}`} />
                                </button>
                            </div>

                            {/* Filter Tabs */}
                            <div className="flex p-1 bg-slate-100 rounded-xl overflow-hidden shadow-inner">
                                <FilterTab label="All" active={filter === 'all'} onClick={() => setFilter('all')} />
                                <FilterTab label="Deposits" active={filter === 'deposit'} onClick={() => setFilter('deposit')} />
                                <FilterTab label="Withdrawals" active={filter === 'withdrawal'} onClick={() => setFilter('withdrawal')} />
                            </div>
                        </div>
                    </div>

                    <div className="max-w-2xl mx-auto px-4 mt-6 pb-20">
                        {/* Content Area */}
                        {loading ? (
                            <div className="flex flex-col items-center justify-center py-20 animate-pulse">
                                <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                                    <Loader2 className="w-8 h-8 text-slate-400 animate-spin" />
                                </div>
                                <p className="text-slate-400 text-sm font-bold">Syncing history...</p>
                            </div>
                        ) : filteredData.length === 0 ? (
                            <div className="flex flex-col items-center justify-center py-24 text-center px-6 fade-in">
                                <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-xl shadow-slate-200/50 border border-slate-50">
                                    <FileText className="w-10 h-10 text-slate-300" />
                                </div>
                                <h3 className="text-lg font-black text-slate-800 mb-2">No Transactions</h3>
                                <p className="text-slate-400 text-sm max-w-xs font-medium">
                                    Your {filter !== 'all' ? filter : ''} history is currently empty.
                                </p>
                            </div>
                        ) : (
                            <div className="space-y-4 fade-in">
                                {filteredData.map((tx, index) => (
                                    <TransactionCard 
                                        key={tx.id || index} 
                                        tx={tx} 
                                        style={{ animationDelay: `${index * 50}ms` }}
                                        onReport={handleReport}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const FilterTab = ({ label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`flex-1 py-2.5 text-xs sm:text-sm font-bold transition-all duration-300 rounded-lg ${
                    active 
                    ? 'bg-white text-slate-800 shadow-sm' 
                    : 'text-slate-400 hover:text-slate-600'
                }`}
            >
                {label}
            </button>
        );

        const TransactionCard = ({ tx, style, onReport }) => {
            const [copied, setCopied] = useState(false);

            // Determine Status Styles
            const getStatusConfig = (status) => {
                const s = status?.toLowerCase() || 'pending';
                switch(s) {
                    case 'successful':
                    case 'success':
                        return {
                            color: 'text-emerald-600',
                            bg: 'bg-emerald-50',
                            border: 'border-emerald-100',
                            icon: <CheckCircle2 className="w-3.5 h-3.5" />,
                            label: 'Success'
                        };
                    case 'pending':
                        return {
                            color: 'text-amber-600',
                            bg: 'bg-amber-50',
                            border: 'border-amber-100',
                            icon: <Clock className="w-3.5 h-3.5" />,
                            label: 'Pending'
                        };
                    case 'processing':
                        return {
                            color: 'text-blue-600',
                            bg: 'bg-blue-50',
                            border: 'border-blue-100',
                            icon: <Loader2 className="w-3.5 h-3.5 animate-spin" />,
                            label: 'Processing'
                        };
                    case 'canceled':
                    case 'cancelled':
                        return {
                            color: 'text-rose-600',
                            bg: 'bg-rose-50',
                            border: 'border-rose-100',
                            icon: <XCircle className="w-3.5 h-3.5" />,
                            label: 'Canceled'
                        };
                    default:
                        return {
                            color: 'text-slate-500',
                            bg: 'bg-slate-100',
                            border: 'border-slate-200',
                            icon: <AlertCircle className="w-3.5 h-3.5" />,
                            label: status
                        };
                }
            };

            const statusStyle = getStatusConfig(tx.status);
            const isDeposit = tx.type === 'deposit';

            const handleCopy = () => {
                if (tx.order_id) {
                    navigator.clipboard.writeText(tx.order_id);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            // Format Date
            const dateObj = new Date(tx.created_at);
            const dateStr = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });

            // DESCRIPTION LOGIC: Use DB value if present, else fallback
            const displayDescription = tx.description && tx.description.trim() !== "" 
                ? tx.description 
                : generateDescription(tx.type, tx.status);

            return (
                <div className="tx-card slide-up bg-white rounded-3xl p-5 shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden group" style={style}>
                    
                    {/* Top Row: Type & Amount */}
                    <div className="flex justify-between items-start mb-4">
                        <div className="flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-transform group-hover:scale-105 ${isDeposit ? 'bg-gradient-to-tr from-emerald-400 to-teal-500 text-white shadow-emerald-500/30' : 'bg-gradient-to-tr from-rose-400 to-pink-500 text-white shadow-rose-500/30'}`}>
                                {isDeposit ? <ArrowDownLeft className="w-6 h-6" /> : <ArrowUpRight className="w-6 h-6" />}
                            </div>
                            <div>
                                <h3 className="font-black text-slate-800 capitalize text-lg">{tx.type}</h3>
                                <p className="text-xs text-slate-400 uppercase tracking-wider font-bold">{tx.method || 'Standard'}</p>
                            </div>
                        </div>
                        <div className="text-right">
                            <span className={`block text-lg font-black font-mono tracking-tight ${isDeposit ? 'text-emerald-500' : 'text-slate-800'}`}>
                                {isDeposit ? '+' : '-'} ₹{Number(tx.amount).toLocaleString('en-IN')}
                            </span>
                        </div>
                    </div>

                    {/* Middle Row: Order ID & Date */}
                    <div className="bg-slate-50 rounded-2xl p-4 mb-4 border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        {/* Order ID */}
                        <div className="flex flex-col gap-1">
                            <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Order ID</span>
                            <button 
                                onClick={handleCopy}
                                className="flex items-center gap-2 text-xs font-mono font-bold text-slate-600 hover:text-blue-600 transition-colors group/copy"
                            >
                                {tx.order_id || '---'}
                                {tx.order_id && (
                                    copied ? <CheckCircle2 className="w-3.5 h-3.5 text-emerald-500" /> : <Copy className="w-3.5 h-3.5 text-slate-400 group-hover/copy:text-blue-500" />
                                )}
                            </button>
                        </div>

                        {/* Date/Time */}
                        <div className="flex items-center gap-2 sm:justify-end border-t sm:border-t-0 sm:border-l border-slate-200 pt-2 sm:pt-0 sm:pl-3">
                             <Calendar className="w-3.5 h-3.5 text-slate-400" />
                             <div className="text-xs text-slate-500 font-bold">
                                <span>{dateStr}</span> <span className="text-slate-300 mx-1">|</span> <span>{timeStr}</span>
                             </div>
                        </div>
                    </div>

                    {/* Bottom Row: Status & Actions */}
                    <div className="flex items-center justify-between pt-1">
                        {/* Status Badge */}
                        <div className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border ${statusStyle.bg} ${statusStyle.border} ${statusStyle.color}`}>
                            {statusStyle.icon}
                            <span className="uppercase tracking-wider">{statusStyle.label}</span>
                        </div>

                        {/* Report Issue */}
                        <button 
                            onClick={onReport}
                            className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-rose-500 transition-colors px-2 py-1 bg-slate-50 hover:bg-rose-50 rounded-lg"
                        >
                            <AlertCircle className="w-3.5 h-3.5" />
                            <span>Report Issue</span>
                        </button>
                    </div>

                    {/* Description Section */}
                    {displayDescription && (
                        <div className="mt-4 pt-3 border-t border-slate-100 flex items-start gap-2 animate-in fade-in">
                            <HelpCircle className="w-3.5 h-3.5 text-blue-400 mt-0.5 shrink-0" />
                            <p className="text-xs text-slate-500 font-medium leading-relaxed">
                                {displayDescription}
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TransactionsPage />);
    </script>
</body>
</html>
